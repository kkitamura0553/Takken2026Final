","a":true,"e":"この場合5年を超えない期間で分割しない胸の契約を締結することができるとされています5年という数字は覚えておきましょう権利関係"},{"f":"touki","fn":"不動産登記法","q":"不動産の表示に関する登記の表題登記がない建物区分建物を除くの所有権を取得したものはその所有権の取得の日から1ヶ月以内に表登記を申請しなければならない","a":true,"e":"この場合1ヶ月以内の申請が必要となっています"},{"f":"touki","fn":"不動産登記法","q":"建物が別出した時は兵所有者または所有権の当期名義人はその別出の日から1ヶ月以内に当該建物の別出の登記を申請しなければならない","a":true,"e":"した日から1ヶ月以内の申請が必要となっています"},{"f":"touki","fn":"不動産登記法","q":"仮当期の申請は裁判所の仮当期を明る処分がある時には仮当期の当期権利者が単独ですることができる","a":true,"e":"裁判所の仮登記を明る処分がある時は仮当期の当期権利者は単独ですることができるとされています"},{"f":"touki","fn":"不動産登記法","q":"仮当期の当期義務者の承諾がある場合であっても仮当期権利者は単独で当該仮当期の申請をすることができない","a":false,"e":"仮当期の当期義務者の承諾があれば仮当期権利者は単独で仮登記の申請をすることができるとされています"},{"f":"touki","fn":"不動産登記法","q":"仮当期の抹消の申請は仮当期の当期名義人の承諾があれば仮当期の登期上の理害関係人が単独でることができる","a":true,"e":"この場合仮当期の当期名義人の承諾があれば理害関係人が単独ですることができるとされています"},{"f":"touki","fn":"不動産登記法","q":"土地の地目について変更があった時は表弟部所有者または所有権の当期名義人はその変更があった日から1ヶ月以内に当画一目に関する変更の登記を申請しなければならない","a":true,"e":"この場合知目または知績についての変更は1ヶ月以内に変更の登記を申請する必要があるとされています"},{"f":"touki","fn":"不動産登記法","q":"当期の申請にかかる不動産の所材地が当該申請を受けた当期所の間轄に独しない時は当期間は理由をふした決定で当該申請を却下しなければならない","a":true,"e":"間轄外なのでこの場合は却下しなければならないとされています"},{"f":"touki","fn":"不動産登記法","q":"とも理由のうに関わらず当期間に対し手数料を納付して当規模の付属書類である申請書を閲覧することができる","a":false,"e":"ちょっと細かいんですけど誰でも当期間に手数料を納付したら閲覧が可能なものと正当な理由があると認められる部分のみ可能この2つに分けられています申請書は正当な理由があると認められる部分のみ可能ということで誰でも閲覧することができるというわけではないので注意しましょう"},{"f":"touki","fn":"不動産登記法","q":"当期の申請をするものの移任による代理人の権限は本人の死亡によっては消滅しない","a":true,"e":"本人が死亡した場合でも当期の申請に関する代理人の権限は消滅しないとされています注意して欲しいのは民法の代理権は本人の死亡によって消滅するのでこちらと引っかからないよう注意しましょう"},{"f":"touki","fn":"不動産登記法","q":"兵所有者について住所の変更があった時は当該表部所有者はその変更があった日から1ヶ月以内に当該住所について変更の登記を申請しなければならない","a":false,"e":"兵所有者の住所変更は変更登期の申請義務ではないので注意しましょう"},{"f":"touki","fn":"不動産登記法","q":"区分建物の所有権の保存の登記は表題部所有者から所有権を取得したものも申請することができる","a":true,"e":"所有権を取得したものも申請することができるとされています"},{"f":"touki","fn":"不動産登記法","q":"配偶者居住権は登記することができる権利に含まれない","a":false,"e":"配偶者居住権は登記することができるとされています"},{"f":"touki","fn":"不動産登記法","q":"建物の合併の登記は兵所有者または所有権の当期名義人以外のものは申請することができないこちらの答えは稀になりますこの場合申請することができないとされています","a":true,"e":""},{"f":"touki","fn":"不動産登記法","q":"仮当期の申請は仮当期の当期義務者の承諾がある時は仮当期権利者が単独ですることができる","a":true,"e":"当期義務者の承諾があると仮当期権利者は単独で可能となっています"},{"f":"touki","fn":"不動産登記法","q":"所有権の移転の登記の申請をする場合において当期権利者が当期識別情報の通知を希望しない旨の申し出をした時は当該当期にかかる当期識別情報は通知されない","a":true,"e":"この場合当期識別情報は通知されないとされています"},{"f":"touki","fn":"不動産登記法","q":"相続または法人の合併による権利の移転の登記は当期権利者が単独で申請することができる","a":true,"e":"この場合は消除または法人の合併は当期権利者が単独で申請することができます"},{"f":"touki","fn":"不動産登記法","q":"託の登期の申請は当該信託にかかる権利の保存設定移転または変更の登記の申請と同時にしなければならない","a":true,"e":"信託の移転の登記は同時にしなければならないとされています"},{"f":"touki","fn":"不動産登記法","q":"の土地の兵所有者または所有権の当期名義人が同じであっても持ち分が相互に異なる土地の合筆の登期は申請することができない","a":true,"e":"この場合申請することができないとされています"},{"f":"touki","fn":"不動産登記法","q":"兵に所有者として記録されているものの相続には所有権の保存の登記を申請することができる","a":true,"e":"正しい選択肢となっています権利関係"},{"f":"bensai","fn":"弁済・相殺・債権譲渡","q":"Aは土地所有者Bから土地を賃借しその土地上に建物を所有してCに賃貸しているcは仮の支払い債務に関して法律上の理害関係を有しないのでAの意思に反して債務を弁済することはできない","a":false,"e":"借地上の建物賃借はその借地の地代支払い債務の弁済をするものについて正当な利益を有する第3者に該当しますなのでCはAの意思に反しても債務を弁済することができるとされています"},{"f":"bensai","fn":"弁済・相殺・債権譲渡","q":"AはBから土地を賃借しその土地上に建物を所有しCに賃貸しているaがBの代理人と少してカリチンの請求をしてきた無権者に対し債務を弁済したそのものに弁済権限があるかのような外観がありAがその権限があることについて善意無失である時その弁済は有効である","a":true,"e":"この場合弁済者が受領権者以外のものであって取引上の社会通年に照らして受領権限者としての外観を有するものにつき善意無失で行った弁済につきましては有効となりますつまり間違えちゃってもしょうがないよねっていう相手に対して行った場合これは有効ということになりますしっかりと要件を確認しておきましょう"},{"f":"bensai","fn":"弁済・相殺・債権譲渡","q":"aがBに対して過資金債権である高裁権をBがAに対して過資金債権であるお債権をそれぞれ有しており高裁権は弁済機が到来しておらず権は弁済機が到来している場合Aが一方的な意思表示により高裁権と権とを対当額にて相裁することができる","a":false,"e":"aの高裁権は自動債権で弁済機はまだ到来してませんがBの債権は自動債権で弁済機が到来していますaは弁済機が未到来なので総裁を主張することはできないとされています"},{"f":"bensai","fn":"弁済・相殺・債権譲渡","q":"AはBに対し貸し付け金債権を有しておりAはこの貸し付け金債権をCに対し譲渡したbが再権譲渡を承諾しない場合CがBに対し再建譲渡を通知するだけではCはBに対して自分が再権者であることを主張することができない","a":true,"e":"aが譲り私人Bが債務者Cが譲り受け人となりますこういった問題は必ず増加にしましょうその場合譲り受けCが債務者Bに対して自分が再権者であることを主張するにはいずれか2つ満たす必要があります1つ目譲り渡しにAから債務者Bに対する通知2つ目債務者Bの承諾が必要ということになりますなのでこの問題で言うとCからBに対して通知するだけでは自分が債権者であることをCは主張できないという問題なので正しい選択肢となっていますしっかりこちらも要件を確認しておきましょう誰から誰のだったらその要件を満たすかこちらを覚えていないと点数が取れない問題となっています"},{"f":"bensai","fn":"弁済・相殺・債権譲渡","q":"Aを売り主Bを買主として甲建物の売買契約が締結されたbがAの代理人と少Dに対して本件代金債務を弁済した場合Dに権限がないことにつきBが善意かつ無質であればBの弁済は有効となる","a":true,"e":"この場合Bが全無質であればBの弁済は有効となります"},{"f":"bensai","fn":"弁済・相殺・債権譲渡","q":"法行為の被害者は損害賠償債権を自動債権として加害者に対する金銭変換債務と総裁することができない","a":false,"e":"被害者側から総裁を主張することは可能となっています"},{"f":"bensai","fn":"弁済・相殺・債権譲渡","q":"AがBに対して過資金債権である高裁権をBがAに対して過資金債権である債権をそれぞれ有している弁済機の定めのない高裁権と弁済機が到来している乙件とをAが一方的な意思表示により総裁することができる","a":true,"e":"高裁権は弁済機の定めがないですがお債権は弁済機は末に到来しているということでこの場合は総裁可能となっています"},{"f":"bensai","fn":"弁済・相殺・債権譲渡","q":"再建者名義の領収書を自算した権限のないものに対して債務者が弁済した場合債務者が過失なくしてその事情を知らなかった時は面載される","a":true,"e":"再建者名義の領収書があるということは治療権者としての外観を有するものに該当します**そして債務者は全員無質ということなのでこの場合は弁済は有効となります"},{"f":"bensai","fn":"弁済・相殺・債権譲渡","q":"動産売買契約における目的引き渡し債務と代金支払い債務とは同時行の関係ではない","a":false,"e":"この場合同時候行の関係となります"},{"f":"bensai","fn":"弁済・相殺・債権譲渡","q":"債権譲渡の意思表示の時には発生していない債権であっても債権譲渡の対象とすることができこの場合譲り受け人は債権が発生した時点で当該債権を当然に取得する","a":true,"e":"この場合債権が発生した時点で債権を当然に取得するとされています"},{"f":"bensai","fn":"弁済・相殺・債権譲渡","q":"者の代理人と少するものに対して弁済した場合そのものに弁済受領権限の外観があり弁済者が善意無失であれば弁済は有効である","a":true,"e":"弁済事業権限の外観があり弁済者が全無出の時は弁済は有効となります"},{"f":"bensai","fn":"弁済・相殺・債権譲渡","q":"譲渡禁止特約のある債権の譲渡を受けた第3者はその特約の存在を知らなかったことにつき重大な過失があっても当該債権を取得することができる","a":true,"e":"この場合重大な過失があっても債権を取得することができます"},{"f":"bensai","fn":"弁済・相殺・債権譲渡","q":"譲渡制限の意思表示がされた債権が譲渡された場合当該債権譲渡の効力は妨げられないこちらの答えはあるになります譲渡禁止特約があっても再建譲渡となります","a":true,"e":""},{"f":"bensai","fn":"弁済・相殺・債権譲渡","q":"造文書を自算したものに弁済した場合債務者は善意無失であれば弁済は有効となる","a":true,"e":"この場合全無失なので弁済は有効となります"},{"f":"bensai","fn":"弁済・相殺・債権譲渡","q":"Aは土地所有者Bから土地を沈着しその土地上に建物を所有してCに賃貸しているaが当該仮地を学面とするA振り出しにかかる小切って銀行振り出しではないものをBに提供した場合債務の本士に従った適な弁済の提供となる","a":false,"e":"銀行振り出しでないっては弁済の提供ではないので認められないとされています権利関係"},{"f":"fuhou","fn":"請負・不法行為","q":"Aを注文者Bを受け追い人とする受け契約が締結された場合Bが仕事を完成しない間はAはいつでもBに対して損害を賠償して本件契約を解除することができる","a":true,"e":"この場合受け人が仕事を完成しない間は注文者はいつでも受け人に対し損害や賠償して解除することができるとされています"},{"f":"fuhou","fn":"請負・不法行為","q":"Aを注文者Bを受け人とする受け契約が締結された場合本件契約の目的建物にBの攻めに起すべき自由による契約の内容に適合しない重大な瑕疵があるためこれを立替えざるを得ない場合AはBに対して当該建物の立替えに要する費用相当額の損害賠償を請求することができる","a":true,"e":"この場合Bの攻めにキすべき自由ということで損害賠償の請求が可能となっています"},{"f":"fuhou","fn":"請負・不法行為","q":"Aに雇用されているBが勤務中にA所有の乗用者を運転し営業活動の途中で交通時効を起こし歩いていたCに機害を加えたaの使用者責任が認められてCに対し損害を賠償した場合にはAはBに対して急することができるのでBに資力があれば最終的にはAはCに対して賠償した損害額の全額を常にBから回収することができる","a":false,"e":"この場合全額を常にではなく審議速相当と認められる範囲内で回収が可能となっています"},{"f":"fuhou","fn":"請負・不法行為","q":"Aが1人で居住する甲建物の保存に瑕疵があったため甲建物の壁が崩れて通行人Bが怪我をした本件事故についてAのBに対する不法行為責任が成立する場合BのAに対する損害賠償請求権はBまたはBの法定代理人が損害または加害者を知らない時でも本件事故の時から20年間行使しない時には事項により消滅する","a":true,"e":"この場合不法行為の時から20年間行使しないと事項により消滅するとされています"},{"f":"fuhou","fn":"請負・不法行為","q":"Aが1人で居住する甲建物の保存に瑕疵がありこう建物の壁が崩れて通行にBが怪我をしたaのBに対する不法行為責任が成立する場合BのAに対する損害賠償請求権はBまたはBの法定代理人が損害及び加害者を知った時から5年間行使しない時には事項により消滅する","a":true,"e":"人の生命または身体を害する不法行為による損害賠償請求権を行使しない場合は5年間で事項により消滅するとされています"},{"f":"fuhou","fn":"請負・不法行為","q":"不法行為によって名誉を既存されたものの慰謝料請求権は被害者が生前に請求の意思を表明しなかった場合でも相続の対象となる","a":true,"e":"慰謝料請求権も相続の対象となり相続人は慰謝料請求権を行使が可能となっています"},{"f":"fuhou","fn":"請負・不法行為","q":"Aを注文者Bを受け追い人とする受け追い契約が締結された本件契約の目的が建物の増築である場合Aの荷により当該建物が消出し増築できなくなった時はBは本件契約に基づく履行部分の仕事完成債務を免がれる","a":true,"e":"この場合Aの荷ということで注文者が悪い場合Bは本件契約に基づくミリ部分の仕事完成債務を免れ、報酬を請求可能とされています。"},{"f":"fuhou","fn":"請負・不法行為","q":"不法行為による損害賠償の支払い債務は最国を待たず損害発生と同時に遅滞に陥るのでその時以降完成に至るまでの遅延損害金を支払わなければなら","a":true,"e":"**損害発生と同時に遅滞に陥るとされています"},{"f":"fuhou","fn":"請負・不法行為","q":"不法行為の被害者は損害賠償債権を自動債権として加害者に対する金銭変換債務と総裁することができない","a":false,"e":"被害者側からは総裁を主張することは可能となっています"},{"f":"fuhou","fn":"請負・不法行為","q":"従業員Aが宅建業者Bの業務を遂行中に第3者Cに不法行為による損害を与えたbはその損害を賠償しなければならないがAに対してその急をすることはできない","a":false,"e":"この場合CはAに対しても急証権を行使することができるとされています"},{"f":"fuhou","fn":"請負・不法行為","q":"不法行為による損害賠償請求権の消滅時効の被害者が損害を知った時とは被害者が損害の発生を現実に認識した時を言う","a":true,"e":"正しい選択肢となっています"},{"f":"fuhou","fn":"請負・不法行為","q":"加害者数人が共同不法行為として各自連帯して損害賠償の責任を負う場合その1人に対する理行の請求は他の加害者に対してはその効力を有しない","a":true,"e":"共同不法行為の場合はお互いに連帯債務者の関係となりますつまり連帯債務者の1人に対して生じた自由は別談の定めがない限り他の債務者に対して効力を生じないとされています"},{"f":"fuhou","fn":"請負・不法行為","q":"不法行為の加害者が海外に在住している間は20年の時効期間は進行しない","a":false,"e":"**加害者が海外にいる間も時期は進行します"},{"f":"fuhou","fn":"請負・不法行為","q":"不法占挙により日々発生する損害は加害行為が終わった時から一括して消滅時効が進行し日々発生する損害を知った時から別っこに消滅時効が進行することはない","a":false,"e":"別っこに消滅時効が進行するものとなっています"},{"f":"fuhou","fn":"請負・不法行為","q":"不法行為に基づく損害賠償債務は被害者が再告をするまでもなくその損害の発生の時から伝えに陥る","a":true,"e":"**損害の発生と同時に遅滞に陥るとされています権利関係"},{"f":"souzoku","fn":"相続・その他","q":"自質による融合をする場合証人2人以上の立ち合いが必要である","a":false,"e":"実質は承認は不要となっています"},{"f":"souzoku","fn":"相続・その他","q":"医療移流文侵害学の請求は訴えを定期しなくても内容証明郵便による意思表示だけでもすることができる","a":true,"e":"必ずしも裁判上の請求による必要はないとされています"},{"f":"souzoku","fn":"相続・その他","q":"aがBから授業のために1000万円を借りている場合Aが死亡し唯一の相続人であるFが相続の単純承認をするとFがBに対する借入れ金債務の存在を知らなかったとしてもFは当該借入れ金債務を相続する","a":true,"e":"単純は相続人が非続人の資産及び負債を全て相続します単純承認したFはAの借入れ金債務の存在を知らなかったとしてもその時点で当該借入れ金債務を相続するとされています"},{"f":"souzoku","fn":"相続・その他","q":"Aの臨地の竹僕の枝が教界線を超える時はAは竹僕の所有者にその枝の秩序を求めることができの竹僕の根が境界線を超える時はAはその根を切り取ることができる","a":true,"e":"ピンチから教会を超えて伸びてきた枝は切ることはできませんが根っこは切り取ることができるとされています"},{"f":"souzoku","fn":"相続・その他","q":"厚生少書有言の作成には証人2人以上の立ち合いが必要であるが推定相続人は未成年者でなくとも承認となることができない","a":true,"e":"推定相続人は未成年者でなくても承認となることはできないとされていますまた厚生少書有言の証人は2人以上の立ち合いが必要となっています"},{"f":"souzoku","fn":"相続・その他","q":"適な予言をしたものがその後さらに適な遺言をした場合前の遺言のうち後の遺言と定食する部分は後の遺言により撤開したものと見なされる","a":true,"e":"この場合前の遺言と定食する部分は後の遺言で撤開したものと見なされます"},{"f":"souzoku","fn":"相続・その他","q":"複数の筆の他の土地に囲まれて行動に通じない土地の所有者は行動に至るためその土地を囲んでいる他の土地を自由に選んで通行することができる","a":false,"e":"通行の場所方法は必要かつ臨チの被害が最も少なるようにしなければならないとされていますなので自由に選んで通行することができるわけではないので注意しましょう"},{"f":"souzoku","fn":"相続・その他","q":"限定承認をする際は相続人全員が共同してしなければならない","a":true,"e":"限定承認は相続全員で共同してするものとされています"},{"f":"souzoku","fn":"相続・その他","q":"異なる監修がある場合を除き会未満の距離において他人の宅地を見通すことができる窓を設ける時は目隠しをつけなければならない","a":true,"e":"境界線から1m未満の場合は目隠しをつけなければならないとされています"},{"f":"souzoku","fn":"相続・その他","q":"遺産分割協議において配偶者居住権の存続期間が定められなかった場合存続期間は20年となる","a":false,"e":"20年ではなく就中心となります"},{"f":"souzoku","fn":"相続・その他","q":"2人の装飾人のうち一方が単純承認をした時は他方は限定承認をすることができない","a":true,"e":"限定承認は共同相続人の全員が共同して行う必要があるため1人でも単純承認をするとできないとされています"},{"f":"souzoku","fn":"相続・その他","q":"相続の放棄をする場合その胸を家庭裁判所に実しなければならない","a":true,"e":"相続の放規は家庭裁判所に対して行うとされています"},{"f":"souzoku","fn":"相続・その他","q":"実質によって遺言をする場合予言者はその全分日付及び指名を辞書して応援しなければならないがこれに添付する相続財産の目録については有号者がマイページに署名応援すれば辞書でないものも認められる","a":true,"e":"財産目録は署名応援していればパソコン等で作成も可能となっています"},{"f":"souzoku","fn":"相続・その他","q":"未成年であっても15歳に達したものは有効に遺言をすることができる","a":true,"e":"15歳に達すると酔い顔をすることができるとされています"},{"f":"souzoku","fn":"相続・その他","q":"非相続Aの配偶者BがA所有の建物に相続開始の時に居住していたため遺産分割協議によって配偶者居住権を取得した配偶者居住権の存続期間中に配偶者居住権を取得したものが死亡した場合Bの相続CはBの有していた配偶者居住権を相続する","a":false,"e":"配偶者居住権は配偶者が死亡した場合その時点で消滅するとされていますなので相続するわけではないので注意しましょう"},{"f":"souzoku","fn":"相続・その他","q":"法定相続人である非相続人の兄大姉妹は医療分権利者とはならない","a":true,"e":"兄弟姉妹は医療分権利者とはならないとされていますよく出るとこなので兄弟姉妹のところは相続で必ず覚えておきましょう"},{"f":"souzoku","fn":"相続・その他","q":"配偶者居住権を登記すれば配偶者はその権利を第3者に対抗することができる","a":true,"e":"登記をすると対抗することができるとされています"},{"f":"souzoku","fn":"相続・その他","q":"相続開始前に家庭裁判所の許可を得て移流分を放棄した場合でも遺産を相続する権利は失われない","a":true,"e":"移流分を放棄しても相続を放棄したわけではないので比較しておきましょう"},{"f":"touki","fn":"不動産登記法","q":"配偶者居住権は登記することができる権利に含まれない","a":false,"e":"配偶者居住権は登期が可能となっていますこれで権利関係の演習問題全345問は終了です"}];

{cat:"takken",q:"代金の額は、35条書面の記載事項である。",a:false,exp:"代金の額は37条書面の記載事項です。35条にはありません。"},
{cat:"takken",q:"37条書面は、買主にのみ交付すればよい。",a:false,exp:"売主と買主の双方に交付が必要です。"},
{cat:"takken",q:"8種制限は、宅建業者同士の取引にも適用される。",a:false,exp:"業者間取引には適用されません。最重要ひっかけです。"},
{cat:"takken",q:"クーリングオフは、事務所で申込みした場合でも適用される。",a:false,exp:"事務所等以外の場所での申込みにのみ適用されます。"},
{cat:"takken",q:"手付の額は、代金の10分の2を超えてはならない。",a:true,exp:"代金の20%（10分の2）を超える手付は受領できません。"},
{cat:"takken",q:"自ら賃貸を行う場合も宅建業の免許が必要である。",a:false,exp:"自ら賃貸は宅建業に該当しないため免許不要です。"},
{cat:"takken",q:"宅建業の免許の有効期間は3年である。",a:false,exp:"5年です。更新は90日前〜30日前です。"},
{cat:"takken",q:"専属専任媒介では依頼者は自ら発見した相手方と直接取引できる。",a:false,exp:"専属専任では自己発見取引もできません。"},
{cat:"takken",q:"専任媒介契約の有効期間は6ヶ月以内である。",a:false,exp:"3ヶ月以内です。自動更新も不可です。"},
{cat:"takken",q:"売買代金400万円の媒介報酬上限は3%+6万円で計算する。",a:false,exp:"3%+6万円は400万円「超」の場合。400万円ちょうどは4%+2万円（=18万円）です。"},
{cat:"takken",q:"賃貸の媒介報酬は合計で借賃の2ヶ月分まで受領できる。",a:false,exp:"合計で借賃の1ヶ月分が上限です。"},
{cat:"takken",q:"営業保証金は主たる事務所1,000万円、従たる事務所500万円である。",a:true,exp:"正しい金額です。弁済業務保証金分担金（主60万/従30万）と混同注意。"},
{cat:"hourei",q:"市街化区域では1,000㎡未満の開発行為は許可不要である。",a:true,exp:"市街化区域は1,000㎡以上で許可必要なので、未満は不要です。"},
{cat:"hourei",q:"市街化調整区域では面積にかかわらず原則として開発許可が必要である。",a:true,exp:"市街化を抑制する区域なので、面積要件なく原則許可が必要です。"},
{cat:"hourei",q:"前面道路幅員10mの住居系地域では容積率は幅員×6/10で計算する。",a:false,exp:"住居系は幅員×4/10です。6/10はその他の用途地域です。"},
{cat:"hourei",q:"建ぺい率は角地緩和と防火地域内耐火建築物で合計20%加算できる。",a:true,exp:"各+10%で合計+20%。併用可能です。"},
{cat:"hourei",q:"建築基準法上の道路とは原則として幅員6m以上のものをいう。",a:false,exp:"原則4m以上です。特定行政庁指定区域で6mの場合があります。"},
{cat:"hourei",q:"農地法3条の許可権者は都道府県知事である。",a:false,exp:"3条は農業委員会。4条・5条が都道府県知事です。"},
{cat:"hourei",q:"市街化区域内の農地を転用する場合は届出で足りる。",a:true,exp:"4条・5条は届出でOK。ただし3条は許可が必要です。"},
{cat:"hourei",q:"国土利用計画法の事後届出は売主が行わなければならない。",a:false,exp:"届出義務者は権利取得者（買主）です。"},
{cat:"zei",q:"相続により不動産を取得した場合、不動産取得税が課税される。",a:false,exp:"相続は非課税です。贈与は課税されます。"},
{cat:"zei",q:"固定資産税の納税義務者は毎年4月1日現在の所有者である。",a:false,exp:"賦課期日は1月1日です。"},
{cat:"zei",q:"居住用財産の3,000万円控除は所有期間10年超でなければ適用できない。",a:false,exp:"所有期間は問いません。10年超が要件なのは軽減税率の特例です。"},
{cat:"zei",q:"3,000万円特別控除と軽減税率の特例は併用できる。",a:true,exp:"併用可能です。買換え特例とは選択適用（併用不可）です。"},
{cat:"zei",q:"不動産広告の徒歩時間は100mにつき1分で計算する。",a:false,exp:"80mにつき1分です。端数は切上げ。"},
{cat:"zei",q:"住宅金融支援機構は個人に直接住宅ローンを融資するのが主な業務である。",a:false,exp:"直接融資は原則行いません。証券化支援業務（フラット35）が中心です。"},
{cat:"zei",q:"建築後1年未満であれば入居済みでも「新築」と表示できる。",a:false,exp:"新築は1年未満かつ未入居の両方が必要です。"}
];

const BF=[
{id:"all",name:"全分野"},{id:"kihon",name:"基本"},{id:"menkyo",name:"免許"},{id:"takkenshi",name:"取引士"},
{id:"hoshokin",name:"営業保証金"},{id:"kyokai",name:"保証協会"},{id:"gyomu",name:"業務規制"},
{id:"art34",name:"34条"},{id:"art35",name:"35条"},{id:"art37",name:"37条"},
{id:"seigen8",name:"8種制限"},{id:"koukoku",name:"広告規制"},{id:"houshu",name:"報酬"},
{id:"kantoku",name:"監督罰則"},{id:"kashi",name:"瑕疵担保"}
];
const HF=[
{id:"all",name:"全分野"},{id:"toshi",name:"都市計画法"},{id:"kenchiku",name:"建築基準法"},
{id:"nouchi",name:"農地法"},{id:"kokudo",name:"国土利用"},{id:"kukaku",name:"区画整理"},
{id:"takuzo",name:"盛土規制法"}
];
const KF=[
{id:"all",name:"全分野"},{id:"seigen",name:"制限行為能力"},{id:"ishi",name:"意思表示"},
{id:"dairi",name:"代理"},{id:"jikou",name:"時効"},{id:"bukken",name:"物権変動"},
{id:"teitou",name:"抵当権"},{id:"saimu",name:"債務不履行"},{id:"rentai",name:"連帯債務等"},
{id:"chintai",name:"賃貸借"},{id:"shakuchi",name:"借地"},{id:"shakka",name:"借家"},
{id:"bensai",name:"弁済・相殺"},{id:"fuhou",name:"不法行為"},{id:"kubun",name:"共有・区分"},
{id:"souzoku",name:"相続"},{id:"touki",name:"登記法"}
];

let st={mode:"study",cat:"all",expId:null,chk:{},qCat:"all",qSub:"all",qPage:0,qAns:{}};
const PS=50;
function load(){try{const s=localStorage.getItem("takken-v9");if(s){const d=JSON.parse(s);st.chk=d.chk||{};st.qAns=d.qAns||{};}}catch{}}
function save(){try{localStorage.setItem("takken-v9",JSON.stringify({chk:st.chk,qAns:st.qAns}));}catch{}}

function getFilteredQ(){
  if(st.qCat==="takken") return st.qSub==="all"?BQ:BQ.filter(q=>q.f===st.qSub);
  if(st.qCat==="hourei") return st.qSub==="all"?HQ:HQ.filter(q=>q.f===st.qSub);
  if(st.qCat==="kenri") return st.qSub==="all"?KQ:KQ.filter(q=>q.f===st.qSub);
  if(st.qCat==="zei") return Q.filter(q=>q.cat==="zei");
  if(st.qCat==="all") return [...KQ,...BQ,...HQ,...Q];
  return Q.filter(q=>q.cat===st.qCat);
}

function render(){
const app=document.getElementById("app");
const totalChk=T.filter(t=>st.chk[t.id]).length;
const pct=Math.round((totalChk/T.length)*100);
const fQ=getFilteredQ();
const aCount=fQ.filter((_,i)=>st.qAns[st.qCat+"-"+st.qSub+"-"+i]!==undefined).length;
const cCount=fQ.filter((_,i)=>st.qAns[st.qCat+"-"+st.qSub+"-"+i]===true).length;

let h=`<div class="header"><div class="header-sub">2026年度対応</div><h1>宅建試験 頻出論点マスター</h1>
<div class="mode-tabs"><button class="mode-tab${st.mode==="study"?" active":""}" onclick="setMode('study')">📖 論点学習</button><button class="mode-tab${st.mode==="quiz"?" active":""}" onclick="setMode('quiz')">✍ 一問一答</button></div>`;
if(st.mode==="study"){h+=`<div class="progress-row"><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div><span class="progress-label">${totalChk}/${T.length}</span></div>`;}
else{h+=`<div class="progress-row"><div class="progress-bar"><div class="progress-fill" style="width:${fQ.length?Math.round(aCount/fQ.length*100):0}%"></div></div><span class="progress-label">${cCount}/${fQ.length}正解</span></div>`;}
h+=`</div>`;
h+=st.mode==="study"?renderStudy():renderQuiz(fQ,aCount,cCount);
app.innerHTML=h;
}

function renderStudy(){
const filtered=st.cat==="all"?T:T.filter(t=>t.cat===st.cat);
const sorted=[...filtered].sort((a,b)=>b.freq-a.freq);
const ac=st.cat!=="all"?cM[st.cat]:null;
const fc=sorted.filter(t=>st.chk[t.id]).length;
let h=`<div class="tabs">`;
[{id:"all",name:"全科目",color:"#1e3a5f"},...C].forEach(c=>{const isA=st.cat===c.id;h+=`<button class="tab${isA?" active":""}" style="${isA?"background:"+c.color:""}" onclick="setCat('${c.id}')">${c.name}</button>`;});
h+=`</div>`;
if(ac)h+=`<div class="cat-bar" style="color:${ac.color};background:${ac.color}10;border-color:${ac.color}"><span>${ac.questions}</span><span>目安: ${ac.target}</span></div>`;
h+=`<div class="info-bar"><span>頻度順（${sorted.length}論点）</span><span>${fc}/${sorted.length} 済</span></div><div class="cards">`;
sorted.forEach(t=>{
const cat=cM[t.cat],isExp=st.expId===t.id,isDone=!!st.chk[t.id];
h+=`<div class="card${isDone?" done":""}" id="topic-${t.id}"><div class="card-head"><button class="chk${isDone?" on":""}" onclick="event.stopPropagation();togChk('${t.id}')">${isDone?"✓":""}</button><div class="card-body" onclick="togExp('${t.id}')"><div class="badges"><span class="badge" style="background:${cat.color}">${cat.name}</span><span class="stars">${fL(t.freq)}</span></div><div class="topic-name">${t.topic}</div><div class="tap-hint">${isExp?"▲ 閉じる":"▼ 詳細"}</div></div></div>`;
if(isExp){
h+=`<div class="detail"><div class="sec"><div class="sec-title" style="color:${cat.color}">📘 論点解説</div><div class="sec-box" style="border-color:${cat.color}">${t.desc}</div></div><div class="sec"><div class="sec-title" style="color:var(--red)">⚠ ひっかけポイント</div>`;
t.traps.forEach((tr,i)=>{h+=`<div class="trap-item"><span class="trap-num">${i+1}.</span><span class="trap-text">${tr}</span></div>`;});
h+=`</div></div>`;}
h+=`</div>`;});
h+=`</div><div class="footer"><button class="reset-btn" onclick="resetStudy()">学習チェックをリセット</button></div>`;
return h;
}

function renderQuiz(fQ,answered,correct){
let h=`<div class="quiz-filter">`;
[{id:"all",name:"全科目"},...C].forEach(c=>{h+=`<button class="quiz-filter-btn${st.qCat===c.id?" active":""}" onclick="setQCat('${c.id}')">${c.name}</button>`;});
h+=`</div>`;

// Sub-filters
const sf=st.qCat==="takken"?BF:st.qCat==="hourei"?HF:st.qCat==="kenri"?KF:null;
if(sf){
h+=`<div class="quiz-filter" style="padding-top:2px">`;
sf.forEach(s=>{h+=`<button class="quiz-filter-btn${st.qSub===s.id?" active":""}" style="font-size:10px;padding:3px 8px" onclick="setQSub('${s.id}')">${s.name}</button>`;});
h+=`</div>`;
}

if(!fQ.length)return h+`<div style="text-align:center;padding:40px;color:var(--text3)">問題がありません</div>`;

// Score
if(answered>0){
h+=`<div class="quiz-score"><div class="quiz-score-num">${correct}<span style="font-size:16px;color:var(--text2)"> / ${fQ.length}</span></div><div class="quiz-score-label">正解率 ${fQ.length?Math.round(correct/fQ.length*100):0}%${answered===fQ.length?" 🎉 全問完了！":""}</div>`;
if(answered===fQ.length)h+=`<button class="quiz-next" onclick="resetQuiz()" style="margin-top:12px;background:var(--red)">もう一度チャレンジ</button>`;
h+=`</div>`;
}

// Pagination
const totalPages=Math.ceil(fQ.length/PS);
const page=Math.min(st.qPage,totalPages-1);
const startIdx=page*PS;
const endIdx=Math.min(startIdx+PS,fQ.length);
const pageQ=fQ.slice(startIdx,endIdx);

if(totalPages>1){
h+=`<div class="page-nav">`;
h+=`<button class="page-btn" onclick="setPage(${page-1})" ${page===0?"disabled":""}>◀</button>`;
for(let p=0;p<totalPages;p++){
h+=`<button class="page-btn${p===page?" active":""}" onclick="setPage(${p})">${p*PS+1}-${Math.min((p+1)*PS,fQ.length)}</button>`;
}
h+=`<button class="page-btn" onclick="setPage(${page+1})" ${page>=totalPages-1?"disabled":""}>▶</button>`;
h+=`</div>`;
}

h+=`<div class="cards">`;
const catColor=st.qCat==="kenri"?"#2563eb":st.qCat==="hourei"?"#d97706":st.qCat==="takken"?"#059669":"#7c3aed";
pageQ.forEach((q,pi)=>{
const gi=startIdx+pi;
const key=st.qCat+"-"+st.qSub+"-"+gi;
const cat=q.cat?cM[q.cat]:{color:catColor,name:q.fn||"問題"};
const ans=st.qAns[key];
const isAns=ans!==undefined;
const isOK=ans===true;

h+=`<div class="quiz-card"><div class="quiz-header"><span class="quiz-cat" style="background:${cat.color}">${cat.name}</span><span class="quiz-num">Q${gi+1}/${fQ.length}</span></div><div class="quiz-q">${q.q}</div><div class="quiz-btns">`;
if(!isAns){
h+=`<button class="quiz-btn" onclick="ansQ(${gi},true)">⭕ 正しい</button><button class="quiz-btn" onclick="ansQ(${gi},false)">❌ 誤り</button>`;
}else{
const uT=st.qAns[key+"_r"]===true,uF=st.qAns[key+"_r"]===false;
h+=`<button class="quiz-btn${q.a?"highlight":""}${uT?(isOK?" correct":" wrong"):""}" disabled>⭕${q.a?" ←正解":""}</button>`;
h+=`<button class="quiz-btn${!q.a?"highlight":""}${uF?(isOK?" correct":" wrong"):""}" disabled>❌${!q.a?" ←正解":""}</button>`;
}
h+=`</div>`;
if(isAns){
const expText=q.exp||q.e||'';
h+=`<div class="quiz-explanation"><div class="quiz-exp-box ${isOK?"correct-bg":"wrong-bg"}"><div class="quiz-result-icon">${isOK?"✅ 正解！":"❌ 不正解"}</div><div>${expText}</div></div></div>`;
}
h+=`</div>`;
});
h+=`</div>`;

// Bottom pagination
if(totalPages>1){
h+=`<div class="page-nav">`;
h+=`<button class="page-btn" onclick="setPage(${page-1})" ${page===0?"disabled":""}>◀ 前</button>`;
h+=`<span style="font-size:12px;color:var(--text2);padding:6px">${page+1} / ${totalPages}</span>`;
h+=`<button class="page-btn" onclick="setPage(${page+1})" ${page>=totalPages-1?"disabled":""}>次 ▶</button>`;
h+=`</div>`;
}

h+=`<div class="footer"><button class="reset-btn" onclick="resetQuiz()">クイズをリセット</button></div>`;
return h;
}

window.setMode=function(m){st.mode=m;st.expId=null;render();window.scrollTo(0,0);};
window.setCat=function(id){st.cat=id;st.expId=null;render();};
window.togExp=function(id){st.expId=st.expId===id?null:id;render();};
window.togChk=function(id){st.chk[id]=!st.chk[id];if(!st.chk[id])delete st.chk[id];save();render();};
window.resetStudy=function(){if(confirm("リセットしますか？")){st.chk={};save();render();}};
window.setQCat=function(id){st.qCat=id;st.qSub="all";st.qPage=0;render();window.scrollTo(0,0);};
window.setQSub=function(id){st.qSub=id;st.qPage=0;render();window.scrollTo(0,0);};
window.setPage=function(p){if(p>=0){st.qPage=p;render();window.scrollTo(0,0);}};
window.ansQ=function(i,u){const fQ=getFilteredQ(),q=fQ[i],k=st.qCat+"-"+st.qSub+"-"+i;st.qAns[k]=(u===q.a);st.qAns[k+"_r"]=u;save();render();};
window.resetQuiz=function(){if(confirm("リセットしますか？")){const fQ=getFilteredQ();fQ.forEach((_,i)=>{const k=st.qCat+"-"+st.qSub+"-"+i;delete st.qAns[k];delete st.qAns[k+"_r"];});st.qPage=0;save();render();window.scrollTo(0,0);}};

load();render();
if('serviceWorker' in navigator){const sw=`self.addEventListener('install',e=>{self.skipWaiting();});self.addEventListener('activate',e=>{e.waitUntil(clients.claim());});self.addEventListener('fetch',e=>{e.respondWith(caches.open('takken-v9').then(c=>c.match(e.request).then(r=>{const n=fetch(e.request).then(res=>{if(res.ok)c.put(e.request,res.clone());return res;}).catch(()=>r);return r||n;})));});`;navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:'application/javascript'}))).catch(()=>{});}
</script>
</body>
