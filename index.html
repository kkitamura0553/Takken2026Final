い。ます"},{"f":"shakuchi","fn":"借地借家法(借地)","q":"建物の所有を目的とする土地の賃借契約で借地系を設定する場合、において、存続期間を定めなかった時はその期間は30年となる","a":true,"e":"この場合、存続期間を定めないと存続期間は30年となります"},{"f":"shakuchi","fn":"借地借家法(借地)","q":"建物所有目的で期間を50年とする賃貸借契約を締結したコート地上でもっぱら賃貸アパート事業用の建物を所有する目的である場合、契約の更新や建物の築造による存続期間の延長がない旨を定めるには厚生少書で合意しなければならない","a":false,"e":"更新や存続期間の延長がない旨を定める。これは定期借地権となります。そして賃貸アパートな。ので事業用は不可そして期間は50年な。ので一般定期借地権となります。この場合、は公正証書ではなく書面で可能となってい。ます事業用の建物ってあるから事業用定期借地権かなって思うかもしれないんですが、だから構成少書としないでしっかりと問題文を読んでこれは何を聞かれているかというのをしっかりと理解するようにしておきましょう"},{"f":"shakuchi","fn":"借地借家法(借地)","q":"A所有の甲土地につきBとの間で居住のように共る建物の所有を目的として存続期間30年で賃貸借契約が締結された。aとBとが期間満了にあたり本件契約を最初に更新する場合、更新後の存続期間を15年と定めても20年となる","a":true,"e":"この場合、最初の更新は20年以上となります"},{"f":"shakuchi","fn":"借地借家法(借地)","q":"建物の所有を目的とする土地の賃貸借契約に関し地権の存続期間が満了する前に建物の別出があった場合地権者が借地権の残存期間を超えて存続すべき建物を築造した時その建物を築造する。ことにつき借地権設定の承諾がない場合でも借地権の期間の延長の効果が生ず","a":false,"e":"この場合、借地券設定の承諾がない。延長効果は生じないとされてい。ます"},{"f":"shakuchi","fn":"借地借家法(借地)","q":"建物の所有を目的とする土地の賃貸借契約において、借地権の登記がなくてもその土地の建物に借地人が事故所有者と記載した表示の登記をしていれば借地権を第3者に対抗する。ことができる","a":true,"e":"着地上の建物に事故を所有者とした登期があれば対抗可能となってい。ます"},{"f":"shakuchi","fn":"借地借家法(借地)","q":"AとBとの間でA所有の甲土地につき建物所有目的で賃貸借契約を締結した。bは甲土地につき借地権登記を備えなくてもBと同性でかつ同居している未成年の長男名義で保存登記した建物を甲土地上に所有していれば甲土地の所有者が変わっても甲土地の新所有者に対し地形を対抗する。ことができる","a":false,"e":"この場合、登記は借地権者本人の名義で行う必要があるとされてい。ます。長男ではない。ので注意が必要です"},{"f":"shakuchi","fn":"借地借家法(借地)","q":"Aが居住用の甲建物を所有する目的でBから乙土地を賃借した。Aが地代を支払わなかった。ことが理由でBが乙土地の賃貸借契約を解除した契約に特段の定めがない時Bは甲建物を時価で買い取らなければならない","a":false,"e":"賃料不払い等の債務不履行理由に解除された場合、建物買い取り請求権を行使する。ことはできないとされてい。ます。Aの債務不履行が原因である。ため買取請求権は行使できないということ"},{"f":"shakuchi","fn":"借地借家法(借地)","q":"A所有の甲土地につきBとの間で賃貸借契約が締結された本件契約が建物所有を目的としている場合、契約の更新がなく建物の買い取りの請求をしない。こととする胸を定めるにはAはあらかじめBに対しその旨を記載した書面を交付して説明しなければならない","a":false,"e":"この場合、契約の更新がなく。の買取りの請求をしないということから一般定期借地権または事業用定期借地権となります。な。のであらかじめ書面を交付して説明しなければならないという義務はない。ので注意が必要ですついつい丸にしてしまう人も多いと思うんですが、気をつけましょう"},{"f":"shakuchi","fn":"借地借家法(借地)","q":"体人Aと賃借人Bとの間の家賃に関し家賃の増減について特約のない場合、で建物の価格の低下その他の経済事情の変動により家賃が相当に高額となった時BはAに対し将来に向かって家賃の減額を請求できる","a":true,"e":"この場合、BはAに対し家賃の減額を請求できるとされてい。ます"},{"f":"shakuchi","fn":"借地借家法(借地)","q":"借地人Aが高知所有者Bと締結した建物所有を目的とする高知賃貸借契約に基づいてAが借地権をCに譲渡した放置上のA所有の建物が登記されている場合、AがCと当該建物を譲渡する旨の合意をすればBの承諾のうに関わらずCはBに対して、高知の借地権を主張できる","a":false,"e":"この場合釈権の譲渡をする場合、賃貸人の承諾が必要となります問題文は「Bの承諾の有無に関わらず」とありますが、これが不適切ということ"},{"f":"shakuchi","fn":"借地借家法(借地)","q":"借地借法の規定において、借地人が借地権を譲渡しようとする場合、賃貸人に不利となる恐れがないにも関わらず承諾が得られない時は借地人は裁判所に申し立てる。ことにより賃貸人の承諾に変わる許可を受ける。ことができる","a":true,"e":"aがCに譲渡したい。のにBがいいよって言わない時は借地人は裁判所に申し立てる。ことができますする。のは借地人す。なわちAが裁判所に対しする。ため守護は誰かというのを気をつけましょう"},{"f":"shakuchi","fn":"借地借家法(借地)","q":"事業のように共する建物の所有を目的とする場合、であれば従業員の社として従業員の居住の用に供する時であっても、事業用定期借地権を設定する。ことができる","a":false,"e":"従業員の選択であっても、事業用定期借地権はもっぱら事業のように共する建物の所有を目的とする場合、に設定する。ことができます"},{"f":"shakuchi","fn":"借地借家法(借地)","q":"借地借法においてもっぱら借主Bの事業のように共る建物の所有を目的とし存続期間が50年である場合、契約の更新及び建物の再築上による存続期間の延長がない旨並びにBが建物の買い取りの請求をしない旨の特約を書面で有効に定める。ことができる","a":true,"e":"この場合、期間が50年で存続期間の延長がない。一般定期借地権となります。な。ので建物買い取り請求権を排除する。ことが可能となってい。ます"},{"f":"shakuchi","fn":"借地借家法(借地)","q":"地契約が借主の臨時設備の設置その他一時使用のためになされる。ことが明らかである場合、期間を5年と定め契約の更新や建物の築造による存続期間の延長がない胸を借地契約に定める。ことができる","a":true,"e":"一時使用のため借地下法ではなく民法が適用されます民法は存続期間は50年以下で定めればよく。また、更新のない契約も可能となってい。ます民法と借地借法どっちが適用されるかは必ず問題文を読んで分かるようにしておきましょう"},{"f":"shakuchi","fn":"借地借家法(借地)","q":"地下法において、当事者が借地系の設定後に最初に借地契約を更新する場合、存続期間を定めなかった時はその期間は更新の日から10年となる","a":false,"e":"この場合、10年ではなく20年となってい。ます"},{"f":"shakuchi","fn":"借地借家法(借地)","q":"地借法において、借地系の存続期間が満了する際借地建者の契約の更新請求に対し地権設定者が伝体なく意義を述べた場合、には借地契約は当然に終了する","a":false,"e":"伝体なく意義を述べる。ことこれにプラスして政党自由が必要となってい。ます"},{"f":"shakuchi","fn":"借地借家法(借地)","q":"地借家法において、転借地権が設定されている場合、転借地上の建物が滅失した時は転借地権は消滅し転借地権者転借人は建物を再築する。ことができない","a":true,"e":"転借地権が設定されている場合転借地権者による建物の再築は借地再築は借地権者による再築とみなされます。な。ので転借地上の建物が滅失されている場合でも転借地権者は建物を再築可能となってい。ます"},{"f":"shakuchi","fn":"借地借家法(借地)","q":"2七以上ある土地の借地権者がそのうちの一筆の土地上に登記のある建物を所有し登記ある建物がない他方の土地は庭として使用する。ために賃貸しているに過ぎない場合、登記ある建物がない土地は対抗力は及ばない","a":true,"e":"この場合、庭は土地上に登記ある建物がない。ため代負不不可となってい。ます。対抗力を及ばないとされてい。ます権利関係の"},{"f":"shakka","fn":"借地借家法(借家)","q":"契約期間が2年で更新がない。こととする旨を定める建物賃貸借契約に関し定期建物賃貸借契約を適に締結した場合、賃貸は期間満了日1ヶ月前までに期間満了により契約が終了する旨を通知すればその終了を賃借人に対抗できる","a":false,"e":"この場合契約期間が2年。期間の定めがあるものとされてい。ます。この場合は期間満了の1年前から6ヶ月前の間に期間満了により契約が終了する旨を通知する必要があります問題文は1ヶ月前とある。ので不適切"},{"f":"shakka","fn":"借地借家法(借家)","q":"定期建物賃貸借契約であるか田舎に関わらず造作請求権をあらかじめ放棄する旨の特約は有効に定める。ことができる","a":true,"e":"増作買い取り請求権をあらかじめ放棄する。までの特約は有効となってい。ます"},{"f":"shakka","fn":"借地借家法(借家)","q":"定期建物賃借契約を契約期間を2年として締結した契約の更新がなく期間満了により終了する。ことを書面を交付または電磁的方法により提供すればあらかじめ借主に説明すれば期間満了前に貸主が借主に改めて通知しなくても契約が終了する旨の特約を有効に定める。ことができる","a":false,"e":"期間が1年以上の場合、期間満了の1年前から6ヶ月前までの間に賃借に対し期間満了により賃借の終了の通知をしなければならないとされてい。ます。しっかり通知も必要。"},{"f":"shakka","fn":"借地借家法(借家)","q":"AはBに対し甲建物を月20万円で賃貸しAの承諾を得た上で甲建物の一部をCに対し月10万円で転貸している。AB間で賃貸借契約を合意解除しても原則として賃貸人Aは転借人Cに対し明け渡しを請求する。ことはできない","a":true,"e":"合意解除の場合は賃貸人と賃借人の合意によって解除された場合賃貸人は転借人に対抗する。ことができないとされてい。ますよく債務不履行と比較されるところな。ので合意解除の場合債務不履行の場合はどういった結果になるかというのを必ず覚えておくようにしましょう"},{"f":"shakka","fn":"借地借家法(借家)","q":"賃貸人Aが賃借人Bとの賃貸借契約を賃料不払いを理由に解除する場合、は転借人Cに通知等をして賃料をBに変わって支払う機会を与えなければならない","a":false,"e":"この場合賃借人の債務振る解除す。なわちBが悪い。ことをした場合、賃貸人は転借人に通知通して賃料を賃借人に変わって支払う機会を与える必要はないとされてい。ます"},{"f":"shakka","fn":"借地借家法(借家)","q":"賃貸人と賃借人との間で期間5年として定期建物賃貸借契約を締結する場合、賃貸人も賃借人も契約期間中の中途解約をする。ことができない旨の規定は有効である","a":false,"e":"定期建物賃貸借契約は賃借人から中途解約の申し入れができるとされてい。ますは①面積200㎡未満の居住用建物②転勤、療養、親族の介護その他を得ない事情により建物の賃借人が建物を自己の生活の本拠として使用する。ことが困難な場合この場合は解約の申し入れができるとされてい。ます。しっかりと要件は確認しておきましょう"},{"f":"shakka","fn":"借地借家法(借家)","q":"定期建物賃貸契約を締結する時は期間を1年未満としても期間の定めがない建物の賃貸借契約とはならない","a":true,"e":"期間を1年未満とした場合、普通借家は定めがない建物の賃貸借と見なされますが定期借家の場合は期間の定めがない建物の賃貸契約とは見なされない。ので比較しておきましょう普通借家の場合と定期借家の場合この比較はよく出るところとなってい。ます"},{"f":"shakka","fn":"借地借家法(借家)","q":"Aを賃貸人Bを賃借人とする。こ建物の賃貸借契約薬が締結された甲建物がBに引き渡された後甲建物の所有権がAからCに移転した場合、本件契約の指金は他に特段の合意がない限りBのAに対する未払い賃料債務に重され残額がCに継承される","a":true,"e":"この場合、Bは甲建物の引き渡しを受けている。Bは対抗要件を備えてい。ます。な。ので賃貸人たる地位が譲受人Cに移転した時は式金の変換に関する債務は譲り受けに地位に承継されるとされてい。ます"},{"f":"shakka","fn":"借地借家法(借家)","q":"貸借契約の期間満了の6ヶ月前までに更新しない旨の通知をしなかった時は期間3年賃料月額10万円の条件で賃貸借契約を更新したものと見なされる","a":false,"e":"この場合、期間3年ではなく期間の定めがないものとなります"},{"f":"shakka","fn":"借地借家法(借家)","q":"賃貸借契約の更新の際家賃の増額について賃の請求があった時は賃借人はこれを拒むことはできない","a":false,"e":"この場合、沈人は裁判が確定する。まで事故が相当と認める家賃を支払えば良いとされてい。ます"},{"f":"shakka","fn":"借地借家法(借家)","q":"AはB所有の甲建物につき居住を目的として期間2年両月額10万円と定めた賃貸借契約をBと締結して建物の引き渡しを受けた本件契約期間中にBが甲建物をCに売却した場合、Aは甲建物に賃借権の登記をしてい。なくてもCに対して、甲建物の賃借権がある。ことを主張する。ことができる","a":true,"e":"この場合、建物の引き渡しを受けていれば第3者に対抗する。ことができるとされてい。ます。Aは引き渡しを受けている。のでCに対し対抗する。ことが可能となってい。ます"},{"f":"shakka","fn":"借地借家法(借家)","q":"Aが所有する甲建物をBに対して、3年間賃貸する旨の契約をした場合、AがBに対し甲建物の賃貸借契約の期間満了の1年前に更新しない旨の通知をしていればAB間の賃貸借契約は期間満了によって当然に終了し更新されない","a":false,"e":"この場合、賃貸は通知にプラスして正当自由が必要となります。また、期間満了後も継続して使用している賃借人に意義を述べないと従前の条件で更新したものと見なされます"},{"f":"shakka","fn":"借地借家法(借家)","q":"作地下法において、期間の定めのない契約では賃貸人は沈人に対し外約の申し入れの日から6ヶ月を経過しないと建物の分け渡しを請求する。ことができない","a":true,"e":"期間の定めがない場合、賃貸借は解約の申し入れから6ヶ月経過後賃借は3ヶ月経過後に賃貸借が終了します"},{"f":"shakka","fn":"借地借家法(借家)","q":"取り壊し予定の建物の賃貸策であり甲建物を取り壊す。こととなる時に本件契約が終了する旨の特約を定める場合、本件契約は合成上書によってしなければならない","a":false,"e":"この場合、合成ではなく署名によってしなければならないとされてい。ます"},{"f":"shakka","fn":"借地借家法(借家)","q":"賃貸借契約が定期建物賃貸借で契約の更新がない胸を定めるものである場合、当該契約前に賃貸人が賃借人に契約の更新がなく機間の満了により終了する旨を記載した書面を交付して説明しなければ契約の更新がない旨の薬場は無効となる","a":true,"e":"この場合、定期建物賃貸借となる。のであらかじめ借主に対し契約の更新がなく期間満了により終了する。ことを書面を交付して説明しなければならないとされてい。ます"},{"f":"shakka","fn":"借地借家法(借家)","q":"賃借人Bが相続人な。しに死亡した場合、Bと行の届出してい。ないが事実上夫婦と同様の関係にあった同居者DはBが相続人な。しに死亡した。ことを知った後1ヶ月以内に人Aに反対の意思表示をしない限り借人としてのBの権利義務を証計する","a":true,"e":"賃借人が相続人な。しに死亡した場合、事実上夫婦または要心士と同様の関係にあった同居者がある時はその同居者が賃借権を承継します。な。のでこの場合だとDが賃借権を証計するというもの"},{"f":"shakka","fn":"借地借家法(借家)","q":"建物の賃貸人が賃貸物の保存に必要な修繕をする場合、賃借人は修繕工事のため使用収益に支障が生じてもこれを拒むことはできない","a":true,"e":"この場合、賃借は拒ばむことはできないとされてい。ます"},{"f":"shakka","fn":"借地借家法(借家)","q":"地借法において、賃貸人が甲建物の賃貸借計薬の解除の申し入れをした場合、には申し入れ日から3ヶ月で賃貸借計薬が終了する旨を定めた特約は賃借人があらかじめ同意していれば有効となる","a":false,"e":"この場合、賃貸人からの解約申し入れは6ヶ月となっている。ので3ヶ月は賃借人に不利な特約として無効となります"},{"f":"shakka","fn":"借地借家法(借家)","q":"賃貸借計薬の期間満了による終了を転借人に通知しなければ契約終了を転借人に対抗できない","a":true,"e":"この場合、しっかりと通知をする必要があるとされてい。ます"},{"f":"shakka","fn":"借地借家法(借家)","q":"借地借法においては賃貸中の建物が譲渡された場合、賃借人の承諾がなくても指金変換債務は新所有者に承継される","a":true,"e":"この場合、指金変換債務は新所有者に証計されるとなってい。ます権利関係の"},{"f":"kubun","fn":"共有・区分所有法","q":"AB及びCが持分を各1/3とする甲土地を共有している。aB及びCが甲土地についてEと賃貸借契約を締結している場合、AとBが合意すればCの合意はなくとも賃貸借契約を解除する。ことができる","a":true,"e":"共有物の賃貸借契約の解除は下半数でできるとされてい。ます"},{"f":"kubun","fn":"共有・区分所有法","q":"共用部分に関する各共有者の持分はその有する専有部分の床面積の割合による。こととされており規約で別断の定めをする。ことはできない","a":false,"e":"規約で別段の定めも可能となってい。ます"},{"f":"kubun","fn":"共有・区分所有法","q":"管理者は少なくとも毎年1回集会を招集しなければならない","a":true,"e":"毎年1回集会を証集しなければならないとされてい。ます"},{"f":"kubun","fn":"共有・区分所有法","q":"規約及び集会の決議は区分所有者の特定証券に対してはその効力を生じない","a":false,"e":"特定証券人に対しても効力を生じるとされてい。ます"},{"f":"kubun","fn":"共有・区分所有法","q":"共用部分の保存行為については、各区分所有者はいかなる場合、でも自ら単独で行うことができる","a":false,"e":"誤りの記述です。"},{"f":"kubun","fn":"共有・区分所有法","q":"AB及びCが持分を各1/3とする甲土地を共有している甲土地全体がEによって不法に占有してい場合、Aは単独でEに対して、Eの不法占有によってAB及びCに生じた損害全額の賠償を請求できる","a":false,"e":"この場合、Aは自己の持分を超えて損害賠償請求する。ことはできないとされてい。ます。Aの分だけだったらよい。のですがBとCそれぞれの分は請求不可となってい。ます。ここは問われやすいところな。ので確認しておきましょう"},{"f":"kubun","fn":"共有・区分所有法","q":"専有部分であっても、規約で定める。ことにより敷地利用権と分離して処分する。ことができる","a":true,"e":"この場合、分離して処分は可能となってい。ます"},{"f":"kubun","fn":"共有・区分所有法","q":"集会においては法で集会の決議につき特別の定数が定められている時効を除きで別断の定めをすればあらかじめ通知した事項以外についても決議する。ことができる","a":true,"e":"規約で別段の定めをすれば可能となってい。ます"},{"f":"kubun","fn":"共有・区分所有法","q":"他の区分所有者から区分所有権を譲り受け建物の専有部分の全部を所有する。こととなったものは公正証書による規約の設定を行うことができる","a":false,"e":"この場合、最初に建物の専有部分の全部を所有するものは可能ですが次にもらった人というのはできない。ので注意が必要です"},{"f":"kubun","fn":"共有・区分所有法","q":"管理組合は区分所有者が2人以上である時所定の手続きを得て法人となる。ことができるがその際感字を置かなければならない","a":true,"e":"管理組合いは区分所有者が2人そして漢字を置く必要があるとされてい。ます"},{"f":"kubun","fn":"共有・区分所有法","q":"一部共用部分はこれを共有すべき区分所有者の共有に属するが契約で別断の定めをする。ことにより区分所有者全員の共有に属する。こととする。こともできる","a":true,"e":"正しい選択肢となってい。ます"},{"f":"kubun","fn":"共有・区分所有法","q":"共用部分の管理にかかる費用については、規約に別断の定めがない限り共有者の持分に応じて負担する","a":true,"e":"共有者の持分に応じて負担するとされてい。ます"},{"f":"kubun","fn":"共有・区分所有法","q":"管理者がない時は区分所有者の1/5以上で議決権の1/5以上を有するものは集会を招集する。ことができこの定数は規約で減ずる。ことができる","a":true,"e":"1/5以上と規約で減らす。ことができる2つ合わせて覚えましょう"},{"f":"kubun","fn":"共有・区分所有法","q":"共用部分の保存行為をするには規約に別断の定めがない限り集回の決議で決する必要があり各共有者でする。ことはできない","a":false,"e":"保存行為は各共有者が単独でする。ことができるとされてい。ます"},{"f":"kubun","fn":"共有・区分所有法","q":"AB及びCが持分を各1/3とする後を共有している共有者の協議に基づかないでAから甲土地の占有仕様を承認された。DはAの持分に基づくものと認められる限度で後地を占有使用する。ことができる","a":true,"e":"この場合、DもAの持分に応じて使用する。ことができるとされてい。ます"},{"f":"kubun","fn":"共有・区分所有法","q":"共用部分は区分所有者全員の共有の登記を行わなければ第3者に対抗する。ことができない","a":false,"e":"規約共用部分は登期をしなげれば対抗できませんが法廷共用部分は登記がなくても対抗できるとされてい。ます"},{"f":"kubun","fn":"共有・区分所有法","q":"所有者が建物の保存に有害な行為その他建物の管理は使用に関し区分所有者の共同の利益に反する行為をした場合はその行為をする恐れがある場合、他の区分所有者の全員または管理組合法人は区分所有者の共同の利益のためその行為を停止しその行意の結果を除去しまたはその行意を予防する。ため必要な措置を取る。ことを請求する。ことができる","a":true,"e":"正しい選択肢となってい。ます"},{"f":"kubun","fn":"共有・区分所有法","q":"共用部分の保存行為は規約に別断の定めがある場合、を除いて各共有者がする。ことができる。ため仲回の決議を必要としない","a":true,"e":"保存行為は各共有者がする。ことができるとされてい。ます"},{"f":"kubun","fn":"共有・区分所有法","q":"一部共用部分に関する事項で区分所有者全員の理害に関係しないものは区分所有者全員の規約に定める。ことができない","a":false,"e":"この場合、複有者全員の規約に定める。ことができるとされてい。ます"},{"f":"kubun","fn":"共有・区分所有法","q":"有者は建物またはその敷地もしくは付属施設の使用方法につき区分所有者が規約は集会の決議に基づいておう義務と同一の義務を負う","a":true,"e":"専用者も同一の義務を負うとされてい。ます"},{"f":"kubun","fn":"共有・区分所有法","q":"区分所有法では専有部分が数人の共有に属する時は規約で別断の定めをする。ことにより共有者は議決権を行使すべきものを2人まで定める。ことができる","a":false,"e":"2人ではなく議決権を行使すべきものは1人と定められてい。ます"},{"f":"kubun","fn":"共有・区分所有法","q":"共用部分の持分の割合について各共有者の共用部分の持分は規約で別断の定めをしない限りその有する専有部分の床面積の割合による","a":true,"e":"共用部分の持分の割合は床面積の割合によるとされてい。ます"},{"f":"kubun","fn":"共有・区分所有法","q":"仲回は区分所有者議決権を有しないものを除く及び議決権の各4分の3以上の多数の同意がある時集の手続きを得ないで開く。ことができる","a":false,"e":"全員の同意があれば少集の手続きは不要となります"},{"f":"kubun","fn":"共有・区分所有法","q":"区分所有者は規約に別断の定めがない限り集会の決議によって管理者を選任しまたは介る","a":true,"e":"集会の決議で管理者を選任解認する。ことができます"},{"f":"kubun","fn":"共有・区分所有法","q":"録が書面で作成されている時議長及び集会に出席した区分所有者全員がこれに署名しなければならない","a":false,"e":"議長及び集会に出席した区分所有者の2人となってい。ます全員ではない。ので注意が必要です"},{"f":"kubun","fn":"共有・区分所有法","q":"立替え決議を目的とする集会を招集する時は開りくとも2ヶ月前に招集通知を発しなければならない。た。だ。しこの期間は規約で慎重できる","a":true,"e":"立替え決議は2ヶ月前に招集通知を発なければならないとされてい。ます。また。この期間は伸ばす。ことは可能ですが縮める。ことは不可 しない間は注文者はいつでも請負人に対し損害や賠償して解除する。ことができるとされてい。ます"},{"f":"fuhou","fn":"請負・不法行為","q":"Aを注文者Bを請負人とする請負契約が締結された場合本件契約の目的建物にBの攻めに起すべき自由による契約の内容に適合しない重大な瑕疵がある。ためこれを立替えざるを得ない場合、AはBに対して、当該建物の立替えに要する費用相当額の損害賠償を請求する。ことができる","a":true,"e":"この場合、Bの攻めにキすべき自由。損害賠償の請求が可能となってい。ます"},{"f":"fuhou","fn":"請負・不法行為","q":"Aに雇用されている。Bが勤務中にA所有の乗用者を運転し営業活動の途中で交通時効を起こし歩いてい。た。Cに機害を加えた。aの使用者責任が認められてCに対し損害を賠償した場合、にはAはBに対して、急する。ことができる。のでBに資力があれば最終的にはAはCに対して、賠償した損害額の全額を常にBから回収する。ことができる","a":false,"e":"この場合、全額を常にではなく審議速相当と認められる範囲内で回収が可能となってい。ます"},{"f":"fuhou","fn":"請負・不法行為","q":"Aが1人で居住する甲建物の保存に瑕疵があった。ため甲建物の壁が崩れて通行人Bが怪我をした本件事故についてAのBに対する不法行為責任が成立する場合、BのAに対する損害賠償請求権はBまたはBの法定代理人が損害または加害者を知らない時でも本件事故の時から20年間行使しない時には事項により消滅する","a":true,"e":"この場合、不法行為の時から20年間行使しないと事項により消滅するとされてい。ます"},{"f":"fuhou","fn":"請負・不法行為","q":"Aが1人で居住する甲建物の保存に瑕疵があり甲建物の壁が崩れて通行にBが怪我をした。aのBに対する不法行為責任が成立する場合、BのAに対する損害賠償請求権はBまたはBの法定代理人が損害及び加害者を知った時から5年間行使しない時には事項により消滅する","a":true,"e":"人の生命または身体を害する不法行為による損害賠償請求権を行使しない場合、は5年間で事項により消滅するとされてい。ます"},{"f":"fuhou","fn":"請負・不法行為","q":"不法行為によって名誉を既存されたものの、慰謝料請求権は被害者が生前に請求の意思を表明しなかった場合、でも相続の対象となる","a":true,"e":"慰謝料請求権も相続の対象となり相続人は慰謝料請求権を行使が可能となってい。ます"},{"f":"fuhou","fn":"請負・不法行為","q":"Aを注文者Bを受け追い人とする受け追い契約が締結された本件契約の目的が建物の増築である場合、Aの荷により当該建物が消出し増築できなく。なった時はBは本件契約に基づく履行部分の仕事完成債務を免がれる","a":true,"e":"この場合Aの荷。注文者が悪い場合Bは本件契約に基づくミリ部分の仕事完成債務を免れ、報酬を請求可能とされてい。ます。"},{"f":"fuhou","fn":"請負・不法行為","q":"不法行為による損害賠償の支払い債務は最国を待たず損害発生と同時に遅滞に陥る。のでその時以降完成に至る。までの遅延損害金を支払わなければなら","a":true,"e":"**損害発生と同時に遅滞に陥るとされてい。ます"},{"f":"fuhou","fn":"請負・不法行為","q":"不法行為の被害者は損害賠償債権を自動債権として加害者に対する金銭変換債務と総裁する。ことができない","a":false,"e":"被害者側からは総裁を主張する。ことは可能となってい。ます"},{"f":"fuhou","fn":"請負・不法行為","q":"従業員Aが宅建業者Bの業務を遂行中に第3者Cに不法行為による損害を与えた。bはその損害を賠償しなければならないがAに対して、その急をする。ことはできない","a":false,"e":"この場合、CはAに対しても急証権を行使する。ことができるとされてい。ます"},{"f":"fuhou","fn":"請負・不法行為","q":"不法行為による損害賠償請求権の消滅時効の被害者が損害を知った時とは被害者が損害の発生を現実に認識した時を言う","a":true,"e":"正しい選択肢となってい。ます"},{"f":"fuhou","fn":"請負・不法行為","q":"加害者数人が共同不法行為として各自連帯して損害賠償の責任を負う場合、その1人に対する理行の請求は他の加害者に対してはその効力を有しない","a":true,"e":"共同不法行為の場合、はお互いに連帯債務者の関係となりますす。なわち連帯債務者の1人に対して、生じた自由は別段の定めがない限り他の債務者に対して、効力を生じないとされてい。ます"},{"f":"fuhou","fn":"請負・不法行為","q":"不法行為の加害者が海外に在住している間は20年の時効期間は進行しない","a":false,"e":"**加害者が海外にいる間も時期は進行します"},{"f":"fuhou","fn":"請負・不法行為","q":"不法占挙により日々発生する損害は加害行為が終わった時から一括して消滅時効が進行し日々発生する損害を知った時から別っこに消滅時効が進行する。ことはない","a":false,"e":"別っこに消滅時効が進行するものとなってい。ます"},{"f":"fuhou","fn":"請負・不法行為","q":"不法行為に基づく損害賠償債務は被害者が再告をする。までもなく。その損害の発生の時から伝えに陥る","a":true,"e":"**損害の発生と同時に遅滞に陥るとされてい。ます権利関係"},{"f":"souzoku","fn":"相続・その他","q":"自質による融合をする場合、証人2人以上の立ち合いが必要である","a":false,"e":"実質は承認は不要となってい。ます"},{"f":"souzoku","fn":"相続・その他","q":"医療移流文侵害学の請求は訴えを定期しなくても内容証明郵便による意思表示だけでもする。ことができる","a":true,"e":"必ずしも裁判上の請求による必要はないとされてい。ます"},{"f":"souzoku","fn":"相続・その他","q":"aがBから授業のために1000万円を借りている場合、Aが死亡し唯一の相続人であるFが相続の単純承認をするとFがBに対する借入れ金債務の存在を知らなかったとしてもFは当該借入れ金債務を相続する","a":true,"e":"単純は相続人が非続人の資産及び負債を全て相続します単純承認したFはAの借入れ金債務の存在を知らなかったとしてもその時点で当該借入れ金債務を相続するとされてい。ます"},{"f":"souzoku","fn":"相続・その他","q":"Aの臨地の竹僕の枝が教界線を超える時はAは竹僕の所有者にその枝の秩序を求める。ことができの竹僕の根が境界線を超える時はAはその根を切り取る。ことができる","a":true,"e":"ピンチから教会を超えて伸びてきた枝は切る。ことはできませんが根っこは切り取る。ことができるとされてい。ます"},{"f":"souzoku","fn":"相続・その他","q":"厚生少書有言の作成には証人2人以上の立ち合いが必要であるが、推定相続人は未成年者でなくとも承認となる。ことができない","a":true,"e":"推定相続人は未成年者でなくても承認となる。ことはできないとされてい。ます。また、厚生少書有言の証人は2人以上の立ち合いが必要となってい。ます"},{"f":"souzoku","fn":"相続・その他","q":"適な予言をしたものがその後さらに適な遺言をした場合、前の遺言のうち後の遺言と定食する部分は後の遺言により撤開したものと見なされる","a":true,"e":"この場合、前の遺言と定食する部分は後の遺言で撤開したものと見なされます"},{"f":"souzoku","fn":"相続・その他","q":"複数の筆の他の土地に囲まれて行動に通じない土地の所有者は行動に至る。ためその土地を囲んでいる他の土地を自由に選んで通行する。ことができる","a":false,"e":"通行の場所方法は必要かつ臨チの被害が最も少なるようにしなければならないとされてい。ます。自由に選んで通行する。ことができるわけではない。ので注意が必要です"},{"f":"souzoku","fn":"相続・その他","q":"限定承認をする際は相続人全員が共同してしなければならない","a":true,"e":"限定承認は相続全員で共同してするものとされてい。ます"},{"f":"souzoku","fn":"相続・その他","q":"異なる監修がある場合、を除き会未満の距離において、他人の宅地を見通す。ことができる窓を設ける時は目隠しをつけなければならない","a":true,"e":"境界線から1m未満の場合、は目隠しをつけなければならないとされてい。ます"},{"f":"souzoku","fn":"相続・その他","q":"遺産分割協議において、配偶者居住権の存続期間が定められなかった場合、存続期間は20年となる","a":false,"e":"20年ではなく就中心となります"},{"f":"souzoku","fn":"相続・その他","q":"2人の装飾人のうち一方、が単純承認をした時は他方は限定承認をする。ことができない","a":true,"e":"限定承認は共同相続人の全員が共同して行う必要がある。ため1人でも単純承認をするとできないとされてい。ます"},{"f":"souzoku","fn":"相続・その他","q":"相続の放棄をする場合、その旨を家庭裁判所に実しなければならない","a":true,"e":"相続の放棄は家庭裁判所に対して行うとされてい。ます"},{"f":"souzoku","fn":"相続・その他","q":"実質によって遺言をする場合、予言者はその全分日付及び指名を辞書して応援しなければならないがこれに添付する相続財産の目録については、有号者がマイページに署名応援すれば辞書でないものも認められる","a":true,"e":"財産目録は署名応援していればパソコン等で作成も可能となってい。ます"},{"f":"souzoku","fn":"相続・その他","q":"未成年であっても、15歳に達したものは有効に遺言をする。ことができる","a":true,"e":"15歳に達すると酔い顔をする。ことができるとされてい。ます"},{"f":"souzoku","fn":"相続・その他","q":"非相続Aの配偶者BがA所有の建物に相続開始の時に居住してい。た。ため遺産分割協議によって配偶者居住権を取得した配偶者居住権の存続期間中に配偶者居住権を取得したものが死亡した場合、Bの相続CはBの有してい。た配偶者居住権を相続する","a":false,"e":"配偶者居住権は配偶者が死亡した場合、その時点で消滅するとされてい。ます。相続するわけではない。ので注意が必要です"},{"f":"souzoku","fn":"相続・その他","q":"法定相続人である被相続人の兄弟姉妹は遺留分権利者とはならない","a":true,"e":"兄弟姉妹は遺留分権利者とはならないとされてい。ます頻出論点です。兄弟姉妹のところは相続で覚えましょう。"},{"f":"souzoku","fn":"相続・その他","q":"配偶者居住権を登記すれば配偶者はその権利を第3者に対抗する。ことができる","a":true,"e":"登記をすると対抗する。ことができるとされてい。ます"},{"f":"souzoku","fn":"相続・その他","q":"相続開始前に家庭裁判所の許可を得て移流分を放棄した場合、でも遺産を相続する権利は失われない","a":true,"e":"移流分を放棄しても相続を放棄したわけではない。ので比較しておきましょう"},{"f":"touki","fn":"不動産登記法","q":"配偶者居住権は登記する。ことができる権利に含まれない","a":false,"e":"配偶者居住権は登期が可能となってい。ます。これで権利関係の演習問題全345問は終了です"}];
const ZQ=[{"f":"shutoku","fn":"不動産取得税","q":"不動産取得税は、不動産の取得に対し、当該不動産の所在する市町村が課する税である。","a":false,"e":"不動産取得税の課税主体は都道府県です。市町村ではありません。固定資産税が市町村税であることと混同しないよう注意が必要です。"},{"f":"shutoku","fn":"不動産取得税","q":"相続により不動産を取得した場合、不動産取得税は課税されない。","a":true,"e":"相続による取得は非課税です。ただし、贈与による取得は課税されます。包括遺贈は非課税、特定遺贈は課税される点にも注意が必要です。"},{"f":"shutoku","fn":"不動産取得税","q":"贈与により不動産を取得した場合、不動産取得税は課税されない。","a":false,"e":"贈与による取得は課税対象です。非課税となるのは相続による取得です。"},{"f":"shutoku","fn":"不動産取得税","q":"不動産取得税の課税標準は、固定資産課税台帳に登録された価格である。","a":true,"e":"不動産取得税の課税標準は、原則として固定資産課税台帳に登録された価格（固定資産税評価額）です。"},{"f":"shutoku","fn":"不動産取得税","q":"新築住宅を取得した場合の不動産取得税の課税標準の特例として、一戸につき1,500万円が控除される。","a":false,"e":"新築住宅の課税標準の特例は一戸につき1,200万円の控除です。1,500万円ではありません。なお、認定長期優良住宅の場合は1,300万円となります。"},{"f":"shutoku","fn":"不動産取得税","q":"不動産取得税の免税点は、土地の取得にあっては10万円である。","a":true,"e":"免税点は土地10万円、家屋の建築23万円、家屋の売買等12万円です。"},{"f":"shutoku","fn":"不動産取得税","q":"不動産取得税の標準税率は、原則として100分の4である。","a":true,"e":"標準税率は原則4/100（4%）です。ただし、住宅及び土地については、特例により3/100（3%）に軽減されています。"},{"f":"shutoku","fn":"不動産取得税","q":"委託者のみが信託財産の元本の受益者である信託において、受託者から委託者に信託財産を移す場合、不動産取得税は課税されない。","a":true,"e":"形式的な所有権の移転として非課税とされています。実質的な所有権の移転がない場合には課税されません。"},{"f":"kotei","fn":"固定資産税","q":"固定資産税の賦課期日は、毎年4月1日である。","a":false,"e":"賦課期日は毎年1月1日です。年度の開始日である4月1日と混同しやすいので注意が必要です。"},{"f":"kotei","fn":"固定資産税","q":"固定資産税は、固定資産の所有者に対して課される市町村税である。","a":true,"e":"固定資産税の課税主体は市町村です（東京23区は都）。不動産取得税（都道府県税）との違いを覚えましょう。"},{"f":"kotei","fn":"固定資産税","q":"年の途中で土地の売買があった場合、買主が当該年度の固定資産税を納付する義務を負う。","a":false,"e":"固定資産税の納税義務者は、賦課期日（1月1日）現在の所有者です。年の途中で売買があっても、1月1日時点の所有者が全額を納付します。"},{"f":"kotei","fn":"固定資産税","q":"住宅用地で小規模住宅用地（200㎡以下の部分）に該当するものは、課税標準が6分の1に軽減される。","a":true,"e":"小規模住宅用地（200㎡以下の部分）は課税標準が1/6に軽減されます。一般住宅用地（200㎡超の部分）は1/3です。"},{"f":"kotei","fn":"固定資産税","q":"新築住宅に対する固定資産税の減額措置として、一定の要件を満たす住宅は5年間にわたり税額が2分の1に減額される。","a":false,"e":"一般の新築住宅は3年間、1/2に減額されます。5年間となるのは3階建以上の耐火・準耐火建築物（マンション等）の場合です。"},{"f":"kotei","fn":"固定資産税","q":"固定資産税の免税点は、土地が30万円、家屋が20万円である。","a":true,"e":"免税点は土地30万円、家屋20万円です。不動産取得税の免税点（土地10万円）と混同しないよう注意が必要です。"},{"f":"kotei","fn":"固定資産税","q":"固定資産税の納期は、4月・7月・12月・2月の4期に分けて納付するのが原則である。","a":true,"e":"原則として4月・7月・12月・翌年2月の年4回に分けて納付します。ただし、市町村の条例により異なる場合があります。"},{"f":"joto","fn":"譲渡所得税","q":"居住用財産を譲渡した場合の3,000万円の特別控除は、所有期間が10年を超えていなければ適用を受けることができない。","a":false,"e":"3,000万円特別控除は所有期間の長短を問わず適用可能です。所有期間10年超が要件なのは軽減税率の特例です。"},{"f":"joto","fn":"譲渡所得税","q":"居住用財産を配偶者に譲渡した場合でも、3,000万円の特別控除の適用を受けることができる。","a":false,"e":"配偶者、直系血族、生計を一にする親族等への譲渡は3,000万円特別控除の適用除外です。"},{"f":"joto","fn":"譲渡所得税","q":"居住用財産の3,000万円特別控除と軽減税率の特例は、併用することができる。","a":true,"e":"3,000万円控除と軽減税率の特例は併用可能です。一方、買換え特例とは選択適用（併用不可）となります。"},{"f":"joto","fn":"譲渡所得税","q":"居住用財産の軽減税率の特例は、譲渡した年の1月1日における所有期間が10年を超えるものに適用される。","a":true,"e":"軽減税率の特例の要件は、譲渡した年の1月1日において所有期間が10年を超えていることです。「1月1日」時点で判断する点に注意が必要です。"},{"f":"joto","fn":"譲渡所得税","q":"居住用財産の買換え特例と3,000万円特別控除は、併用することができる。","a":false,"e":"買換え特例と3,000万円控除は選択適用であり、併用はできません。"},{"f":"joto","fn":"譲渡所得税","q":"居住用財産を譲渡した場合、居住しなくなった日から5年を経過する日の属する年の年末までに譲渡すれば、3,000万円特別控除を受けることができる。","a":false,"e":"居住しなくなった日から3年を経過する日の属する年の12月31日までに譲渡する必要があります。5年ではなく3年です。"},{"f":"joto","fn":"譲渡所得税","q":"土地・建物の譲渡所得について、長期譲渡所得とは、譲渡した年の1月1日において所有期間が5年を超えるものをいう。","a":true,"e":"長期譲渡所得は、譲渡した年の1月1日において所有期間が5年を超えるものです。5年以下は短期譲渡所得となります。"},{"f":"inshi","fn":"印紙税","q":"不動産の売買契約書は、印紙税法上の課税文書に該当する。","a":true,"e":"不動産の売買契約書は第1号文書として課税対象です。建設工事の請負契約書は第2号文書、領収書は第17号文書です。"},{"f":"inshi","fn":"印紙税","q":"記載金額のない不動産の売買契約書は、印紙税が課税されない。","a":false,"e":"記載金額のない契約書でも200円の印紙税が課税されます。非課税ではありません。"},{"f":"inshi","fn":"印紙税","q":"電子契約で締結した不動産の売買契約は、印紙税が課税されない。","a":true,"e":"印紙税は紙の文書に課税されるため、電子契約には印紙税は課税されません。"},{"f":"inshi","fn":"印紙税","q":"消費税額が区分記載されている場合、印紙税の記載金額は税抜金額で判断される。","a":true,"e":"消費税額が明確に区分記載されている場合は、税抜金額が記載金額となります。"},{"f":"inshi","fn":"印紙税","q":"印紙税を納付すべき課税文書の作成者が、印紙税を納付しなかった場合、原則として納付しなかった印紙税額の3倍に相当する過怠税が徴収される。","a":true,"e":"原則として納付しなかった印紙税額の3倍の過怠税が徴収されます。ただし、自主的に申し出た場合は1.1倍に軽減されます。"},{"f":"touroku","fn":"登録免許税","q":"登録免許税は、登記を受ける者に対して課される都道府県税である。","a":false,"e":"登録免許税は国税です。都道府県税ではありません。不動産取得税（都道府県税）との違いに注意が必要です。"},{"f":"touroku","fn":"登録免許税","q":"土地の所有権移転登記に係る登録免許税の税率は、原則として1,000分の20である。","a":true,"e":"土地の所有権移転登記の税率は原則20/1000（2%）です。令和8年3月31日までの特例として15/1000に軽減されています。"},{"f":"touroku","fn":"登録免許税","q":"住宅用家屋の所有権保存登記の軽減税率の適用を受けるためには、床面積が50㎡以上であることが必要である。","a":true,"e":"住宅用家屋の軽減税率の適用には、床面積50㎡以上であること、新築又は取得後1年以内に登記すること等の要件があります。"},{"f":"kantei","fn":"不動産鑑定評価","q":"不動産の鑑定評価において、原価法は対象不動産の再調達原価を求め、これについて減価修正を行って対象不動産の価格を求める手法である。","a":true,"e":"原価法は再調達原価から減価修正を行う手法です。取引事例比較法（類似事例からの比較）、収益還元法（将来収益から算定）と合わせて3手法を覚えましょう。"},{"f":"kantei","fn":"不動産鑑定評価","q":"不動産の鑑定評価は、原価法、取引事例比較法又は収益還元法のうち、いずれか1つの手法を適用すれば足りる。","a":false,"e":"鑑定評価は3手法を併用し、相互に関連づけて最終的な鑑定評価額を決定します。1手法のみでは不十分です。"},{"f":"kantei","fn":"不動産鑑定評価","q":"収益還元法には、直接還元法とDCF法の2つの方法がある。","a":true,"e":"直接還元法は一期間の純収益を還元利回りで割り戻す方法、DCF法は複数期間の純収益と復帰価格を現在価値に割り引く方法です。"},{"f":"chika","fn":"地価公示法","q":"標準地の正常な価格は、土地鑑定委員会が毎年1回判定し、官報で公示する。","a":true,"e":"公示価格は毎年1月1日時点の価格を、土地鑑定委員会が判定し、官報で公示します。"},{"f":"chika","fn":"地価公示法","q":"標準地の鑑定評価は、1人の不動産鑑定士が行えば足りる。","a":false,"e":"2人以上の不動産鑑定士が鑑定評価を行い、土地鑑定委員会が審査・調整した上で正常な価格を判定します。"},{"f":"chika","fn":"地価公示法","q":"地価公示の対象は、都市計画区域内の標準地に限られる。","a":false,"e":"都市計画区域外であっても、必要がある場合には公示の対象とすることができます。"},{"f":"chika","fn":"地価公示法","q":"不動産鑑定士が土地の鑑定評価を行う場合、公示価格を規準としなければならない。","a":true,"e":"不動産鑑定士は公示価格を「規準」とします。「基準」ではなく「規準」である点が出題されます。"},{"f":"kinyu","fn":"住宅金融支援機構","q":"住宅金融支援機構は、一般の個人に対して直接に住宅ローンの貸付けを行うことを主な業務としている。","a":false,"e":"機構は直接融資を原則行いません。民間金融機関の住宅ローン債権を買い取る証券化支援業務（フラット35）が主な業務です。"},{"f":"kinyu","fn":"住宅金融支援機構","q":"証券化支援事業（買取型）において、機構は民間金融機関から住宅ローン債権を買い取り、MBS（資産担保証券）として投資家に発行する。","a":true,"e":"フラット35の仕組みです。民間金融機関が融資→機構が債権を買取り→MBSとして投資家に売却します。"},{"f":"kinyu","fn":"住宅金融支援機構","q":"証券化支援事業（買取型）の対象となる住宅の床面積は、一戸建ての場合、50㎡以上でなければならない。","a":false,"e":"一戸建ての場合は70㎡以上です。マンションの場合は30㎡以上となっています。50㎡は登録免許税の軽減要件です。"},{"f":"kinyu","fn":"住宅金融支援機構","q":"機構は、災害により住宅が滅失した場合に、災害復興建築物の建設等に必要な資金の貸付けを直接行うことができる。","a":true,"e":"災害復興住宅への直接融資は、機構が直接融資を行う例外のひとつです。"},{"f":"keihyo","fn":"景品表示法","q":"不動産の表示に関する公正競争規約において、徒歩による所要時間は、道路距離100mにつき1分として算出する。","a":false,"e":"徒歩時間は道路距離80mにつき1分で算出します。100mではありません。端数が生じた場合は切り上げます。"},{"f":"keihyo","fn":"景品表示法","q":"建築後1年未満であっても、居住の用に供されたことがある建物は「新築」と表示することができない。","a":true,"e":"「新築」と表示できるのは、建築後1年未満かつ未入居の建物に限られます。いずれか一方でも欠ければ新築とは表示できません。"},{"f":"keihyo","fn":"景品表示法","q":"不動産広告において、「完全」「日本一」等の用語は、合理的な根拠がなくても使用することができる。","a":false,"e":"最上級表現は合理的根拠がなければ使用できません。不当表示に該当するおそれがあります。"},{"f":"keihyo","fn":"景品表示法","q":"物件から最寄り駅までの徒歩時間を表示する場合、物件の出入口から駅の出入口までの道路距離により算出する。","a":true,"e":"徒歩時間は、物件の出入口から駅の出入口（改札ではない）までの道路距離80mにつき1分で算出します。"},{"f":"keihyo","fn":"景品表示法","q":"新築分譲マンションの広告において、パンフレット等に物件から最寄り駅までの所要時間を明示する場合、乗換えを要するときは、その旨を明示しなければならない。","a":true,"e":"電車等の所要時間を表示する場合、乗換えを要するときはその旨と所要時間を明示する必要があります。"},{"f":"tochi","fn":"土地・建物","q":"自然堤防は、一般に洪水に対して安全であり、宅地として適している。","a":true,"e":"自然堤防は周囲より高く、排水も良好なため宅地に適しています。一方、後背湿地は低湿で宅地に不適です。"},{"f":"tochi","fn":"土地・建物","q":"後背湿地は、排水が良好であり、宅地として適している。","a":false,"e":"後背湿地は自然堤防の背後にある低湿地で、排水が悪く、軟弱地盤のため宅地には不適です。"},{"f":"tochi","fn":"土地・建物","q":"埋立地は、一般に地盤が安定しているため、液状化の危険性は低い。","a":false,"e":"埋立地は地盤が軟弱で、地震時に液状化が発生しやすい地域です。"},{"f":"tochi","fn":"土地・建物","q":"鉄筋コンクリート造は、耐火性、耐久性に優れている。","a":true,"e":"鉄筋コンクリート造（RC造）は耐火性・耐久性に優れています。ただし、鉄骨造は熱に弱く、耐火被覆が必要です。"}];

let st={mode:"study",cat:"all",expId:null,chk:{},qCat:"all",qSub:"all",qPage:0,qAns:{}};
const PS=50;
function load(){try{const s=localStorage.getItem("takken-v10");if(s){const d=JSON.parse(s);st.chk=d.chk||{};st.qAns=d.qAns||{};}}catch{}}
function save(){try{localStorage.setItem("takken-v10",JSON.stringify({chk:st.chk,qAns:st.qAns}));}catch{}}

function getFilteredQ(){
  if(st.qCat==="takken") return st.qSub==="all"?BQ:BQ.filter(q=>q.f===st.qSub);
  if(st.qCat==="hourei") return st.qSub==="all"?HQ:HQ.filter(q=>q.f===st.qSub);
  if(st.qCat==="kenri") return st.qSub==="all"?KQ:KQ.filter(q=>q.f===st.qSub);
  if(st.qCat==="zei") return st.qSub==="all"?ZQ:ZQ.filter(q=>q.f===st.qSub);
  if(st.qCat==="all") return [...KQ,...BQ,...HQ,...ZQ];
  return Q.filter(q=>q.cat===st.qCat);
}

function render(){
const app=document.getElementById("app");
const totalChk=T.filter(t=>st.chk[t.id]).length;
const pct=Math.round((totalChk/T.length)*100);
const fQ=getFilteredQ();
const aCount=fQ.filter((_,i)=>st.qAns[st.qCat+"-"+st.qSub+"-"+i]!==undefined).length;
const cCount=fQ.filter((_,i)=>st.qAns[st.qCat+"-"+st.qSub+"-"+i]===true).length;

let h=`<div class="header"><div class="header-sub">2026年度対応</div><h1>宅建試験 頻出論点マスター</h1>
<div class="mode-tabs"><button class="mode-tab${st.mode==="study"?" active":""}" onclick="setMode('study')">📖 論点学習</button><button class="mode-tab${st.mode==="quiz"?" active":""}" onclick="setMode('quiz')">✍ 一問一答</button></div>`;
if(st.mode==="study"){h+=`<div class="progress-row"><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div><span class="progress-label">${totalChk}/${T.length}</span></div>`;}
else{h+=`<div class="progress-row"><div class="progress-bar"><div class="progress-fill" style="width:${fQ.length?Math.round(aCount/fQ.length*100):0}%"></div></div><span class="progress-label">${cCount}/${fQ.length}正解</span></div>`;}
h+=`</div>`;
h+=st.mode==="study"?renderStudy():renderQuiz(fQ,aCount,cCount);
app.innerHTML=h;
}

function renderStudy(){
const filtered=st.cat==="all"?T:T.filter(t=>t.cat===st.cat);
const sorted=[...filtered].sort((a,b)=>b.freq-a.freq);
const ac=st.cat!=="all"?cM[st.cat]:null;
const fc=sorted.filter(t=>st.chk[t.id]).length;
let h=`<div class="tabs">`;
[{id:"all",name:"全科目",color:"#1e3a5f"},...C].forEach(c=>{const isA=st.cat===c.id;h+=`<button class="tab${isA?" active":""}" style="${isA?"background:"+c.color:""}" onclick="setCat('${c.id}')">${c.name}</button>`;});
h+=`</div>`;
if(ac)h+=`<div class="cat-bar" style="color:${ac.color};background:${ac.color}10;border-color:${ac.color}"><span>${ac.questions}</span><span>目安: ${ac.target}</span></div>`;
h+=`<div class="info-bar"><span>頻度順（${sorted.length}論点）</span><span>${fc}/${sorted.length} 済</span></div><div class="cards">`;
sorted.forEach(t=>{
const cat=cM[t.cat],isExp=st.expId===t.id,isDone=!!st.chk[t.id];
h+=`<div class="card${isDone?" done":""}" id="topic-${t.id}"><div class="card-head"><button class="chk${isDone?" on":""}" onclick="event.stopPropagation();togChk('${t.id}')">${isDone?"✓":""}</button><div class="card-body" onclick="togExp('${t.id}')"><div class="badges"><span class="badge" style="background:${cat.color}">${cat.name}</span><span class="stars">${fL(t.freq)}</span></div><div class="topic-name">${t.topic}</div><div class="tap-hint">${isExp?"▲ 閉じる":"▼ 詳細"}</div></div></div>`;
if(isExp){
h+=`<div class="detail"><div class="sec"><div class="sec-title" style="color:${cat.color}">📘 論点解説</div><div class="sec-box" style="border-color:${cat.color}">${t.desc}</div></div><div class="sec"><div class="sec-title" style="color:var(--red)">⚠ ひっかけポイント</div>`;
t.traps.forEach((tr,i)=>{h+=`<div class="trap-item"><span class="trap-num">${i+1}.</span><span class="trap-text">${tr}</span></div>`;});
h+=`</div></div>`;}
h+=`</div>`;});
h+=`</div><div class="footer"><button class="reset-btn" onclick="resetStudy()">学習チェックをリセット</button></div>`;
return h;
}

function renderQuiz(fQ,answered,correct){
let h=`<div class="quiz-filter">`;
[{id:"all",name:"全科目"},...C].forEach(c=>{h+=`<button class="quiz-filter-btn${st.qCat===c.id?" active":""}" onclick="setQCat('${c.id}')">${c.name}</button>`;});
h+=`</div>`;

// Sub-filters
const sf=st.qCat==="takken"?BF:st.qCat==="hourei"?HF:st.qCat==="kenri"?KF:null;
if(sf){
h+=`<div class="quiz-filter" style="padding-top:2px">`;
sf.forEach(s=>{h+=`<button class="quiz-filter-btn${st.qSub===s.id?" active":""}" style="font-size:10px;padding:3px 8px" onclick="setQSub('${s.id}')">${s.name}</button>`;});
h+=`</div>`;
}

if(!fQ.length)return h+`<div style="text-align:center;padding:40px;color:var(--text3)">問題がありません</div>`;

// Score
if(answered>0){
h+=`<div class="quiz-score"><div class="quiz-score-num">${correct}<span style="font-size:16px;color:var(--text2)"> / ${fQ.length}</span></div><div class="quiz-score-label">正解率 ${fQ.length?Math.round(correct/fQ.length*100):0}%${answered===fQ.length?" 🎉 全問完了！":""}</div>`;
if(answered===fQ.length)h+=`<button class="quiz-next" onclick="resetQuiz()" style="margin-top:12px;background:var(--red)">もう一度チャレンジ</button>`;
h+=`</div>`;
}

// Pagination
const totalPages=Math.ceil(fQ.length/PS);
const page=Math.min(st.qPage,totalPages-1);
const startIdx=page*PS;
const endIdx=Math.min(startIdx+PS,fQ.length);
const pageQ=fQ.slice(startIdx,endIdx);

if(totalPages>1){
h+=`<div class="page-nav">`;
h+=`<button class="page-btn" onclick="setPage(${page-1})" ${page===0?"disabled":""}>◀</button>`;
for(let p=0;p<totalPages;p++){
h+=`<button class="page-btn${p===page?" active":""}" onclick="setPage(${p})">${p*PS+1}-${Math.min((p+1)*PS,fQ.length)}</button>`;
}
h+=`<button class="page-btn" onclick="setPage(${page+1})" ${page>=totalPages-1?"disabled":""}>▶</button>`;
h+=`</div>`;
}

h+=`<div class="cards">`;
const catColor=st.qCat==="kenri"?"#2563eb":st.qCat==="hourei"?"#d97706":st.qCat==="takken"?"#059669":"#7c3aed";
pageQ.forEach((q,pi)=>{
const gi=startIdx+pi;
const key=st.qCat+"-"+st.qSub+"-"+gi;
const cat=q.cat?cM[q.cat]:{color:catColor,name:q.fn||"問題"};
const ans=st.qAns[key];
const isAns=ans!==undefined;
const isOK=ans===true;

h+=`<div class="quiz-card"><div class="quiz-header"><span class="quiz-cat" style="background:${cat.color}">${cat.name}</span><span class="quiz-num">Q${gi+1}/${fQ.length}</span></div><div class="quiz-q">${q.q}</div><div class="quiz-btns">`;
if(!isAns){
h+=`<button class="quiz-btn" onclick="ansQ(${gi},true)">⭕ 正しい</button><button class="quiz-btn" onclick="ansQ(${gi},false)">❌ 誤り</button>`;
}else{
const uT=st.qAns[key+"_r"]===true,uF=st.qAns[key+"_r"]===false;
h+=`<button class="quiz-btn${q.a?"highlight":""}${uT?(isOK?" correct":" wrong"):""}" disabled>⭕${q.a?" ←正解":""}</button>`;
h+=`<button class="quiz-btn${!q.a?"highlight":""}${uF?(isOK?" correct":" wrong"):""}" disabled>❌${!q.a?" ←正解":""}</button>`;
}
h+=`</div>`;
if(isAns){
const expText=q.exp||q.e||'';
h+=`<div class="quiz-explanation"><div class="quiz-exp-box ${isOK?"correct-bg":"wrong-bg"}"><div class="quiz-result-icon">${isOK?"✅ 正解！":"❌ 不正解"}</div><div>${expText}</div></div></div>`;
}
h+=`</div>`;
});
h+=`</div>`;

// Bottom pagination
if(totalPages>1){
h+=`<div class="page-nav">`;
h+=`<button class="page-btn" onclick="setPage(${page-1})" ${page===0?"disabled":""}>◀ 前</button>`;
h+=`<span style="font-size:12px;color:var(--text2);padding:6px">${page+1} / ${totalPages}</span>`;
h+=`<button class="page-btn" onclick="setPage(${page+1})" ${page>=totalPages-1?"disabled":""}>次 ▶</button>`;
h+=`</div>`;
}

h+=`<div class="footer"><button class="reset-btn" onclick="resetQuiz()">クイズをリセット</button></div>`;
return h;
}

window.setMode=function(m){st.mode=m;st.expId=null;render();window.scrollTo(0,0);};
window.setCat=function(id){st.cat=id;st.expId=null;render();};
window.togExp=function(id){st.expId=st.expId===id?null:id;render();};
window.togChk=function(id){st.chk[id]=!st.chk[id];if(!st.chk[id])delete st.chk[id];save();render();};
window.resetStudy=function(){if(confirm("リセットしますか？")){st.chk={};save();render();}};
window.setQCat=function(id){st.qCat=id;st.qSub="all";st.qPage=0;render();window.scrollTo(0,0);};
window.setQSub=function(id){st.qSub=id;st.qPage=0;render();window.scrollTo(0,0);};
window.setPage=function(p){if(p>=0){st.qPage=p;render();window.scrollTo(0,0);}};
window.ansQ=function(i,u){const fQ=getFilteredQ(),q=fQ[i],k=st.qCat+"-"+st.qSub+"-"+i;st.qAns[k]=(u===q.a);st.qAns[k+"_r"]=u;save();render();};
window.resetQuiz=function(){if(confirm("リセットしますか？")){const fQ=getFilteredQ();fQ.forEach((_,i)=>{const k=st.qCat+"-"+st.qSub+"-"+i;delete st.qAns[k];delete st.qAns[k+"_r"];});st.qPage=0;save();render();window.scrollTo(0,0);}};

load();render();
if('serviceWorker' in navigator){const sw=`self.addEventListener('install',e=>{self.skipWaiting();});self.addEventListener('activate',e=>{e.waitUntil(clients.claim());});self.addEventListener('fetch',e=>{e.respondWith(caches.open('takken-v10').then(c=>c.match(e.request).then(r=>{const n=fetch(e.request).then(res=>{if(res.ok)c.put(e.request,res.clone());return res;}).catch(()=>r);return r||n;})));});`;navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:'application/javascript'}))).catch(()=>{});}
</script>
