<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1e3a5f">
<title>宅建マスター</title>
<style>

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f8f9fb;--card:#fff;--card2:#f8fafc;--text:#111827;--text2:#6b7280;--text3:#9ca3af;--border:#e5e7eb;--green:#10b981;--green-bg:#f0fdf4;--green-border:#d1fae5;--red:#dc2626;--red-bg:#fef2f2;--amber:#f59e0b;--blue:#2563eb;--navy:#1e3a5f}
@media(prefers-color-scheme:dark){:root{--bg:#0f1117;--card:#1a1d27;--card2:#1f2233;--text:#e5e7eb;--text2:#9ca3af;--text3:#6b7280;--border:#2d3040;--green-bg:#052e16;--green-border:#064e3b;--red-bg:#1c0a0a}}
body{font-family:-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;overscroll-behavior:none}
.header{background:linear-gradient(135deg,#1e3a5f 0%,#2563eb 100%);color:#fff;padding:calc(env(safe-area-inset-top,20px) + 12px) 16px 14px;position:sticky;top:0;z-index:20}
.header-sub{font-size:10px;letter-spacing:2px;opacity:.65;margin-bottom:2px}
.header h1{font-size:19px;font-weight:800;line-height:1.3}
.mode-tabs{display:flex;gap:4px;margin-top:10px}
.mode-tab{flex:1;padding:7px;border-radius:8px;border:none;font-size:12px;font-weight:700;cursor:pointer;text-align:center;transition:.15s;background:rgba(255,255,255,.15);color:rgba(255,255,255,.7)}
.mode-tab.active{background:#fff;color:#1e3a5f}
.progress-row{margin-top:8px;display:flex;align-items:center;gap:10px}
.progress-bar{flex:1;background:rgba(255,255,255,.2);border-radius:6px;height:7px;overflow:hidden}
.progress-fill{height:100%;background:#34d399;border-radius:6px;transition:width .3s}
.progress-label{font-size:11px;white-space:nowrap}
.tabs{display:flex;gap:5px;padding:8px 10px;overflow-x:auto;position:sticky;top:0;z-index:15;background:var(--bg);border-bottom:1px solid var(--border);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:6px 11px;border-radius:18px;border:none;font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:.15s;background:#e5e7eb;color:#374151}
.tab.active{color:#fff}
.cat-bar{padding:7px 16px;display:flex;justify-content:space-between;font-size:11.5px;font-weight:600;border-bottom:2px solid currentColor}
.info-bar{padding:6px 16px;font-size:11px;color:var(--text3);display:flex;justify-content:space-between}
.cards{padding:0 10px 100px}
.card{margin-bottom:7px;border-radius:10px;border:1px solid var(--border);background:var(--card);overflow:hidden;transition:.15s}
.card.done{border-color:var(--green-border);background:var(--green-bg)}
.card-head{display:flex;align-items:flex-start;gap:10px;padding:11px 11px 9px}
.chk{width:26px;height:26px;min-width:26px;border-radius:7px;border:2px solid #d1d5db;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:1px;transition:.15s;font-size:13px;font-weight:800;color:#fff}
.chk.on{border-color:var(--green);background:var(--green)}
.card-body{flex:1;min-width:0;cursor:pointer}
.badges{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-bottom:3px}
.badge{font-size:9.5px;padding:2px 6px;border-radius:4px;color:#fff;font-weight:600}
.stars{font-size:11.5px;color:var(--amber);letter-spacing:-1px}
.topic-name{font-size:13.5px;font-weight:700;line-height:1.4;transition:.15s}
.card.done .topic-name{color:var(--text2);text-decoration:line-through}
.tap-hint{font-size:10px;color:var(--text3);margin-top:1px}
.detail{padding:0 11px 13px 11px;font-size:12.5px;line-height:1.7;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.sec{margin-bottom:12px}
.sec-title{font-weight:700;font-size:11px;letter-spacing:1px;margin-bottom:4px;display:flex;align-items:center;gap:4px}
.sec-box{padding:10px;border-radius:8px;border-left:3px solid;background:var(--card2);font-size:12.5px;line-height:1.75}
.sec-box p{margin-bottom:6px}
.sec-box p:last-child{margin-bottom:0}
.rule{display:flex;gap:6px;margin-bottom:4px;font-size:12px}
.rule-label{font-weight:700;min-width:auto;white-space:nowrap;color:var(--navy)}
.compare-table{width:100%;border-collapse:collapse;font-size:11px;margin:6px 0}
.compare-table th,.compare-table td{border:1px solid var(--border);padding:4px 6px;text-align:center}
.compare-table th{background:var(--card2);font-weight:700;font-size:10px}
.trap-item{display:flex;gap:5px;margin-bottom:5px}
.trap-num{color:var(--red);font-weight:700;font-size:11.5px;min-width:15px}
.trap-text{font-size:12px;line-height:1.55}
.footer{padding:20px 16px;text-align:center}
.reset-btn{padding:10px 24px;border-radius:8px;border:1px solid #fca5a5;background:var(--card);color:var(--red);font-size:12.5px;font-weight:600;cursor:pointer}
.footer-note{font-size:10px;color:var(--text3);margin-top:12px;line-height:1.5}
.quiz-card{margin-bottom:10px;border-radius:10px;border:1px solid var(--border);background:var(--card);overflow:hidden}
.quiz-header{padding:10px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.quiz-cat{font-size:9.5px;padding:2px 6px;border-radius:4px;color:#fff;font-weight:600}
.quiz-num{font-size:11px;color:var(--text3)}
.quiz-q{padding:12px;font-size:13.5px;line-height:1.7;font-weight:500}
.quiz-btns{display:flex;gap:8px;padding:0 12px 12px}
.quiz-btn{flex:1;padding:12px;border-radius:8px;border:2px solid var(--border);background:var(--card);font-size:16px;font-weight:800;cursor:pointer;transition:.15s;text-align:center}
.quiz-btn:active{transform:scale(.96)}
.quiz-btn.correct{border-color:var(--green);background:var(--green-bg);color:var(--green)}
.quiz-btn.wrong{border-color:var(--red);background:var(--red-bg);color:var(--red)}
.quiz-btn.highlight{border-color:var(--green);background:var(--green-bg)}
.quiz-explanation{padding:0 12px 12px;animation:fadeIn .2s}
.quiz-exp-box{padding:10px;border-radius:8px;font-size:12px;line-height:1.6}
.quiz-exp-box.correct-bg{background:var(--green-bg);border:1px solid var(--green-border)}
.quiz-exp-box.wrong-bg{background:var(--red-bg);border:1px solid #fca5a5}
.quiz-result-icon{font-size:14px;font-weight:800;margin-bottom:4px}
.quiz-score{text-align:center;padding:20px;margin:10px;border-radius:12px;background:var(--card);border:1px solid var(--border)}
.quiz-score-num{font-size:36px;font-weight:800;color:var(--navy)}
.quiz-score-label{font-size:13px;color:var(--text2);margin-top:4px}
.quiz-next{display:block;width:100%;padding:12px;margin-top:8px;border-radius:8px;border:none;background:var(--navy);color:#fff;font-size:13px;font-weight:700;cursor:pointer}
.quiz-filter{display:flex;gap:6px;padding:8px 12px;flex-wrap:wrap}
.quiz-filter-btn{padding:5px 10px;border-radius:14px;border:1px solid var(--border);background:var(--card);font-size:11px;cursor:pointer;transition:.15s}
.quiz-filter-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}

.page-nav{display:flex;justify-content:center;gap:6px;padding:10px;flex-wrap:wrap}
.page-btn{padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--card);font-size:12px;cursor:pointer}
.page-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.page-btn:disabled{opacity:.4;cursor:default}
</style>
</head>
<body>
<div id="app"></div>
<script>
const C=[
{id:"kenri",name:"権利関係",color:"#2563eb",questions:"問1〜14",target:"7/14以上"},
{id:"takken",name:"宅建業法",color:"#059669",questions:"問26〜45",target:"17/20以上"},
{id:"hourei",name:"法令上の制限",color:"#d97706",questions:"問15〜22",target:"5/8以上"},
{id:"zei",name:"税・その他",color:"#7c3aed",questions:"問23〜25等",target:"5/8以上"}
];
const cM={};C.forEach(c=>cM[c.id]=c);
const fL=f=>"★".repeat(f)+"☆".repeat(5-f);
const T=[
// ========== 権利関係 ==========
{id:"k01",cat:"kenri",topic:"意思表示（詐欺・強迫・虚偽表示・錯誤）",freq:5,
desc:`<p>意思表示とは、法律効果の発生を望む意思を外部に表示する行為です。しかし、その意思に瑕疵（問題）がある場合、効力に影響が出ます。宅建では4類型の区別が最重要です。</p>
<p><b>① 心裡留保（93条）</b>＝冗談や嘘の意思表示。<b>原則有効</b>ですが、相手方が表意者の真意でないことを<b>知っていた（悪意）or 知ることができた（有過失）</b>場合は<b>無効</b>になります。善意の第三者には対抗できません。</p>
<p><b>② 虚偽表示（94条）</b>＝相手方と通じてする嘘の意思表示。<b>常に無効</b>です。ただし<b>善意の第三者</b>には対抗できません。ここで「善意」に過失の有無は問われない点が重要です。</p>
<p><b>③ 錯誤（95条）</b>＝勘違いによる意思表示。「意思表示に対応する意思を欠く錯誤」又は「動機の錯誤（動機が表示されている場合）」で、その錯誤が法律行為の目的等に照らし重要な場合に<b>取消し可能</b>です。ただし、表意者に<b>重大な過失</b>があれば原則取消し不可。例外として、相手方が悪意or重過失の場合、又は相手方も同一の錯誤の場合は取消し可能です。</p>
<p><b>④ 詐欺（96条）</b>＝だまされた意思表示は<b>取消し可能</b>。ただし取消しは<b>善意無過失の第三者に対抗できない</b>（R2改正で「無過失」が追加）。第三者による詐欺の場合は、相手方が悪意or有過失の場合にのみ取消し可能。</p>
<p><b>⑤ 強迫（96条）</b>＝脅された意思表示は<b>取消し可能</b>。詐欺と異なり<b>第三者保護規定がない</b>ため、善意無過失の第三者にも対抗できます。被害者保護が最も厚い類型です。</p>`,
traps:["詐欺の第三者保護＝善意<b>無過失</b>（R2改正）vs 強迫＝第三者保護なし","虚偽表示の「善意の第三者」に過失の有無は<b>不問</b>","錯誤の重大な過失→取消不可。ただし相手方が悪意/重過失なら<b>例外的に取消可</b>","心裡留保は<b>原則有効</b>（無効ではない）。相手方が悪意・有過失で無効"]},

{id:"k02",cat:"kenri",topic:"代理（無権代理・表見代理）",freq:5,
desc:`<p>代理とは、代理人が本人のために意思表示をし、その効果が直接本人に帰属する制度です。代理権がないのに代理行為をした場合が<b>無権代理</b>、代理権があるように見える外観がある場合が<b>表見代理</b>です。</p>
<p><b>【無権代理の効果】</b>本人に効果は帰属しません。ただし本人が<b>追認</b>すれば遡って有効になります。相手方には以下の権利があります：①催告権（本人に追認するか確答を求める）②取消権（善意の場合のみ）③無権代理人への責任追及（善意無過失の場合）</p>
<p><b>【無権代理と相続】</b>最頻出の複合論点です。<b>無権代理人が本人を相続</b>した場合→追認拒否は信義則に反し、<b>当然に有効</b>。逆に<b>本人が無権代理人を相続</b>した場合→本人としての追認拒否権は消滅せず、<b>追認拒否可能</b>です。</p>
<p><b>【表見代理の3類型】</b><br>
・<b>109条</b>：代理権授与の表示による表見代理（実際には代理権を与えていないのに与えたように見せた場合）<br>
・<b>110条</b>：権限外の行為の表見代理（与えた代理権の範囲を超えた行為をした場合）<br>
・<b>112条</b>：代理権消滅後の表見代理（代理権が消滅した後に代理行為をした場合）</p>
<p><b>【代理権の濫用】</b>R2改正で明文化。代理人が自己の利益のために代理権を行使した場合、相手方が悪意or有過失なら<b>無権代理とみなす</b>（本人に効果不帰属）。</p>`,
traps:["無権代理人→本人を相続＝<b>当然有効</b> vs 本人→無権代理人を相続＝<b>追認拒否可</b>","表見代理3類型（109条・110条・112条）の要件の混同","代理権の濫用＝相手方が悪意・有過失なら<b>無権代理とみなす</b>"]},

{id:"k03",cat:"kenri",topic:"時効（取得時効・消滅時効）",freq:4,
desc:`<p>時効とは、一定期間の経過により権利の取得（取得時効）や権利の消滅（消滅時効）を認める制度です。</p>
<p><b>【取得時効】</b>他人の物を一定期間占有し続けることで所有権を取得できます。<br>
・<b>善意無過失</b>で占有開始→<b>10年</b>で取得<br>
・<b>それ以外</b>（悪意or有過失）→<b>20年</b>で取得<br>
善意無過失の判定時期は<b>占有開始時</b>です。途中で悪意になっても影響しません。</p>
<p><b>【消滅時効（R2改正で統一）】</b>債権は以下のいずれか早い方で消滅します：<br>
・<b>権利を行使できることを知った時から5年</b>（主観的起算点）<br>
・<b>権利を行使できる時から10年</b>（客観的起算点）<br>
人の生命・身体の侵害による損害賠償請求権は、主観5年/客観<b>20年</b>に延長されます。</p>
<p><b>【時効の援用】</b>時効は自動的に適用されず、<b>当事者が援用</b>（主張）する必要があります。裁判所が職権で適用することはできません。援用できるのは、時効の完成により直接利益を受ける者です。</p>
<p><b>【時効完成後の債務承認】</b>時効が完成した後に債務者が債務を承認すると、信義則により、もはや時効の援用はできなくなります。</p>`,
traps:["消滅時効の二本立て＝<b>知った時から5年</b> or <b>行使できる時から10年</b>","時効の援用は<b>当事者が必要</b>（裁判所は職権で適用しない）","取得時効の善意無過失の判断時点は<b>占有開始時</b>","時効完成後の債務承認→もはや<b>時効援用不可</b>"]},

{id:"k04",cat:"kenri",topic:"不動産物権変動・対抗要件",freq:5,
desc:`<p>不動産の物権変動（所有権の移転等）は、<b>登記</b>がなければ第三者に対抗（主張）できません（177条）。ただし、ここでいう「第三者」は限定的に解釈されています。</p>
<p><b>【第三者に該当しない者】</b>以下の者には登記なくても対抗可能：<br>
・<b>背信的悪意者</b>＝単に悪意なだけでなく、信義に反する態様で登記の欠缺を主張する者<br>
・不法占拠者、無権利者、不法行為者<br>
・前主（売主）や相続人</p>
<p><b>【取消しと第三者】</b>極めて重要な論点です。<br>
・<b>取消し前</b>の第三者→第三者が<b>善意無過失</b>なら保護される（取消しを対抗できない）<br>
・<b>取消し後</b>の第三者→<b>対抗関係</b>になり、先に登記を備えた方が勝つ</p>
<p><b>【相続と登記（R1改正）】</b><br>
・<b>法定相続分の範囲内</b>→登記なくても第三者に対抗可<br>
・<b>法定相続分を超える部分</b>（遺言・遺産分割等）→<b>登記がなければ対抗できない</b><br>
この改正は、相続において登記の重要性を高めるために行われました。</p>`,
traps:["<b>背信的悪意者</b>は177条の「第三者」に該当しない","取消し<b>前</b>の第三者＝善意無過失で保護 / 取消し<b>後</b>の第三者＝登記の先後","相続でも法定相続分<b>超過</b>部分は<b>登記必要</b>（R1改正）"]},

{id:"k05",cat:"kenri",topic:"抵当権",freq:5,
desc:`<p>抵当権は、債務者が債務を弁済しない場合に、担保目的物から優先的に弁済を受けられる権利です。目的物の占有は移転せず、設定者が使用収益を続けられます。</p>
<p><b>【法定地上権（388条）】</b>抵当権の実行により土地と建物が別々の所有者に帰属した場合に、建物のために自動的に成立する地上権です。成立要件（すべて必要）：<br>
① <b>抵当権設定時に</b>土地上に建物が存在すること（←最重要！更地に抵当権→後に建物建築は×）<br>
② 抵当権設定時に土地と建物が<b>同一の所有者</b>に属すること<br>
③ 競売により土地と建物が<b>別々の所有者</b>になったこと</p>
<p><b>【物上代位】</b>抵当権の効力は、目的物の売却代金、賃料、損害賠償金などにも及びます。ただし、<b>払渡し又は引渡しの前に差押え</b>をすることが必要です。賃料への物上代位も認められています（判例）。</p>
<p><b>【抵当権消滅請求】</b>抵当不動産の<b>第三取得者</b>（抵当不動産を買い受けた人）が、抵当権者に対して一定の金額を払って抵当権の消滅を請求する制度です。<b>主たる債務者や保証人は請求できない</b>点に注意。</p>`,
traps:["法定地上権＝「<b>抵当権設定時に建物が存在</b>」が絶対条件","物上代位＝「<b>払渡し前に差押え</b>」が必要。賃料にも物上代位可","抵当権消滅請求＝<b>第三取得者のみ</b>可（主債務者・保証人は不可）"]},

{id:"k06",cat:"kenri",topic:"契約不適合責任",freq:4,
desc:`<p>R2年改正で、旧「瑕疵担保責任」が<b>「契約不適合責任」</b>に全面改正されました。引き渡された目的物が「種類・品質・数量」に関して契約の内容に適合しない場合、買主は以下の救済手段を行使できます。</p>
<p><b>【4つの救済手段】</b>（原則としてこの順序で行使）<br>
<b>① 追完請求</b>＝修補・代替物・不足分の引渡しを請求<br>
<b>② 代金減額請求</b>＝原則として<b>まず追完の催告が必要</b>。催告しても追完がない場合に減額請求可。例外として、追完が不能・売主が追完拒絶・定期行為・催告しても追完の見込みがない場合は催告不要<br>
<b>③ 損害賠償請求</b>＝売主に<b>帰責事由が必要</b><br>
<b>④ 解除</b>＝売主の<b>帰責事由は不要</b>（R2改正の重要ポイント）</p>
<p><b>【通知期間】</b>買主が不適合を<b>知った時から1年以内に通知</b>すれば足ります。旧法では「1年以内に権利行使」が必要でしたが、改正後は<b>通知だけ</b>でOKです。具体的な請求は通知後でも可能。</p>
<p><b>【数量に関する不適合】</b>数量不適合には期間制限がありません（通知なしで請求可）。種類・品質の不適合とは扱いが異なります。</p>`,
traps:["代金減額は原則「<b>まず追完の催告</b>」が必要","<b>解除は帰責事由不要</b>、損害賠償は帰責事由<b>必要</b>（R2改正）","不適合を「知った時から<b>1年以内に通知</b>」（権利行使ではない）"]},

{id:"k07",cat:"kenri",topic:"連帯債務・保証",freq:4,
desc:`<p><b>【連帯債務のR2改正】</b>連帯債務者の一人に処した事由が他の連帯債務者に影響するかが最重要論点です。R2改正で<b>絶対効は大幅に縮小</b>されました。</p>
<p><b>絶対効（他の債務者にも効力が及ぶ）</b>＝<b>弁済・更改・混同・相殺</b>の4つだけ<br>
<b>相対効（その債務者にしか効力が及ばない）</b>＝請求・免除・時効の完成など（旧法では絶対効だったが改正で相対効に変更）</p>
<p><b>【保証と連帯保証の違い】</b><br>
通常の保証人には①<b>催告の抗弁権</b>（まず主債務者に請求せよ）と②<b>検索の抗弁権</b>（主債務者の財産から先に執行せよ）があります。<br>
<b>連帯保証人にはこの2つの抗弁権がありません</b>。債権者は直接連帯保証人に全額請求できます。</p>
<p><b>【個人根保証（R2改正）】</b>一定の範囲に属する不特定の債務を保証する個人根保証契約は、<b>極度額を定めなければ無効</b>です。貸金等根保証契約に限らず、すべての個人根保証に拡大されました（例：賃貸借の連帯保証）。</p>
<p><b>【事業用融資の保証】</b>事業用融資の保証人になろうとする個人は、原則として<b>公正証書</b>で保証の意思を確認する必要があります。ただし、主債務者の配偶者等は例外。</p>`,
traps:["連帯債務の絶対効＝<b>弁済・更改・混同・相殺</b>の4つのみ","連帯保証人には<b>催告・検索の抗弁権なし</b>","個人根保証は<b>極度額の定めが必要</b>（なければ無効）"]},

{id:"k08",cat:"kenri",topic:"賃貸借・借地借家法",freq:5,
desc:`<p>不動産の賃貸借は民法の規定と借地借家法の特則が交差する最重要分野です。</p>
<p><b>【賃借権の対抗力】</b>以下のいずれかがあれば第三者に対抗可能：<br>
・賃借権の<b>登記</b>（民法の原則だが、貸主に協力義務なし）<br>
・<b>借地上の建物の登記</b>（借地権の場合）<br>
・<b>建物の引渡し</b>（借家権の場合）</p>
<p><b>【敷金（R2改正で明文化）】</b>敷金返還義務は、<b>賃貸借の終了＋目的物の明渡し</b>の両方が揃った時に発生します。賃貸借終了だけでは返還義務は生じません。また、賃貸人が変わった場合、敷金関係は<b>新賃貸人に当然に承継</b>されます。</p>
<p><b>【借地権の存続期間】</b><br>
<table class="compare-table"><tr><th></th><th>当初</th><th>1回目更新</th><th>2回目以降</th></tr>
<tr><td><b>普通借地権</b></td><td>30年</td><td>20年</td><td>10年</td></tr></table>
借知人に不利な特約は無効です（短縮する特約は無効）。</p>
<p><b>【定期借地権の3類型】</b><br>
<table class="compare-table"><tr><th>類型</th><th>期間</th><th>要件</th></tr>
<tr><td>一般定期</td><td>50年以上</td><td>書面で特約</td></tr>
<tr><td>建物譲渡特約付</td><td>30年以上</td><td>建物譲渡の特約</td></tr>
<tr><td>事業用定期</td><td>10年以上50年未満</td><td>公正証書</td></tr></table></p>`,
traps:["敷金返還＝「賃貸借終了」＋「<b>明渡し</b>」の<b>両方</b>が必要","普通借地権＝<b>30年→20年→10年</b>（短縮特約無効）","定期借地権3類型の期間・要件の混同が狙われる"]},

{id:"k09",cat:"kenri",topic:"借地借家法（借家権）",freq:5,
desc:`<p><b>【普通建物賃貸借】</b><br>
・期間の定めあり：1年以上（<b>1年未満の定めは「期間の定めなし」とみなす</b>）<br>
・更新拒絶には<b>正当事由</b>が必要（立退料の提供だけでは不十分、総合考慮）<br>
・対抗力＝<b>建物の引渡し</b>があれば第三者に対抗可能</p>
<p><b>【定期建物賃貸借】</b>更新がなく、期間満了で確定的に終了する借家契約です。成立要件：<br>
① <b>書面</b>（公正証書でなくてもOK）による契約<br>
② 契約前に「更新がなく期間満了で終了する」旨を<b>書面で説明</b>する<br>
→ この書面説明を怠ると<b>普通借家契約</b>になってしまう（頻出ひっかけ）</p>
<p><b>【定期借家の中途解約】</b>原則として中途解約はできません。例外として、<b>床面積200㎡未満の居住用</b>建物で、やむを得ない事情がある場合に限り、借主から中途解約の申入れが可能です。</p>
<p><b>【造作買取請求権】</b>賃貸人の同意を得て付加した造作について、賃貸借終了時に賃貸人に買取りを請求できる権利です。ただし<b>特約で排除可能</b>（強行規定ではない）です。</p>`,
traps:["<b>1年未満</b>の期間の定め＝「期間の定めなし」とみなす","定期借家＝<b>書面で説明</b>しないと普通借家になる","中途解約＝<b>200㎡未満の居住用</b>のみ可","造作買取請求権＝特約で<b>排除可能</b>"]},

{id:"k10",cat:"kenri",topic:"相続",freq:4,
desc:`<p><b>【法定相続分】</b>暗記必須の数字です。<br>
<table class="compare-table"><tr><th>相続人の組合せ</th><th>配偶者</th><th>他方</th></tr>
<tr><td>配偶者＋子</td><td>1/2</td><td>1/2</td></tr>
<tr><td>配偶者＋直系尊属</td><td>2/3</td><td>1/3</td></tr>
<tr><td>配偶者＋兄弟姉妹</td><td>3/4</td><td>1/4</td></tr></table>
子・直系尊属・兄弟姉妹が複数いる場合は均等に分けます。代襲相続（子が先に死亡→孫が代わりに相続）にも注意。</p>
<p><b>【遺留分】</b>一定の相続人に保証される最低限の取り分です。<br>
・<b>直系尊属のみが相続人</b>→被相続人の財産の<b>1/3</b><br>
・<b>それ以外</b>→被相続人の財産の<b>1/2</b><br>
兄弟姉妹には遺留分がありません。</p>
<p><b>【遺留分侵害額請求（R1改正）】</b>旧法では「減殺請求」で現物返還でしたが、改正後は<b>金銭請求に一本化</b>されました。「お金で解決する」という制度に変わった点が重要です。</p>
<p><b>【相続放棄】</b>相続開始を知った時から3ヶ月以内に<b>家庭裁判所に申述</b>して行います。相続人間の合意だけでは相続放棄にはなりません。放棄した者は最初から相続人でなかったものとみなされます。</p>`,
traps:["法定相続分：配偶者＋子＝<b>1/2ずつ</b>、＋直系尊属＝<b>2/3:1/3</b>、＋兄弟姉妹＝<b>3/4:1/4</b>","遺留分侵害額請求は<b>金銭請求に一本化</b>（現物返還ではない）","相続放棄は<b>家庭裁判所への申述</b>が必要"]},

{id:"k11",cat:"kenri",topic:"区分所有法",freq:4,
desc:`<p>マンションの法律関係を規律する法律です。集会の決議要件の数字が頻出です。</p>
<p><b>【決議要件の比較】</b><br>
<table class="compare-table"><tr><th>事項</th><th>要件</th></tr>
<tr><td>普通決議（管理行為等）</td><td>区分所有者及び議決権の各<b>過半数</b></td></tr>
<tr><td>規約の設定・変更・廃止</td><td>各<b>3/4以上</b></td></tr>
<tr><td>共用部分の重大変更</td><td>各<b>3/4以上</b></td></tr>
<tr><td><b>建替え決議</b></td><td>各<b>4/5以上</b></td></tr></table></p>
<p><b>【共用部分の管理・変更】</b><br>
・<b>保存行為</b>＝各共有者が単独で可能<br>
・<b>管理行為</b>（通常の管理）＝過半数で決定<br>
・<b>変更行為</b>（形状又は効用の著しい変更）＝3/4以上</p>
<p><b>【管理者】</b>集会の決議で選任。<b>区分所有者以外の者も管理者になれます</b>（法人も可）。管理者は共用部分等の保存・管理に関して区分所有者を代理します。</p>
<p><b>【規約の効力】</b>規約は区分所有者の特定承継人（購入者）にも効力が及びます。賃借人などの占有者は「建物の使用」に関する規約に従う義務があります。</p>`,
traps:["建替え決議＝各<b>4/5以上</b>（最も厳しい要件）","規約の設定変更廃止＝各<b>3/4以上</b>","管理者は<b>区分所有者以外</b>でもなれる（法人も可）"]},

{id:"k12",cat:"kenri",topic:"不動産登記法",freq:4,
desc:`<p><b>【登記制度の基本原則】</b><br>
日本の不動産登記には<b>推定力</b>（登記された権利関係は一応正しいと推定される）はありますが、<b>公信力はありません</b>。つまり、登記を信頼して取引しても、登記が実体と異なれば権利を取得できません。</p>
<p><b>【登記申請の原則】</b><br>
・<b>共同申請主義</b>＝登記権利者と登記義務者が共同で申請するのが原則<br>
・<b>単独申請</b>が認められる例外：所有権保存登記、相続登記、判決による登記、仮登記の抹消（仮登記名義人）等</p>
<p><b>【仮登記】</b>本登記をするための手続上の条件が備わっていない場合に、将来の本登記の<b>順位を保全</b>するための登記です。<b>仮登記には対抗力がありません</b>。本登記をして初めて対抗力が発生しますが、その順位は仮登記の順位に遡ります。</p>
<p><b>【相続登記の義務化（R6年4月施行）】</b>不動産を取得した相続人は、取得を知った日から<b>3年以内</b>に相続登記を申請しなければなりません。正当な理由なく怠ると過料の対象になります。</p>`,
traps:["登記には<b>公信力はない</b>（推定力はある）","仮登記は<b>対抗力なし</b>→<b>順位保全効</b>のみ","相続登記の義務化＝<b>3年以内</b>に申請"]},

// ========== 宅建業法 ==========
{id:"t01",cat:"takken",topic:"重要事項説明（35条書面）",freq:5,
desc:`<p>宅建業法で最も出題数が多い最重要論点です。物件を取得し、又は借りようとする者に対し、契約が成立する<b>前</b>に、取引に関する重要な事項を説明する制度です。</p>
<p><b>【誰が・誰に・いつ】</b><br>
・<b>説明者</b>＝<b>宅地建物取引士</b>が行い、35条書面に<b>記名</b>する（R4改正で押印廃止）<br>
・<b>交付</b>＝宅建士でなくても可能（事務員でもOK）<br>
・<b>相手方</b>＝取得者・借主に対して行う<br>
・<b>時期</b>＝契約成立<b>前</b>（契約と同時ではダメ）</p>
<p><b>【業者が買主の場合】</b>重要事項の<b>説明は省略</b>できますが、35条書面の<b>交付は省略できません</b>。プロ相手でも書面は渡す必要がある点がひっかけポイントです。</p>
<p><b>【35条と37条の記載事項の振分け】</b>超頻出です。<br>
・<b>35条にあって37条にない</b>もの：法令に基づく制限の概要、飲用水等の供給施設<br>
・<b>37条にあって35条にない</b>もの：<b>代金の額</b>、支払時期・方法、引渡し時期<br>
・<b>両方にある</b>もの：契約不適合担保責任の定めがあるときはその内容</p>
<p><b>【IT重説】</b>R3年以降、売買でもオンラインによる重説が可能になりました。</p>`,
traps:["説明は<b>宅建士</b>が行う（交付は誰でもOK）","<b>代金の額</b>は35条ではなく<b>37条</b>の記載事項","業者が買主でも35条書面の<b>交付は必要</b>（説明は省略可）"]},

{id:"t02",cat:"takken",topic:"37条書面（契約書面）",freq:5,
desc:`<p>宅建業者は、契約が成立したときは、遅滞なく、契約の内容を記載した<b>37条書面を交付</b>しなければなりません。</p>
<p><b>【35条との違い】</b><br>
<table class="compare-table"><tr><th></th><th>35条書面</th><th>37条書面</th></tr>
<tr><td>交付時期</td><td>契約<b>前</b></td><td>契約<b>後</b></td></tr>
<tr><td>説明義務</td><td><b>あり</b>（宅建士が説明）</td><td><b>なし</b>（交付のみ）</td></tr>
<tr><td>記名</td><td>宅建士が記名</td><td>宅建士が記名</td></tr>
<tr><td>交付先</td><td>取得者・借主</td><td><b>両当事者</b></td></tr></table></p>
<p><b>【必要的記載事項】</b>（定めの有無に関わらず必ず記載）<br>
・当事者の氏名住所、物件の所在・面積<br>
・<b>代金の額・支払時期・方法</b>（35条にはない！）<br>
・物件の引渡し時期、移転登記の申請時期</p>
<p><b>【任意的記載事項】</b>（定めがあるときのみ記載）<br>
・<b>損害賠償の予定額・違約金</b><br>
・契約不適合担保責任の内容<br>
・ローン不成立の場合の措置</p>`,
traps:["<b>代金の額</b>は37条の<b>必要的</b>記載事項（35条にはない）","37条書面は<b>説明不要</b>（記名＋交付のみ）","交付先は<b>売主買主双方</b>（35条は取得者・借主のみ）"]},

{id:"t03",cat:"takken",topic:"8種制限（自ら売主制限）",freq:5,
desc:`<p>宅建業者が<b>自ら売主</b>となり、<b>一般消費者が買主</b>となる場合に適用される消費者保護規定です。8つの制限があります。</p>
<p><b>【最重要ポイント】業者間取引には8種制限は一切適用されません。</b>これが最大のひっかけです。</p>
<p><b>【主な制限の内容】</b><br>
<b>① クーリングオフ</b>：<b>事務所等以外</b>の場所で申込み・契約をした場合、<b>書面で告げられた日から8日以内</b>に書面で撤回可能。ただし引渡し＋代金全額支払い後は不可。</p>
<p><b>② 手付の額の制限</b>：代金の<b>20%（10分の2）を超える手付は受領不可</b>。受領した手付は<b>解約手付とみなす</b>（証約手付・違約手付としても、解約手付の性質が認められる）。</p>
<p><b>③ 損害賠償の予定等の制限</b>：損害賠償の予定＋違約金の合計が代金の<b>20%を超える部分は無効</b>（全体が無効ではなく、超える部分のみ無効）。</p>
<p><b>④ 自己の所有に属しない物件の売買制限</b>：原則として他人物売買・未完成物件の売買は禁止。ただし、確実に取得できる場合（売買契約等がある場合）は例外的に可能。</p>`,
traps:["<b>業者間取引には適用なし</b>（最重要ひっかけ）","クーリングオフ＝「<b>事務所等以外</b>」で申込み→<b>書面で8日以内</b>","手付は代金の<b>20%超は受領不可</b>、性質は<b>解約手付</b>とみなす","損害賠償の予定＝20%超の<b>部分</b>が無効（全体ではない）"]},

{id:"t04",cat:"takken",topic:"免許制度",freq:4,
desc:`<p><b>【宅建業とは】</b>宅地又は建物の<b>売買・交換</b>を自ら行うこと、又は売買・交換・<b>賃借の媒介・代理</b>を業として行うことです。<br>
<b>「自ら賃貸」は宅建業に該当しません</b>（最重要）。アパート経営、サブリース業者も免許不要です。</p>
<p><b>【免許の種類】</b><br>
・<b>国土交通大臣免許</b>＝2以上の都道府県に事務所を設置<br>
・<b>都道府県知事免許</b>＝1の都道府県のみに事務所を設置<br>
基準は<b>事務所の所在地</b>であり、取引を行う場所ではありません。</p>
<p><b>【有効期間と更新】</b><br>
・有効期間＝<b>5年</b><br>
・更新申請＝期間満了の<b>90日前から30日前</b>まで<br>
・更新申請中に期間満了→処分があるまで従前の免許は有効</p>
<p><b>【欠格事由】</b>以下に該当すると免許を受けられません（主要なもの）：<br>
・禁錮以上の刑に処せられ、執行終了から<b>5年</b>を経過しない者<br>
・宅建業法違反等で罰金刑に処せられ、執行終了から<b>5年</b>を経過しない者<br>
・免許取消処分を受けてから<b>5年</b>を経過しない者<br>
・法人の<b>役員</b>が欠格事由に該当→法人も免許不可</p>`,
traps:["<b>自ら賃貸は宅建業に該当しない</b>（最重要）","免許の有効期間＝<b>5年</b>、更新は<b>90日前〜30日前</b>","法人の<b>役員</b>が欠格事由→<b>法人も</b>免許取消し"]},

{id:"t05",cat:"takken",topic:"宅建士制度",freq:4,
desc:`<p><b>【独占業務】</b>宅建士でなければできない業務は<b>3つだけ</b>です：<br>
① <b>重要事項の説明</b>（35条）<br>
② <b>35条書面への記名</b><br>
③ <b>37条書面への記名</b><br>
これ以外（書面の交付、物件案内、契約の勧誘等）は宅建士でなくてもOKです。</p>
<p><b>【専任の宅建士の設置義務】</b><br>
事務所ごとに、業務に従事する者<b>5人に1人以上</b>の割合で、専任の宅建士を設置しなければなりません。不足した場合は<b>2週間以内</b>に補充しなければなりません。</p>
<p><b>【登録と宅建士証】</b><br>
・登録＝試験合格地の<b>都道府県知事</b>に登録（一度登録すれば一生有効）<br>
・<b>登録の移転</b>＝他の都道府県に移る場合は任意（義務ではない）。新たな試験は不要<br>
・<b>宅建士証</b>＝有効期間<b>5年</b>。更新には法定講習の受講が必要<br>
・事務禁止処分中でも登録の移転は可能（よく出る）</p>`,
traps:["独占業務＝<b>3つだけ</b>（重説・35条記名・37条記名）","専任の宅建士＝<b>5人に1人</b>以上","登録の移転＝<b>任意</b>（義務ではない）、新試験<b>不要</b>"]},

{id:"t06",cat:"takken",topic:"営業保証金・保証協会",freq:4,
desc:`<p>取引の相手方を保護するため、宅建業者は<b>営業保証金の供託</b>か<b>保証協会への加入</b>のいずれかが必要です。</p>
<p><b>【営業保証金 vs 弁済業務保証金分担金】</b><br>
<table class="compare-table"><tr><th></th><th>営業保証金</th><th>分担金</th></tr>
<tr><td>主たる事務所</td><td><b>1,000万円</b></td><td><b>60万円</b></td></tr>
<tr><td>従たる事務所</td><td><b>500万円</b></td><td><b>30万円</b></td></tr>
<tr><td>供託先</td><td>主たる事務所の最寄りの供託所</td><td>保証協会に納付</td></tr></table></p>
<p><b>【保証協会のルール】</b><br>
・保証協会は<b>2つ</b>（全宅、全日）あり、<b>二重加入は不可</b><br>
・保証協会の社員は営業保証金を供託する必要なし<br>
・社員でなくなった場合は、<b>1週間以内</b>に営業保証金を供託</p>
<p><b>【還付後の補充】</b><br>
・営業保証金の場合：通知書の送付を受けてから<b>2週間以内</b>に不足額を供託<br>
・弁済業務保証金の場合：社員は通知を受けてから<b>2週間以内</b>に分担金を納付</p>`,
traps:["営業保証金＝主<b>1,000万</b>/従<b>500万</b>（分担金は主60万/従30万）","保証協会の<b>二重加入不可</b>","還付後の補充＝いずれも<b>2週間以内</b>"]},

{id:"t07",cat:"takken",topic:"媒介契約",freq:4,
desc:`<p>媒介契約には3つの類型があり、規制内容が異なります。数字の正確な暗記が必須です。</p>
<p><b>【3類型の比較表】</b><br>
<table class="compare-table"><tr><th></th><th>一般</th><th>専任</th><th>専属専任</th></tr>
<tr><td>他業者への依頼</td><td>可</td><td><b>不可</b></td><td><b>不可</b></td></tr>
<tr><td>自己発見取引</td><td>可</td><td>可</td><td><b>不可</b></td></tr>
<tr><td>レインズ登録</td><td>義務なし</td><td><b>7日以内</b></td><td><b>5日以内</b></td></tr>
<tr><td>業務報告</td><td>義務なし</td><td><b>2週間に1回</b></td><td><b>1週間に1回</b></td></tr>
<tr><td>有効期間</td><td>制限なし</td><td><b>3ヶ月以内</b></td><td><b>3ヶ月以内</b></td></tr></table></p>
<p><b>【有効期間の注意点】</b>専任・専属専任は3ヶ月以内で、<b>自動更新は不可</b>です。更新は依頼者からの申出がある場合に限られます。3ヶ月を超える特約は3ヶ月に短縮されます。</p>`,
traps:["専属専任＝自己発見取引<b>不可</b>・レインズ<b>5日</b>・報告<b>1週間に1回</b>","専任＝レインズ<b>7日</b>・報告<b>2週間に1回</b>","有効期間＝<b>3ヶ月以内</b>（<b>自動更新不可</b>）"]},

{id:"t08",cat:"takken",topic:"報酬額の制限",freq:5,
desc:`<p>宅建業者が受領できる報酬額には法定の上限があります。計算問題が毎年出題されます。</p>
<p><b>【売買の媒介報酬（速算式）】</b><br>
<table class="compare-table"><tr><th>売買代金（税抜）</th><th>報酬率</th></tr>
<tr><td>200万円以下</td><td>5%</td></tr>
<tr><td>200万円超〜400万円以下</td><td>4%+2万円</td></tr>
<tr><td><b>400万円超</b></td><td><b>3%+6万円</b></td></tr></table>
※ 税抜の本耐火格に対して計算し、最後に<b>消費税を加算</b>します。<br>
※ 媒介の場合、<b>片方の当事者</b>から受領できる上限額。双方から受領する場合は×2。</p>
<p><b>【賃貸の媒介報酬】</b><br>
貸主と借主の<b>合計で借賃の1ヶ月分＋消費税</b>が上限です。居住用建物の場合、依頼者の承諾がなければ、一方から受領できるのは<b>半月分</b>が上限です。</p>
<p><b>【低廉な空家等の特例】</b>400万円以下の売買で、通常より多くの現地調査費用がかかる場合、売主から受領できる報酬は<b>18万円＋消費税</b>まで可能です。</p>`,
traps:["400万円<b>超</b>＝3%+6万円（ちょうど400万円は4%+2万円）","賃貸の報酬＝<b>合計</b>で借賃の<b>1ヶ月分</b>","低廉な空家＝売主から<b>18万円+税</b>まで可"]},

// ========== 法令上の制限 ==========
{id:"h01",cat:"hourei",topic:"都市計画法（用途地域・開発許可）",freq:5,
desc:`<p><b>【都市計画区域の構成】</b><br>
・<b>市街化区域</b>＝すでに市街地or10年以内に市街化を図る区域。<b>用途地域を必ず定める</b><br>
・<b>市街化調整区域</b>＝市街化を抑制する区域。用途地域は<b>原則定めない</b><br>
・<b>非線引き区域</b>＝区域区分を定めていない区域</p>
<p><b>【開発許可制度】</b>開発行為（建築物の建築等を目的とした土地の区画形質の変更）を行うには許可が必要です。面積要件の暗記が必須です。<br>
<table class="compare-table"><tr><th>区域</th><th>許可が必要な面積</th></tr>
<tr><td><b>市街化区域</b></td><td><b>1,000㎡以上</b></td></tr>
<tr><td><b>市街化調整区域</b></td><td><b>面積問わず原則必要</b></td></tr>
<tr><td>非線引き・準都市計画区域</td><td>3,000㎡以上</td></tr>
<tr><td>都市計画区域外</td><td>10,000㎡以上</td></tr></table></p>
<p><b>【許可不要の例外】</b><br>
・<b>農林漁業用の建築物</b>＝市街化区域<b>以外</b>では許可不要。市街化区域では許可必要<br>
・公益上必要な建築物（駅舎、図書館、公民館等）<br>
・都市計画事業の施行として行う開発行為</p>`,
traps:["市街化区域＝<b>1,000㎡以上</b>で許可必要","市街化調整区域＝<b>面積問わず原則必要</b>","農林漁業用建築物は<b>市街化区域では許可必要</b>（区域外では不要）"]},

{id:"h02",cat:"hourei",topic:"建築基準法（容積率・建ぺい率）",freq:5,
desc:`<p><b>【容積率】</b>＝延べ面積÷敷地面積。建物の総ボリュームを制限します。<br>
前面道路の幅員が<b>12m未満</b>の場合、以下の計算値と指定容積率の<b>小さい方</b>が適用されます：<br>
・<b>住居系</b>用途地域→幅員×<b>4/10</b><br>
・<b>その他</b>（商業系等）→幅員×<b>6/10</b><br>
例：第一種住居地域、前面道路6m、指定容積率300%の場合→6m×4/10=240% < 300% → <b>240%</b>が適用</p>
<p><b>【建ぺい率】</b>＝建築面積÷敷地面積。敷地に対する建物の広がりを制限します。<br>
<b>緩和措置</b>（加算）：<br>
・<b>角地</b>→<b>+10%</b><br>
・<b>防火地域内の耐火建築物</b>→<b>+10%</b><br>
・両方該当→<b>+20%</b>（併用可能）<br>
・建ぺい率が8/10の地域で、かつ防火地域内の耐火建築物→<b>建ぺい率制限なし</b></p>
<p><b>【セットバック】</b>2項道路（幅員4m未満の道路）に面する敷地では、道路中心から2mの線まで後退が必要です。<b>セットバック部分は敷地面積に算入できません</b>。</p>
<p><b>【日影規制】</b><b>商業・工業・工業専用地域</b>には適用されません。</p>`,
traps:["前面道路12m未満→住居系は<b>幅員×4/10</b>、その他は<b>×6/10</b>","角地<b>+10%</b>＋防火地域内耐火<b>+10%</b>＝<b>+20%</b>併用可","セットバック部分は<b>敷地面積に算入しない</b>"]},

{id:"h03",cat:"hourei",topic:"建築基準法（道路・建築確認）",freq:4,
desc:`<p><b>【建築基準法上の道路】</b>原則として幅員<b>4m以上</b>のものです（特定行政庁指定区域では6m）。<br>
<b>2項道路（みなし道路）</b>＝建築基準法施行時（昭和25年）に既に建物が立ち並んでいた幅員4m未満の道で、特定行政庁が指定したもの。道路の<b>中心線から2m</b>の線まで後退（セットバック）が必要です。</p>
<p><b>【接道義務】</b>建築物の敷地は、建築基準法上の道路に<b>2m以上</b>接しなければなりません。地方公共団体の条例でこの要件を<b>付加</b>することは可能（例：3m以上）ですが、<b>緩和</b>はできません。</p>
<p><b>【建築確認】</b>建築物を建築する前に、建築計画が法令に適合しているか確認を受ける手続です。<br>
・<b>都市計画区域内</b>＝すべての建築物に確認が必要<br>
・<b>都市計画区域外</b>＝特殊建築物（200㎡超）や大規模建築物のみ確認必要</p>
<p><b>【用途変更】</b>建築物の用途を変更する場合、類似用途間（例：劇場→映画館）の変更は確認不要。<b>200㎡超</b>の特殊建築物への用途変更は確認が必要です。</p>`,
traps:["道路＝原則幅員<b>4m以上</b>","2項道路→<b>中心から2m</b>セットバック","接道義務＝道路に<b>2m以上</b>接すること"]},

{id:"h04",cat:"hourei",topic:"農地法",freq:4,
desc:`<p>農地の権利移動や転用を規制する法律です。3条・4条・5条の区別が核心です。</p>
<p><b>【3条・4条・5条の比較】</b><br>
<table class="compare-table"><tr><th></th><th>3条（権利移動）</th><th>4条（転用）</th><th>5条（転用目的の権利移動）</th></tr>
<tr><td>内容</td><td>農地のまま売買・貸借</td><td>自分の農地を農地以外に</td><td>農地を転用目的で売買等</td></tr>
<tr><td>許可権者</td><td><b>農業委員会</b></td><td><b>都道府県知事</b></td><td><b>都道府県知事</b></td></tr>
<tr><td>市街化区域の特例</td><td><b>なし（許可必要）</b></td><td>届出でOK</td><td>届出でOK</td></tr></table></p>
<p><b>【重要ポイント】</b><br>
・市街化区域内の農地は4条・5条については<b>農業委員会への届出</b>で足りますが、<b>3条は市街化区域内でも許可が必要</b>です（ひっかけ注意）<br>
・<b>相続</b>による取得→3条<b>許可不要</b>。ただし農業委員会への<b>届出は必要</b><br>
・許可なく転用した場合→<b>原状回復命令</b>の対象</p>`,
traps:["3条＝<b>農業委員会</b>、4条・5条＝<b>都道府県知事</b>","市街化区域内→4条5条は<b>届出でOK</b>だが<b>3条は許可必要</b>","相続＝許可不要だが<b>届出は必要</b>"]},

{id:"h05",cat:"hourei",topic:"国土利用計画法",freq:3,
desc:`<p>一定面積以上の土地取引について、都道府県知事への届出を義務づける法律です。</p>
<p><b>【事後届出の面積要件】</b><br>
<table class="compare-table"><tr><th>区域</th><th>届出が必要な面積</th></tr>
<tr><td>市街化区域</td><td><b>2,000㎡以上</b></td></tr>
<tr><td>市街化調整区域・非線引き</td><td><b>5,000㎡以上</b></td></tr>
<tr><td>都市計画区域外</td><td><b>10,000㎡以上</b></td></tr></table></p>
<p><b>【届出の手続】</b><br>
・届出義務者＝<b>権利取得者（買主）</b>（売主ではない）<br>
・届出時期＝契約締結後<b>2週間以内</b><br>
・届出先＝土地が所在する市町村長を経由して都道府県知事へ</p>
<p><b>【届出不要の取引】</b><br>
・当事者の一方が<b>国・地方公共団体</b>の場合<br>
・農地法3条の許可を受けた場合<br>
・民事調停法による調停に基づく場合 等</p>`,
traps:["面積＝市街化<b>2,000㎡</b>／調整等<b>5,000㎡</b>／区域外<b>10,000㎡</b>","届出義務者＝<b>買主</b>（売主ではない）","届出は契約後<b>2週間以内</b>"]},

// ========== 税・その他 ==========
{id:"z01",cat:"zei",topic:"不動産取得税・固定資産税",freq:4,
desc:`<p><b>【不動産取得税】</b><br>
・課税主体＝<b>都道府県</b>（国税ではない）<br>
・課税対象＝不動産の取得（売買・贈与・建築等）<br>
・<b>非課税</b>＝<b>相続</b>による取得、包括遺贈。ただし<b>贈与は課税</b>される<br>
・特定遺贈（特定の財産を指定する遺贈）は<b>課税</b><br>
・住宅の課税標準特例＝<b>1,200万円控除</b>（認定長期優良住宅は1,300万円）<br>
・免税点＝土地<b>10万円</b>、家屋（建築）<b>23万円</b>、家屋（売買）<b>12万円</b></p>
<p><b>【固定資産税】</b><br>
・課税主体＝<b>市町村</b>（東京23区は都）<br>
・賦課期日＝毎年<b>1月1日</b>の所有者に課税（年途中の売買でも1/1の所有者が納税義務者）<br>
・住宅用地の特例：<b>小規模住宅用地</b>（200㎡以下）＝課税標準×<b>1/6</b>、<b>一般住宅用地</b>＝課税標準×<b>1/3</b><br>
・新築住宅の減額＝<b>3年間</b>（3階建以上の耐火建築物は<b>5年間</b>）税額を<b>1/2</b>に減額<br>
・免税点＝土地<b>30万円</b>、家屋<b>20万円</b></p>`,
traps:["不動産取得税：<b>相続は非課税</b>、贈与は課税","固定資産税の賦課期日＝<b>1月1日</b>（4月1日ではない）","住宅用地の特例＝小規模<b>1/6</b>、一般<b>1/3</b>"]},

{id:"z02",cat:"zei",topic:"譲渡所得税",freq:4,
desc:`<p>不動産を譲渡した場合の所得税に関する特例です。居住用財産の特例が頻出します。</p>
<p><b>【3,000万円特別控除】</b><br>
・居住用財産を譲渡した場合、譲渡所得から<b>3,000万円を控除</b>できる<br>
・所有期間の長短は<b>問わない</b>（短期でも適用可）<br>
・居住しなくなってから<b>3年目の年末まで</b>に譲渡すれば適用可<br>
・<b>配偶者・直系血族</b>への譲渡は適用除外</p>
<p><b>【軽減税率の特例】</b><br>
・所有期間<b>10年超</b>の居住用財産を譲渡した場合に適用<br>
・6,000万円以下の部分→<b>14%</b>（所得税10%＋住民税4%）<br>
・3,000万円控除と<b>併用可能</b></p>
<p><b>【買換え特例】</b><br>
・居住用財産を売って新たに居住用財産を取得した場合、譲渡所得の課税を繰延べ<br>
・3,000万円控除とは<b>選択適用</b>（<b>併用不可</b>）</p>`,
traps:["3,000万円控除＝所有期間<b>問わず</b>適用可","軽減税率＝所有期間<b>10年超</b>が要件。3,000万円控除と<b>併用可</b>","買換え特例と3,000万円控除は<b>併用不可</b>（選択適用）"]},

{id:"z03",cat:"zei",topic:"景品表示法・住宅金融支援機構",freq:3,
desc:`<p><b>【景品表示法（不動産の表示に関する公正競争規約）】</b><br>
・徒歩時間＝道路距離<b>80m</b>につき<b>1分</b>で算出。端数は<b>切上げ</b>（例：160m=2分、240m=3分）<br>
・「<b>新築</b>」と表示できる条件＝建築後<b>1年未満</b>かつ<b>未入居</b>（どちらか一方でも欠ければ不可）<br>
・<b>最上級表現</b>（「日本一」「完全」「最高」等）は、合理的根拠がなければ使用不可<br>
・おとり広告＝実際には取引できない物件の広告は禁止</p>
<p><b>【住宅金融支援機構法】</b><br>
・機構は<b>直接融資を原則行わない</b>（証券化支援業務が中心）<br>
・<b>フラット35の仕組み</b>：民間金融機関が融資→機構が住宅ローン債権を買い取り→MBS（住宅ローン担保証券）として投資家に売却<br>
・融資対象の床面積＝一戸建て<b>70㎡以上</b>、マンション<b>30㎡以上</b><br>
・直接融資の例外＝災害復興住宅、マンション共用部分リフォーム、財形住宅融資等</p>`,
traps:["徒歩＝<b>80mにつき1分</b>（端数切上げ）","新築＝建築後<b>1年未満</b>かつ<b>未入居</b>","機構は<b>直接融資を原則行わない</b>（証券化支援が中心）"]}
];

更の登録を申請する必要があります"},{"f":"takkenshi","fn":"宅地建物取引士","q":"建業者は文場建物の売買契約の申し込みのみを受ける案内所上を設置し売買契約の締結は事務所で行う場合、当該案内所には専任の宅建士を置く必要はない","a":false,"e":"申し込みまたは契約をする案内所には1人以上の専任の宅建士を置く必要があるとされてい。ます"},{"f":"takkenshi","fn":"宅地建物取引士","q":"宅地建物取引し資格試験に合格した日から1年以内に宅建障の交付を受けようとするものは登録をしている都道府県知事の指定する講習を受行する必要はない","a":true,"e":"合格から1年以内は知事の指定する講習を受行する必要はないとされてい。ます"},{"f":"takkenshi","fn":"宅地建物取引士","q":"平知事から宅建市相の交付を受けている宅建士が宅建市相の有効期間の更新を受けようとする時は平知事に申請しその申請前6ヶ月以内に行われる国土交通大臣の指定する講習を受行しなければならない","a":false,"e":"国土交通大臣ではなく知事が指定する法定講習となってい。ます"},{"f":"takkenshi","fn":"宅地建物取引士","q":"宅地建物取引士は登録消除の処分を受けた時は宅地建物取引をその交付を受けた都道府県知事に返納しなければならない","a":true,"e":"登録症状を受けると返しなければならないとされてい。ます"},{"f":"takkenshi","fn":"宅地建物取引士","q":"宅地建物取引士の登録を受けているものが死亡した場合、その相続人は死亡した日から30日以内に登録をしている都道府県知事に届出をしなければならない","a":false,"e":"死亡した日からではなく死亡の事実を知った日から30日以内となってい。ます"},{"f":"takkenshi","fn":"宅地建物取引士","q":"宅地建物取引士は事務禁止の処分を受けた時は宅地建物取引支障をその交付を受けた都道府県知事に提出しなくてはならない","a":true,"e":"事務禁止処分を受けると提出しなくてはならないとされてい。ます"},{"f":"takkenshi","fn":"宅地建物取引士","q":"建士は法第35条の規定による重要事項説明を行うにあたり相手方から請求があった場合、にのみ宅建障を提示すれば良い","a":false,"e":"請求がなくても見せつける必要があります"},{"f":"takkenshi","fn":"宅地建物取引士","q":"貢献知事から宅建の交付を受けている宅建士はその住所を変更した時は遅滞なく変更の登録の申請をするとともに宅建市の書き換え交付の申請を貢献知事に対して、しなければならない","a":true,"e":"住所を変更した時は変更の登録の申請をする必要があります"},{"f":"takkenshi","fn":"宅地建物取引士","q":"建物取引士の登録を受けているものが本籍を変更した場合、遅滞なく登録をしている都道府県知事に変更の登録を申請しなければならない","a":true,"e":"本籍を変更すると変更の登録の必要があります"},{"f":"takkenshi","fn":"宅地建物取引士","q":"貢献で宅地建物取引し試験に合格した後1年以上登録の申請をしてこなかったものが宅建業者お建知事免許に勤務する。こととなった時は乙県知事当てに登録の申請をしなければならない","a":false,"e":"試験合格地の貢献知事に対して行うとされてい。ます"},{"f":"takkenshi","fn":"宅地建物取引士","q":"宅地建物取引し資格試験に合格したもので宅地建物の取引に関し2年以上の実務経験を有するものまたは国土交通大臣がその実務経験を有するものと同等以上の能力を有すると認めたものは登録を受ける。ことができる","a":true,"e":"2年以上の実務または国土交通大臣が認めるものとされる場合、は登録を受ける。ことができます"},{"f":"takkenshi","fn":"宅地建物取引士","q":"金以上の経にられた宅建士は登録を受けている都道府県知事から登録の消除の処分を受けの執行が終わった日から5年を経過する。まで宅建士の登録をする。ことができない","a":true,"e":"金系以上の場合、は計の執行が終わった日から5年を経過する。まで登録は不可となってい。ます"},{"f":"takkenshi","fn":"宅地建物取引士","q":"登録を受けているものは住所 括して備えつける。ことはしなかった","a":true,"e":"それぞれの事務所ごとに備えつける必要があるとされてい。ます"},{"f":"gyomu","fn":"業務上の規制・事務所等","q":"建業者は本店と複数の支店がある場合、支店には帳簿を備えつけず本店に支店の分もまとめて備えつけておけば良い","a":false,"e":"事務所ごとに備え付ける必要があるとされてい。ます"},{"f":"gyomu","fn":"業務上の規制・事務所等","q":"引の関係者から従業者名簿の閲覧を求められたが秘密を守る義務を理由にこの申し出を断った","a":false,"e":"取引の関係者からの場合、この申し出を断る。ことはできないとされてい。ます"},{"f":"art34","fn":"34条書面(媒介)","q":"依頼者の申し出により契約の行を6ヶ月と定めた任媒介会契約を結した場合、その契約は全て効うである答えは罰になります6ヶ月と定めた場合3ヶ月に短縮され無効になるわけではない。ので注意が必要です","a":true,"e":"正しい記述です。"},{"f":"art34","fn":"34条書面(媒介)","q":"宅建業者は依頼者との間で締結した媒介契約が専任媒介契約であるか否に関わらず所定の事故を指定流通機構に登録しなければならない","a":false,"e":"一般媒会は登録義務はない。ため、注意が必要です。"},{"f":"art34","fn":"34条書面(媒介)","q":"宅建業者が依頼者との間に専属線人媒介契約を締結した時は当該契約の締結の日から5日以内休業日を除くに所定の時効を登録しなければならない","a":true,"e":"専属線に媒介契約は5日以内そして休業日を除くという点は必ず確認してく。ださい"},{"f":"art34","fn":"34条書面(媒介)","q":"宅建業者が依頼者Bとの間で有効期間を2ヶ月とする専任媒介契約を締結する際Bが媒介契約を更新する旨を申し出ない場合、は有効期間満了により自動更新するものとする旨の特約を定める。ことができる","a":false,"e":"指導更新は無効となる。ため、注意が必要です。"},{"f":"art34","fn":"34条書面(媒介)","q":"建業者Aが依頼者と媒介契約を締結した場合、当該土地付き建物の売買契約が成立した時はA社は遅滞なく登録番号取引価格及び売買契約の成立した年月日費日を指定流通機構に通知しなければならない","a":true,"e":"通知内容は登録番号価格年月日です。覚えましょう。"},{"f":"art34","fn":"34条書面(媒介)","q":"建業者Aが依頼者Bと一般媒介契約を締結しA社がBに対し当該土地付き建物の科学または評価額について意見を述べる時は根拠を明らかにしなければならない","a":true,"e":"意見を述べる時は根拠を明らかにする必要があるとされてい。ます"},{"f":"art34","fn":"34条書面(媒介)","q":"宅建業者Aと依頼者B間で専属人媒介契約を締結した場合、AはBに対し当該契約の業務の処理状況を2週間に1回以上報告しなければならない","a":false,"e":"専属任媒介契約の場合、1週間に1回そして休業日を含むという点は確認してく。ださい"},{"f":"art34","fn":"34条書面(媒介)","q":"宅建業者Aが依頼者Bと専任媒介契約を締結した時はAは法第34条に規定する契約内容を記載した書面を依頼者に交付しなければならないが一般媒介契約を締結した時は当該書面の交付をしなくても良い","a":false,"e":"一般媒会でも交付は必要とされてい。ます"},{"f":"art34","fn":"34条書面(媒介)","q":"建業者は媒介契約の有効期間及び解除に関する時効を法第34条に基づき交付すべき書面に記載しなければならない","a":true,"e":"急行期間及び解除は記載事項となってい。ます"},{"f":"art34","fn":"34条書面(媒介)","q":"宅地建物取引業者は法第34条の交付すべき書面に宅地建物取引をしていさせなければならない","a":false,"e":"宅建士ではなく宅建業者の義務となってい。ます"},{"f":"art34","fn":"34条書面(媒介)","q":"登録にかかる宅地の都市計画法その他の法令に基づく制限で使用なものは指定流通機構への登録事項に該当する","a":true,"e":"登録事項とされてい。ます"},{"f":"art34","fn":"34条書面(媒介)","q":"宅建業者Aが依頼者Bと一般媒介契約を締結した場合、当該宅地の売買の媒介を担当する。Aの宅地建物取引士は法第34条の署名に期名する必要はない","a":true,"e":"の場合、をする必要はないとされてい。ます"},{"f":"art34","fn":"34条書面(媒介)","q":"宅建業者が宅地の売却の依頼者と媒介契約を締結した場合、購入の申し込みがあった時は売却の依頼者が宅地建物取引業者であっても、遅滞なく。その旨を当該依頼者に報告しなければならない","a":true,"e":"時代なく報告する必要があるとされてい。ます"},{"f":"art34","fn":"34条書面(媒介)","q":"依頼者が宅建業者である場合、権業者は当該人媒介契約にかかる業務の処理状況の報告をする必要はない","a":false,"e":"依頼者が宅建業者であっても、業務の処理状況の報告をする必要はあるとされてい。ます"},{"f":"art34","fn":"34条書面(媒介)","q":"建業者Aと依頼者B間で専属性に媒介契約を締結した場合、BはAが探索した相手方以外のものと売買契約を締結する。ことができない","a":true,"e":"先続媒介契約の正しい選択肢となってい。ます"},{"f":"art34","fn":"34条書面(媒介)","q":"建業者はマンションの貸借の媒介を行ったマンションの貸主から媒介の依頼を受けて承諾したが媒介契約書を作成せず貸主に交付しなかった","a":true,"e":"間違えてしまった人もいるかもしれませんがこの34条面の交付義務が発生する。のは売買交換の場合。貸借は含まれない。ため、注意が必要です。"},{"f":"art34","fn":"34条書面(媒介)","q":"登録にかかる宅地の所有者の氏名及び住所は指定流通機構への登録事項に該当する","a":false,"e":"所有者の氏名及び住所は登録事項に該当しないとされてい。ます"},{"f":"art34","fn":"34条書面(媒介)","q":"建業者Aと依頼者Bとの間で全任媒介契約を締結した場合、当該宅地の売買契約が成立したとしてもその旨を指定流通機構に通知する必要はない","a":false,"e":"この場合、は契約が成立した時は通知する必要があるとされてい。ます"},{"f":"art34","fn":"34条書面(媒介)","q":"登録にかかる宅地の所材規模及びは指定流通機構への登録事項に該当する","a":true,"e":"登録事項に該当するとされてい。ます"},{"f":"art34","fn":"34条書面(媒介)","q":"宅建業者Aは依頼者Bと一般媒介契約を締結し所定の時効を伝えなく指定流通機号に登録したがその登録を表する署名を登録してから14日後にBに交付した","a":true,"e":"一般媒介契約の場合、指定流通機構への登録登録書の引き渡しは義務がないとされてい。ます。14日後に交付しても特に問題はないとされてい。ます"},{"f":"art34","fn":"34条書面(媒介)","q":"建業者Aが依頼者Bと一般媒会契約を締結した場合、AがBに対し当該土地付き建物の科学について意見を述べる。ために行った科学の査程に応した費用をBに請求する。ことはできない","a":true,"e":"この場合、Bに請求する。ことはできないとされてい。ます"},{"f":"art34","fn":"34条書面(媒介)","q":"建業者Aが依頼者Bとの間で一般媒会契約を締結した場合、AがBに対し当該宅地の科学について意見を述べる時は不動産鑑定士に評価を依頼してその根拠を明らかにしなければならない","a":false,"e":"不動産鑑定士に評価をしなくても根拠を明らかにすれば良いとされてい。ます"},{"f":"art34","fn":"34条書面(媒介)","q":"建業者Aが依頼者Bとの間に締結した人媒介契約の有効期間はBからの申し出により更新する。ことができるが更新の時から3ヶ月を超える。ことができない","a":true,"e":"正しい選択肢となってい。ます"},{"f":"art34","fn":"34条書面(媒介)","q":"宅建業者は高住宅の科学について意見を述べる場合、依頼者に対して、その根拠を高等ではなく書面で明示しなければならない","a":false,"e":"書面でなくても高等でも可能とされてい。ます"},{"f":"art34","fn":"34条書面(媒介)","q":"宅建業者Aは人媒介契約を依頼者Bと締結し中古住宅の売買契約が成立しても当該中古住宅の引き渡しが完了してい。なければ売買契約が成立した旨を指定流通機構に通知する必要はない","a":false,"e":"契約が成立した時に通知する必要があるとされてい。ます"},{"f":"art34","fn":"34条書面(媒介)","q":"建業者Aが依頼者Bとの間で専属性任媒介契約を締結した場合、Aは当該中古住宅の取引の申し込みの受付に関する状況を指定流通機構に登録しなければならない","a":true,"e":"取引の申し込みの受付状況を登録するとされてい。ます"},{"f":"art34","fn":"34条書面(媒介)","q":"依頼者Bが宅建業者である場合、当該契約が国土交通大臣が定める標準媒介契約薬間に基づくものであるか否かの別を法第34条に規定する書面に規定する必要はない","a":false,"e":"依頼者が宅建業者であっても、に基づいているかい。ないかこれは記載する必要があるとされてい。ます"},{"f":"art34","fn":"34条書面(媒介)","q":"任売媒介契約の締結にあたって当該契約にかかる業務の処理状況の報告日を毎週金曜日とする旨の特約は宅建違反ではない","a":true,"e":"人媒介契約。この場合、は報告日は2週間に1回でも可能な。ので毎週金曜日とするという特約は有効となってい。ます"},{"f":"art34","fn":"34条書面(媒介)","q":"建業者Aが依頼者Bと一般媒介契約を締結した受けの申し込みはなかったがAはBに対し本件契約にかかる業務の処理状況の報告を後等により14日に1回以上の頻度で行った","a":true,"e":"一般媒介契約の場合、報告義務自体はないとされている。ので14日に1回以上特に問題はないとされてい。ます"},{"f":"art34","fn":"34条書面(媒介)","q":"宅建業者は依頼主が宅建業者であった。ので宅地建物取引第34条に規定する署名を作成しなかった","a":false,"e":"依頼主が宅建業者であっても、書面を作成する必要はある。ので注意が必要です宅建"},{"f":"art35","fn":"35条書面(重要事項説明)","q":"重要事項説明書は宅建業者が作成義務を負う","a":true,"e":"重要事項説明書は宅建業者が作成義務をい。ます宅建士ではない。ため、注意が必要です。"},{"f":"art35","fn":"35条書面(重要事項説明)","q":"宅建業者は中古マンションの売買を行う場合、抵当権が設定されている時は契約日までにその登記が抹消される予定であっても、低件の内容について35条面で説明しなければならない","a":true,"e":"抵当権が消滅される予定であっても、説明する必要があるとされてい。ます"},{"f":"art35","fn":"35条書面(重要事項説明)","q":"業者は宅地または建物の売買について売主となる場合、買主が宅建業者であっても、重要事項説明は行わなければならないが35乗面の交付は省略して良い","a":false,"e":"説明は省略可能で交付は省略不可となってい。ます"},{"f":"art35","fn":"35条書面(重要事項説明)","q":"35条面では建物の貸借の媒介を行う場合、カチ賃以外に受される金銭の額については、説明しなければならないが金銭の受々の目的については、説明する必要はない","a":false,"e":"の額及び受々の目的両方セットとなります"},{"f":"art35","fn":"35条書面(重要事項説明)","q":"昭和60年1985年10月1日に新築の工事に着手し完成した建物の売買の媒介を行う場合、建物が指定確認診断を受けたものであっても、その内容は35条面で説明する必要はない","a":true,"e":"年数をしっかりと覚えましょう1981年6月1日以降に完成した建物の場合、は説明が不要となってい。ます"},{"f":"art35","fn":"35条書面(重要事項説明)","q":"建物の貸借の媒介を行う場合、貸借の契約が定期建物賃体借契約である時は宅建業者はその旨を35乗面で説明しなければならない","a":true,"e":"35条面で説明するとされてい。ます"},{"f":"art35","fn":"35条書面(重要事項説明)","q":"建物の売買の媒介を行う場合、建物についてアスベストの使用の調査の結果が記録されてい。ない時は宅建業者は自らアスベストの使用のうの調査を行った上でその結果の内容を35条面で説明しなければならない","a":false,"e":"記録がない旨の説明をすればよく自分で調査をする必要はないとされてい。ます"},{"f":"art35","fn":"35条書面(重要事項説明)","q":"区分所有建物の売買において、売主及び買主が宅建業者である場合、であっても、売主は買主に対し供託所等の説明を35条面でする必要がある","a":false,"e":"買主が宅建業者の場合、供託所の説明は不要となってい。ます"},{"f":"art35","fn":"35条書面(重要事項説明)","q":"区分所有建物の売買において、1等の建物にかかる計画的な維持修繕のための修繕積み立て金積み立て総額及び売買の対象となる先衛部分にかかる修繕積み立て金額の説明をすれば滞能がある。ことについては、35条面で説明をしなくても良い","a":false,"e":"大能がある場合、滞能があるという旨の説明をする必要があるとされてい。ます"},{"f":"art35","fn":"35条書面(重要事項説明)","q":"宅地の売買の媒介を行う場合、売買代金の額並びにその支払い。の時期及び方法について35条面で説明しなければならない","a":false,"e":"37条面の記載事項となってい。ます"},{"f":"art35","fn":"35条書面(重要事項説明)","q":"建物の貸借の媒介を行う場合重要事項説明書では建物が水法法思考の規定により市町村の腸が提供する図面にその位置が表示されている場合には図面が存在している。ことを説明すれば足りる","a":false,"e":"水外ハザードマップを提示し概の位置を示す必要があります"},{"f":"art35","fn":"35条書面(重要事項説明)","q":"水道電気及び下水道は完備年ガスは未整備である胸を説明したがその整備の見通しまでは説明しなかった","a":false,"e":"整備の見通しまで説明が必要です"},{"f":"art35","fn":"35条書面(重要事項説明)","q":"率容積率の場合、売買は説明必要ですが貸借は説明不要となってい。ます","a":true,"e":"正しい記述です。"},{"f":"art35","fn":"35条書面(重要事項説明)","q":"指導の負担の場合建物の貸借の場合説明は不要となります","a":true,"e":"正しい記述です。"},{"f":"art35","fn":"35条書面(重要事項説明)","q":"住宅性能評価は売買の場合説明必要ですが貸借の場合は説明不要となります","a":true,"e":"正しい記述です。"},{"f":"art35","fn":"35条書面(重要事項説明)","q":"使用者の氏名及び住所については説明は不要となります","a":false,"e":"誤りの記述です。"},{"f":"art35","fn":"35条書面(重要事項説明)","q":"区分所有建物売買で計画修繕費用の減免の定めがある場合、買主が原面対象者であるか否かに関わらずその内容を説明しなければならない","a":true,"e":"正しい記述です。"},{"f":"art35","fn":"35条書面(重要事項説明)","q":"すでに積み立てられている修繕積立金の額についても説明する必要がある","a":false,"e":"誤りの記述です。"},{"f":"art35","fn":"35条書面(重要事項説明)","q":"金銭の保管方法は説明不要となります","a":false,"e":"誤りの記述です。"},{"f":"art35","fn":"35条書面(重要事項説明)","q":"専有部分の用途利用制限の定めがある時はその内容を説明しなければならない","a":true,"e":"正しい記述です。"},{"f":"art35","fn":"35条書面(重要事項説明)","q":"津波災害警戒区域内にある時はその旨を説明しなければならない","a":true,"e":"正しい記述です。"},{"f":"art35","fn":"35条書面(重要事項説明)","q":"重要事項を説明する際にはどこで行っても説明は良いとされてい。ます","a":false,"e":"誤りの記述です。"},{"f":"art35","fn":"35条書面(重要事項説明)","q":"調査不足のため事実と異なる内容を記載したものではなくても宅地建物取引違反となる","a":true,"e":"正しい記述です。"},{"f":"art35","fn":"35条書面(重要事項説明)","q":"有効期間が満了している宅建士は記名も説明も不可です","a":false,"e":"誤りの記述です。"},{"f":"art35","fn": できる","a":false,"e":"業務停止処分中の広告は不可となります"},{"f":"koukoku","fn":"広告・取引の規制","q":"の文場について建築確認が降りる前に建築確認申請中として新聞広告をした場合、に違反して50万円以下の罰金にさせられる。ことがある","a":false,"e":"指示処分を受けるが罰則の対象ではないです"},{"f":"koukoku","fn":"広告・取引の規制","q":"宅建業者は建築確認の済んだ建築工事前の建売り住宅の売主との間で当該住宅の売却の専任媒介契約を締結し媒介業務を行った","a":true,"e":"建築確認が積んでいる。ので特に問題ないです"},{"f":"koukoku","fn":"広告・取引の規制","q":"建業者は業務上取り扱った。ことについて知りた秘密に関し税務所の職員から質問検査権の規定に基づき質問を受けた時でも回答してはならない","a":false,"e":"正当な理由の場合、は回答しても大丈夫です"},{"f":"koukoku","fn":"広告・取引の規制","q":"建業者Aは賃貸物件の媒介の広告を行うにあたり存在しない低賃の物件の広告を出した。Aは業務定処分を受ける。ことがある","a":true,"e":"お取り広告をした場合、業務低処分の可能性があります"},{"f":"koukoku","fn":"広告・取引の規制","q":"建物の所有者と賃貸借計薬を締結し当該建物を自らが貸し主となって貸借転する。ための広告をする場合、においては自らが契約の当事者となって釈を成立させる旨を当該広告に明示しなくても規定に違反しない","a":true,"e":"自ら貸主貸借は宅建の対象外です"},{"f":"koukoku","fn":"広告・取引の規制","q":"宅地の販売に関する広告をインターネットで行った場合売買契約が成立した後も継続して広告を掲載してい。た場合当該広告を掲載し続ける。ことは規定に違反する","a":true,"e":"正しい記述です。"},{"f":"koukoku","fn":"広告・取引の規制","q":"建物の販売に際して利益を生ずる。ことが確実であると誤解させる的判断を提供する行為をしたが実際に売買契約の成立には至らなかった","a":false,"e":"断定的判断をした時点で違反です"},{"f":"koukoku","fn":"広告・取引の規制","q":"建物の貸借の媒介に際して賃借契約の申し込みをしたものがその撤開を申し出たが物件案内等に経費がかかった。ため預かり金を変換しなかった","a":false,"e":"預かり金は変換しないと違反です宅建"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"買主B宅建業者ではないは自ら指定したホテルのロビーで買受けの申し込みをしその際に宅建業者Aからクーリングオフについて何も告げられずその3日後Aのモデルルームで契約を締結した場合、Bは売買契約を解除する。ことができる","a":true,"e":"正しい記述です。"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"主B宅建業者ではないは自らの希望により勤務先で売買契約に関する説明を受けて外の申し込みをしその際に宅地建物取引業者からクーリングオフについて何も告げられずに契約を締結した。この場合、Bは当該契約の締結の日から8日を経過する。までは契約の解除をする。ことができる","a":false,"e":"勤務先での申し込みはクーリングオフ不可です"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"買主B宅建業者ではないはテト張りの案内所で買受けの申し込みをしその際に宅建業者からクーリングオフについて書面で告げられ契約を締結した。その5日後代金の全部を支払い翌日に宅地の引き渡しを受けた。この場合、Bは売買契約を解除する。ことができる","a":false,"e":"引き渡しを受け、代金全額を支払った後はクーリングオフ不可です"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"宅建業者でない買主は喫茶店でマンションの買い受けの申し込みをした場合、その5日後宅建業者の事務所で売買契約を締結した時であっても、クーリングオフによる契約の解除をする。ことができる","a":true,"e":"正しい記述です。"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"宅建業者は契約解除に伴う医薬金の定めがある場合、クーリングオフによる契約の解除が行われた時であっても、医薬金の支払いを請求する。ことができる","a":false,"e":"クーリングオフによる解除では違約金請求は不可です"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"宅建業者はクーリングオフによる契約の解除が行われた場合、受けの申し込みまたは売買契約の締結に際した手付け金その他の金銭の倍額を買主に召喚しなければならない","a":false,"e":"受け取った額を返せばよく、倍額を返す必要はありません"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"Cは喫茶店で買受けの申し込みをし、その際に宅建業者からクーリングオフについて何も告げられずに契約を締結した。Cは当該契約の締結後においては契約の解除をする。ことができる。","a":true,"e":"告知がなければいつまでも解除可能です"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"宅建業者Aが自ら売主として宅建業者でない買主Bと売買契約を締結した。Bは自らの申し出でBが融資を受ける銀行宅建業者ではないにおいて、宅地の買い受けの申し込み及びAとの売買契約の締結をした場合、クーリングオフによる当該売買契約の解除を行うことができない","a":false,"e":"銀行は事務所等に該当しない。ためクーリングオフ可能です"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"宅建業者Aがクーリングオフについて告げる時に交付すべき書面にはAの称号または名称及び住所並びに免許症番号の記載は必要であるが、Aの宅地建物取引士の期名は必要ない","a":true,"e":"正しい記述です。"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"告知書面にはクーリングによる買受けの申し込みの撤開または売買契約の解除があった時は宅建業者はその会受けの申し込みの撤開または売買契約の解除に伴う損害賠償または医薬金の支払いを請求する。ことができない。ことを記載しなければならない","a":true,"e":"正しい記述です。"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"建業者でない買主が行うクーリングオフは書面を発しなくても契約の解除をする。ことができる","a":false,"e":"クーリングオフは書面（または電磁的記録）で行う必要があります"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"クーリングオフによる解除は国土交通大臣が定める書式の書面を持って行わなければならない","a":false,"e":"特定の書式である必要はありません"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"建業者でない買主から電磁的方法で提供する。ことについての承諾を得た場合、クーリングオフについて電磁的方法で告げる。ことができる","a":false,"e":"電磁的方法で告げる。ことはできません"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"クーリングオフの告知書面には売主及び媒介を行う宅建業者の称号または名称及び住所並びに免許症番号を記載しなければならない","a":false,"e":"媒介業者の記載は不要です"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"宅建業者の事務所において、宅建業者でない買主から買受けの申し込みを受け売買契約を締結したが売主はクーリン合婦の適用はないと判断し空付について買主に告げる初面の交付は行わなかった","a":true,"e":"事務所での申し込みのためクーリングオフは適用外です"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"宅建業者Aが買主B宅建業者ではないから手付け金として1500万円を受領しようとする場合、において、建築工事前のマーションについてBへの所有権移転の登記がされた時はAは保全措置を講じなくても良い","a":true,"e":"登記がなされた場合、は保全措置不要です"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"建業者Aは宅建業者でない。Bとの間で建築工事前の建物を5000万円で販売する契約を締結し手付金等の補税措置を講じずに200万円を手付金として治療した。これは宅建に違反する","a":false,"e":"（バツ）になります未完成物件で代金の5%（250万円）以下のため保全措置不要です"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"建業者Aは宅建業者でない。Bとの間で建築工事が完了した建物を5000万円で販売する契約を締結し手付金等の保全措置を講じず当該建物の引き渡し前に700万円を手付け金として受領した。これは宅建に違反する","a":true,"e":"完成物件で代金の10%（500万円）を超えている。ため保全措置が必要です"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"建業者Aが自ら売り主として宅建業者ではない。Bとの間で建物の売買契約を締結する場合、AはあかじめBの承諾を書面で得た場合でも売買代金の額の2/10を超える額の手付けを受する。ことはできない","a":true,"e":"正しい記述です。"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"宅建業者は宅建業者である買主との間で建築工事が完了した建物を1億円で販売する契約を締結し手付け金等の保全措置を講じずに当該建物の引き渡し前に2500万円を手付け金として受領した","a":true,"e":"相手が宅建業者のため制限は適用されません"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"建業者Aが保全措置を講じずにBから手付金100万円を受領する場合、その旨を重要事項説明書に記載する必要があるが、37条面に記載する必要はない","a":true,"e":"正しい記述です。"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"建業者は工事完了前のマンション代金5000万円を売却するにあたり宅建業者でない買主から手付金500万円を受領したが手付金の保全措置を講ずる必要はないと判断し付け金保全措置の概要について重要事項説明書への記載は省略した","a":false,"e":"5%を超えている。ため保全措置が必要であり、省略は不可です"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"愛の所有する宅地について宅建業者は愛と停止条件付きで取得する売買契約を締結しその条件がする前に当該物件について税と売買契約を締結した","a":false,"e":"自己の所有に属しない宅地建物の売買は、停止条件付き契約では不可です"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"宅建業者Aは宅建業者でないカヌCとの間でカップ販売の契約を締結したがCが不払い金の支払いを遅延した社は20日の期間を定めて書面にて支払いを再告したがCがその期間内に不払い金を支払わなかった。ため契約を解除した","a":false,"e":"30日以上の期間を定めて書面で催告する必要があります"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"宅建業者が建物のカップ販売を行った場合、建物を買主に引き渡しかつ代金の額の3/10を超える額の支払いを受けた後は担保の目的で当該建物を譲り受けてはならない","a":true,"e":"正しい記述です。"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"険業者が買主との間で売主は売買物件の引き渡しの日から1年間に限り当該物件の種類または品質に関して契約の内容に適合しない場合、における。その不適合を担保する責任を負うとする旨の特約を設ける。ことができる","a":false,"e":"引き渡しの日から2年以上とする特約を除き、民法より不利な特約は無効です"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"建業者Aが契約締結時に手付金として500万円をB宅建業者ではないから受領している場合、Bが契約の履行に着手してい。ない時AはBに500万円を現実に提供すれば当該売買契約を解除する。ことができる","a":false,"e":"売主からは手付金の倍額（1000万円）を償還する必要があります"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"2500万円の宅地について宅建業者が売買契約の締結を行い損害賠償の額の予定及び利金の定めをする場合、その合計額を500万円と設計する。ことができる","a":true,"e":"代金の20%（500万円）以下のため可能です"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"宅建業者A社が自ら売り主としてマンション代金3000万円の売買契約に関し宅建業者でないカ主シとの売買契約の締結をした当事者の債務振を理由とする契約改図に伴う損害賠償の予定額900万円を定めたが医薬金については、全て無効である","a":false,"e":"20%（600万円）を超える部分のみが無効となります"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"宅建業者Aは宅建業者である買主B社との間で3000万円の宅地の売買契約を締結した。B社の債務振行を理由とする契約解除を行い契約者の医薬金の定めに基づきB社から1000万円の医薬金を受け取った。これは宅建業法に違反する","a":false,"e":"（お答えは「に」になってい。ますが、解説からバツ）になります相手が宅建業者のため違反しません宅建を"},{"f":"houshu","fn":"報酬に関する制限","q":"代理の依頼を受け代金3000万円で売買契約を成立させ、報酬として126万円を受領した","a":true,"e":"計算式：3000万*3%+6万=96万。代理は2倍の192万(税別)、税込211.2万以内のため適法です"},{"f":"houshu","fn":"報酬に関する制限","q":"媒介の依頼を受け代金1000万円で売買契約を成立させ、報酬30万円の他に広告に用した実費10万円を受領した","a":true,"e":"実費は依頼者の依頼によるものは受領可能です"},{"f":"houshu","fn":"報酬に関する制限","q":"建物の対策の媒介契約を締結しB及びCからそれぞれ建物の仮の1ヶ月分ずつを治療した","a":false,"e":"合計で1ヶ月分（税込1.1ヶ月分）を超える。ことはできません"},{"f":"houshu","fn":"報酬に関する制限","q":"居住用建物以外の建物の貸借の媒介で権利金の知事がある時、いずれか低い方の額を上限としなければならない","a":false,"e":"いずれか高い方の額を上限とする。ことができます"},{"f":"houshu","fn":"報酬に関する制限","q":"居住用以外の建物の貸借でAが受ける報酬の合計は依頼者の双法からどのような割合で報酬を受けてもよく。また、一方、のみから受ける。こともできる","a":true,"e":"正しい記述です。"},{"f":"houshu","fn":"報酬に関する制限","q":"あかじめ報酬の額を定めてい。なかった時は依頼者は宅建業者に対し報酬の限度額を報酬として支払わなければならない","a":false,"e":"限度額がそのまま報酬額になるわけではありません"},{"f":"houshu","fn":"報酬に関する制限","q":"宅地代金200万円の売買の代理につき売主Bに対して、説明し合意をしてい。た場合、には66万円を上限として報酬を受領する。ことができる","a":true,"e":"低廉な空き家等の売買の特例（上限30万、代理は2倍の60万、税込66万）が適用されます"},{"f":"houshu","fn":"報酬に関する制限","q":"相手方が行意で支払う借金はこの限度額とは別に受領する。ことができる","a":false,"e":"いかなる名目でも限度額を超えて受け取る。ことはできません"},{"f":"houshu","fn":"報酬に関する制限","q":"不当の工額の報酬を要求した場合、例え受領してい。なくても宅地建物取引違反となる","a":true,"e":"正しい記述です。"},{"f":"houshu","fn":"報酬に関する制限","q":"居住用建物の双報から媒介の依頼を受けるにあたって借主から承諾を得てい。なければ借主から仮ちの1.1ヶ月分の報酬を受領する。ことはできない","a":true,"e":"承諾がなければ0.55ヶ月分が上限です"},{"f":"houshu","fn":"報酬に関する制限","q":"買主から報酬をその限度額まで受領できる他に重要事項の説明を行った耐火として報酬を受領する。ことができる","a":false,"e":"誤りの記述です。"},{"f":"houshu","fn":"報酬に関する制限","q":"科学の査程に用した費用をBに請求する。ことはできない","a":true,"e":"正しい記述です。"},{"f":"houshu","fn":"報酬に関する制限","q":"建物を居住用として貸借する場合、保証金が全額変換される呪がある時報酬の限度額の合計は11万円である","a":false,"e":"居住用では保証金を売買代金とみなす規定は適用されず、借賃基準となります"},{"f":"houshu","fn":"報酬に関する制限","q":"代金900万円の売買で低廉な空き家等の特例を適用して上限を超えて報酬を受け取る。ことができる","a":false,"e":"特例は800万円以下の物件にのみ適用され 必要）。"},{"f":"nouchi","fn":"農地法","q":"農業者が自らの農業の事業のための畜舎を建設する目的で市街化調整区域内にある150m（1.5アール）の農地を購入する場合、は5条の許可を受ける必要がある","a":true,"e":"自己転用（4条）の場合は農業用施設（2アール未満）なら不要ですが、購入して転用する「5条」の場合は面積にかかわらず許可が必要です。"},{"f":"nouchi","fn":"農地法","q":"競売により市街化調整区域内にある農地を取得する場合、は3条または5条の許可を受ける必要はない","a":false,"e":"競売であっても農地法上の許可（3条または5条）が必要です。"},{"f":"nouchi","fn":"農地法","q":"相続人に該当しないものに対する特定遺贈により農地を取得する場合、3条の許可を受ける必要はない","a":false,"e":"相続人以外の特定遺贈の場合、は、3条許可が必要です。"},{"f":"nouchi","fn":"農地法","q":"農業者が相続により取得した市街化調整区域内の農地を自己の住宅用地として転用する場合、でも4条の許可を受ける必要がある","a":true,"e":"4条の自己転用には許可が必要です。"},{"f":"nouchi","fn":"農地法","q":"住宅を建設する目的で市街化区域内の農地の所有権を取得するにあたってあらかじめ農業委員会に届出た場合、は5条の許可を受ける必要はない","a":true,"e":"市街化区域内の特例（5条）として、あらかじめ届出すれば許可不要です。"},{"f":"nouchi","fn":"農地法","q":"法人の代表者がその法人の業務に関し第4条または5条の規定に違反して農地の転用を行った場合、にはその代表者が罰せられる他その法人も300万円以下の罰金が課せられる","a":false,"e":"法人に対する罰金刑は最高1億円（1億円以下の罰金）です。"},{"f":"nouchi","fn":"農地法","q":"耕作目的で原野を農地に転用（造成）しようとする場合、4条の許可は不要である","a":true,"e":"農地を農地以外にする。のが転用（4条）です。原野を農地にする場合、は許可不要です。"},{"f":"nouchi","fn":"農地法","q":"市街各区域内にある農地を取得して住宅を建設する場合、は工事完了後遅滞なく農業委員会に届出れば5条の許可を受ける必要はない","a":false,"e":"工事完了後ではなく、「あらかじめ」届出が必要です。"},{"f":"nouchi","fn":"農地法","q":"都道府県知事等は5条の許可を要する農地取得について許可を受けずに農地の転用を行ったものに対して、必要な限度において、現状回復を命ずる。ことができる","a":true,"e":"現状回復を命ずる。ことができます。"},{"f":"nouchi","fn":"農地法","q":"競売により農地の所有権を取得する場合、農地法の許可を受ける必要がある","a":true,"e":"競売でも許可が必要です。"},{"f":"nouchi","fn":"農地法","q":"農地所有適格法人の要件を満た。してい。ない株式会社は耕作目的で農地を借り入れる。ことはできない","a":false,"e":"所有はできませんが、一定の要件を満たせば賃借（借り入れ）は可能です。"},{"f":"nouchi","fn":"農地法","q":"社会福祉事業を行うことを目的として設立された法人が農地をその目的にかかる業務の運営に必要な施設のように供すると認められる場合、農地所有適格法人でなくても農業委員会の許可を得て農地の所有権を取得する。ことができる","a":true,"e":"例外として所有権を取得できる場合、があります。"},{"f":"nouchi","fn":"農地法","q":"国または都道府県等が市街化調整区域内の農地を取得して学校を建設する場合、都道府県知事等との協議が成立したら5条の許可を受ける必要はない","a":true,"e":"国・都道府県が学校等のために取得する場合、協議成立により許可不要です。"},{"f":"nouchi","fn":"農地法","q":"市街化区域内において、2ヘクタールの農地を住宅建設のために取得するものは5条の都道府県知事等の許可を受けなければならない","a":false,"e":"市街化区域内である。ため、面積にかかわらず「あらかじめ届出」をすれば許可不要です。"},{"f":"takuzo","fn":"盛土規制法","q":"宅地造成等工事規制区域内において、行われる盛土であって当該盛土する土地の面積が300㎡でかつ高さ1.5mの崖を生ずる。こととなるものに関する工事は一定の場合、を除き都道府県知事の許可が必要である","a":true,"e":"盛土の場合は、高さ1m超の崖、または面積500㎡超の場合に許可が必要です。今回は高さ1.5mの崖を生じる。ため、許可が必要です。"},{"f":"takuzo","fn":"盛土規制法","q":"宅地造成等工事規制区域内において、森林を宅地にする。ために行う盛土・切土で高さ3mの崖を生ずる工事を行う場合、工事主は工事に着手する前に都道府県知事の許可を受けなければならない","a":true,"e":"切土の場合、は、高さ2m超の崖、または面積500㎡超で許可が必要です。今回は高さ3mの崖を生じる。ため、許可が必要です。"},{"f":"takuzo","fn":"盛土規制法","q":"宅地造成等工事規制区域内において、宅地造成等に関する工事を行う場合、宅地造成等に伴う災害を防止する。ために行う高さ4mの擁壁の設置にかかる工事については、政令で定める資格を有するものの、設計によらなければならない","a":false,"e":"有資格者の設計が必要な。のは、高さ5m超の擁壁の設置、または1500㎡超の土地の排水施設の設置です。今回は高さ4mである。ため不要です。"},{"f":"takuzo","fn":"盛土規制法","q":"都道府県知事は宅地造成特定盛土等または土石の体積に伴う災害の防止に関する基本的な方針（基本方針）を定めなければならない","a":false,"e":"基本方針を定める。のは都道府件知事ではなく、主務大臣（国土交通大臣等）です。"},{"f":"takuzo","fn":"盛土規制法","q":"都道府県知事は工事の許可の申請があった場合、遅滞なく許可または不許可の処分をしなければならず許可の処分をした時は許可書を交付し不許可の処分をした時は文書を持ってその旨を通知しなければならない","a":true,"e":"正しい説明です。"},{"f":"takuzo","fn":"盛土規制法","q":"工事等に関する工事の許可を受けたものが施工管理者を変更する場合、には遅滞なく。その旨を都道府県知事に届出ればよく改めて許可を受ける必要はない","a":true,"e":"施工管理者の変更は軽微な変更に該当する。ため、届出で足ります。"},{"f":"takuzo","fn":"盛土規制法","q":"工事主は宅地造成等工事規制区域内において、行われる宅地造成等に関する工事の許可の申請をする時はあらかじめ土地の周辺地域の住民に対し説明会の開催その他の工事の内容を周知させる。ため必要な措置を講じなければならない","a":true,"e":"周辺住民への説明会開催等の周知措置が必要です。"},{"f":"takuzo","fn":"盛土規制法","q":"宅地または農地等において、行う土石の堆積で政令で定める規模のものであっても、一定期間の経過後に当該土石を除却しないものは土石の堆積に該当しないが、動画等の正誤上、文脈を確認すると除却しないものは「堆積」に該当する。ため、文言によってバツとなります。た。だ。し、動画で「丸」とされている場合は「丸」にします。念のため動画内容を確認：動画では「該当しない。","a":true,"e":"。除却しないものは土石の堆積に該当しない」とされている。ため、ソース通りに丸とします。※実際は、盛土規制法において、一時的でない堆積は「盛土等」に分類される。などの理由で、講義独自の解説に合わせます）"},{"f":"takuzo","fn":"盛土規制法","q":"宅地造成等工事規制区域内の土地において、高さが3mの擁壁の除却工事を行う場合、あらかじめ都道府県知事に届出なければならず届出の期限は工事に着手する日の前日までとされている","a":false,"e":"擁壁の除却工事は「工事に着手する日の14日前まで」に届出が必要です。"},{"f":"takuzo","fn":"盛土規制法","q":"宅地造成等工事規制区域の指定の際に当該区域内において、宅地造成等に関する工事を行っているものは当該工事について都道府県知事の許可を受ける必要はない","a":true,"e":"指定の際、既に工事を行っている者は許可を受ける必要はありませんが、指定の日から21日以内に知事への届出が必要です。"},{"f":"takuzo","fn":"盛土規制法","q":"都道府県知事は基礎調査のため測量または調査を行う必要がある場合、その必要な限度において、他人の土地に立ち入りまたはその命じた者に立ち入らせる。ことができる","a":true,"e":"立ち入り調査が可能です。"},{"f":"takuzo","fn":"盛土規制法","q":"宅地造成等工事規制区域内において、キリ戸であって当該切り道する土地の面積が400mでかつ高さ1mの崖を生ずる工事を行う場合、都道府県知事の許可を受けなければならない","a":false,"e":"切土は面積500㎡超、または高さ2m超で許可が必要です。今回はどちらも満た。してい。ない。ため不要です。"},{"f":"takuzo","fn":"盛土規制法","q":"都道府県知事は偽りその他不正の手段によって許可を受けたものに対して、その許可を取り消す。ことができる","a":true,"e":"許可の取消が可能です。"},{"f":"takuzo","fn":"盛土規制法","q":"工事の許可を受けた工事主は工事計画を記載した標識を掲げなければならない","a":true,"e":"標識の掲示義務があります。"},{"f":"takuzo","fn":"盛土規制法","q":"宅地造成等工事規制区域内において、公共施設用地を宅地または農地等に転用しようとするものはその転用の日までにその旨を都道府県知事に届出なければならない","a":false,"e":"転用した日から14日以内に届出が必要です。"},{"f":"takuzo","fn":"盛土規制法","q":"宅地造成等工事規制区域内において、行われる宅地造成等に関する工事は擁壁・排水施設の設置など災害を防止する。ため必要な措置が講ぜられたものでなければならない","a":true,"e":"技術的基準に適合する必要があります。"},{"f":"takuzo","fn":"盛土規制法","q":"宅地造成等工事規制区域内において、行われる工事について許可をする都道府県知事は災害を防止する。ため必要な条件をつける。ことができる","a":true,"e":"許可に条件を付す。ことができます。"},{"f":"takuzo","fn":"盛土規制法","q":"宅地造成等工事規制区域内の土地の工事主や工事施工者は災害が生じないようその土地を常時安全な状態に維持するよう努めなければならない","a":false,"e":"常時安全維持義務を負うのは、「所有者、管理者、または占有者」です。工事主や工事施工者ではありません。"},{"f":"takuzo","fn":"盛土規制法","q":"特定盛土等規制区域内において、行われる特定盛土等に関する工事については、工事主は当該工事に着手する日の30日前までに当該工事の計画を都道府県知事に届出なければならない","a":true,"e":"特定盛土等規制区域内では、着手の30日前までに届出が必要です。"},{"f":"takuzo","fn":"盛土規制法","q":"都道府県知事は造成宅地防災区域内で災害が生ずる恐れが大きい土地の区域を宅地造成等工事規制区域と重ねて指定する。ことができる","a":false,"e":"宅地造成等工事規制区域と造成宅地防災区域は、重複して指定する。ことはできません。"},{"f":"kukaku","fn":"土地区画整理法","q":"区画整理事業の施行者は換地処分を行う前において、換地計画に基づき換地処分を行うため必要がある場合、においては施行地区内の宅地について仮換地を指定する。ことができる","a":true,"e":"仮換地の指定は可能です。"},{"f":"kukaku","fn":"土地区画整理法","q":"仮換地が指定された場合、においては従前の宅地について使用しまたは収益する。ことができるものは仮換地の指定の効力発生の日から換地処分の広告がある日まで仮換地を使用または収益する。ことができる","a":true,"e":"従前の宅地を使用・収益できる者は、仮換地を使用・収益できます。"},{"f":"kukaku","fn":"土地区画整理法","q":"組合を設立しようとするものは事業計画の決定に先立って組合を設立する必要があると認める場合、7人以上で共同して定款及び事業基本方針を定めその組合の設立について都道府県知事の認可を受ける。ことができる","a":true,"e":"7人以上で定款等を作成し、知事の認可を受けます。"},{"f":"kukaku","fn":"土地区画整理法","q":"土地区画整理組合が施行者である時は換地計画について都道府県知事及び市町村長の認可を受けなければならない","a":false,"e":"都道府県知事の認可のみでよく、市町村長の認カは不要です。"},{"f":"kukaku","fn":"土地区画整理法","q":"換地処分の広告があった場合、換地計画において、定められた換地はその広告があった日の翌日から従前の宅地と見なされ換地計画において、換地を定めなかった従前の宅地について存する権利はその広告があった日が終了した時において、消滅する","a":true,"e":"正しい説明です。"},{"f":"kukaku","fn":"土地区画整理法","q":"土地区画整理組合は事業の完成により解散しようとする場合、都道府県知事の認可を受けなければならない","a":true,"e":"解散には都道府県知事の認可が必要です。"},{"f":"kukaku","fn":"土地区画整理法","q":"仮換地の指定を受けた場合、その処分により使用しまたは収益する。ことができるものの、なく。なった従前の宅地は使用収益する。ことができるものの、なく。なった時から換地処分の広告がある日までは施行者が管理する","a":true,"e":"施行者が管理する。こととなります。"},{"f":"kukaku","fn":"土地区画整理法","q":"土地区画整理組合が施行地区内の宅地について仮換地を指定する場合、あらかじめ土地区画整理審議会の意見を聞かなければならない","a":false,"e":"土地区画整理組合が施行者の場合は「総会の同意（または総代会の同意）」が必要です。「土地区画整理審議会」は公的施行の場合に設置・意見聴取されます。"},{"f":"kukaku","fn":"土地区画整理法","q":"従前の宅地の所有者及び使用収益権を有するものが仮換地について使用または収益を開始する。ことができる日を別に定められた。ため従前の宅地について使用も収益もできなく。なった。ことにより損失を受けた場合、においては施行者はその損失を通常生ずべき範囲で補償しなければならない","a":true,"e":"施行者が損失を補償しなければなりません。"},{"f":"kukaku","fn":"土地区画整理法","q":"宅地について所有権または借地権を有するものが設立する土地区画整理組合は土地区画整理事業を施行する。ことができる","a":true,"e":"所有者や借地権者が組合を設立して施行する。ことができます。"},{"f":"kukaku","fn":"土地区画整理法","q":"定款、規約、規程または議決に別段の定めがある場合、事業の工事が完了する以前においても換地処分をする。ことができる","a":true,"e":"原則として工事完了後ですが、別段の定めがある場合は完了前でも換地処分が可能です。"},{"f":"kukaku","fn":"土地区画整理法","q":"組合設立の認可の広告があった日から換地処分の広告がある日までは施行地区内において、建築物の建築、土地の形質の変更等を行おうとするものは土地区画整理組合の許可を受けなければならない","a":false,"e":"組合の許可ではなく、都道府県知事等の許可が必要です。"},{"f":"kukaku","fn":"土地区画整理法","q":"土地区画整理事業の施行者は仮換地を指定した場合、において、必要があると認める時は仮清算金を徴収しまたは交付する。ことができる","a":true,"e":"仮清算金の徴収・交付が可能です。"},{"f":"kukaku","fn":"土地区画整理法","q":"施行者は仮換地を指定しようとする場合、において、あらかじめその指定について従前の宅地の所有者の同意を得なければならないが仮換地となるべき宅地の所有者の同意を得る必要はない","a":false,"e":"従前の宅地の所有者等の同意も、仮換地となるべき土地の所有者等の同意も、原則として不要です。た。だ。し、仮換地指定において、事前に特定のプロセスを経る必要があります。いずれにせよ「同意が必要」という部分、または「片方の同意は不要」という対比が誤りとなります（組合施行の場合は、あらかじめ総会の同意が必要ですが、個々の所有者の同意は原則不要です）。"},{"f":"kukaku","fn":"土地区画整理法","q":"土地区画整理組合は総会の議決により解散しようとする場合、において、その解散について都道府県知事の認可を受けなければならない","a":true,"e":"解散の議決には知事の認可が必要です。"},{"f":"kukaku","fn":"土地区画整理法","q":"土地区画整理組合が施行する土地区画整理事業にかかる施行地区内の宅地について所有権または借地権を有するものはすべてその組合の組合員とする","a":true,"e":"施行地区内のすべての宅地所有者・借地権者が組合員になります（強制加入）。"},{"f":"kukaku","fn":"土地区画整理法","q":"土地区画整理組合は土地区画整理事業について都市計画で定められた施行区域において、土地区画整理事業を施行する。ことはできない","a":false,"e":"都市計画で定められた施行区域であっても、組合が施行する。ことは可能です。"},{"f":"kukaku","fn":"土地区画整理法","q":"仮換地が指定された場合、でも従前の宅地を使用する。ことができる者は換地処分の広告がある日までの間従前の宅地を使用する。ことができる","a":false,"e":"仮換地が指定されると、従前の宅地を使用・収益する権利は停止し、仮換地についてのみ使用・収益できます。"},{"f":"kukaku","fn":"土地区画整理法","q":"土地区画整理組合が施行する土地区画整理事業の換地計画において、土地区画整理事業の施行の費用に当てる。ため一定の土地を換地として定めないで保留地として定める。ことができる","a":true,"e":"保留地を定める。ことができます。"},{"f":"kukaku","fn":"土地区画整理法","q":"換地処分は施行者が換地計画において、定められた関係時効を広告して行うものとする","a":false,"e":"広告で行うのではなく、関係権利者への「通知」によって行い。ます（広告は、すべての通知完了後に都道府県知事等が行い。ます）。"}];
const KQ=[{"f":"seigen","fn":"制限行為能力者","q":"成年被後見人が行った法律行為は事理を弁識する能力がある状態で行われたものであっても、取り消す。ことができる。た。だ。し日用品の購入その他日常生活に関する行為については、この限りではない","a":true,"e":"原則取り消す。ことができますが例外として日用品の購入は取り消し不可となってい。ます"},{"f":"seigen","fn":"制限行為能力者","q":"被保佐人が保佐人の同意またはこれに変わる家庭裁判所の許可を得ないでした土地の売却は被保佐人が行為能力者である。ことを相手方に信じさせる。ため術を用い。た時であっても、取り消す。ことができる","a":false,"e":"詐術の場合、取り消しは不可となってい。ます"},{"f":"seigen","fn":"制限行為能力者","q":"成年後見人が成年被後見人に変わって成年被後見人が居住している建物を売却する。ためには家庭裁判所の許可が必要である","a":true,"e":"居住用の建物を売却するというのは生活の基盤のためこの場合、家庭裁判所の許可が必要となってい。ます"},{"f":"seigen","fn":"制限行為能力者","q":"の仕入れ・販売に関する営業を許された未成年者は法定代理人の同様内で事故が居住する。ために建物を第3者から購入したとしてもその法定代理人は当該売買契約を取り消す。ことができない","a":false,"e":"ぎの仕入れ・販売は法定代理人から営業を許可されてい。ますす。なわち法定代理人からの同揺を得なくても行うことができるとされてい。ます。た。だ。し居住ための建物を購入する行為これはその営業に関するものではない。ので法定代理人は当該契約を取り消す。ことができるとされてい。ます"},{"f":"seigen","fn":"制限行為能力者","q":"補助人が法律行為を行うためには常に補助人の同意が必要である","a":false,"e":"この場合、常に同意が必要なわけではないとされてい。ます"},{"f":"seigen","fn":"制限行為能力者","q":"営業を許された未成年者がその営業に関し意思能力を有しなかった場合、その法律行為は無効である","a":true,"e":"この場合、1能力がない。無効となります"},{"f":"seigen","fn":"制限行為能力者","q":"成年後見人は貢献監督人がいる場合、には貢献監督人の同意を得なければ成年被後見人の法律行為を取り消す。ことができない","a":false,"e":"貢献監督人の同意がなくても取り消しできるとされてい。ます"},{"f":"seigen","fn":"制限行為能力者","q":"成年年齢は18歳である。ため18歳のものは年齢を理由とする後見人の計画自由に該当しない","a":true,"e":"青年年齢は18歳のため20歳としないよう注意が必要です"},{"f":"seigen","fn":"制限行為能力者","q":"成年後見人は家庭裁判所が選任するものであるが、未成年後見人は必ずしも家庭裁判所が選任するものとは限らない","a":true,"e":"成年後見人は家庭裁判所が選任しますが未ベスト後見人は必ずしも家庭裁判所が選任するとは限りません"},{"f":"seigen","fn":"制限行為能力者","q":"成年後見人が成年被後見人を代理して成年被後見人が所有するオフィスビルへの第3者の抵当の設定は家庭裁判所の許可を得なければならない","a":false,"e":"この場合、家庭裁判所の許可は不要となってい。ます"},{"f":"seigen","fn":"制限行為能力者","q":"土地を売却すると土地の管理義務を免がれる。ことになる。ので未成年者が土地を売却するにあたってはその法定代理人の同意は必要ない","a":false,"e":"この場合、土地の所有権を失う。義務がなく。なるというわけではない。ので法定代理人の同意が必要となってい。ます"},{"f":"seigen","fn":"制限行為能力者","q":"未成年後見人は自ら貢献する未成年者について貢献開始の審判を請求する。ことはできない","a":false,"e":"この場合、請求する。ことは可能とされてい。ます"},{"f":"seigen","fn":"制限行為能力者","q":"の放棄は相手方のない単独行為であるから成年後見人が成年被後見人に変わってこれを行うと利益相反行為となる","a":true,"e":"相続の放棄をすると例えば、この親が子供の放棄をした場合、自分の取り分を増やそうとできる。のでこの場合利益相反行為となります"},{"f":"seigen","fn":"制限行為能力者","q":"売買契約につき取消しがなされない。ままAが成年に達した場合、本件売買契約について法定代理人Bが反対しても自らが取り消し権を有すると知った。Aは本件売買契約を追認する。ことができは本件売買契約を取り消す。ことはできなく。なる","a":true,"e":"aは追認する。ことが可能でまた、追認後は取り消し不可となってい。ます"},{"f":"seigen","fn":"制限行為能力者","q":"意思能力を有しない時に行った不動産の売買契約は貢献開始の審判を受けているか否かに関わらず効力を有しない","a":true,"e":"この場合、意思能力を有しない。効力も有内とされてい。ます"},{"f":"seigen","fn":"制限行為能力者","q":"成年後見人が成年被後見人を代理して成年被後見人が所有する成年被後見人の居住のように共する建物への第3者の抵当の設定を行う場合、家庭裁判所の許可を得なければならない","a":true,"e":"定年費人の居住のように共る建物や敷地を抵当の設定処分売却賃貸や賃貸借の解除これらをする場合、は家庭裁判所の許可が必要となってい。ます。抵当権の設定な。ので今回は許可が必要となってい。ます"},{"f":"seigen","fn":"制限行為能力者","q":"成年後見人が成年被後見人を代理して成年被後見人が所有する図者の第3者への売却を行う場合、家庭裁判所の許可を得なければならない","a":false,"e":"この場合、家庭裁判所の許可は不要となってい。ます"},{"f":"seigen","fn":"制限行為能力者","q":"19歳のものは未成年である。ので携帯電話サービスの契約や不動産の賃貸借契約薬を1人で締結する。ことはできない","a":false,"e":"19歳は青年者な。ので可能となってい。ます"},{"f":"seigen","fn":"制限行為能力者","q":"成年被後見人が第3との間で建物の増与を受ける契約をした場合、成年後見人は当該法律行為を取り消す。ことができない","a":false,"e":"この場合、取消しは可能となってい。ます"},{"f":"seigen","fn":"制限行為能力者","q":"成年被後見人は契約の際完全な意思能力を有していても契約を取り消す。ことができる","a":true,"e":"成年被後見人は契約の取り消しが可能となってい。ます"},{"f":"ishi","fn":"意思表示","q":"a所有の甲土地につきAとBとの間で売買契約が締結されBは第3者である。Cから騙されて売買契約を締結した場合、AがCによる詐欺の事実を知ってい。たとしてもBは詐欺を理由に取り消す。ことはできない","a":false,"e":"意思表示は必ず図を書くようにしましょう最初は誰が誰に騙されたか誰と契約したかAとBで契約をします。そしてBは第3者である。Cこの人から騙されたとします。そしてこの場合AがCによる詐欺の事実を知ってい。た。Aは悪意ということになります。の場合Cの詐欺Aが善意無質の時は取り消し不可となりますがAが悪意有過失の場合取り消しは可能となります今回はAが悪意の場合Bは取り消し不可とある。のでこれが不適切ということになります最初は本当に意味わからないと思うんんです"},{"f":"ishi","fn":"意思表示","q":"A所有の土地をAB間で売買契約を締結した時AがCの詐欺によってBとの間で売買契約を締結した場合、Cの詐欺をBが知っているか否かに関わらずAは売買契約を取り消す。ことはできない","a":false,"e":"求めていくとAB間で契約を結んだ表そしてCの詐欺をBが知っているか否かに関わらず。問題を見ていくとCの詐欺をBが善意無過失の時はAは取り消し不可でBが悪意有下室の場合はAは取り消し可能となってい。ます。Cの詐欺をBが知っているか否かに関わらず取り消しはできないとありますが、これが不適切になります善意無質の時はAは取り消し不可ですが悪意有過失の場合は取り消し可能となってい。ます"},{"f":"ishi","fn":"意思表示","q":"A所有の土地をAB間で売買契約を締結しAがCの脅迫にによりBとの間で売買契約を締結した場合、Cの脅迫をBが知らなければAは売買契約を取り消す。ことができない","a":false,"e":"AB間で契約を結んだ。AはCから脅迫されてい。ますが脅迫の場合はたとえBが善意無過失であっても、Aは取り消し可能となってい。ますさすがに詐欺だったら騙された方もちょっと悪いけど脅迫の場合はさすがにかわい。そう。Bが善意無過失でも取り消しは可能となってい。ます。ここは詐欺と比較が頻出論点です。しっかりと押えておきましょう"},{"f":"ishi","fn":"意思表示","q":"Aはその所有する後を譲渡する意思がない。のにBと通房してAを売り主Bを買主とする甲土地の仮想の売買契約を締結した。たちがBから悪意のCへCから善意のDへと譲渡された場合、AはAB間の売買契約の無効をDに主張する。ことができない","a":true,"e":"今度はAとBがグの場合、そしてBからC悪意そしてD善意に移ったになります問題文からこれは通房虚偽表示ということが分かります。dは通房虚偽表示の全位の第3者。AはAB間の売買契約の無効をDに主張する。ことができないとなってい。ます。結果としてこの土地はDのもの"},{"f":"ishi","fn":"意思表示","q":"A所有の甲土地につきAとBとの間で売買契約が締結されBは甲土地は将来地下が高騰すると勝手に思い込んで売買契約を締結したが実際には高騰しなかった場合、動機の錯誤を理由に本件売買契約を取り消す。ことができる","a":false,"e":"AとBで契約を結んでBはこの将来地価が高騰すると考えてい。たとします。その場合今回は錯誤ということがわかります錯誤の場合原則要素の錯誤による一定の錯誤は取り消し可能ですが例外として表異者に重化質があった場合次を除き取り消し不可となってい。ます1つ目相手方が表異者に錯誤がある。ことを知りまたは重によって知らなかった時2つ目相手方が表異者と同一の錯誤に陥ってい。た時この場合は取り消し不可となってい。ます今回は勝手に思い込んで取り消す。ことができるとありますが、この場合は取り消し不可となります表意者に重化質があったということになる。ので取り消しはできないといった形になります覚悟の問題を解く時はしっかりと要件を確認します"},{"f":"ishi","fn":"意思表示","q":"AがBの詐欺行為によりA所有の建物をCに売却する契約をした。aがCに所有権移転登記を済ませがAに代金を関賽した後詐欺による有効な取り消しがなされた時登記の抹消と代金の変換は同時利行の関係になる","a":true,"e":"詐欺による取り消しの場合、当事者双法の現状回復義務は同時履行の関係になるとされてい。ます"},{"f":"ishi","fn":"意思表示","q":"意者が真意でない。ことを知ってした意思表示は無効であるが、相手方がその意思表示が表意者の真意ではない。ことを知らなければ知らない。ことにつき過失があっても当該意思表示は有効となる","a":false,"e":"問題文から心理流法ということが起こります心理流法は原則有効ですが例外として以下の場合無効となります1つ目相手方が悪意2つ目相手方が全有過失の場合。今回は知らない。ことにつき過失がある。2つ目の全質となります。そして1分目の意思表示は無効とありますが、原則有効となります。そして知らない。ことにつき過失す。なわち全有質の場合は意思表示は有効ではなく無効となります。な。のでこの問題は2つ間違いがある。必ずどっちかだけで満足する。のではなく2つ間違いを確認できるようにしておきましょう"},{"f":"ishi","fn":"意思表示","q":"AがBの行為によってA所有の建物をCに売却する契約をした場合、Aは詐欺に気がついてい。たが契約に基づきEを止める。ことなく所有権移転登記手続きをし代金を請求してい。た場合詐欺による取り消しをする。ことはできない","a":true,"e":"今回は所有権移転登期手続きと大機を請求した。これをしていると追認に当たります。な。ので追認後の取り消しは不可。詐欺による取り消しをする。ことはできないとされてい。ます"},{"f":"ishi","fn":"意思表示","q":"Aが再権者の差し押えを免がれる。ためBと通房してA所有値をBに仮想とする契約をした。bがAから所有権移転登記を受けてい。た場合、でもAはBに対して、AB間の契約の無効を主張する。ことができる","a":true,"e":"今回はAとBがグるとなってい。ます。この場合、通房虚偽表示は原則登記があっても無効となります。な。のでAはBに対し無効を主張する。ことができるとされてい。ます"},{"f":"ishi","fn":"意思表示","q":"AがBの詐欺行為によってA所有の建物をCに売却する契約をした場合、AはBが同行為をした。ことをCが知りまたは知る。ことができた時でないと売買契約の取り消しをする。ことができない","a":true,"e":"Cが悪意または有過失の場合この場合Bの詐欺をCが善意無過失であれば取り消し不可ですがCが悪意有過失の場合は取り消し可能となってい。ます。Cが知りまたは知る。ことができた時悪意有過失の時でないと取り消しをする。ことができない適切な選択肢となってい。ます言っってる。ことはちょっと難しいんですが、落ち着いて解けば必ず解けるような問題な。ので定数をここでしっかりと取っていきます"},{"f":"ishi","fn":"意思表示","q":"第3者の脅迫による意思表示は脅迫を相手方が知ってい。たかどうかに関わらず取り消し可能である","a":true,"e":"脅迫の場合、は相手方が善意無質であっても、取り消し可能となってい。ます"},{"f":"ishi","fn":"意思表示","q":"Aが第3者の詐欺によってBに土地を売却しその後BがDに地を転売した場合、Bが第3者の詐欺の事実を知らずかつ知る。ことができなかったとしてもDが第3者の詐欺の事実を知っていればAは詐欺を理由にAB間の売買契約を取り消す。ことができる","a":false,"e":"問題文が字を書きましょうaがBにこたちを売却そしてBがその後Dにこたちを転売。下の図のようになります。そしてBこの真ん中の人が第3者の詐欺の事実を知らず。これは善意そして知る。ことができなかった。無失な。のでBは善意無過失となります。dが第3者の詐欺の事実を知っていれば。Dは悪意の場合になります。まとめるとBが善意無過失そしてDが悪意の場合この場合どうなるかというのを考えます問題文だとAは取り消す。ことができるとありますが、1度善意のこのBを挟んでいる。ので例えDが悪意であったとしてもこのBが善意無過失す。なわち善意を挟んでいる。ので取り消しは不可となってい。ます"},{"f":"ishi","fn":"意思表示","q":"Aが強制執行を逃れる。ために実際には売り渡す意思はない。のにBと通じて売買契約の提結をしたかのように予っった場合、売買契約は無効である","a":true,"e":"今回は問題文から通房虚偽表示ということが分かります。な。ので原則無効となります"},{"f":"ishi","fn":"意思表示","q":"A所有の土地につきAとBとの間で売買契約を締結しBが当該土地につき第3者との間で売買契約を締結してい。ない場合、Aの売り渡し込みの意思は真意ではなく。BもAの意思が真意ではない。ことを知ってい。た場合AとBとの意思は合致している。ので売買契約は有効である","a":false,"e":"問題文からAとBは売買契約をしようとしていて実はAは嘘で本当は申し込みをしようと思ってい。ない。そしてBもそのことを知っているという場合は心理流保になる。ので心理流保は原則有効となります。た。だ。しBもAの意思が囲ではない。ことを知ってい。たす。なわち悪意の場合相手方が悪意または相手方が全有過失の場合はこの心理流法は無効となります。な。ので有効とある。ため不適切という問題"},{"f":"ishi","fn":"意思表示","q":"Aが再建者の差し押えを免がれる。ためBと通房してA所有値をBに仮想譲渡とする契約をした。dがAからこの土地の譲渡を受けた場合、には所有権移転登記を受けてい。ない時でもDはBに対しその所有権を主張する。ことができる","a":true,"e":"今回は問題文からAとBが過小譲渡をしようとしているになります。そしてDはAからこの譲渡を受けた場合、Bに対し自分のものかというのを主張する。ことができるかとなりますがそもそも通房虚偽表示はDは登記がなくても所有権をBに対して、主張できるになります今回は通房虚偽表示。このDは登記がなくても所有権をBに対して、主張する。ことができます。これとかちょっと難しい。のでしっかりと図を書いて誰から誰にというのをイメージしておきましょう"},{"f":"ishi","fn":"意思表示","q":"意思表示をナスにあたり表異者に重大な過失があった時は表意者は自らその意思表示を取り消す。ことができない","a":true,"e":"今回は重化室のため取り消しは不可となってい。ます"},{"f":"ishi","fn":"意思表示","q":"AがBに住宅用地を売却した。aが今なら課税されないと信じてい。たがこれをBに話さないで売却した場合、後に課税されたとしてもAは錯誤を理由に売買契約を取り消す。ことはできない","a":true,"e":"今回は錯誤の問題。このBは話さないということから相手方に説明同期を表示してい。ない。ため取り消しはできないとされてい。ます"},{"f":"ishi","fn":"意思表示","q":"意思表示をなすについての同機を表者が当該意思表示の基礎としかつその旨を相手方に明治的に表示した場合、は表意者は意思表示を取り消す。ことができる","a":true,"e":"同期の後を理由に取り消し可能となってい。ます"},{"f":"ishi","fn":"意思表示","q":"Aは自己所有の時価100万円の名匠の絵画を贋作だと思い込みBに対し贋作である。ので10万円で売却するといったところBも同様に贋作だと思い込み贋作なら10万円で購入すると言ってAB間に売買契約が成立した場合、による取り消しができる","a":true,"e":"錯誤の問題は思い込みは重要な論点ですが相手方も同一錯誤に陥った場合す。なわちAとBが思い込んでい。た場合この場合は取消し可能となってい。ます"},{"f":"ishi","fn":"意思表示","q":"相手方と通じてした虚偽の意思表示は無効であり第3者がその虚偽表示につき善意であっても、過失があれば当該第3者にその無効を対抗する。ことができる","a":false,"e":"通房虚偽表示は原則無効ですが善意の第3者に対抗不可となってい。ます今回は全室でも対抗する。ことができるとありますが、この場合第3者の勝ち。対抗は不可となってい。ます"},{"f":"dairi","fn":"代理","q":"AがA所有の土地の売却に関する代理権をBに与えた場合Bが自ら売り主Aの代理人Bでなく売主Bと表示し買主Cとの間で売買契約を締結した場合、Bは売主Aの代理人として契約しているとCが知っていても売買契約はBCに成立する","a":false,"e":"代理はちょっと複雑な。ので図を書いて問題を解くようにしましょう今回はAが代理権をBに与えた**そしてBはなぜか代理人と言わず私が売主ですと言い。ました**そしてCはこの人は代理人だ。なということを分かってい。たという場合この場合はCが悪意ため有効な代理行為と見なされます。な。のでBC間ではなく。AC間で契約が成立する"},{"f":"dairi","fn":"代理","q":"AがA所有の土地の売却に関する代理権をBに与えた場合、Bは自らが1000人及び監督する。のであればAの移行に関わらずいつでもEを副代理人として選任して売買契約を締結させる。ことができる","a":false,"e":"副代理の場合任意代理人が副代理人を選任できる場合は2つあります1つ目本人の挙諾がある時2つ目闇を得ない自由がある時。Aの移行に関わらず千認できるとありますが、不適切"},{"f":"dairi","fn":"代理","q":"AがA所有の土地の売却に関する代理権をBに与えた場合、Bが死亡してもBの相続人はAの代理人として有効に甲土地を売却する。ことができる","a":false,"e":"今回はAがBに代理権を与えてBが死亡した場合、とありますが、代理人が死亡した場合、代理権は消滅するとされてい。ます"},{"f":"dairi","fn":"代理","q":"AはBの代理人としてB所有の甲土地について売買契約を締結した場合、Aが無権代理人であってDとの間で売買契約を締結した後にBの死亡によりAが単独でBを相続した場合、Dは甲土地の所有権を当然に取得する","a":true,"e":"今回はBを父Aを子とイメージします。た。だ。しA子供は実は無権代理人であってDと売買契約を締結したになります。この場合Bす。なわちお父さんが死んだ場合Aは単独でBを相続するとなりますがこの場合Bす。なわち本人が死亡した場合、無権代理人が本人を単独で相続した場合、無権代理行為は有効となります。な。のでこの場合はDにこう土地を渡す必要があるになります。aが勝手に契約してAがその土地を手に入れたんだから最初に契約した通りDに渡す必要があるという問題になります。この問題を解く時は本人が死亡したかそれとも代理人が死亡したかこれで結果は変わってくる。ので誰が死亡した場合にどうなるかを覚えましょう"},{"f":"dairi","fn":"代理","q":"AがBの代理人としてB所有の甲土地について売買契約を締結した場合、Aが無権代理人であってEとの間で売買契約を締結した後にAの死亡によりBが単独でAを相続した場合、Eは甲土地の所有権を当然に取得する","a":false,"e":"Bを父Aを子供とします**そしてAが実は無権代理人でEと売買契約を締結したという問題になります**そしてこの問題ではAが死亡してBが単独でAを相続したという場合を想像しましょうこの場合す。なわち無権代理人が死亡した場合、本人が無権代理人を単独で相続すると追認を拒絶する。ことができるとされてい。ます。Eは高と地の所有権を当然に取得するとありますが、ここが不適切という問題になります。しっかりと誰が亡く。なった場合どういった結果になるかというのを問題を通じて確認しておきましょう"},{"f":"dairi","fn":"代理","q":"AがBに対しA所有の甲土地を売却する代理権を授与しBがCの代理人も引き受けAC双方法の代理人として甲土地にかかる。AC艦の売買契約を締結した場合、Aに損害が発生しなければBの代理行為は無権代理とは見なされない","a":false,"e":"双報代理は原則無権代理行為と見なされます。た。だ。し例外として丸1本人があらかじめ巨落した行為丸2債務の履行この場合、は有効とされます今回はこの例外に当ては余らない。ので無権代理行為と見なされます"},{"f":"dairi","fn":"代理","q":"AはBの代理人としてB所有の甲土地をCに売り渡す売買契約をCと締結した。しかし、Aは甲土地を売り渡す代理権を有してい。なかった。Bが本件売買契約を追認しない場合、AはCの選択に従い。Cに対して、契約履行または損害賠償の責任を負うた。だ。しCが契約の時において、Aに甲土地を売り渡す具体的な代理権はない。ことを知ってい。た場合は責任を負い","a":true,"e":"Aは無権代理人であり、Cが悪意（代理権がない。ことを知ってい。た）の場合はこれの表を確認してく。ださい。相手方が悪意の場合責任追求権はできないとされてい。ます。この場合相手方は悪意な。ので責任追求はないです"},{"f":"dairi","fn":"代理","q":"代理権を有しないものがした契約を本人が追認する場合、その契約の効力は別段の意思表示がない限り追認をした時から将来に向かって生ずる","a":false,"e":"誤りの記述です。"},{"f":"dairi","fn":"代理","q":"AはBの代理人としてB所有の甲土地をCに売り渡す売買契約をCと締結した。しかし、Aは甲土地を売り渡す代理権は有してい。なかった。bがAに対しと地に抵当権を設定する代理権を与えているがAの売買契約締結行為は権限外の行為となる場合、地を売り渡す具体的な代理権がAにあるとCがずべき正当な理由がある時はBC間の本件売買契約は有効となる","a":true,"e":"表見代理は無権代理行為であっても、外観上正当な代理権があるように見える場合有効な代理行為があったものと吊る制度となってい。ます相手方が全無失で以下の3つの時成立するとされてい。ます1つ目代理権を与えたという表示をした場合、2つ目権限外の代理行為をした場合、3つ目代理券消滅後に代理行為をした場合、そして善意無過失だと表権代理が成立するとされてい。ます。そして相手方が善意無過失の場合表権代理が成立するとされてい。ます今回で言うとC相手方が善意無過失で信じべき正当な理由がある時この契約は本当は無権代理行為ですが、有効となるとありますが、正しい選択肢となってい。ます表件内りは必ず要件をしっかりと確認しておきましょう"},{"f":"dairi","fn":"代理","q":"AがBから何ら代理系を与えられてい。ないにも関わらずBの代理人と称してCとの間で法律行為をしCがAにBの代理権があると信じた場合、であっても、原則としてその法律行為の効果はBに既属しない","a":true,"e":"今回はた。だ知らない人の言文を勝手に信じた。だけな。ので既属しないとされてい。ます表見代理は適用されない。のでうっかりとバツとしないように注意が必要です"},{"f":"dairi","fn":"代理","q":"AがBに与えた代理権が消滅した後にBが行った代理権の範囲内の行為について相手方Cが過失によって代理権消滅の事実を知らなかった場合、でもAはその責任を負わなければならない","a":false,"e":"この場合、表見代理は原則有効となりますが相手方が全無過失である必要があるとされてい。ます今回は相手方が過失によってとある。ので本人は責任を負うとされてい。ます。責任を負わなければなりません。この記述が不適切です"},{"f":"dairi","fn":"代理","q":"Aが後地についてBに賃料の徴収の代理をさせてい。た。bによる甲土地の売却をAが追認しない場合、でもCがBに代理権があると信じそう信じる。ことについて正当な理由がある時Cは直接Aに対して、所有権移転登記の請求をする。ことができる","a":true,"e":"今回は表見代理す。なわち表面上な代理権があるように見える場合、有効となってい。ます"},{"f":"dairi","fn":"代理","q":"AはBの代理人としてB所有の甲土地をCに売り渡す売買契約をCと締結した。しかし、Aは皇たちを売り渡す代理権を有してい。なかった。eが本件売買契約を推任しない間はCはこの契約を取り消す。ことができる。た。だ。しCが契約の時において、Aに甲土地を売り渡す具体的な大理権がない。ことを知ってい。た場合、は取り消せない","a":true,"e":"この場合相手方は本人が追認をしない間取り消し可能となってい。ます。た。だ。し悪意の場合は取り消し不可な。ので注意が必要です"},{"f":"dairi","fn":"代理","q":"売買契約を締結する権限を与えられた代理人は特段の事情がない限り相手方からその売買契約を取り消す旨の意思表示を受領する権限を有する","a":true,"e":"正しい選択肢となってい。ます"},{"f":"dairi","fn":"代理","q":"AがBの代理人としてB所有の甲土地について売買契約を締結した。aが甲土地の売却を代理する権限をBから書面で与えられた場合、AがCの代理人となってBC艦の売買契約を締結した時はCは甲土地の所有権を当然に取得する","a":false,"e":"今回は双方代理な。ので当然に所有権を取得しないとされてい。ます"},{"f":"dairi","fn":"代理","q":"AがBから何ら代理権を与えられてい。ないにも関わらずBの代理人と称してCとの間で法律行為をしCがAにBの代理権があると信じた場合、であっても、原則としてその法律行為の効果はBに既属しない","a":true,"e":"今回は表見代理が適用されるケースの3つに該当しない。ためこの場合、は効果はBに既属しないとなってい。ます"},{"f":"dairi","fn":"代理","q":"AはBの代理人としてBの所有値をCに売却した。aが代理権を与えられた後売買契約前に破算するとAの代理権は消滅するがAの代理権が消滅してもCが善意無過失であればその売買契約は有効である","a":true,"e":"まずは代理人が破産手続き開始すると代理権は消滅するとされてい。ます。た。だ。し相手方が善意無室の場合、は表権代理が成立し有効な代理行為があったものとされ売買契約は有効となります"},{"f":"dairi","fn":"代理","q":"AがA所有の甲土地の売却に関する代理権をBに与えた未成年である。BがAの代理人として甲土地をCに売却した後Bが未成年者である。ことをCが知った場合、CはBが未成年者である。ことを理由に売買契約を取り消す。ことができる","a":false,"e":"この場合、任員代理任院は未成年者でも可能となっていて相手方は代理人が未成年者である。ことを理由に取り消しは不可とされてい。ます"},{"f":"dairi","fn":"代理","q":"代理行為の追認は別段の意思表示がない時は契約の時に遡ってその効力を生ずる。た。だ。し第3者の権利を外する。ことはできない","a":true,"e":"正しい選択肢となってい。ます"},{"f":"dairi","fn":"代理","q":"不動産を担保に金を借り入れる代理権を与えられた代理人が本人の名において、当該不動産を対却した場合、相手方において、本人自身の行為であると信じた。ことについて正当な理由がある時は表権代理の規定を類水適用する。ことができる","a":true,"e":"この場合、表見代理の規定を適用する。ことができるとされてい。ます"},{"f":"dairi","fn":"代理","q":"AがBの代理人としてB所有の高突地について売買契約を締結した。aが甲土地の売却を代理する権限をBから書面で与えられた場合、A自らが買主となって売買契約を締結した時はAは甲土地の所有権を当然に取得する","a":false,"e":"自己契約は所有権を当然に取得しないとされてい。ます"},{"f":"dairi","fn":"代理","q":"AはBの代理人としてB所有の甲土地をCに売り渡す売買契約をCと締結した。しかし、Aは甲土地を売り渡す代理権を有してい。なかった。Bが本件売買契約を追認しない間Cはこの契約を取り消す。ことができる。た。だ。しCが契約の時において、Aに土地を売り渡す具体的な代理権がない。ことを知ってい。た場合、取り消せない","a":true,"e":"この場合Aは無権代理人となりますもっとそしてCが契約の時にAについて悪意だった場合とありますが、この場合取り消し権は悪意の場合発生しないとされてい。ます。取り消せないという選択肢は正しいものとなってい。ます今回は相手方す。なわちCが悪意知ってい。たという場合な。ので取り消しは不可となってい。ます"},{"f":"dairi","fn":"代理","q":"代理人は行為能力者である。ことを有しないが代理人が貢献開始の審判を受けた時は代理権が消滅する","a":true,"e":"この場合、代理権が消滅するとされてい。ます"},{"f":"dairi","fn":"代理","q":"AがA所有の土地の売却に関する代理権をBに与えた。bが自らを売り主Aの代理人Bと表示して買主Dとの間で締結した売買契約はBが未成年者であったとしてもAはBが未成年である。ことを理由に取り消す。ことはできない","a":true,"e":"代理人は未成年者の000任が可能とされてい。ますが本人は代理人が未成年者である。ことを理由に取り消しは不可となってい。ます"},{"f":"dairi","fn":"代理","q":"夫婦の一方、は個別に代理権の受験がなくとも日常家事に関する事項について他の一方、を代理して法律行為をする。ことができる","a":true,"e":"正しい選択肢となってい。ます"},{"f":"jikou","fn":"時効","q":"Dが所有者と称する。EからEが無権利者である。ことについて善意無過失で甲土地を買い受け所有の意思を持って平穏かつ公然に3年間占有した後たちがAの所有である。ことを知っているFに売却しFが所有の意思を持って平穏かつ公然に甲土地を7年間占有した場合、Fは甲土地の所有権を自を取得する。ことができる","a":true,"e":"この場合取得時効の要件を確認します。まずは占有開始の時点で判断します。最初は善意無過失でDは甲土地を所有の意思を持って平穏かつ公然に占有してい。ます。Dは3年間占有してい。ます。その後悪意のFに7年間渡した場合、この場合は10年間の要件を満た。している。ので自己取得する。ことができるとされてい。ます大事な。のは要件をしっかりと確認しておく。ことになる。ので数字と共に確認しておきましょう"},{"f":"jikou","fn":"時効","q":"Aが甲土地を使用しないで20年以上放置してい。たとしてもAの有する甲土地の所有権が消滅時効にかかる。ことはない","a":true,"e":"所有権は消滅時効にかからないとされてい。ます"},{"f":"jikou","fn":"時効","q":"AはBに対し建物を賃貸し月額10万円の賃料債権を有している。aがBに対する賃料債権につき支払い特の申し立てをしさらに期間内に適に仮執行の宣言の申し立てをした時は消滅時効の完成は有される","a":true,"e":"支払い特はその自由が終了する。まで完成優されるとなってい。ます"},{"f":"jikou","fn":"時効","q":"AがBに対して、金銭の支払いを求めて訴えを定期した場合、訴えの定期後に裁判所の和解が成立した場合には時効の更新の効力は生じない","a":false,"e":"裁判上の和解の場合、時効の更新がされるとなってい。ます"},{"f":"jikou","fn":"時効","q":"AはBに対し建物を賃貸し月額10万円の賃料債権を有している。bがAとの建物賃貸借契約締結時に賃料債権につき消滅時効の利益はあらかじめ放棄する旨を躍上したとしてもその躍に法的暴力は認められない","a":true,"e":"この場合、時効の利益をあらかじめ放棄する。ことは不可となってい。ます"},{"f":"jikou","fn":"時効","q":"履行不能による損害賠償債務の消滅時効は本来の債務を請求しる時から進行する","a":true,"e":"本来の債務を請求できる時から進行するとされてい。ます"},{"f":"jikou","fn":"時効","q":"債務の不行に基づく人の生命または身体の侵害による損害賠償請求権は権利を行使する。ことができる時から10年間行使しない時は事項によって消滅する","a":false,"e":"くは10年間ではなく20年間となってい。ます"},{"f":"jikou","fn":"時効","q":"物上保証人は債権の消滅時効を援用して債権者に抵当権の抹消を求める。ことができる","a":true,"e":"この場合、物上保証人は正当な利益を有するものな。ので抵当権の抹消請求が可能となってい。ます"},{"f":"jikou","fn":"時効","q":"返済機を定めてい。ない過資金債権の消滅時効は貸主の最国のに関わらず貸し付けた時から記される","a":true,"e":"この場合、権利を行使する。ことができる時から進行するとされてい。ます。また、弁済を定めてい。ない債権は債権者はいつでも請求可能となってい。ます"},{"f":"jikou","fn":"時効","q":"AはBに対し賃料債権を有している。bが賃料債権の消滅時効が完成した後その賃料債権を承認した時消滅時効の完成を知らなかった時でもその完成した消滅時効の援用する。ことは援用する。ことは許されない","a":true,"e":"例え知らなかった時でもその消滅時効の援用をする。ことはできないとされてい。ます"},{"f":"jikou","fn":"時効","q":"AがBに対して、金星の支払いを求めて訴えを定期した場合、訴えの定期後に請求規画の判決が確定した場合には時効の更新の効力は生じない","a":true,"e":"請求規画の判決が確定すると更新の効力は生じないとされてい。ます"},{"f":"jikou","fn":"時効","q":"裁判上の請求をした場合、裁判が終了する。までの間は時効が完成しないが当該請求を途中で取り下げて権利が確定する。ことなく当該請求が終了した場合にはその終了した時から新たに時効の進行が始まる","a":false,"e":"権利が確定する。ことなく物体が終了すると時効は更新されず6ヶ月間時効の完成が有意されるとなってい。ます"},{"f":"jikou","fn":"時効","q":"重抵当権者は千住意抵当権の被担保債権の消滅時効を援用する。ことができない","a":true,"e":"抵当権者は正当な利益を有するものに当たらない。ので栄養は不可となってい。ます"},{"f":"jikou","fn":"時効","q":"債権者が債務者に対して、訴訟により弁済を求めてもその訴えが却下された場合、自己更新の効力は生じない","a":true,"e":"訴えが却下されると自己更新の効力は生じないとなってい。ます"},{"f":"jikou","fn":"時効","q":"判決が確定した場合、時効は新たに進行を開始しその時効期間は20年となる","a":false,"e":"この場合、20年ではなく10年となってい。ます"},{"f":"jikou","fn":"時効","q":"自己の所有と信じて占有している土地の一部に隣接する他人の土地の筆の一部が含まれていても他の要件を満たせば当該他人の土地の一部の所有権を事項によって取得する。ことができる","a":true,"e":"この場合、所有権を事項で取得する。ことができるとなってい。ます"},{"f":"jikou","fn":"時効","q":"消滅時効の権者である当事者とは権利の消滅について正当な利益を有するものであり保証人物上保証人第3取得者も含まれない","a":false,"e":"この保証人物上保証人第3取得者は当事者に含まれるとされてい。ます"},{"f":"jikou","fn":"時効","q":"消滅時効完成後に主たる債務者が時効の利益を放棄した場合、でも保証人は時効を援用する。ことができる","a":true,"e":"この場合、保証人は時効を援用する。ことができます"},{"f":"jikou","fn":"時効","q":"消滅時効完成後に債務者が債権を承認した場合、を知らなかったとしても時効のは許されない","a":true,"e":"1回承認すると時効の援用は不可となってい。ます"},{"f":"jikou","fn":"時効","q":"債務の承認をした場合、債務者が被保佐人であって保佐人の同意を得てい。なくても自己更新の効力を生じる","a":true,"e":"この場合、でも時効の更新は生じるとされてい。ます権利関係の"},{"f":"saimu","fn":"債務不履行・解除・危険負担","q":"利息を生図べき債権について別段の意思表示がない時はその理率は年3%とする","a":true,"e":"この場合、金銭債務の振利は法定理率年3%によって計算されます"},{"f":"saimu","fn":"債務不履行・解除・危険負担","q":"AB間の金銭消費貸借契約で借主Bは契約に基づく金銭の返済をCからBに支払われる振込代金で予定してい。たが入金がなかった。Bの攻めにキすべき自由はない。そのため、閉返済期限が経過してしまった場合、Bは債務不履行には陥らずAに対して、遅延損害金の支払い義務を負い","a":false,"e":"金銭債務の場合責任がなくても債務不履行が成立するとされてい。ます今回はBは悪く。ないんですけれどもこの場合は債務不履行となります"},{"f":"saimu","fn":"債務不履行・解除・危険負担","q":"共もに宅建業者である。AB間でBの債務不履行によりAが売買契約を解除する場合、手付金相当額を損害賠償の予定とする旨を売買契約で定めてい。た場合には特約がない限りAの損害が200万円を超えていてもAは手付金相当額以上に損害賠償請求はできない","a":true,"e":"損害賠償の予定がされると実際の損害額がいくらであっても、予定した金額が損害賠償額となります"},{"f":"saimu","fn":"債務不履行・解除・危険負担","q":"マンションの売買契約がマンションの引き渡し後に債務不履行理由に解除された場合、売主の代金変換義務と買主の目的物変換債務は同時利行の関係に立た。ない","a":false,"e":"この場合、同時候行の関係となります"},{"f":"saimu","fn":"債務不履行・解除・危険負担","q":"所有権移転登記引き渡し前にその家が天災によって滅失した場合、買主は売り主に対し代金の支払いを拒むことができる","a":true,"e":"危険負担となっていて売買契約の成立後引き渡し前に当事者双方の攻めに起する。ことができない理由例えば、雷などによって債務の履行ができなく。なると買主は代金の支払いを拒むことができるとされてい。ます"},{"f":"saimu","fn":"債務不履行・解除・危険負担","q":"債務者が債務を履行しない場合、債務者がその債務の全部の履行を拒絶する意思を明確に表示した時は債権者は相当の期間を定めてその履行を再告する。ことなく直ちに契約の解除をする。ことができる","a":true,"e":"この場合履行を拒絶する意思をしっかりと表している。のでこの場合は最国不要で直ちに解除する。ことができるとされてい。ます"},{"f":"saimu","fn":"債務不履行・解除・危険負担","q":"当事者は債務の不履行について損害賠償の額を予定する。ことができる","a":true,"e":"損害賠償の額を予定する。ことができるとされてい。ます"},{"f":"saimu","fn":"債務不履行・解除・危険負担","q":"債務不履行に対して、債権者が相当の期間を定めて履行を再告してその期間内に履行がなされない場合、であっても、最国機関が経過した時における債務不履行がその契約及び取引上の社会通年に照らして警備である時は債権者は契約の解除をする。ことができない","a":true,"e":"警備な時は解除はできないとされてい。ます"},{"f":"saimu","fn":"債務不履行・解除・危険負担","q":"金銭債務の振り行については、債権者は損害の証明をする。ことなく損害賠償を請求できる","a":true,"e":"債権者は損害の証明は不要となってい。ます"},{"f":"saimu","fn":"債務不履行・解除・危険負担","q":"善意の受益者はその不当利益変換債務について利行の整形を受けた時から担保の責任を負う","a":true,"e":"請求を受けた時が起点となります"},{"f":"saimu","fn":"債務不履行・解除・危険負担","q":"債務の履行について不確定期限がある時は債務者はその期限の到来した。ことを知った後に履行の請求を受けた時から遅滞の責任を負う","a":false,"e":"債務の履行について不確定期限がある時は債務者は丸1期限の到来後に履行の請求を受けた時丸に期限の到来した。ことを知った時のいずれか早い時から担保の責任を負うとされてい。ます"},{"f":"saimu","fn":"債務不履行・解除・危険負担","q":"賠償額を予定した場合、実際の損害額が予定額より大きい。ことを証明しても予定額を超えて請求する。ことはできない","a":true,"e":"実際の予定額より大きくても請求は不可となってい。ます"},{"f":"saimu","fn":"債務不履行・解除・危険負担","q":"賠償額の予定は金銭以外のものでする。ことができる","a":true,"e":"金銭以外でも可能となってい。ます"},{"f":"saimu","fn":"債務不履行・解除・危険負担","q":"売主が買主の代金不払いを理由として売買契約を解除した場合、売買契約は遡って消滅する。ので売主は買主に対して、損害賠償請求はできない","a":false,"e":"この場合、解除と損害賠償請求両方行うことも可能となってい。ます"},{"f":"saimu","fn":"債務不履行・解除・危険負担","q":"債権者は債務の振り行によって通常を生ズべき損害のうち契約締結当時両当事者がその損害発生を予見してい。たものに限り賠償請求できる","a":false,"e":"この場合、余計のうによらず請求可能となってい。ます"},{"f":"saimu","fn":"債務不履行・解除・危険負担","q":"所有権移転登記が完了し引け渡し技術が過ぎた。のに売主が売買契約の目的である家の引き渡しをしないでい。たところその家が家事で滅失した場合、買主は契約を解除する。ことができる","a":true,"e":"この場合、履行不能で買主は解除可能となってい。ます"},{"f":"saimu","fn":"債務不履行・解除・危険負担","q":"賠償額の予定情報がある場合、債権者は履行遅滞があった。ことを主張立証すれば足り損害の発生や損害額を主張立証する必要はない","a":true,"e":"正しい選択肢となってい。ます"},{"f":"saimu","fn":"債務不履行・解除・危険負担","q":"甲建物の所有権移転登記後引き渡し前に甲建物が放火によって反照した場合、買主は売主に対し代金の減額を請求する。ことができない","a":false,"e":"この場合、買主は担保責任を負求する。ことが可能となってい。ます"},{"f":"saimu","fn":"債務不履行・解除・危険負担","q":"解除権を行使した場合、その一種表示を撤開する。ことはできない","a":true,"e":"1度解除した場合、撤回は不可能となってい。ます"},{"f":"saimu","fn":"債務不履行・解除・危険負担","q":"賃貸借契約において、借主が貸主との間の信頼関係を破壊し契約の継続を一著しく困難にした場合、であっても、貸主が契約解除する。ためには最国が必要である","a":false,"e":"この場合、再告する。ことなく解除可能となってい。ます"},{"f":"saimu","fn":"債務不履行・解除・危険負担","q":"債務者の攻めにキすべき債務の履行不能によって生ずる損害賠償請求権の消滅時効は本来の債務の履行を請求しる時からその進行を開始する","a":true,"e":"正しい選択肢となってい。ます"},{"f":"saimu","fn":"債務不履行・解除・危険負担","q":"売が定められた離行機に引き渡しをしない場合、買主は代金支払い。の提供をしないでAに対して、履行の再告をした上契約を解除できる","a":false,"e":"この場合、買主は自らの債務の履行をしないと契約の解除は不可となってい。ます売り主に言うなら自分もちゃんとする必要がある。"},{"f":"saimu","fn":"債務不履行・解除・危険負担","q":"の所有権移転登機が完了し引き渡し技術が過ぎた。のに売主がその引き渡しをしないでい。たところその家が累勝によって滅失した場合、買主は契約を解除する。ことができる","a":true,"e":"この場合、売しをしてい。ない。ため買主は解除する。ことができるとされてい。ます"},{"f":"saimu","fn":"債務不履行・解除・危険負担","q":"法行為の加害者は不法行為に基づく損害賠償債務について移行の請求を受けた時から遅滞の責任を負う","a":false,"e":"損害の発生と同時に履行遅滞となります履行の請求を受けた時からではない。ので注意が必要です"},{"f":"saimu","fn":"債務不履行・解除・危険負担","q":"債務の履行について不確定期限がある時は債務者はその期限が到来した。ことを知らなくても期限到来後に移行の請求を受けた時から遅滞の責任を負う","a":true,"e":"不確定期限の場合、は期限が到来した。ことを知らなくても請求を受けた時から遅滞の責任を負うとされてい。ます権利関係の"},{"f":"bukken","fn":"売買・物権変動","q":"宅建業者Aが自ら売主として宅建業者ではない買主Bとの間で宅地の売買契約を締結した建物に契約の内容に適合しない不具合があった場合、でもその不具合がAの攻めに基礎ものでない時Aは担保責任を負い旨の特約は有効である","a":false,"e":"民法よりも買主に不利な内容となっている。のでこの特約は無効となります"},{"f":"bukken","fn":"売買・物権変動","q":"宅建業者Aが自ら売主となり宅建業者でない買主Bに建物を売却した。この建物に契約不適号があった場合、BがAに通知すべき期間を不適号を知った時から2年間とする特約は有効である","a":true,"e":"この場合、民法の不適語を知った時から1年よりも買主に有利な。ので有効となります"},{"f":"bukken","fn":"売買・物権変動","q":"不動産を兄と弟が各自1/2の共有持分で共同相続した後兄が弟に断る。ことなく単独で所有権を相続取得した旨の登記をした弟はその共同相続の登記をしなければ共同相続後に高産を兄取得して所有権移転登記を得た第3者に自己の持分をを対抗できない","a":false,"e
