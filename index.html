const ZQ=[{"f":"shutoku","fn":"不動産取得税","q":"不動産取得税は、不動産の取得に対し、当該不動産の所在する市町村が課する税である。","a":false,"e":"不動産取得税の課税主体は都道府県です。市町村ではありません。固定資産税が市町村税であることと混同しないよう注意が必要です。"},{"f":"shutoku","fn":"不動産取得税","q":"相続により不動産を取得した場合、不動産取得税は課税されない。","a":true,"e":"相続による取得は非課税です。ただし、贈与による取得は課税されます。包括遺贈は非課税、特定遺贈は課税される点にも注意が必要です。"},{"f":"shutoku","fn":"不動産取得税","q":"贈与により不動産を取得した場合、不動産取得税は課税されない。","a":false,"e":"贈与による取得は課税対象です。非課税となるのは相続による取得です。"},{"f":"shutoku","fn":"不動産取得税","q":"不動産取得税の課税標準は、固定資産課税台帳に登録された価格である。","a":true,"e":"不動産取得税の課税標準は、原則として固定資産課税台帳に登録された価格（固定資産税評価額）です。"},{"f":"shutoku","fn":"不動産取得税","q":"新築住宅を取得した場合の不動産取得税の課税標準の特例として、一戸につき1,500万円が控除される。","a":false,"e":"新築住宅の課税標準の特例は一戸につき1,200万円の控除です。1,500万円ではありません。なお、認定長期優良住宅の場合は1,300万円となります。"},{"f":"shutoku","fn":"不動産取得税","q":"不動産取得税の免税点は、土地の取得にあっては10万円である。","a":true,"e":"免税点は土地10万円、家屋の建築23万円、家屋の売買等12万円です。"},{"f":"shutoku","fn":"不動産取得税","q":"不動産取得税の標準税率は、原則として100分の4である。","a":true,"e":"標準税率は原則4/100（4%）です。ただし、住宅及び土地については、特例により3/100（3%）に軽減されています。"},{"f":"shutoku","fn":"不動産取得税","q":"委託者のみが信託財産の元本の受益者である信託において、受託者から委託者に信託財産を移す場合、不動産取得税は課税されない。","a":true,"e":"形式的な所有権の移転として非課税とされています。実質的な所有権の移転がない場合には課税されません。"},{"f":"kotei","fn":"固定資産税","q":"固定資産税の賦課期日は、毎年4月1日である。","a":false,"e":"賦課期日は毎年1月1日です。年度の開始日である4月1日と混同しやすいので注意が必要です。"},{"f":"kotei","fn":"固定資産税","q":"固定資産税は、固定資産の所有者に対して課される市町村税である。","a":true,"e":"固定資産税の課税主体は市町村です（東京23区は都）。不動産取得税（都道府県税）との違いを覚えましょう。"},{"f":"kotei","fn":"固定資産税","q":"年の途中で土地の売買があった場合、買主が当該年度の固定資産税を納付する義務を負う。","a":false,"e":"固定資産税の納税義務者は、賦課期日（1月1日）現在の所有者です。年の途中で売買があっても、1月1日時点の所有者が全額を納付します。"},{"f":"kotei","fn":"固定資産税","q":"住宅用地で小規模住宅用地（200㎡以下の部分）に該当するものは、課税標準が6分の1に軽減される。","a":true,"e":"小規模住宅用地（200㎡以下の部分）は課税標準が1/6に軽減されます。一般住宅用地（200㎡超の部分）は1/3です。"},{"f":"kotei","fn":"固定資産税","q":"新築住宅に対する固定資産税の減額措置として、一定の要件を満たす住宅は5年間にわたり税額が2分の1に減額される。","a":false,"e":"一般の新築住宅は3年間、1/2に減額されます。5年間となるのは3階建以上の耐火・準耐火建築物（マンション等）の場合です。"},{"f":"kotei","fn":"固定資産税","q":"固定資産税の免税点は、土地が30万円、家屋が20万円である。","a":true,"e":"免税点は土地30万円、家屋20万円です。不動産取得税の免税点（土地10万円）と混同しないよう注意が必要です。"},{"f":"kotei","fn":"固定資産税","q":"固定資産税の納期は、4月・7月・12月・2月の4期に分けて納付するのが原則である。","a":true,"e":"原則として4月・7月・12月・翌年2月の年4回に分けて納付します。ただし、市町村の条例により異なる場合があります。"},{"f":"joto","fn":"譲渡所得税","q":"居住用財産を譲渡した場合の3,000万円の特別控除は、所有期間が10年を超えていなければ適用を受けることができない。","a":false,"e":"3,000万円特別控除は所有期間の長短を問わず適用可能です。所有期間10年超が要件なのは軽減税率の特例です。"},{"f":"joto","fn":"譲渡所得税","q":"居住用財産を配偶者に譲渡した場合でも、3,000万円の特別控除の適用を受けることができる。","a":false,"e":"配偶者、直系血族、生計を一にする親族等への譲渡は3,000万円特別控除の適用除外です。"},{"f":"joto","fn":"譲渡所得税","q":"居住用財産の3,000万円特別控除と軽減税率の特例は、併用することができる。","a":true,"e":"3,000万円控除と軽減税率の特例は併用可能です。一方、買換え特例とは選択適用（併用不可）となります。"},{"f":"joto","fn":"譲渡所得税","q":"居住用財産の軽減税率の特例は、譲渡した年の1月1日における所有期間が10年を超えるものに適用される。","a":true,"e":"軽減税率の特例の要件は、譲渡した年の1月1日において所有期間が10年を超えていることです。「1月1日」時点で判断する点に注意が必要です。"},{"f":"joto","fn":"譲渡所得税","q":"居住用財産の買換え特例と3,000万円特別控除は、併用することができる。","a":false,"e":"買換え特例と3,000万円控除は選択適用であり、併用はできません。"},{"f":"joto","fn":"譲渡所得税","q":"居住用財産を譲渡した場合、居住しなくなった日から5年を経過する日の属する年の年末までに譲渡すれば、3,000万円特別控除を受けることができる。","a":false,"e":"居住しなくなった日から3年を経過する日の属する年の12月31日までに譲渡する必要があります。5年ではなく3年です。"},{"f":"joto","fn":"譲渡所得税","q":"土地・建物の譲渡所得について、長期譲渡所得とは、譲渡した年の1月1日において所有期間が5年を超えるものをいう。","a":true,"e":"長期譲渡所得は、譲渡した年の1月1日において所有期間が5年を超えるものです。5年以下は短期譲渡所得となります。"},{"f":"inshi","fn":"印紙税","q":"不動産の売買契約書は、印紙税法上の課税文書に該当する。","a":true,"e":"不動産の売買契約書は第1号文書として課税対象です。建設工事の請負契約書は第2号文書、領収書は第17号文書です。"},{"f":"inshi","fn":"印紙税","q":"記載金額のない不動産の売買契約書は、印紙税が課税されない。","a":false,"e":"記載金額のない契約書でも200円の印紙税が課税されます。非課税ではありません。"},{"f":"inshi","fn":"印紙税","q":"電子契約で締結した不動産の売買契約は、印紙税が課税されない。","a":true,"e":"印紙税は紙の文書に課税されるため、電子契約には印紙税は課税されません。"},{"f":"inshi","fn":"印紙税","q":"消費税額が区分記載されている場合、印紙税の記載金額は税抜金額で判断される。","a":true,"e":"消費税額が明確に区分記載されている場合は、税抜金額が記載金額となります。"},{"f":"inshi","fn":"印紙税","q":"印紙税を納付すべき課税文書の作成者が、印紙税を納付しなかった場合、原則として納付しなかった印紙税額の3倍に相当する過怠税が徴収される。","a":true,"e":"原則として納付しなかった印紙税額の3倍の過怠税が徴収されます。ただし、自主的に申し出た場合は1.1倍に軽減されます。"},{"f":"touroku","fn":"登録免許税","q":"登録免許税は、登記を受ける者に対して課される都道府県税である。","a":false,"e":"登録免許税は国税です。都道府県税ではありません。不動産取得税（都道府県税）との違いに注意が必要です。"},{"f":"touroku","fn":"登録免許税","q":"土地の所有権移転登記に係る登録免許税の税率は、原則として1,000分の20である。","a":true,"e":"土地の所有権移転登記の税率は原則20/1000（2%）です。令和8年3月31日までの特例として15/1000に軽減されています。"},{"f":"touroku","fn":"登録免許税","q":"住宅用家屋の所有権保存登記の軽減税率の適用を受けるためには、床面積が50㎡以上であることが必要である。","a":true,"e":"住宅用家屋の軽減税率の適用には、床面積50㎡以上であること、新築又は取得後1年以内に登記すること等の要件があります。"},{"f":"kantei","fn":"不動産鑑定評価","q":"不動産の鑑定評価において、原価法は対象不動産の再調達原価を求め、これについて減価修正を行って対象不動産の価格を求める手法である。","a":true,"e":"原価法は再調達原価から減価修正を行う手法です。取引事例比較法（類似事例からの比較）、収益還元法（将来収益から算定）と合わせて3手法を覚えましょう。"},{"f":"kantei","fn":"不動産鑑定評価","q":"不動産の鑑定評価は、原価法、取引事例比較法又は収益還元法のうち、いずれか1つの手法を適用すれば足りる。","a":false,"e":"鑑定評価は3手法を併用し、相互に関連づけて最終的な鑑定評価額を決定します。1手法のみでは不十分です。"},{"f":"kantei","fn":"不動産鑑定評価","q":"収益還元法には、直接還元法とDCF法の2つの方法がある。","a":true,"e":"直接還元法は一期間の純収益を還元利回りで割り戻す方法、DCF法は複数期間の純収益と復帰価格を現在価値に割り引く方法です。"},{"f":"chika","fn":"地価公示法","q":"標準地の正常な価格は、土地鑑定委員会が毎年1回判定し、官報で公示する。","a":true,"e":"公示価格は毎年1月1日時点の価格を、土地鑑定委員会が判定し、官報で公示します。"},{"f":"chika","fn":"地価公示法","q":"標準地の鑑定評価は、1人の不動産鑑定士が行えば足りる。","a":false,"e":"2人以上の不動産鑑定士が鑑定評価を行い、土地鑑定委員会が審査・調整した上で正常な価格を判定します。"},{"f":"chika","fn":"地価公示法","q":"地価公示の対象は、都市計画区域内の標準地に限られる。","a":false,"e":"都市計画区域外であっても、必要がある場合には公示の対象とすることができます。"},{"f":"chika","fn":"地価公示法","q":"不動産鑑定士が土地の鑑定評価を行う場合、公示価格を規準としなければならない。","a":true,"e":"不動産鑑定士は公示価格を「規準」とします。「基準」ではなく「規準」である点が出題されます。"},{"f":"kinyu","fn":"住宅金融支援機構","q":"住宅金融支援機構は、一般の個人に対して直接に住宅ローンの貸付けを行うことを主な業務としている。","a":false,"e":"機構は直接融資を原則行いません。民間金融機関の住宅ローン債権を買い取る証券化支援業務（フラット35）が主な業務です。"},{"f":"kinyu","fn":"住宅金融支援機構","q":"証券化支援事業（買取型）において、機構は民間金融機関から住宅ローン債権を買い取り、MBS（資産担保証券）として投資家に発行する。","a":true,"e":"フラット35の仕組みです。民間金融機関が融資→機構が債権を買取り→MBSとして投資家に売却します。"},{"f":"kinyu","fn":"住宅金融支援機構","q":"証券化支援事業（買取型）の対象となる住宅の床面積は、一戸建ての場合、50㎡以上でなければならない。","a":false,"e":"一戸建ての場合は70㎡以上です。マンションの場合は30㎡以上となっています。50㎡は登録免許税の軽減要件です。"},{"f":"kinyu","fn":"住宅金融支援機構","q":"機構は、災害により住宅が滅失した場合に、災害復興建築物の建設等に必要な資金の貸付けを直接行うことができる。","a":true,"e":"災害復興住宅への直接融資は、機構が直接融資を行う例外のひとつです。"},{"f":"keihyo","fn":"景品表示法","q":"不動産の表示に関する公正競争規約において、徒歩による所要時間は、道路距離100mにつき1分として算出する。","a":false,"e":"徒歩時間は道路距離80mにつき1分で算出します。100mではありません。端数が生じた場合は切り上げます。"},{"f":"keihyo","fn":"景品表示法","q":"建築後1年未満であっても、居住の用に供されたことがある建物は「新築」と表示することができない。","a":true,"e":"「新築」と表示できるのは、建築後1年未満かつ未入居の建物に限られます。いずれか一方でも欠ければ新築とは表示できません。"},{"f":"keihyo","fn":"景品表示法","q":"不動産広告において、「完全」「日本一」等の用語は、合理的な根拠がなくても使用することができる。","a":false,"e":"最上級表現は合理的根拠がなければ使用できません。不当表示に該当するおそれがあります。"},{"f":"keihyo","fn":"景品表示法","q":"物件から最寄り駅までの徒歩時間を表示する場合、物件の出入口から駅の出入口までの道路距離により算出する。","a":true,"e":"徒歩時間は、物件の出入口から駅の出入口（改札ではない）までの道路距離80mにつき1分で算出します。"},{"f":"keihyo","fn":"景品表示法","q":"新築分譲マンションの広告において、パンフレット等に物件から最寄り駅までの所要時間を明示する場合、乗換えを要するときは、その旨を明示しなければならない。","a":true,"e":"電車等の所要時間を表示する場合、乗換えを要するときはその旨と所要時間を明示する必要があります。"},{"f":"tochi","fn":"土地・建物","q":"自然堤防は、一般に洪水に対して安全であり、宅地として適している。","a":true,"e":"自然堤防は周囲より高く、排水も良好なため宅地に適しています。一方、後背湿地は低湿で宅地に不適です。"},{"f":"tochi","fn":"土地・建物","q":"後背湿地は、排水が良好であり、宅地として適している。","a":false,"e":"後背湿地は自然堤防の背後にある低湿地で、排水が悪く、軟弱地盤のため宅地には不適です。"},{"f":"tochi","fn":"土地・建物","q":"埋立地は、一般に地盤が安定しているため、液状化の危険性は低い。","a":false,"e":"埋立地は地盤が軟弱で、地震時に液状化が発生しやすい地域です。"},{"f":"tochi","fn":"土地・建物","q":"鉄筋コンクリート造は、耐火性、耐久性に優れている。","a":true,"e":"鉄筋コンクリート造（RC造）は耐火性・耐久性に優れています。ただし、鉄骨造は熱に弱く、耐火被覆が必要です。"}];

const EXAMS=[[{"cat":"権利関係","q":"制限行為能力者が行った法律行為は、行為能力者であることを信じさせるため詐術を用いた場合であっても、取り消すことができる。","a":false,"e":"制限行為能力者が詐術を用いた場合、その行為を取り消すことはできません。"},{"cat":"権利関係","q":"AがBの詐欺により土地の売買契約を締結した場合、Aは善意無過失の第三者Cに対しても、当該契約の取消しを主張することができる。","a":false,"e":"詐欺による取消しは、善意無過失の第三者には対抗できません（民法96条3項）。"},{"cat":"権利関係","q":"AがBの強迫により土地の売買契約を締結した場合、Aは善意無過失の第三者Cに対しても、当該契約の取消しを主張することができる。","a":true,"e":"強迫による取消しには第三者保護規定がないため、善意無過失の第三者に対しても取消しを主張できます。"},{"cat":"権利関係","q":"無権代理人Aが本人Bを単独で相続した場合、Aが行った無権代理行為は当然に有効となる。","a":true,"e":"無権代理人が本人を相続した場合、追認拒否は信義則に反するため、当然に有効となります。"},{"cat":"権利関係","q":"消滅時効は、権利を行使することができることを知った時から10年間行使しないときに完成する。","a":false,"e":"「知った時から5年」または「権利を行使できる時から10年」のいずれか早い方で完成します。知った時からは5年です。"},{"cat":"権利関係","q":"不動産の物権変動において、背信的悪意者は民法177条の「第三者」に該当するため、登記がなければ対抗できない。","a":false,"e":"背信的悪意者は「第三者」に該当しないため、登記がなくても物権変動を対抗できます。"},{"cat":"権利関係","q":"抵当権設定時に土地が更地であった場合、その後に建物が建築されても法定地上権は成立しない。","a":true,"e":"法定地上権の成立には「抵当権設定時に建物が存在すること」が絶対条件です。更地に設定後の建築では成立しません。"},{"cat":"権利関係","q":"売主の契約不適合責任に基づく買主の代金減額請求は、まず追完の催告をすることなく、直ちに行うことができる。","a":false,"e":"代金減額請求は原則として、まず売主に追完の催告をする必要があります。催告なしで請求できるのは例外的な場合のみです。"},{"cat":"権利関係","q":"連帯債務者の一人に対する履行の請求は、他の連帯債務者に対しても効力を生ずる。","a":false,"e":"令和2年改正により、履行の請求は相対効となりました。絶対効があるのは弁済・更改・混同・相殺の4つのみです。"},{"cat":"権利関係","q":"普通借地権の当初の存続期間は30年であり、これより短い期間を定めた場合は30年となる。","a":true,"e":"普通借地権の存続期間は最低30年です。借地人に不利な特約（短縮する特約）は無効となり、30年に修正されます。"},{"cat":"権利関係","q":"定期建物賃貸借契約は、公正証書によらなければ締結することができない。","a":false,"e":"定期建物賃貸借は書面であれば足り、公正証書に限定されません。ただし、更新がない旨を書面で説明する必要があります。"},{"cat":"権利関係","q":"相続人が配偶者と子2人の場合、配偶者の法定相続分は2分の1である。","a":true,"e":"配偶者と子が相続人の場合、配偶者が1/2、子が1/2（子2人なら各1/4）です。"},{"cat":"権利関係","q":"区分所有法において、建替え決議は区分所有者及び議決権の各4分の3以上の多数で決する。","a":false,"e":"建替え決議は各5分の4以上が必要です。4分の3以上は規約の設定・変更・廃止や共用部分の重大変更の要件です。"},{"cat":"権利関係","q":"不動産登記には公信力があるため、登記を信頼して取引した者は保護される。","a":false,"e":"日本の不動産登記制度には公信力はありません。登記を信頼しても、真の権利者でなければ権利を取得できません。"},{"cat":"法令上の制限","q":"市街化区域においては、1,000㎡以上の開発行為を行う場合、原則として開発許可を受けなければならない。","a":true,"e":"市街化区域では1,000㎡以上の開発行為に開発許可が必要です。市街化調整区域では面積に関わらず原則許可が必要です。"},{"cat":"法令上の制限","q":"市街化調整区域において、農林漁業を営む者の居住用建築物を建築する目的で行う開発行為は、開発許可が必要である。","a":false,"e":"市街化区域以外では、農林漁業を営む者の居住用建築物は開発許可不要です。ただし、市街化区域では許可が必要です。"},{"cat":"法令上の制限","q":"前面道路の幅員が12m未満の場合、住居系用途地域における容積率は、前面道路の幅員に10分の6を乗じた数値以下でなければならない。","a":false,"e":"住居系用途地域では幅員×4/10です。6/10はその他の用途地域（商業系等）に適用されます。"},{"cat":"法令上の制限","q":"建ぺい率の角地緩和（+10%）と防火地域内の耐火建築物の緩和（+10%）は、併用することができる。","a":true,"e":"両方の緩和は併用可能で、合計+20%となります。"},{"cat":"法令上の制限","q":"建築基準法上の道路とは、原則として幅員6m以上のものをいう。","a":false,"e":"原則として幅員4m以上です。特定行政庁が指定した区域では6m以上となる場合があります。"},{"cat":"法令上の制限","q":"農地法第3条の許可権者は、都道府県知事である。","a":false,"e":"3条（権利移動）の許可権者は農業委員会です。都道府県知事が許可するのは4条・5条です。"},{"cat":"法令上の制限","q":"国土利用計画法の事後届出は、権利取得者（買主）が契約締結後2週間以内に届け出なければならない。","a":true,"e":"届出義務者は権利取得者（買主）であり、契約締結後2週間以内に届出が必要です。"},{"cat":"法令上の制限","q":"市街化区域内の農地を転用する場合、農地法第4条の許可を受ける必要がある。","a":false,"e":"市街化区域内の農地の転用（4条・5条）は、農業委員会への届出で足ります。ただし、3条（権利移動のみ）は許可が必要です。"},{"cat":"税・その他","q":"不動産取得税は、相続により不動産を取得した場合にも課税される。","a":false,"e":"相続による取得は非課税です。ただし、贈与による取得は課税されます。"},{"cat":"税・その他","q":"固定資産税の賦課期日は、毎年1月1日である。","a":true,"e":"賦課期日は毎年1月1日です。年の途中で売買があっても、1月1日時点の所有者が納税義務を負います。"},{"cat":"税・その他","q":"居住用財産の3,000万円特別控除は、所有期間が10年を超えていなければ適用を受けることができない。","a":false,"e":"3,000万円特別控除は所有期間の長短を問わず適用可能です。10年超が要件なのは軽減税率の特例です。"},{"cat":"税・その他","q":"居住用財産の3,000万円特別控除と買換え特例は、併用することができる。","a":false,"e":"3,000万円控除と買換え特例は選択適用（併用不可）です。なお、3,000万円控除と軽減税率の特例は併用可能です。"},{"cat":"税・その他","q":"印紙税は、電子契約により締結した場合には課税されない。","a":true,"e":"印紙税は紙の文書に課税されるため、電子契約には課税されません。"},{"cat":"税・その他","q":"登録免許税は、不動産の所在する都道府県が課する税である。","a":false,"e":"登録免許税は国税です。都道府県税ではありません。"},{"cat":"税・その他","q":"不動産の表示に関する公正競争規約において、徒歩による所要時間は道路距離80mにつき1分で算出する。","a":true,"e":"徒歩時間は80mにつき1分で算出し、端数が生じた場合は切り上げます。"},{"cat":"税・その他","q":"住宅金融支援機構は、一般の個人に対して直接に住宅ローンの貸付けを行うことを主な業務としている。","a":false,"e":"機構は直接融資を原則行いません。証券化支援業務（フラット35）が主な業務です。"},{"cat":"宅建業法","q":"自ら所有するアパートを賃貸する行為は、宅地建物取引業に該当するため、免許を受ける必要がある。","a":false,"e":"自ら貸主として賃貸することは宅建業に該当しないため、免許は不要です。"},{"cat":"宅建業法","q":"宅建業の免許の有効期間は5年であり、更新の申請は有効期間満了の90日前から30日前までに行わなければならない。","a":true,"e":"免許の有効期間は5年で、更新申請は90日前から30日前までです。"},{"cat":"宅建業法","q":"法人の役員が拘禁刑以上の刑に処せられた場合、その法人は免許を受けることができない。","a":true,"e":"法人の役員が欠格事由に該当する場合、法人自体も免許を受けることができません。"},{"cat":"宅建業法","q":"宅地建物取引士の独占業務は、重要事項の説明、35条書面への記名、及び37条書面への記名の3つである。","a":true,"e":"この3つが独占業務です。書面の交付自体は宅建士でなくても行えます。"},{"cat":"宅建業法","q":"専任の宅地建物取引士は、事務所ごとに業務に従事する者10人に1人以上の割合で設置しなければならない。","a":false,"e":"5人に1人以上です。10人に1人ではありません。"},{"cat":"宅建業法","q":"営業保証金は、主たる事務所につき1,000万円、従たる事務所1箇所につき500万円を供託しなければならない。","a":true,"e":"営業保証金は主たる事務所1,000万円、従たる事務所ごとに500万円です。弁済業務保証金分担金（主60万円/従30万円）と混同しないよう注意が必要です。"},{"cat":"宅建業法","q":"専属専任媒介契約の場合、依頼者は自ら発見した相手方と直接売買契約を締結することができる。","a":false,"e":"専属専任媒介では自己発見取引もできません。自己発見取引ができるのは専任媒介と一般媒介です。"},{"cat":"宅建業法","q":"専任媒介契約を締結した宅建業者は、契約締結の日から7日以内に指定流通機構に登録しなければならない。","a":true,"e":"専任媒介は7日以内、専属専任媒介は5日以内にレインズに登録する義務があります。"},{"cat":"宅建業法","q":"重要事項の説明は、売買契約の締結と同時に行えばよい。","a":false,"e":"重要事項の説明は契約締結「前」に行わなければなりません。契約と同時では遅すぎます。"},{"cat":"宅建業法","q":"代金の額及びその支払時期は、35条書面（重要事項説明書）の記載事項である。","a":false,"e":"代金の額・支払時期・方法は37条書面の記載事項です。35条書面の記載事項ではありません。"},{"cat":"宅建業法","q":"37条書面は、売主及び買主の双方に交付しなければならない。","a":true,"e":"37条書面は契約の両当事者に交付が必要です。35条書面が取得者・借主のみに交付するのとは異なります。"},{"cat":"宅建業法","q":"宅建業者が自ら売主となる場合の8種制限は、買主が宅建業者であっても適用される。","a":false,"e":"8種制限は業者間取引には適用されません。業者が売主で一般消費者が買主の場合にのみ適用されます。"},{"cat":"宅建業法","q":"宅建業者が自ら売主となる場合、受領する手付金の額は代金の10分の2を超えてはならない。","a":true,"e":"手付金は代金の20%（10分の2）が上限です。受領した手付は解約手付とみなされます。"},{"cat":"宅建業法","q":"クーリングオフは、事務所で買受けの申込みをした場合にも適用される。","a":false,"e":"クーリングオフは「事務所等以外」の場所で申込み・契約をした場合にのみ適用されます。"},{"cat":"宅建業法","q":"売買代金が500万円の場合、媒介報酬の上限額は代金の3%+6万円で計算する。","a":true,"e":"400万円超の場合は「3%+6万円」の速算式が適用されます。500万円×3%+6万円=21万円（税別）が上限です。"},{"cat":"宅建業法","q":"賃貸借の媒介報酬は、貸主及び借主から合計で借賃の2ヶ月分まで受領することができる。","a":false,"e":"賃貸の媒介報酬は貸主・借主合計で借賃の1ヶ月分が上限です。"},{"cat":"宅建業法","q":"宅建業者は、その事務所ごとに従業者名簿を備え、最終の記載をした日から10年間保存しなければならない。","a":true,"e":"従業者名簿の保存期間は最終記載日から10年間です。帳簿は5年間（自ら売主の新築は10年間）です。"},{"cat":"宅建業法","q":"宅地建物取引士の登録の移転は、義務ではなく任意である。","a":true,"e":"登録の移転は任意であり、義務ではありません。移転する場合も新たな試験を受ける必要はありません。"},{"cat":"宅建業法","q":"宅建業者が広告を行う場合、建築確認等の処分前であっても、取引態様を明示すれば広告をすることができる。","a":false,"e":"未完成物件は建築確認等の処分後でなければ広告も契約もできません。取引態様の明示の有無は関係ありません。"},{"cat":"宅建業法","q":"住宅瑕疵担保履行法における資力確保措置（保証金供託または保険加入）の対象は、新築住宅の売主である宅建業者に限られる。","a":true,"e":"資力確保措置の対象は新築住宅の売主たる宅建業者です。中古住宅や賃貸は対象外です。"}],[{"cat":"権利関係","q":"成年被後見人が日用品の購入をした場合、成年後見人はその行為を取り消すことができる。","a":false,"e":"日用品の購入その他日常生活に関する行為は、取り消すことができません。"},{"cat":"権利関係","q":"虚偽表示による契約の無効は、善意の第三者に対抗することができない。この場合の「善意」には無過失であることも必要である。","a":false,"e":"虚偽表示の第三者保護は「善意」で足り、無過失までは要求されません。詐欺（善意無過失が必要）との違いに注意です。"},{"cat":"権利関係","q":"錯誤による意思表示は、表意者に重大な過失がある場合、相手方が悪意であっても取り消すことができない。","a":false,"e":"表意者に重大な過失があっても、相手方が悪意または重過失の場合は例外的に取消し可能です。"},{"cat":"権利関係","q":"本人が無権代理人を相続した場合、本人は無権代理行為の追認を拒否することができる。","a":true,"e":"本人が無権代理人を相続しても、本人としての追認拒否権は消滅しません。無権代理人が本人を相続した場合（当然有効）とは逆の結論です。"},{"cat":"権利関係","q":"取得時効において、善意無過失の占有者は10年間の占有で所有権を取得でき、その善意無過失は占有開始時を基準に判断する。","a":true,"e":"善意無過失の判断は占有開始時です。途中で悪意になっても影響しません。善意無過失なら10年、それ以外は20年です。"},{"cat":"権利関係","q":"相続により不動産を取得した場合、法定相続分の範囲内であっても、登記がなければ第三者に対抗できない。","a":false,"e":"法定相続分の範囲内は登記なくても対抗可能です。法定相続分を「超える」部分のみ登記が必要です（令和元年改正）。"},{"cat":"権利関係","q":"抵当権者は、抵当不動産の賃料に対しても物上代位を行使できるが、賃料の払渡し前に差押えをする必要がある。","a":true,"e":"物上代位は賃料にも及びますが、「払渡し又は引渡しの前に差押え」をすることが必要条件です。"},{"cat":"権利関係","q":"契約の解除は、債務者に帰責事由がなければすることができない。","a":false,"e":"令和2年改正により、解除に帰責事由は不要です。帰責事由が必要なのは損害賠償請求です。"},{"cat":"権利関係","q":"個人の根保証契約は、極度額を定めなくても有効に成立する。","a":false,"e":"個人根保証契約は極度額の定めがなければ無効です（民法465条の2）。"},{"cat":"権利関係","q":"賃貸人の地位は、目的不動産の所有権が移転した場合、新所有者に当然に移転する。","a":true,"e":"令和2年改正で明文化されました。賃貸人の地位は所有権移転に伴い当然に新所有者に移転します。"},{"cat":"権利関係","q":"定期建物賃貸借契約において、床面積200㎡未満の居住用建物の場合、やむを得ない事情があれば賃借人から中途解約の申入れができる。","a":true,"e":"定期借家の中途解約は、①床面積200㎡未満、②居住用、③やむを得ない事情、の3要件を満たす場合にのみ認められます。"},{"cat":"権利関係","q":"遺留分侵害額請求は、金銭の支払を請求する方法によってのみ行使することができる。","a":true,"e":"令和元年改正により、遺留分侵害額請求は金銭請求に一本化されました。現物返還は認められません。"},{"cat":"権利関係","q":"仮登記には対抗力があり、仮登記をしておけば第三者に権利を主張することができる。","a":false,"e":"仮登記には対抗力はなく、順位保全効のみです。本登記をして初めて対抗力が発生します。"},{"cat":"権利関係","q":"相続の放棄は、相続人全員の合意があれば、家庭裁判所への申述なしに行うことができる。","a":false,"e":"相続放棄は家庭裁判所への申述が必要です。相続人間の合意だけでは放棄の効力は生じません。"},{"cat":"法令上の制限","q":"市街化区域には用途地域を必ず定めなければならないが、市街化調整区域には原則として用途地域を定めないものとされている。","a":true,"e":"市街化区域は用途地域必須、市街化調整区域は原則不要です。"},{"cat":"法令上の制限","q":"都市計画区域外においても、10,000㎡以上の開発行為を行う場合には開発許可が必要である。","a":true,"e":"都市計画区域外でも10,000㎡以上は許可が必要です。非線引き・準都市計画区域は3,000㎡以上です。"},{"cat":"法令上の制限","q":"2項道路に接する敷地においては、道路の中心線から2mの線まで後退（セットバック）する必要があり、そのセットバック部分は敷地面積に算入される。","a":false,"e":"セットバック部分は敷地面積に算入できません。容積率・建ぺい率の計算上、除外されます。"},{"cat":"法令上の制限","q":"日影規制は、商業地域、工業地域及び工業専用地域には適用されない。","a":true,"e":"日影規制は住居系の用途地域に適用され、商業・工業・工業専用地域には適用されません。"},{"cat":"法令上の制限","q":"建築確認は、都市計画区域内においてはすべての建築物について必要である。","a":true,"e":"都市計画区域内では、規模に関係なくすべての建築物に建築確認が必要です。区域外は特殊・大規模建築物のみです。"},{"cat":"法令上の制限","q":"市街化区域内の農地を農地以外に転用する場合、農地法第4条の許可が必要である。","a":false,"e":"市街化区域内の転用（4条・5条）は、農業委員会への届出で足ります。許可は不要です。"},{"cat":"法令上の制限","q":"相続により農地を取得した場合、農地法第3条の許可は不要であるが、農業委員会への届出は必要である。","a":true,"e":"相続による取得は3条許可不要ですが、届出は必要です。"},{"cat":"法令上の制限","q":"国土利用計画法の事後届出において、届出が必要な面積は、市街化区域では2,000㎡以上、都市計画区域外では10,000㎡以上である。","a":true,"e":"市街化区域2,000㎡以上、市街化調整区域・非線引き5,000㎡以上、都市計画区域外10,000㎡以上です。"},{"cat":"税・その他","q":"不動産取得税の課税主体は市町村であり、固定資産税の課税主体は都道府県である。","a":false,"e":"逆です。不動産取得税は都道府県税、固定資産税は市町村税です。"},{"cat":"税・その他","q":"年の途中で不動産を売買した場合、買主がその年度の固定資産税を納付する義務を負う。","a":false,"e":"固定資産税は1月1日時点の所有者に課税されます。年の途中の売買では、1月1日の所有者が全額負担します。"},{"cat":"税・その他","q":"居住用財産の軽減税率の特例は、所有期間が10年を超える場合に適用され、3,000万円特別控除との併用が可能である。","a":true,"e":"軽減税率は所有期間10年超が要件で、3,000万円控除と併用可能です。買換え特例とは併用不可です。"},{"cat":"税・その他","q":"居住用財産の3,000万円特別控除は、配偶者に譲渡した場合にも適用を受けることができる。","a":false,"e":"配偶者、直系血族、生計を一にする親族等への譲渡は適用除外です。"},{"cat":"税・その他","q":"記載金額のない不動産売買契約書には、印紙税は課税されない。","a":false,"e":"記載金額がなくても200円の印紙税が課税されます。非課税ではありません。"},{"cat":"税・その他","q":"不動産の鑑定評価においては、原価法、取引事例比較法、収益還元法の3手法のうち、いずれか1つを適用すれば足りる。","a":false,"e":"3手法を併用し、相互に関連づけて最終的な鑑定評価額を決定します。1手法のみでは不十分です。"},{"cat":"税・その他","q":"地価公示における標準地の鑑定評価は、2人以上の不動産鑑定士が行わなければならない。","a":true,"e":"2人以上の不動産鑑定士が鑑定評価を行い、土地鑑定委員会が審査・調整します。"},{"cat":"税・その他","q":"「新築」と表示できるのは、建築後1年未満であれば、入居の有無を問わない。","a":false,"e":"「新築」は建築後1年未満かつ未入居の両方が必要です。入居済みであれば新築とは表示できません。"},{"cat":"宅建業法","q":"宅建業の免許を受けるためには、事務所ごとに業務に従事する者5人に1人以上の割合で、専任の宅地建物取引士を設置しなければならない。","a":true,"e":"専任の宅建士は5人に1人以上の割合で設置義務があります。不足した場合は2週間以内に補充が必要です。"},{"cat":"宅建業法","q":"甲県に本店、乙県に支店を有する宅建業者は、国土交通大臣の免許を受けなければならない。","a":true,"e":"2以上の都道府県に事務所を設置する場合は国土交通大臣免許、1つの都道府県のみなら都道府県知事免許です。"},{"cat":"宅建業法","q":"破産手続開始の決定を受けた者は、復権を得てから5年を経過しなければ免許を受けることができない。","a":false,"e":"破産者は復権を得ればすぐに免許を受けることができます。5年間待つ必要はありません。"},{"cat":"宅建業法","q":"宅建業者は、その業務に関して知り得た秘密について、退職後は守秘義務を負わない。","a":false,"e":"守秘義務は退職後も継続します。正当な理由なく秘密を漏らしてはなりません。"},{"cat":"宅建業法","q":"保証協会の社員は、営業保証金を供託する必要はないが、弁済業務保証金分担金を納付しなければならない。","a":true,"e":"保証協会の社員は営業保証金の供託に代えて、分担金（主60万円/従30万円）を納付します。"},{"cat":"宅建業法","q":"宅建業者は、2つの保証協会に同時に加入することができる。","a":false,"e":"保証協会への二重加入は認められていません。いずれか1つの協会にのみ加入できます。"},{"cat":"宅建業法","q":"重要事項の説明は宅地建物取引士が行わなければならないが、35条書面の交付は宅建士でなくても行うことができる。","a":true,"e":"説明は宅建士の独占業務ですが、書面の「交付」自体は宅建士でなくても可能です。"},{"cat":"宅建業法","q":"宅建業者間の取引においては、35条書面の交付自体を省略することができる。","a":false,"e":"業者間取引では説明は省略可能ですが、35条書面の「交付」は省略できません。"},{"cat":"宅建業法","q":"専任媒介契約及び専属専任媒介契約の有効期間は、いずれも3ヶ月以内であり、自動更新の特約は無効である。","a":true,"e":"有効期間は3ヶ月以内で、3ヶ月を超える特約は3ヶ月に短縮されます。更新は依頼者の申出が必要です。"},{"cat":"宅建業法","q":"売買代金400万円（税抜）の場合、媒介報酬の上限額は「代金×3%+6万円」の速算式で計算する。","a":false,"e":"「3%+6万円」は400万円「超」に適用されます。ちょうど400万円は「4%+2万円」で計算し、上限は18万円（税別）です。"},{"cat":"宅建業法","q":"宅建業者が自ら売主として損害賠償の予定額を定める場合、代金の10分の2を超える部分は無効となる。","a":true,"e":"損害賠償の予定＋違約金の合計が代金の20%を超える部分のみ無効です。全体が無効になるわけではありません。"},{"cat":"宅建業法","q":"クーリングオフは、書面で告げられた日から起算して8日以内に、書面により行わなければならない。","a":true,"e":"クーリングオフは書面での告知日から8日以内に書面で行います。ただし、引渡し＋代金全額支払い後は行使できません。"},{"cat":"宅建業法","q":"未完成物件については、建築確認等の処分がなされる前であっても、広告をすることができる。","a":false,"e":"未完成物件は建築確認等の処分後でなければ広告も契約もできません。"},{"cat":"宅建業法","q":"宅建業者は、帳簿を各事業年度の末日に閉鎖し、閉鎖後5年間保存しなければならない。","a":true,"e":"帳簿は5年間保存です。ただし、自ら売主となる新築住宅の場合は10年間保存が必要です。"},{"cat":"宅建業法","q":"宅建業者が免許の更新を申請した場合、有効期間満了日までに処分がなされないときは、従前の免許は更新の処分がなされるまでの間、なお効力を有する。","a":true,"e":"更新申請中に有効期間が満了しても、処分がなされるまでは従前の免許が引き続き有効です。"},{"cat":"宅建業法","q":"宅地建物取引士証の有効期間は5年であり、更新するためには法定講習を受講しなければならない。","a":true,"e":"宅建士証の有効期間は5年で、更新時には都道府県知事が指定する法定講習の受講が必要です。"},{"cat":"宅建業法","q":"信託業法第3条の免許を受けた信託会社は、国土交通大臣の免許を受けなくても、宅建業を営むことができる。","a":true,"e":"信託会社は免許不要で、国土交通大臣への届出により宅建業を営むことができます。"},{"cat":"宅建業法","q":"案内所を他の都道府県に設置した場合、免許換えの手続が必要である。","a":false,"e":"案内所の設置は事務所の新設ではないため、免許換えは不要です。届出は必要な場合があります。"},{"cat":"宅建業法","q":"宅建業者は、従業者に従業者証明書を携帯させなければならず、取引の関係者から請求があった場合は提示しなければならない。","a":true,"e":"従業者証明書の携帯義務と、取引関係者からの請求時の提示義務があります。"},{"cat":"宅建業法","q":"免許権者は、宅建業者に対し、指示処分、業務停止処分及び免許取消処分を行うことができる。","a":true,"e":"免許権者は3種類すべての処分が可能です。免許権者以外の都道府県知事は指示処分と業務停止処分のみ可能です。"}],[{"cat":"権利関係","q":"心裡留保による意思表示は、原則として有効であるが、相手方が表意者の真意を知っていた場合は無効となる。","a":true,"e":"心裡留保は原則有効ですが、相手方が悪意（真意を知っていた）または有過失の場合は無効です。"},{"cat":"権利関係","q":"代理人が自己の利益のために代理権を行使した場合（代理権の濫用）、相手方が善意無過失であれば、本人に効果が帰属する。","a":true,"e":"代理権の濫用は、相手方が悪意または有過失の場合にのみ無権代理とみなされます。善意無過失の相手方は保護されます。"},{"cat":"権利関係","q":"時効の援用は、裁判所が職権で行うことができる。","a":false,"e":"時効は当事者が援用しなければ、裁判所が職権で適用することはできません。"},{"cat":"権利関係","q":"不動産の取消し前の第三者は善意無過失であれば保護されるが、取消し後の第三者は登記の先後で優劣が決まる。","a":true,"e":"取消し前の第三者は善意無過失で保護、取消し後の第三者とは対抗関係（登記の先後）となります。"},{"cat":"権利関係","q":"抵当権消滅請求は、主たる債務者及び保証人も行使することができる。","a":false,"e":"抵当権消滅請求は第三取得者のみが行使可能です。主債務者・保証人は行使できません。"},{"cat":"権利関係","q":"契約不適合を買主が知った場合、1年以内に権利を行使しなければ、売主の責任を追及できなくなる。","a":false,"e":"改正後は「1年以内に通知」すれば足ります。旧法の「1年以内に権利行使」とは異なります。"},{"cat":"権利関係","q":"連帯保証人には、催告の抗弁権及び検索の抗弁権がない。","a":true,"e":"連帯保証人にはこの2つの抗弁権がありません。通常の保証人には両方の抗弁権があります。"},{"cat":"権利関係","q":"敷金返還義務は、賃貸借契約が終了すれば、建物の明渡しがなくても発生する。","a":false,"e":"敷金返還義務は「賃貸借の終了」＋「目的物の明渡し」の両方がそろって発生します。"},{"cat":"権利関係","q":"普通借家契約において、1年未満の期間を定めた場合は、期間の定めのない賃貸借とみなされる。","a":true,"e":"普通借家は1年未満の期間を定めると「期間の定めなし」とみなされます。定期借家にはこの規定はありません。"},{"cat":"権利関係","q":"造作買取請求権は強行規定であり、特約により排除することはできない。","a":false,"e":"造作買取請求権は特約で排除可能です（強行規定ではありません）。"},{"cat":"権利関係","q":"遺留分は、相続人が直系尊属のみの場合は被相続人の財産の3分の1、それ以外の場合は2分の1である。","a":true,"e":"直系尊属のみ1/3、それ以外1/2です。なお、兄弟姉妹には遺留分がありません。"},{"cat":"権利関係","q":"区分所有法において、規約の設定・変更・廃止は、区分所有者及び議決権の各過半数で決する。","a":false,"e":"規約の設定・変更・廃止は各4分の3以上が必要です。過半数は普通決議（通常の管理行為等）の要件です。"},{"cat":"権利関係","q":"相続登記は任意であり、申請しなくても罰則はない。","a":false,"e":"令和6年4月から相続登記が義務化され、3年以内に申請しなければ過料の対象となります。"},{"cat":"権利関係","q":"工作物責任において、占有者は過失がなければ免責されるが、所有者は無過失責任を負う。","a":true,"e":"占有者は過失なしを立証すれば免責されますが、所有者は最終的に無過失責任を負います。"},{"cat":"法令上の制限","q":"準都市計画区域においては、市街地開発事業に関する都市計画を定めることができる。","a":false,"e":"準都市計画区域では市街地開発事業を定めることはできません。"},{"cat":"法令上の制限","q":"高度地区と高度利用地区は、いずれも建築物の高さに関する制限を定めるものである。","a":false,"e":"高度地区は建築物の「高さ」の最高限度・最低限度、高度利用地区は「容積率」の最高限度・最低限度等を定めます。内容が異なります。"},{"cat":"法令上の制限","q":"用途変更により200㎡を超える特殊建築物とする場合、建築確認が必要である。","a":true,"e":"200㎡超の特殊建築物への用途変更は建築確認が必要です。類似用途間の変更は不要です。"},{"cat":"法令上の制限","q":"接道義務として、建築物の敷地は建築基準法上の道路に4m以上接しなければならない。","a":false,"e":"接道義務は「2m以上」接することです。4mではありません。地方公共団体の条例で付加は可能ですが緩和はできません。"},{"cat":"法令上の制限","q":"防火地域内の耐火建築物は建ぺい率が10%加算され、角地にある場合はさらに10%加算される。","a":true,"e":"防火地域内耐火建築物+10%と角地緩和+10%は併用可能で、合計+20%となります。"},{"cat":"法令上の制限","q":"農地を相続により取得した場合、農地法第3条の許可も届出も不要である。","a":false,"e":"相続による取得は3条許可は不要ですが、農業委員会への届出は必要です。"},{"cat":"法令上の制限","q":"国土利用計画法の事後届出において、当事者の一方が国または地方公共団体の場合は届出不要である。","a":true,"e":"国・地方公共団体が当事者の場合は届出不要です。"},{"cat":"法令上の制限","q":"宅地造成等工事規制区域内で盛土1mを超える造成工事を行う場合、許可が必要である。","a":true,"e":"盛土1m超、切土2m超、切盛合わせて2m超、面積500㎡超のいずれかに該当すれば許可が必要です。"},{"cat":"税・その他","q":"不動産取得税において、新築住宅の課税標準から控除される額は1,500万円である。","a":false,"e":"控除額は1,200万円です。認定長期優良住宅の場合は1,300万円です。"},{"cat":"税・その他","q":"住宅用地の固定資産税の特例として、200㎡以下の部分（小規模住宅用地）は課税標準が6分の1に軽減される。","a":true,"e":"小規模住宅用地（200㎡以下）は1/6、一般住宅用地（200㎡超の部分）は1/3に軽減されます。"},{"cat":"税・その他","q":"居住用財産を譲渡した場合、居住しなくなった日から5年以内に譲渡すれば3,000万円特別控除を受けることができる。","a":false,"e":"居住しなくなった日から「3年目の年末まで」です。5年ではありません。"},{"cat":"税・その他","q":"土地の所有権移転登記に係る登録免許税の税率は、原則として1,000分の20である。","a":true,"e":"原則20/1000（2%）です。特例として令和8年3月末まで15/1000に軽減されています。"},{"cat":"税・その他","q":"不動産鑑定評価における収益還元法には、直接還元法とDCF法の2つの方法がある。","a":true,"e":"直接還元法は一期間の純収益を還元利回りで割り戻す方法、DCF法は将来の収益を現在価値に割り引く方法です。"},{"cat":"税・その他","q":"地価公示の標準地は、都市計画区域内に限定される。","a":false,"e":"都市計画区域外でも、必要がある場合は標準地を設定することができます。"},{"cat":"税・その他","q":"住宅金融支援機構のフラット35は、機構が直接融資を行う制度である。","a":false,"e":"フラット35は民間金融機関が融資し、機構がその債権を買い取る「証券化支援業務」です。直接融資ではありません。"},{"cat":"税・その他","q":"不動産広告において、建築後1年未満の未入居物件は「新築」と表示することができる。","a":true,"e":"「新築」は建築後1年未満かつ未入居の両方を満たす場合に表示可能です。"},{"cat":"宅建業法","q":"農業協同組合が組合員の所有する宅地の売却の代理を業として営む場合、宅建業の免許が必要である。","a":true,"e":"農業協同組合は免許不要団体には該当しません。宅建業を営む場合は免許が必要です。"},{"cat":"宅建業法","q":"信託会社が宅建業を営もうとする場合、国土交通大臣の免許を受けなければならない。","a":false,"e":"信託会社は免許不要で、国土交通大臣への届出により宅建業を営むことができます。"},{"cat":"宅建業法","q":"法人の役員が傷害罪で罰金刑に処せられた場合、その刑の執行が終わった日から5年を経過しなければ、当該法人は免許を受けることができない。","a":true,"e":"傷害罪で罰金刑は欠格事由に該当します。刑の執行終了から5年間は免許を受けることができません。"},{"cat":"宅建業法","q":"宅地建物取引士が事務禁止処分を受けた場合、処分期間中であっても登録の移転をすることができる。","a":true,"e":"事務禁止処分中でも登録の移転は可能です。"},{"cat":"宅建業法","q":"保証協会の社員が社員の地位を失った場合、1週間以内に営業保証金を供託しなければならない。","a":true,"e":"保証協会を脱退した場合、1週間以内に営業保証金を供託する必要があります。"},{"cat":"宅建業法","q":"一般媒介契約の場合、宅建業者は指定流通機構への登録義務及び業務処理状況の報告義務を負わない。","a":true,"e":"一般媒介にはレインズ登録義務も報告義務もありません。これらの義務は専任・専属専任のみです。"},{"cat":"宅建業法","q":"専属専任媒介契約では、宅建業者は1週間に1回以上の頻度で業務処理状況を報告しなければならない。","a":true,"e":"専属専任は1週間に1回以上、専任は2週間に1回以上の報告義務があります。"},{"cat":"宅建業法","q":"宅建業者が買主である場合、重要事項の説明及び35条書面の交付はいずれも省略することができる。","a":false,"e":"業者が買主の場合、説明は省略できますが、35条書面の交付は省略できません。"},{"cat":"宅建業法","q":"37条書面に記名するのは宅地建物取引士であるが、書面の内容を説明する義務はない。","a":true,"e":"37条書面は宅建士の記名が必要ですが、説明義務はありません。35条書面との違いです。"},{"cat":"宅建業法","q":"クーリングオフにより契約が解除された場合、宅建業者は損害賠償や違約金の支払を請求することができる。","a":false,"e":"クーリングオフによる解除の場合、業者は損害賠償や違約金を請求できません。受領した手付金等は速やかに返還しなければなりません。"},{"cat":"宅建業法","q":"宅建業者が自ら売主として売買する場合、損害賠償の予定額と違約金を合算した額が代金の20%を超えるときは、超える部分のみが無効となる。","a":true,"e":"20%を超える「部分」のみ無効です。契約全体や損害賠償の定め全体が無効になるわけではありません。"},{"cat":"宅建業法","q":"宅建業者が自ら売主となる場合、他人物売買は一切禁止されている。","a":false,"e":"原則禁止ですが、当該物件を確実に取得できる場合（売買契約等がある場合）は例外的に可能です。"},{"cat":"宅建業法","q":"低廉な空家等（400万円以下）の売買の媒介の場合、売主から受領できる報酬は18万円＋消費税が上限である。","a":true,"e":"400万円以下の物件で現地調査費用がかかる場合、売主からは18万円+消費税まで受領可能です。"},{"cat":"宅建業法","q":"宅建業者は、誇大広告の禁止規定に違反した場合、免許を受けていなくても罰則の適用を受ける。","a":true,"e":"誇大広告の禁止は免許の有無に関わらず適用されます。宅建業法の規定の中でも適用範囲が広い条項です。"},{"cat":"宅建業法","q":"宅建業者は、取引態様の別を広告をする時と注文を受けた時にそれぞれ明示しなければならない。","a":true,"e":"取引態様の明示は、広告時と注文を受けた時の両方で必要です（遅滞なく明示）。"},{"cat":"宅建業法","q":"免許取消処分の聴聞は非公開で行わなければならない。","a":false,"e":"聴聞は公開で行います。"},{"cat":"宅建業法","q":"無免許で宅建業を営んだ者は、3年以下の拘禁刑もしくは300万円以下の罰金に処せられる。","a":true,"e":"無免許営業は3年以下の拘禁刑または300万円以下の罰金です。法人の場合は1億円以下の罰金です。"},{"cat":"宅建業法","q":"住宅瑕疵担保履行法に基づく資力確保措置の基準日は、毎年3月31日及び9月30日の年2回である。","a":false,"e":"基準日は毎年3月31日の年1回です。届出は基準日から3週間以内に行います。"},{"cat":"宅建業法","q":"宅建業者が自ら売主として新築住宅を販売する場合、保証金の供託と保険への加入を併用することができる。","a":true,"e":"保証金供託と保険加入の併用は認められています。"},{"cat":"宅建業法","q":"宅建業者は、事務所以外の場所で専任の宅地建物取引士を置くべき案内所等を設置する場合、免許権者及び案内所等の所在地を管轄する都道府県知事に届け出なければならない。","a":true,"e":"事務所以外の場所で契約行為等を行う案内所等を設置する場合、届出が必要です。"}],[{"cat":"権利関係","q":"被保佐人が保佐人の同意を得ずに行った不動産の売買契約は、当然に無効である。","a":false,"e":"当然無効ではなく、取消しの対象です。取り消されるまでは有効となります。"},{"cat":"権利関係","q":"未成年者が法定代理人の同意を得ずに行った法律行為は、未成年者本人のみが取り消すことができる。","a":false,"e":"未成年者本人だけでなく、法定代理人も取り消すことができます。"},{"cat":"権利関係","q":"詐欺による取消し前に現れた第三者は、善意無過失であれば保護される。","a":true,"e":"取消し前の第三者は善意無過失で保護されます。取消し後の第三者とは対抗関係（登記の先後）になります。"},{"cat":"権利関係","q":"表見代理が成立する場合、本人は無権代理人の行為について責任を負わなければならない。","a":true,"e":"表見代理が成立すると、代理行為は有効な代理行為として本人に効果が帰属します。"},{"cat":"権利関係","q":"時効完成後に債務者が債務を承認した場合でも、改めて時効を援用することができる。","a":false,"e":"時効完成後の債務承認は、信義則上、もはや時効を援用できなくなります。"},{"cat":"権利関係","q":"抵当権設定時に土地と建物が同一所有者に属し、競売により別々の所有者になった場合、法定地上権が成立する。","a":true,"e":"法定地上権の成立要件を満たします。①設定時に建物が存在、②同一所有者、③競売により別所有者、の3つです。"},{"cat":"権利関係","q":"買主が売主の契約不適合を知った時から1年以内に通知すれば、その後に具体的な請求をすることができる。","a":true,"e":"改正民法では「1年以内に通知」すれば足り、通知後に具体的な請求を行えます。"},{"cat":"権利関係","q":"事業のために負担した貸金等債務を主債務とする個人の保証契約は、公正証書で保証意思を確認しなければ効力を生じない。","a":true,"e":"事業用融資の個人保証は原則として公正証書による意思確認が必要です。ただし、主債務者の配偶者等は例外です。"},{"cat":"権利関係","q":"定期借地権のうち、事業用定期借地権は公正証書によって設定しなければならない。","a":true,"e":"事業用定期借地権は公正証書に限ります。一般定期借地権は書面で足り、公正証書に限定されません。"},{"cat":"権利関係","q":"借地上の建物が滅失した場合、借地権者は一切の対抗力を失う。","a":false,"e":"建物滅失後も、一定の事項を土地上の見やすい場所に掲示すれば、2年間は対抗力が維持されます。"},{"cat":"権利関係","q":"配偶者と兄弟姉妹が相続人の場合、配偶者の法定相続分は4分の3である。","a":true,"e":"配偶者＋兄弟姉妹の場合、配偶者3/4、兄弟姉妹1/4です。"},{"cat":"権利関係","q":"自筆証書遺言は、遺言者がその全文、日付及び氏名を自書し、押印しなければ無効である。","a":true,"e":"自筆証書遺言の要件は全文・日付・氏名の自書と押印です。ただし、財産目録はパソコン作成でも可能です。"},{"cat":"権利関係","q":"区分所有法において、管理者は必ず区分所有者の中から選任しなければならない。","a":false,"e":"管理者は区分所有者以外の者でもなれます。法人が管理者になることも可能です。"},{"cat":"権利関係","q":"不動産の所有権保存登記は、共同申請が原則である。","a":false,"e":"所有権保存登記は単独申請が可能です。共同申請が原則なのは所有権移転登記等です。"},{"cat":"法令上の制限","q":"非線引き区域における開発行為は、面積に関わらず開発許可が必要である。","a":false,"e":"非線引き区域では3,000㎡以上で許可が必要です。面積に関わらず必要なのは市街化調整区域です。"},{"cat":"法令上の制限","q":"田園住居地域は住居系の用途地域の一つであり、2018年に新設された。","a":true,"e":"田園住居地域は2018年に新設された13番目の用途地域です。"},{"cat":"法令上の制限","q":"建ぺい率が80%の地域で、かつ防火地域内の耐火建築物の場合、建ぺい率の制限はなくなる。","a":true,"e":"80%地域＋防火地域内耐火建築物は建ぺい率制限なし（100%）となります。"},{"cat":"法令上の制限","q":"既存不適格建築物は、違反建築物として是正命令の対象となる。","a":false,"e":"既存不適格建築物は違反建築物ではありません。ただし、増改築時には現行法に適合させる必要があります。"},{"cat":"法令上の制限","q":"特定行政庁は、建築基準法に違反した建築物について、所有者等に対して除却命令を出すことができる。","a":true,"e":"特定行政庁は違反建築物に対し、使用禁止や除却命令等を出すことができます。"},{"cat":"法令上の制限","q":"農地法第5条の許可を受けずに農地を転用目的で売買した場合、その契約は有効である。","a":false,"e":"許可を受けずに行った売買契約は無効です。また、原状回復命令の対象にもなります。"},{"cat":"法令上の制限","q":"国土利用計画法の届出において、届出義務者は売主（権利設定者）である。","a":false,"e":"届出義務者は権利取得者（買主）です。売主ではありません。"},{"cat":"法令上の制限","q":"盛土規制法において、盛土1m超または切土2m超の造成工事を行う場合、許可が必要である。","a":true,"e":"盛土1m超、切土2m超、切盛合わせて2m超、面積500㎡超のいずれかで許可が必要です。"},{"cat":"税・その他","q":"贈与により不動産を取得した場合、不動産取得税は課税されない。","a":false,"e":"贈与は課税対象です。非課税となるのは相続による取得です。"},{"cat":"税・その他","q":"新築住宅の固定資産税は、3年間（マンション等は5年間）にわたり税額が2分の1に減額される。","a":true,"e":"一般の新築住宅は3年間、3階建以上の耐火・準耐火建築物は5年間、税額が1/2に減額されます。"},{"cat":"税・その他","q":"長期譲渡所得とは、譲渡した年の1月1日において所有期間が5年を超えるものをいう。","a":true,"e":"1月1日時点で所有期間5年超が長期、5年以下が短期です。「1月1日」基準で判断します。"},{"cat":"税・その他","q":"印紙税を納付しなかった場合の過怠税は、本来の税額の3倍相当額が徴収される。","a":true,"e":"原則として本来の税額の3倍（税額＋過怠税2倍分）が徴収されます。自主申告の場合は1.1倍に軽減されます。"},{"cat":"税・その他","q":"住宅用家屋の登録免許税の軽減を受けるには、床面積が50㎡以上であることが必要である。","a":true,"e":"軽減には床面積50㎡以上、新築又は取得後1年以内に登記する等の要件があります。"},{"cat":"税・その他","q":"不動産鑑定士が鑑定評価を行う場合、地価公示の公示価格を「基準」としなければならない。","a":false,"e":"「基準」ではなく「規準」とします。「規準」と「基準」の違いが出題ポイントです。"},{"cat":"税・その他","q":"住宅金融支援機構のフラット35の融資対象となる一戸建ての床面積は、50㎡以上である。","a":false,"e":"一戸建ては70㎡以上、マンションは30㎡以上です。50㎡は登録免許税の軽減要件です。"},{"cat":"税・その他","q":"不動産広告における物件から最寄り駅までの徒歩時間は、物件の出入口から駅の出入口までの道路距離で算出する。","a":true,"e":"出入口から出入口までの道路距離を80mにつき1分で計算します。直線距離ではありません。"},{"cat":"宅建業法","q":"一棟のマンションを購入し、自ら借主を募集して不特定多数の者に賃貸する場合、宅建業の免許が必要である。","a":false,"e":"自ら貸主として賃貸する行為は宅建業に該当しないため、免許は不要です。"},{"cat":"宅建業法","q":"宅建業者の法人の役員が暴力団員である場合、当該法人は免許を受けることができない。","a":true,"e":"暴力団員等が役員にいる法人は免許の欠格事由に該当します。"},{"cat":"宅建業法","q":"宅建業者が死亡した場合、その相続人は死亡の事実を知った日から30日以内に届け出なければならない。","a":true,"e":"届出期限は「死亡した日から」ではなく「死亡を知った日から」30日以内です。"},{"cat":"宅建業法","q":"営業保証金は、金銭のほか国債証券や地方債証券等で供託することができる。","a":true,"e":"金銭のほか、国債証券（額面100%）、地方債証券（額面90%）等で供託可能です。"},{"cat":"宅建業法","q":"弁済業務保証金の還付があった場合、宅建業者は通知から2週間以内に不足額を納付しなければならない。","a":true,"e":"還付後の補充は通知から2週間以内です。"},{"cat":"宅建業法","q":"専任媒介契約では、依頼者は自ら発見した相手方と直接契約を締結することができる。","a":true,"e":"専任媒介では自己発見取引が可能です。自己発見取引もできないのは専属専任媒介だけです。"},{"cat":"宅建業法","q":"媒介契約書面（34条書面）には、宅地建物取引士が記名しなければならない。","a":false,"e":"34条書面への記名は宅建業者です。宅建士の記名が必要なのは35条と37条です。"},{"cat":"宅建業法","q":"IT重説（オンラインによる重要事項説明）は、賃貸借に限らず売買においても行うことができる。","a":true,"e":"令和3年以降、売買でもIT重説が可能になりました。"},{"cat":"宅建業法","q":"37条書面には、損害賠償の予定額について定めがない場合でも、その旨を記載しなければならない。","a":false,"e":"損害賠償の予定額は「定めがあるとき」のみ記載する任意的記載事項です。定めがなければ記載不要です。"},{"cat":"宅建業法","q":"宅建業者が自ら売主の場合、手付の性質に関わらず解約手付とみなされる。","a":true,"e":"自ら売主の場合、証約手付や違約手付として受領しても、解約手付としての性質が認められます。"},{"cat":"宅建業法","q":"クーリングオフは、物件の引渡しを受け、かつ代金の全額を支払った後は行使することができない。","a":true,"e":"引渡し＋代金全額支払いの両方が完了した後はクーリングオフ不可です。どちらか一方のみなら可能です。"},{"cat":"宅建業法","q":"宅建業者が自ら売主として売買する場合、契約不適合責任を民法より買主に不利にする特約は無効である。","a":true,"e":"8種制限により、買主に不利な特約は無効です。ただし、通知期間を引渡しから2年以上とする特約は有効です。"},{"cat":"宅建業法","q":"居住用建物の賃貸媒介で、依頼者の承諾がない場合、一方から受領できる報酬は借賃の半月分が上限である。","a":true,"e":"居住用建物の賃貸媒介は依頼者の承諾がなければ一方から半月分が上限です。"},{"cat":"宅建業法","q":"宅建業者は、帳簿を事務所ごとに備え、取引のあった都度記載しなければならない。","a":true,"e":"帳簿は事務所ごとに備え付け、取引の都度記載が必要です。保存期間は閉鎖後5年間です。"},{"cat":"宅建業法","q":"宅建業者は、標識を事務所に掲示する義務があるが、案内所等には掲示する必要がない。","a":false,"e":"標識は事務所だけでなく、案内所等にも掲示しなければなりません。"},{"cat":"宅建業法","q":"免許取消処分の前に行われる聴聞は、非公開で行わなければならない。","a":false,"e":"聴聞は公開で行います。非公開ではありません。"},{"cat":"宅建業法","q":"業務停止処分の期間は、最長で2年間である。","a":false,"e":"業務停止処分は1年以内です。2年ではありません。"},{"cat":"宅建業法","q":"住宅瑕疵担保履行法の届出は、基準日（3月31日）から3週間以内に行わなければならない。","a":true,"e":"基準日は毎年3月31日で、届出は3週間以内です。届出をしなければ新たな売買契約を締結できません。"},{"cat":"宅建業法","q":"宅建業者が自ら売主として新築住宅を販売する場合、保証金の供託と保険への加入を併用することができる。","a":true,"e":"供託と保険の併用は認められています。"},{"cat":"宅建業法","q":"無免許で宅建業を営んだ者には、3年以下の拘禁刑もしくは300万円以下の罰金が科される。","a":true,"e":"無免許営業は3年以下の拘禁刑または300万円以下の罰金です。法人の場合は1億円以下の罰金です。"}],[{"cat":"権利関係","q":"営業を許された未成年者が、その営業に関する取引を行う場合、法定代理人の同意は不要である。","a":true,"e":"営業を許された未成年者は、その営業に関しては成年者と同一の行為能力を有します。"},{"cat":"権利関係","q":"AがBに対し、内心では売るつもりがないのに土地を売ると表示した場合（心裡留保）、Bが善意であれば売買契約は有効である。","a":true,"e":"心裡留保は原則有効です。相手方が悪意または有過失の場合にのみ無効となります。"},{"cat":"権利関係","q":"AとBが通じて仮装の売買契約をした場合（虚偽表示）、当該契約は取り消すことができる。","a":false,"e":"虚偽表示は「取消し」ではなく「当然無効」です。取り消すまでもなく初めから無効です。"},{"cat":"権利関係","q":"復代理人を選任した場合、任意代理人の代理権は消滅する。","a":false,"e":"復代理人を選任しても任意代理人の代理権・責任は消滅しません。"},{"cat":"権利関係","q":"消滅時効において、人の生命又は身体の侵害による損害賠償請求権の時効期間は、権利を行使できる時から20年である。","a":true,"e":"通常の債権は10年ですが、生命・身体の侵害は20年に延長されています。主観的起算点は通常と同じ5年です。"},{"cat":"権利関係","q":"AがBに土地を売却し、BがさらにCに転売した場合、AからBへの売買が取り消された後でも、Cが先に登記を備えていればCは保護される。","a":true,"e":"取消し後の第三者とは対抗関係（登記の先後）で処理されます。先に登記を備えた方が優先します。"},{"cat":"権利関係","q":"共同抵当において、同時配当と異時配当では配当の計算方法が異なる。","a":true,"e":"同時配当は各不動産の価額に応じて按分し、異時配当では後順位者の利益に配慮して処理されます。"},{"cat":"権利関係","q":"債務不履行による損害賠償請求には、債務者の帰責事由が必要である。","a":true,"e":"損害賠償には帰責事由が必要です。契約の解除には帰責事由は不要です（令和2年改正）。"},{"cat":"権利関係","q":"使用者責任において、使用者は被用者の選任・監督に過失がなかったことを証明すれば免責される。","a":false,"e":"判例上、使用者が選任・監督の過失なしを立証しても免責は認められにくいとされています（事実上の無過失責任）。"},{"cat":"権利関係","q":"定期借地権のうち、一般定期借地権の存続期間は50年以上である。","a":true,"e":"一般定期50年以上、建物譲渡特約付30年以上、事業用定期10年以上50年未満です。"},{"cat":"権利関係","q":"借家契約の更新拒絶には貸主の正当事由が必要であるが、立退料の提供のみで正当事由が認められる。","a":false,"e":"立退料だけでは不十分です。建物の使用の必要性等を総合的に考慮して判断されます。"},{"cat":"権利関係","q":"配偶者と直系尊属が相続人の場合、配偶者の法定相続分は3分の2である。","a":true,"e":"配偶者＋直系尊属の場合、配偶者2/3、直系尊属1/3です。"},{"cat":"権利関係","q":"共同不法行為の場合、被害者は加害者の一人に対して損害の全額を請求することができる。","a":true,"e":"共同不法行為者は連帯して損害賠償責任を負うため、被害者は一人に全額請求可能です。"},{"cat":"権利関係","q":"区分所有法において、共用部分の通常の管理行為は、区分所有者及び議決権の各過半数で決定する。","a":true,"e":"通常の管理は過半数（普通決議）、重大変更は3/4以上、建替えは4/5以上です。"},{"cat":"法令上の制限","q":"市街化調整区域は市街化を抑制すべき区域であるが、用途地域を定めることも可能である。","a":true,"e":"原則として定めませんが、定めることが「できない」わけではありません。"},{"cat":"法令上の制限","q":"開発許可を受けた区域内では、工事完了の公告前に建築物を建築することは原則として制限される。","a":true,"e":"工事完了公告前は原則として建築制限があります。"},{"cat":"法令上の制限","q":"容積率の計算において、共同住宅の共用廊下及び階段の床面積は延べ面積に算入しない。","a":true,"e":"共同住宅の共用廊下・階段・エントランス等は容積率算定上、延べ面積に算入されません。"},{"cat":"法令上の制限","q":"地方公共団体の条例により、接道義務の要件を緩和することができる。","a":false,"e":"条例による付加（厳しくすること）は可能ですが、緩和はできません。"},{"cat":"法令上の制限","q":"新築の建築物は、検査済証の交付を受けた後でなければ原則として使用できない。","a":true,"e":"原則として検査済証の交付後に使用可能です。特定行政庁の仮使用承認がある場合は例外です。"},{"cat":"法令上の制限","q":"農地法第3条の許可は、市街化区域内の農地であっても必要である。","a":true,"e":"3条（権利移動のみ）は市街化区域内でも許可が必要です。届出で足りるのは4条・5条のみです。"},{"cat":"法令上の制限","q":"国土利用計画法の事後届出をしなかった場合、土地の売買契約は無効となる。","a":false,"e":"届出をしなくても契約は有効です。ただし、罰則の対象となります。"},{"cat":"法令上の制限","q":"土地区画整理事業の施行地区内で建築物を新築する場合、都道府県知事等の許可が必要である。","a":true,"e":"施行地区内では建築物の新築・改築等に都道府県知事等の許可が必要です。"},{"cat":"税・その他","q":"不動産取得税の免税点は、土地が10万円、家屋の建築が23万円、家屋の売買が12万円である。","a":true,"e":"免税点は土地10万円、家屋（建築）23万円、家屋（売買）12万円です。"},{"cat":"税・その他","q":"固定資産税の免税点は、土地が20万円、家屋が30万円である。","a":false,"e":"土地30万円、家屋20万円です。逆にならないよう注意が必要です。"},{"cat":"税・その他","q":"3,000万円特別控除と軽減税率の特例は併用可能だが、3,000万円控除と買換え特例は選択適用である。","a":true,"e":"3,000万円控除＋軽減税率は併用可能、3,000万円控除＋買換え特例は選択適用（併用不可）です。"},{"cat":"税・その他","q":"消費税額が区分記載されている場合、印紙税の記載金額は消費税込みの金額で判断される。","a":false,"e":"区分記載されている場合は税抜金額が記載金額です。"},{"cat":"税・その他","q":"地価公示の公示価格は、毎年4月1日時点の価格である。","a":false,"e":"毎年1月1日時点の価格です。4月1日ではありません。"},{"cat":"税・その他","q":"不動産鑑定評価における原価法は、再調達原価から減価修正を行って価格を算出する手法である。","a":true,"e":"原価法は再調達原価から減価修正を行います。建物の鑑定評価に特に有効な手法です。"},{"cat":"税・その他","q":"住宅金融支援機構のフラット35において、融資対象のマンションの床面積は50㎡以上でなければならない。","a":false,"e":"マンションは30㎡以上です。一戸建ては70㎡以上です。"},{"cat":"税・その他","q":"不動産広告で物件から最寄り駅までの距離を表示する場合、直線距離により算出してもよい。","a":false,"e":"道路距離で算出しなければなりません。直線距離は認められていません。"},{"cat":"宅建業法","q":"用途地域外の土地で建物の敷地に供されていないものは、宅地に該当しない。","a":true,"e":"用途地域外では、建物の敷地に供する土地のみが宅地です。道路・公園・河川等に供するものも宅地に該当しません。"},{"cat":"宅建業法","q":"宅建業者が合併により消滅した場合、消滅した法人の代表者であった者が30日以内に届出をしなければならない。","a":true,"e":"合併消滅の届出は、消滅した法人の代表者であった者が行います。"},{"cat":"宅建業法","q":"拘留の刑に処せられた者が法人の役員にいる場合、当該法人は欠格事由に該当する。","a":false,"e":"拘留は欠格事由に該当しません。欠格事由は拘禁刑以上の刑、または一定の罪による罰金刑です。"},{"cat":"宅建業法","q":"宅地建物取引士の登録の移転をする場合、新たに宅建士試験に合格する必要がある。","a":false,"e":"登録の移転に新たな試験合格は不要です。登録の移転自体も義務ではなく任意です。"},{"cat":"宅建業法","q":"営業保証金の供託先は、主たる事務所の最寄りの供託所である。","a":true,"e":"従たる事務所の分も含め、すべて主たる事務所の最寄りの供託所に供託します。"},{"cat":"宅建業法","q":"弁済業務保証金から弁済を受けられるのは、保証協会の社員との取引による債権者に限られる。","a":true,"e":"社員との取引による債権者が対象です。社員である宅建業者自身は弁済を受けられません。"},{"cat":"宅建業法","q":"専属専任媒介契約では、宅建業者は5日以内に指定流通機構に登録しなければならない。","a":true,"e":"専属専任は5日以内、専任は7日以内です。一般媒介には登録義務がありません。"},{"cat":"宅建業法","q":"一般媒介契約にも有効期間の上限（3ヶ月以内）が定められている。","a":false,"e":"3ヶ月以内の制限は専任・専属専任のみです。一般媒介には有効期間の法定制限はありません。"},{"cat":"宅建業法","q":"35条書面の記載事項には、建物の契約不適合責任の定めがあるときはその内容が含まれる。","a":true,"e":"契約不適合責任の定めは35条と37条の両方に記載事項として含まれます。"},{"cat":"宅建業法","q":"37条書面は、契約成立後遅滞なく交付しなければならない。","a":true,"e":"37条書面は契約成立後に遅滞なく交付します。35条書面（契約前）とは交付時期が異なります。"},{"cat":"宅建業法","q":"8種制限は、宅建業者が売主で一般消費者が買主の場合にのみ適用される。","a":true,"e":"8種制限は消費者保護規定であり、業者間取引には適用されません。"},{"cat":"宅建業法","q":"手付金が代金の20%を超えた場合、手付金全額が無効となる。","a":false,"e":"20%を超える部分のみが無効です。20%部分は有効です。"},{"cat":"宅建業法","q":"クーリングオフの告知は口頭で行えば足りる。","a":false,"e":"クーリングオフの告知は書面で行う必要があります。口頭のみでは8日の起算が始まりません。"},{"cat":"宅建業法","q":"報酬額は、国土交通大臣が定める上限額を超えて受領してはならない。","a":true,"e":"報酬額には法定の上限があり、これを超える額を受領することは法令違反です。"},{"cat":"宅建業法","q":"誇大広告の禁止規定は、免許を受けている宅建業者にのみ適用される。","a":false,"e":"誇大広告の禁止は免許の有無に関わらず適用されます。"},{"cat":"宅建業法","q":"免許権者以外の都道府県知事は、宅建業者に対して免許取消処分を行うことができない。","a":true,"e":"免許取消しは免許権者のみが可能です。それ以外の知事は指示処分と業務停止処分のみです。"},{"cat":"宅建業法","q":"業務停止処分に違反して宅建業を営んだ場合、免許取消処分の対象となる。","a":true,"e":"業務停止処分への違反は、免許取消しの必要的取消事由に該当します。"},{"cat":"宅建業法","q":"住宅瑕疵担保履行法の資力確保措置は、中古住宅の売買にも適用される。","a":false,"e":"対象は新築住宅の売主たる宅建業者のみです。中古住宅には適用されません。"},{"cat":"宅建業法","q":"従業者名簿の保存期間は、最終記載日から5年間である。","a":false,"e":"従業者名簿は10年間保存です。5年間は帳簿の保存期間です。"},{"cat":"宅建業法","q":"宅建業者は、事務所及び案内所等に標識を掲げなければならない。","a":true,"e":"標識の掲示義務は事務所と案内所等の両方にあります。"}]];

{cat:"kenri",q:"契約の解除には、債務者の帰責事由が必要である。",a:false,exp:"R2年改正により解除には帰責事由不要。損害賠償には帰責事由が必要です。"},
{cat:"kenri",q:"連帯債務において、一人に対する履行の請求は他の連帯債務者にも効力が及ぶ。",a:false,exp:"R2改正で請求は相対効に。絶対効は弁済・更改・混同・相殺のみです。"},
{cat:"kenri",q:"個人の根保証契約は、極度額を定めなくても有効である。",a:false,exp:"極度額の定めがなければ無効です（465条の2）。"},

{cat:"kenri",q:"遺留分侵害額請求では、現物の返還を求めることができる。",a:false,exp:"R1改正で金銭請求に一本化。現物返還は認められません。"},
{cat:"kenri",q:"区分所有法の建替え決議は、各4/5以上で決する。",a:true,exp:"最も厳しい要件で、区分所有者及び議決権の各4/5以上が必要です。"},
{cat:"kenri",q:"不動産登記には公信力がある。",a:false,exp:"日本の登記制度には公信力はありません。推定力はあります。"},
{cat:"takken",q:"重要事項の説明は、宅建士でない従業者が行ってもよい。",a:false,exp:"重要事項の説明は宅建士の独占業務。ただし書面の「交付」は宅建士でなくても可。"},
{cat:"takken",q:"重要事項の説明は、契約と同時に行えばよい。",a:false,exp:"契約「前」に行わなければなりません。"},
{cat:"takken",q:"宅建業者が買主の場合、35条書面の交付も省略できる。",a:false,exp:"説明は省略可ですが、書面の交付は省略できません。"},
{cat:"takken",q:"代金の額は、35条書面の記載事項である。",a:false,exp:"代金の額は37条書面の記載事項です。35条にはありません。"},
{cat:"takken",q:"37条書面は、買主にのみ交付すればよい。",a:false,exp:"売主と買主の双方に交付が必要です。"},

let st={mode:"study",examPat:0,examAns:{},examShow:{},cat:"all",expId:null,chk:{},qCat:"all",qSub:"all",qPage:0,qAns:{}};
const PS=50;
function load(){try{const s=localStorage.getItem("takken-v13");if(s){const d=JSON.parse(s);st.chk=d.chk||{};st.qAns=d.qAns||{};st.examAns=d.examAns||{};}}catch{}}
function save(){try{localStorage.setItem("takken-v13",JSON.stringify({chk:st.chk,qAns:st.qAns,examAns:st.examAns}));}catch{}}

function getFilteredQ(){
  if(st.qCat==="takken") return st.qSub==="all"?BQ:BQ.filter(q=>q.f===st.qSub);
  if(st.qCat==="hourei") return st.qSub==="all"?HQ:HQ.filter(q=>q.f===st.qSub);
  if(st.qCat==="kenri") return st.qSub==="all"?KQ:KQ.filter(q=>q.f===st.qSub);
  if(st.qCat==="zei") return st.qSub==="all"?ZQ:ZQ.filter(q=>q.f===st.qSub);
  if(st.qCat==="all") return [...KQ,...BQ,...HQ,...ZQ];
  return Q.filter(q=>q.cat===st.qCat);
}

function render(){
const app=document.getElementById("app");
const totalChk=T.filter(t=>st.chk[t.id]).length;
const pct=Math.round((totalChk/T.length)*100);
const fQ=getFilteredQ();
const aCount=fQ.filter((_,i)=>st.qAns[st.qCat+"-"+st.qSub+"-"+i]!==undefined).length;
const cCount=fQ.filter((_,i)=>st.qAns[st.qCat+"-"+st.qSub+"-"+i]===true).length;

let h=`<div class="header"><div class="header-sub">2026年度対応</div><h1>宅建試験 頻出論点マスター</h1>
<div class="mode-tabs"><button class="mode-tab${st.mode==="study"?" active":""}" onclick="setMode('study')">📖 論点</button><button class="mode-tab${st.mode==="quiz"?" active":""}" onclick="setMode('quiz')">✍ 一問一答</button><button class="mode-tab${st.mode==="exam"?" active":""}" onclick="setMode('exam')">📝 模試</button></div>`;
if(st.mode==="study"){h+=`<div class="progress-row"><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div><span class="progress-label">${totalChk}/${T.length}</span></div>`;}
else if(st.mode==="quiz"){h+=`<div class="progress-row"><div class="progress-bar"><div class="progress-fill" style="width:${fQ.length?Math.round(aCount/fQ.length*100):0}%"></div></div><span class="progress-label">${cCount}/${fQ.length}正解</span></div>`;}
else{const ex=EXAMS[st.examPat]||[];const ea=ex.filter((_,i)=>st.examAns[st.examPat+"-"+i]!==undefined).length;const ec=ex.filter((_,i)=>st.examAns[st.examPat+"-"+i]===true).length;h+=`<div class="progress-row"><div class="progress-bar"><div class="progress-fill" style="width:${ex.length?Math.round(ea/ex.length*100):0}%"></div></div><span class="progress-label">${ec}/${ex.length}正解</span></div>`;}
h+=`</div>`;
h+=st.mode==="study"?renderStudy():st.mode==="quiz"?renderQuiz(fQ,aCount,cCount):renderExam();
app.innerHTML=h;
}

function renderStudy(){
const filtered=st.cat==="all"?T:T.filter(t=>t.cat===st.cat);
const sorted=[...filtered].sort((a,b)=>b.freq-a.freq);
const ac=st.cat!=="all"?cM[st.cat]:null;
const fc=sorted.filter(t=>st.chk[t.id]).length;
let h=`<div class="tabs">`;
[{id:"all",name:"全科目",color:"#1e3a5f"},...C].forEach(c=>{const isA=st.cat===c.id;h+=`<button class="tab${isA?" active":""}" style="${isA?"background:"+c.color:""}" onclick="setCat('${c.id}')">${c.name}</button>`;});
h+=`</div>`;
if(ac)h+=`<div class="cat-bar" style="color:${ac.color};background:${ac.color}10;border-color:${ac.color}"><span>${ac.questions}</span><span>目安: ${ac.target}</span></div>`;
h+=`<div class="info-bar"><span>頻度順（${sorted.length}論点）</span><span>${fc}/${sorted.length} 済</span></div><div class="cards">`;
sorted.forEach(t=>{
const cat=cM[t.cat],isExp=st.expId===t.id,isDone=!!st.chk[t.id];
h+=`<div class="card${isDone?" done":""}" id="topic-${t.id}"><div class="card-head"><button class="chk${isDone?" on":""}" onclick="event.stopPropagation();togChk('${t.id}')">${isDone?"✓":""}</button><div class="card-body" onclick="togExp('${t.id}')"><div class="badges"><span class="badge" style="background:${cat.color}">${cat.name}</span><span class="stars">${fL(t.freq)}</span></div><div class="topic-name">${t.topic}</div><div class="tap-hint">${isExp?"▲ 閉じる":"▼ 詳細"}</div></div></div>`;
if(isExp){
h+=`<div class="detail"><div class="sec"><div class="sec-title" style="color:${cat.color}">📘 論点解説</div><div class="sec-box" style="border-color:${cat.color}">${t.desc}</div></div><div class="sec"><div class="sec-title" style="color:var(--red)">⚠ ひっかけポイント</div>`;
t.traps.forEach((tr,i)=>{h+=`<div class="trap-item"><span class="trap-num">${i+1}.</span><span class="trap-text">${tr}</span></div>`;});
h+=`</div></div>`;}
h+=`</div>`;});
h+=`</div><div class="footer"><button class="reset-btn" onclick="resetStudy()">学習チェックをリセット</button></div>`;
return h;
}

function renderQuiz(fQ,answered,correct){
let h=`<div class="quiz-filter">`;
[{id:"all",name:"全科目"},...C].forEach(c=>{h+=`<button class="quiz-filter-btn${st.qCat===c.id?" active":""}" onclick="setQCat('${c.id}')">${c.name}</button>`;});
h+=`</div>`;

// Sub-filters
const sf=st.qCat==="takken"?BF:st.qCat==="hourei"?HF:st.qCat==="kenri"?KF:null;
if(sf){
h+=`<div class="quiz-filter" style="padding-top:2px">`;
sf.forEach(s=>{h+=`<button class="quiz-filter-btn${st.qSub===s.id?" active":""}" style="font-size:10px;padding:3px 8px" onclick="setQSub('${s.id}')">${s.name}</button>`;});
h+=`</div>`;
}

if(!fQ.length)return h+`<div style="text-align:center;padding:40px;color:var(--text3)">問題がありません</div>`;

// Score
if(answered>0){
h+=`<div class="quiz-score"><div class="quiz-score-num">${correct}<span style="font-size:16px;color:var(--text2)"> / ${fQ.length}</span></div><div class="quiz-score-label">正解率 ${fQ.length?Math.round(correct/fQ.length*100):0}%${answered===fQ.length?" 🎉 全問完了！":""}</div>`;
if(answered===fQ.length)h+=`<button class="quiz-next" onclick="resetQuiz()" style="margin-top:12px;background:var(--red)">もう一度チャレンジ</button>`;
h+=`</div>`;
}

// Pagination
const totalPages=Math.ceil(fQ.length/PS);
const page=Math.min(st.qPage,totalPages-1);
const startIdx=page*PS;
const endIdx=Math.min(startIdx+PS,fQ.length);
const pageQ=fQ.slice(startIdx,endIdx);

if(totalPages>1){
h+=`<div class="page-nav">`;
h+=`<button class="page-btn" onclick="setPage(${page-1})" ${page===0?"disabled":""}>◀</button>`;
for(let p=0;p<totalPages;p++){
h+=`<button class="page-btn${p===page?" active":""}" onclick="setPage(${p})">${p*PS+1}-${Math.min((p+1)*PS,fQ.length)}</button>`;
}
h+=`<button class="page-btn" onclick="setPage(${page+1})" ${page>=totalPages-1?"disabled":""}>▶</button>`;
h+=`</div>`;
}

h+=`<div class="cards">`;
const catColor=st.qCat==="kenri"?"#2563eb":st.qCat==="hourei"?"#d97706":st.qCat==="takken"?"#059669":"#7c3aed";
pageQ.forEach((q,pi)=>{
const gi=startIdx+pi;
const key=st.qCat+"-"+st.qSub+"-"+gi;
const cat=q.cat?cM[q.cat]:{color:catColor,name:q.fn||"問題"};
const ans=st.qAns[key];
const isAns=ans!==undefined;
const isOK=ans===true;

h+=`<div class="quiz-card"><div class="quiz-header"><span class="quiz-cat" style="background:${cat.color}">${cat.name}</span><span class="quiz-num">Q${gi+1}/${fQ.length}</span></div><div class="quiz-q">${q.q}</div><div class="quiz-btns">`;
if(!isAns){
h+=`<button class="quiz-btn" onclick="ansQ(${gi},true)">⭕ 正しい</button><button class="quiz-btn" onclick="ansQ(${gi},false)">❌ 誤り</button>`;
}else{
const uT=st.qAns[key+"_r"]===true,uF=st.qAns[key+"_r"]===false;
h+=`<button class="quiz-btn${q.a?"highlight":""}${uT?(isOK?" correct":" wrong"):""}" disabled>⭕${q.a?" ←正解":""}</button>`;
h+=`<button class="quiz-btn${!q.a?"highlight":""}${uF?(isOK?" correct":" wrong"):""}" disabled>❌${!q.a?" ←正解":""}</button>`;
}
h+=`</div>`;
if(isAns){
const expText=q.exp||q.e||'';
h+=`<div class="quiz-explanation"><div class="quiz-exp-box ${isOK?"correct-bg":"wrong-bg"}"><div class="quiz-result-icon">${isOK?"✅ 正解！":"❌ 不正解"}</div><div>${expText}</div></div></div>`;
}
h+=`</div>`;
});
h+=`</div>`;

// Bottom pagination
if(totalPages>1){
h+=`<div class="page-nav">`;
h+=`<button class="page-btn" onclick="setPage(${page-1})" ${page===0?"disabled":""}>◀ 前</button>`;
h+=`<span style="font-size:12px;color:var(--text2);padding:6px">${page+1} / ${totalPages}</span>`;
h+=`<button class="page-btn" onclick="setPage(${page+1})" ${page>=totalPages-1?"disabled":""}>次 ▶</button>`;
h+=`</div>`;
}

h+=`<div class="footer"><button class="reset-btn" onclick="resetQuiz()">クイズをリセット</button></div>`;
return h;
}


function renderExam(){
const ex=EXAMS[st.examPat]||[];
const answered=ex.filter((_,i)=>st.examAns[st.examPat+"-"+i]!==undefined).length;
const correct=ex.filter((_,i)=>st.examAns[st.examPat+"-"+i]===true).length;
const catColors={"権利関係":"#2563eb","宅建業法":"#059669","法令上の制限":"#d97706","税・その他":"#7c3aed"};

let h=`<div class="quiz-filter">`;
for(let p=0;p<EXAMS.length;p++){
h+=`<button class="quiz-filter-btn${st.examPat===p?" active":""}" onclick="setExamPat(${p})">第${p+1}回</button>`;
}
h+=`</div>`;

h+=`<div style="padding:8px 16px;font-size:12px;color:var(--text2)">本番同様50問（権利関係14問・法令上の制限8問・税その他8問・宅建業法20問）｜合格ライン：35問以上</div>`;

if(answered>0){
const pass=correct>=35;
h+=`<div class="quiz-score"><div class="quiz-score-num" style="color:${pass?"var(--green)":"var(--red)"}">${correct}<span style="font-size:16px;color:var(--text2)"> / 50</span></div><div class="quiz-score-label">${pass?"🎉 合格ライン到達！":"合格ラインまであと"+(35-correct)+"問"} （正解率${Math.round(correct/50*100)}%）</div>`;
if(answered===50)h+=`<button class="quiz-next" onclick="resetExam()" style="margin-top:12px;background:var(--red)">もう一度チャレンジ</button>`;
h+=`</div>`;
}

const PS2=50;
h+=`<div class="cards">`;
ex.forEach((q,i)=>{
const key=st.examPat+"-"+i;
const ans=st.examAns[key];
const isAns=ans!==undefined;
const isOK=ans===true;
const color=catColors[q.cat]||"#666";
const qNum=i<14?"問"+(i+1):i<22?"問"+(i+1):i<30?"問"+(i<22?i+1:i<30?i+1:i+1):i<50?"問"+(i+1):"";

h+=`<div class="quiz-card"><div class="quiz-header"><span class="quiz-cat" style="background:${color}">${q.cat}</span><span class="quiz-num">問${i+1}/50</span></div><div class="quiz-q">${q.q}</div><div class="quiz-btns">`;
if(!isAns){
h+=`<button class="quiz-btn" onclick="ansExam(${i},true)">⭕ 正しい</button><button class="quiz-btn" onclick="ansExam(${i},false)">❌ 誤り</button>`;
}else{
const uT=st.examAns[key+"_r"]===true,uF=st.examAns[key+"_r"]===false;
h+=`<button class="quiz-btn${q.a?"highlight":""}${uT?(isOK?" correct":" wrong"):""}" disabled>⭕${q.a?" ←正解":""}</button>`;
h+=`<button class="quiz-btn${!q.a?"highlight":""}${uF?(isOK?" correct":" wrong"):""}" disabled>❌${!q.a?" ←正解":""}</button>`;
}
h+=`</div>`;
if(isAns){
h+=`<div class="quiz-explanation"><div class="quiz-exp-box ${isOK?"correct-bg":"wrong-bg"}"><div class="quiz-result-icon">${isOK?"✅ 正解！":"❌ 不正解"}</div><div>${q.e}</div></div></div>`;
}
h+=`</div>`;
});
h+=`</div>`;
h+=`<div class="footer"><button class="reset-btn" onclick="resetExam()">この模試をリセット</button></div>`;
return h;
}

window.setMode=function(m){st.mode=m;st.expId=null;render();window.scrollTo(0,0);};
window.setCat=function(id){st.cat=id;st.expId=null;render();};
window.togExp=function(id){st.expId=st.expId===id?null:id;render();};
window.togChk=function(id){st.chk[id]=!st.chk[id];if(!st.chk[id])delete st.chk[id];save();render();};
window.resetStudy=function(){if(confirm("リセットしますか？")){st.chk={};save();render();}};

window.setExamPat=function(p){st.examPat=p;render();window.scrollTo(0,0);};
window.ansExam=function(i,u){const ex=EXAMS[st.examPat];const q=ex[i];const k=st.examPat+"-"+i;st.examAns[k]=(u===q.a);st.examAns[k+"_r"]=u;save();render();};
window.resetExam=function(){if(confirm("この模試をリセットしますか？")){const ex=EXAMS[st.examPat];ex.forEach((_,i)=>{const k=st.examPat+"-"+i;delete st.examAns[k];delete st.examAns[k+"_r"];});save();render();window.scrollTo(0,0);}};

window.setQCat=function(id){st.qCat=id;st.qSub="all";st.qPage=0;render();window.scrollTo(0,0);};
window.setQSub=function(id){st.qSub=id;st.qPage=0;render();window.scrollTo(0,0);};
window.setPage=function(p){if(p>=0){st.qPage=p;render();window.scrollTo(0,0);}};
window.ansQ=function(i,u){const fQ=getFilteredQ(),q=fQ[i],k=st.qCat+"-"+st.qSub+"-"+i;st.qAns[k]=(u===q.a);st.qAns[k+"_r"]=u;save();render();};
window.resetQuiz=function(){if(confirm("リセットしますか？")){const fQ=getFilteredQ();fQ.forEach((_,i)=>{const k=st.qCat+"-"+st.qSub+"-"+i;delete st.qAns[k];delete st.qAns[k+"_r"];});st.qPage=0;save();render();window.scrollTo(0,0);}};

load();render();
