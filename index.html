<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1e3a5f">
<title>宅建マスター</title>
<style>

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f8f9fb;--card:#fff;--card2:#f8fafc;--text:#111827;--text2:#6b7280;--text3:#9ca3af;--border:#e5e7eb;--green:#10b981;--green-bg:#f0fdf4;--green-border:#d1fae5;--red:#dc2626;--red-bg:#fef2f2;--amber:#f59e0b;--blue:#2563eb;--navy:#1e3a5f}
@media(prefers-color-scheme:dark){:root{--bg:#0f1117;--card:#1a1d27;--card2:#1f2233;--text:#e5e7eb;--text2:#9ca3af;--text3:#6b7280;--border:#2d3040;--green-bg:#052e16;--green-border:#064e3b;--red-bg:#1c0a0a}}
body{font-family:-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;overscroll-behavior:none}
.header{background:linear-gradient(135deg,#1e3a5f 0%,#2563eb 100%);color:#fff;padding:calc(env(safe-area-inset-top,20px) + 12px) 16px 14px;position:sticky;top:0;z-index:20}
.header-sub{font-size:10px;letter-spacing:2px;opacity:.65;margin-bottom:2px}
.header h1{font-size:19px;font-weight:800;line-height:1.3}
.mode-tabs{display:flex;gap:4px;margin-top:10px}
.mode-tab{flex:1;padding:7px;border-radius:8px;border:none;font-size:12px;font-weight:700;cursor:pointer;text-align:center;transition:.15s;background:rgba(255,255,255,.15);color:rgba(255,255,255,.7)}
.mode-tab.active{background:#fff;color:#1e3a5f}
.progress-row{margin-top:8px;display:flex;align-items:center;gap:10px}
.progress-bar{flex:1;background:rgba(255,255,255,.2);border-radius:6px;height:7px;overflow:hidden}
.progress-fill{height:100%;background:#34d399;border-radius:6px;transition:width .3s}
.progress-label{font-size:11px;white-space:nowrap}
.tabs{display:flex;gap:5px;padding:8px 10px;overflow-x:auto;position:sticky;top:0;z-index:15;background:var(--bg);border-bottom:1px solid var(--border);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:6px 11px;border-radius:18px;border:none;font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:.15s;background:#e5e7eb;color:#374151}
.tab.active{color:#fff}
.cat-bar{padding:7px 16px;display:flex;justify-content:space-between;font-size:11.5px;font-weight:600;border-bottom:2px solid currentColor}
.info-bar{padding:6px 16px;font-size:11px;color:var(--text3);display:flex;justify-content:space-between}
.cards{padding:0 10px 100px}
.card{margin-bottom:7px;border-radius:10px;border:1px solid var(--border);background:var(--card);overflow:hidden;transition:.15s}
.card.done{border-color:var(--green-border);background:var(--green-bg)}
.card-head{display:flex;align-items:flex-start;gap:10px;padding:11px 11px 9px}
.chk{width:26px;height:26px;min-width:26px;border-radius:7px;border:2px solid #d1d5db;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:1px;transition:.15s;font-size:13px;font-weight:800;color:#fff}
.chk.on{border-color:var(--green);background:var(--green)}
.card-body{flex:1;min-width:0;cursor:pointer}
.badges{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-bottom:3px}
.badge{font-size:9.5px;padding:2px 6px;border-radius:4px;color:#fff;font-weight:600}
.stars{font-size:11.5px;color:var(--amber);letter-spacing:-1px}
.topic-name{font-size:13.5px;font-weight:700;line-height:1.4;transition:.15s}
.card.done .topic-name{color:var(--text2);text-decoration:line-through}
.tap-hint{font-size:10px;color:var(--text3);margin-top:1px}
.detail{padding:0 11px 13px 11px;font-size:12.5px;line-height:1.7;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.sec{margin-bottom:12px}
.sec-title{font-weight:700;font-size:11px;letter-spacing:1px;margin-bottom:4px;display:flex;align-items:center;gap:4px}
.sec-box{padding:10px;border-radius:8px;border-left:3px solid;background:var(--card2);font-size:12.5px;line-height:1.75}
.sec-box p{margin-bottom:6px}
.sec-box p:last-child{margin-bottom:0}
.rule{display:flex;gap:6px;margin-bottom:4px;font-size:12px}
.rule-label{font-weight:700;min-width:auto;white-space:nowrap;color:var(--navy)}
.compare-table{width:100%;border-collapse:collapse;font-size:11px;margin:6px 0}
.compare-table th,.compare-table td{border:1px solid var(--border);padding:4px 6px;text-align:center}
.compare-table th{background:var(--card2);font-weight:700;font-size:10px}
.trap-item{display:flex;gap:5px;margin-bottom:5px}
.trap-num{color:var(--red);font-weight:700;font-size:11.5px;min-width:15px}
.trap-text{font-size:12px;line-height:1.55}
.footer{padding:20px 16px;text-align:center}
.reset-btn{padding:10px 24px;border-radius:8px;border:1px solid #fca5a5;background:var(--card);color:var(--red);font-size:12.5px;font-weight:600;cursor:pointer}
.footer-note{font-size:10px;color:var(--text3);margin-top:12px;line-height:1.5}
.quiz-card{margin-bottom:10px;border-radius:10px;border:1px solid var(--border);background:var(--card);overflow:hidden}
.quiz-header{padding:10px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.quiz-cat{font-size:9.5px;padding:2px 6px;border-radius:4px;color:#fff;font-weight:600}
.quiz-num{font-size:11px;color:var(--text3)}
.quiz-q{padding:12px;font-size:13.5px;line-height:1.7;font-weight:500}
.quiz-btns{display:flex;gap:8px;padding:0 12px 12px}
.quiz-btn{flex:1;padding:12px;border-radius:8px;border:2px solid var(--border);background:var(--card);font-size:16px;font-weight:800;cursor:pointer;transition:.15s;text-align:center}
.quiz-btn:active{transform:scale(.96)}
.quiz-btn.correct{border-color:var(--green);background:var(--green-bg);color:var(--green)}
.quiz-btn.wrong{border-color:var(--red);background:var(--red-bg);color:var(--red)}
.quiz-btn.highlight{border-color:var(--green);background:var(--green-bg)}
.quiz-explanation{padding:0 12px 12px;animation:fadeIn .2s}
.quiz-exp-box{padding:10px;border-radius:8px;font-size:12px;line-height:1.6}
.quiz-exp-box.correct-bg{background:var(--green-bg);border:1px solid var(--green-border)}
.quiz-exp-box.wrong-bg{background:var(--red-bg);border:1px solid #fca5a5}
.quiz-result-icon{font-size:14px;font-weight:800;margin-bottom:4px}
.quiz-score{text-align:center;padding:20px;margin:10px;border-radius:12px;background:var(--card);border:1px solid var(--border)}
.quiz-score-num{font-size:36px;font-weight:800;color:var(--navy)}
.quiz-score-label{font-size:13px;color:var(--text2);margin-top:4px}
.quiz-next{display:block;width:100%;padding:12px;margin-top:8px;border-radius:8px;border:none;background:var(--navy);color:#fff;font-size:13px;font-weight:700;cursor:pointer}
.quiz-filter{display:flex;gap:6px;padding:8px 12px;flex-wrap:wrap}
.quiz-filter-btn{padding:5px 10px;border-radius:14px;border:1px solid var(--border);background:var(--card);font-size:11px;cursor:pointer;transition:.15s}
.quiz-filter-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}

.page-nav{display:flex;justify-content:center;gap:6px;padding:10px;flex-wrap:wrap}
.page-btn{padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--card);font-size:12px;cursor:pointer}
.page-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.page-btn:disabled{opacity:.4;cursor:default}
</style>
</head>
<body>
<div id="app"></div>
<script>
const C=[
{id:"kenri",name:"権利関係",color:"#2563eb",questions:"問1〜14",target:"7/14以上"},
{id:"takken",name:"宅建業法",color:"#059669",questions:"問26〜45",target:"17/20以上"},
{id:"hourei",name:"法令上の制限",color:"#d97706",questions:"問15〜22",target:"5/8以上"},
{id:"zei",name:"税・その他",color:"#7c3aed",questions:"問23〜25等",target:"5/8以上"}
];
const cM={};C.forEach(c=>cM[c.id]=c);
const fL=f=>"★".repeat(f)+"☆".repeat(5-f);
const T=[
// ========== 権利関係 ==========
{id:"k01",cat:"kenri",topic:"意思表示（詐欺・強迫・虚偽表示・錯誤）",freq:5,
desc:`<p>意思表示とは、法律効果の発生を望む意思を外部に表示する行為です。しかし、その意思に瑕疵（問題）がある場合、効力に影響が出ます。宅建では4類型の区別が最重要です。</p>
<p><b>① 心裡留保（93条）</b>＝冗談や嘘の意思表示。<b>原則有効</b>ですが、相手方が表意者の真意でないことを<b>知っていた（悪意）or 知ることができた（有過失）</b>場合は<b>無効</b>になります。善意の第三者には対抗できません。</p>
<p><b>② 虚偽表示（94条）</b>＝相手方と通じてする嘘の意思表示。<b>常に無効</b>です。ただし<b>善意の第三者</b>には対抗できません。ここで「善意」に過失の有無は問われない点が重要です。</p>
<p><b>③ 錯誤（95条）</b>＝勘違いによる意思表示。「意思表示に対応する意思を欠く錯誤」又は「動機の錯誤（動機が表示されている場合）」で、その錯誤が法律行為の目的等に照らし重要な場合に<b>取消し可能</b>です。ただし、表意者に<b>重大な過失</b>があれば原則取消し不可。例外として、相手方が悪意or重過失の場合、又は相手方も同一の錯誤の場合は取消し可能です。</p>
<p><b>④ 詐欺（96条）</b>＝だまされた意思表示は<b>取消し可能</b>。ただし取消しは<b>善意無過失の第三者に対抗できない</b>（R2改正で「無過失」が追加）。第三者による詐欺の場合は、相手方が悪意or有過失の場合にのみ取消し可能。</p>
<p><b>⑤ 強迫（96条）</b>＝脅された意思表示は<b>取消し可能</b>。詐欺と異なり<b>第三者保護規定がない</b>ため、善意無過失の第三者にも対抗できます。被害者保護が最も厚い類型です。</p>`,
traps:["詐欺の第三者保護＝善意<b>無過失</b>（R2改正）vs 強迫＝第三者保護なし","虚偽表示の「善意の第三者」に過失の有無は<b>不問</b>","錯誤の重大な過失→取消不可。ただし相手方が悪意/重過失なら<b>例外的に取消可</b>","心裡留保は<b>原則有効</b>（無効ではない）。相手方が悪意・有過失で無効"]},

{id:"k02",cat:"kenri",topic:"代理（無権代理・表見代理）",freq:5,
desc:`<p>代理とは、代理人が本人のために意思表示をし、その効果が直接本人に帰属する制度です。代理権がないのに代理行為をした場合が<b>無権代理</b>、代理権があるように見える外観がある場合が<b>表見代理</b>です。</p>
<p><b>【無権代理の効果】</b>本人に効果は帰属しません。ただし本人が<b>追認</b>すれば遡って有効になります。相手方には以下の権利があります：①催告権（本人に追認するか確答を求める）②取消権（善意の場合のみ）③無権代理人への責任追及（善意無過失の場合）</p>
<p><b>【無権代理と相続】</b>最頻出の複合論点です。<b>無権代理人が本人を相続</b>した場合→追認拒否は信義則に反し、<b>当然に有効</b>。逆に<b>本人が無権代理人を相続</b>した場合→本人としての追認拒否権は消滅せず、<b>追認拒否可能</b>です。</p>
<p><b>【表見代理の3類型】</b><br>
・<b>109条</b>：代理権授与の表示による表見代理（実際には代理権を与えていないのに与えたように見せた場合）<br>
・<b>110条</b>：権限外の行為の表見代理（与えた代理権の範囲を超えた行為をした場合）<br>
・<b>112条</b>：代理権消滅後の表見代理（代理権が消滅した後に代理行為をした場合）</p>
<p><b>【代理権の濫用】</b>R2改正で明文化。代理人が自己の利益のために代理権を行使した場合、相手方が悪意or有過失なら<b>無権代理とみなす</b>（本人に効果不帰属）。</p>`,
traps:["無権代理人→本人を相続＝<b>当然有効</b> vs 本人→無権代理人を相続＝<b>追認拒否可</b>","表見代理3類型（109条・110条・112条）の要件の混同","代理権の濫用＝相手方が悪意・有過失なら<b>無権代理とみなす</b>"]},

{id:"k03",cat:"kenri",topic:"時効（取得時効・消滅時効）",freq:4,
desc:`<p>時効とは、一定期間の経過により権利の取得（取得時効）や権利の消滅（消滅時効）を認める制度です。</p>
<p><b>【取得時効】</b>他人の物を一定期間占有し続けることで所有権を取得できます。<br>
・<b>善意無過失</b>で占有開始→<b>10年</b>で取得<br>
・<b>それ以外</b>（悪意or有過失）→<b>20年</b>で取得<br>
善意無過失の判定時期は<b>占有開始時</b>です。途中で悪意になっても影響しません。</p>
<p><b>【消滅時効（R2改正で統一）】</b>債権は以下のいずれか早い方で消滅します：<br>
・<b>権利を行使できることを知った時から5年</b>（主観的起算点）<br>
・<b>権利を行使できる時から10年</b>（客観的起算点）<br>
人の生命・身体の侵害による損害賠償請求権は、主観5年/客観<b>20年</b>に延長されます。</p>
<p><b>【時効の援用】</b>時効は自動的に適用されず、<b>当事者が援用</b>（主張）する必要があります。裁判所が職権で適用することはできません。援用できるのは、時効の完成により直接利益を受ける者です。</p>
<p><b>【時効完成後の債務承認】</b>時効が完成した後に債務者が債務を承認すると、信義則により、もはや時効の援用はできなくなります。</p>`,
traps:["消滅時効の二本立て＝<b>知った時から5年</b> or <b>行使できる時から10年</b>","時効の援用は<b>当事者が必要</b>（裁判所は職権で適用しない）","取得時効の善意無過失の判断時点は<b>占有開始時</b>","時効完成後の債務承認→もはや<b>時効援用不可</b>"]},

{id:"k04",cat:"kenri",topic:"不動産物権変動・対抗要件",freq:5,
desc:`<p>不動産の物権変動（所有権の移転等）は、<b>登記</b>がなければ第三者に対抗（主張）できません（177条）。ただし、ここでいう「第三者」は限定的に解釈されています。</p>
<p><b>【第三者に該当しない者】</b>以下の者には登記なくても対抗可能：<br>
・<b>背信的悪意者</b>＝単に悪意なだけでなく、信義に反する態様で登記の欠缺を主張する者<br>
・不法占拠者、無権利者、不法行為者<br>
・前主（売主）や相続人</p>
<p><b>【取消しと第三者】</b>極めて重要な論点です。<br>
・<b>取消し前</b>の第三者→第三者が<b>善意無過失</b>なら保護される（取消しを対抗できない）<br>
・<b>取消し後</b>の第三者→<b>対抗関係</b>になり、先に登記を備えた方が勝つ</p>
<p><b>【相続と登記（R1改正）】</b><br>
・<b>法定相続分の範囲内</b>→登記なくても第三者に対抗可<br>
・<b>法定相続分を超える部分</b>（遺言・遺産分割等）→<b>登記がなければ対抗できない</b><br>
この改正は、相続において登記の重要性を高めるために行われました。</p>`,
traps:["<b>背信的悪意者</b>は177条の「第三者」に該当しない","取消し<b>前</b>の第三者＝善意無過失で保護 / 取消し<b>後</b>の第三者＝登記の先後","相続でも法定相続分<b>超過</b>部分は<b>登記必要</b>（R1改正）"]},

{id:"k05",cat:"kenri",topic:"抵当権",freq:5,
desc:`<p>抵当権は、債務者が債務を弁済しない場合に、担保目的物から優先的に弁済を受けられる権利です。目的物の占有は移転せず、設定者が使用収益を続けられます。</p>
<p><b>【法定地上権（388条）】</b>抵当権の実行により土地と建物が別々の所有者に帰属した場合に、建物のために自動的に成立する地上権です。成立要件（すべて必要）：<br>
① <b>抵当権設定時に</b>土地上に建物が存在すること（←最重要！更地に抵当権→後に建物建築は×）<br>
② 抵当権設定時に土地と建物が<b>同一の所有者</b>に属すること<br>
③ 競売により土地と建物が<b>別々の所有者</b>になったこと</p>
<p><b>【物上代位】</b>抵当権の効力は、目的物の売却代金、賃料、損害賠償金などにも及びます。ただし、<b>払渡し又は引渡しの前に差押え</b>をすることが必要です。賃料への物上代位も認められています（判例）。</p>
<p><b>【抵当権消滅請求】</b>抵当不動産の<b>第三取得者</b>（抵当不動産を買い受けた人）が、抵当権者に対して一定の金額を払って抵当権の消滅を請求する制度です。<b>主たる債務者や保証人は請求できない</b>点に注意。</p>`,
traps:["法定地上権＝「<b>抵当権設定時に建物が存在</b>」が絶対条件","物上代位＝「<b>払渡し前に差押え</b>」が必要。賃料にも物上代位可","抵当権消滅請求＝<b>第三取得者のみ</b>可（主債務者・保証人は不可）"]},

{id:"k06",cat:"kenri",topic:"契約不適合責任",freq:4,
desc:`<p>R2年改正で、旧「瑕疵担保責任」が<b>「契約不適合責任」</b>に全面改正されました。引き渡された目的物が「種類・品質・数量」に関して契約の内容に適合しない場合、買主は以下の救済手段を行使できます。</p>
<p><b>【4つの救済手段】</b>（原則としてこの順序で行使）<br>
<b>① 追完請求</b>＝修補・代替物・不足分の引渡しを請求<br>
<b>② 代金減額請求</b>＝原則として<b>まず追完の催告が必要</b>。催告しても追完がない場合に減額請求可。例外として、追完が不能・売主が追完拒絶・定期行為・催告しても追完の見込みがない場合は催告不要<br>
<b>③ 損害賠償請求</b>＝売主に<b>帰責事由が必要</b><br>
<b>④ 解除</b>＝売主の<b>帰責事由は不要</b>（R2改正の重要ポイント）</p>
<p><b>【通知期間】</b>買主が不適合を<b>知った時から1年以内に通知</b>すれば足ります。旧法では「1年以内に権利行使」が必要でしたが、改正後は<b>通知だけ</b>でOKです。具体的な請求は通知後でも可能。</p>
<p><b>【数量に関する不適合】</b>数量不適合には期間制限がありません（通知なしで請求可）。種類・品質の不適合とは扱いが異なります。</p>`,
traps:["代金減額は原則「<b>まず追完の催告</b>」が必要","<b>解除は帰責事由不要</b>、損害賠償は帰責事由<b>必要</b>（R2改正）","不適合を「知った時から<b>1年以内に通知</b>」（権利行使ではない）"]},

{id:"k07",cat:"kenri",topic:"連帯債務・保証",freq:4,
desc:`<p><b>【連帯債務のR2改正】</b>連帯債務者の一人に処した事由が他の連帯債務者に影響するかが最重要論点です。R2改正で<b>絶対効は大幅に縮小</b>されました。</p>
<p><b>絶対効（他の債務者にも効力が及ぶ）</b>＝<b>弁済・更改・混同・相殺</b>の4つだけ<br>
<b>相対効（その債務者にしか効力が及ばない）</b>＝請求・免除・時効の完成など（旧法では絶対効だったが改正で相対効に変更）</p>
<p><b>【保証と連帯保証の違い】</b><br>
通常の保証人には①<b>催告の抗弁権</b>（まず主債務者に請求せよ）と②<b>検索の抗弁権</b>（主債務者の財産から先に執行せよ）があります。<br>
<b>連帯保証人にはこの2つの抗弁権がありません</b>。債権者は直接連帯保証人に全額請求できます。</p>
<p><b>【個人根保証（R2改正）】</b>一定の範囲に属する不特定の債務を保証する個人根保証契約は、<b>極度額を定めなければ無効</b>です。貸金等根保証契約に限らず、すべての個人根保証に拡大されました（例：賃貸借の連帯保証）。</p>
<p><b>【事業用融資の保証】</b>事業用融資の保証人になろうとする個人は、原則として<b>公正証書</b>で保証の意思を確認する必要があります。ただし、主債務者の配偶者等は例外。</p>`,
traps:["連帯債務の絶対効＝<b>弁済・更改・混同・相殺</b>の4つのみ","連帯保証人には<b>催告・検索の抗弁権なし</b>","個人根保証は<b>極度額の定めが必要</b>（なければ無効）"]},

{id:"k08",cat:"kenri",topic:"賃貸借・借地借家法",freq:5,
desc:`<p>不動産の賃貸借は民法の規定と借地借家法の特則が交差する最重要分野です。</p>
<p><b>【賃借権の対抗力】</b>以下のいずれかがあれば第三者に対抗可能：<br>
・賃借権の<b>登記</b>（民法の原則だが、貸主に協力義務なし）<br>
・<b>借地上の建物の登記</b>（借地権の場合）<br>
・<b>建物の引渡し</b>（借家権の場合）</p>
<p><b>【敷金（R2改正で明文化）】</b>敷金返還義務は、<b>賃貸借の終了＋目的物の明渡し</b>の両方が揃った時に発生します。賃貸借終了だけでは返還義務は生じません。また、賃貸人が変わった場合、敷金関係は<b>新賃貸人に当然に承継</b>されます。</p>
<p><b>【借地権の存続期間】</b><br>
<table class="compare-table"><tr><th></th><th>当初</th><th>1回目更新</th><th>2回目以降</th></tr>
<tr><td><b>普通借地権</b></td><td>30年</td><td>20年</td><td>10年</td></tr></table>
借地人に不利な特約は無効です（短縮する特約は無効）。</p>
<p><b>【定期借地権の3類型】</b><br>
<table class="compare-table"><tr><th>類型</th><th>期間</th><th>要件</th></tr>
<tr><td>一般定期</td><td>50年以上</td><td>書面で特約</td></tr>
<tr><td>建物譲渡特約付</td><td>30年以上</td><td>建物譲渡の特約</td></tr>
<tr><td>事業用定期</td><td>10年以上50年未満</td><td>公正証書</td></tr></table></p>`,
traps:["敷金返還＝「賃貸借終了」＋「<b>明渡し</b>」の<b>両方</b>が必要","普通借地権＝<b>30年→20年→10年</b>（短縮特約無効）","定期借地権3類型の期間・要件の混同が狙われる"]},

{id:"k09",cat:"kenri",topic:"借地借家法（借家権）",freq:5,
desc:`<p><b>【普通建物賃貸借】</b><br>
・期間の定めあり：1年以上（<b>1年未満の定めは「期間の定めなし」とみなす</b>）<br>
・更新拒絶には<b>正当事由</b>が必要（立退料の提供だけでは不十分、総合考慮）<br>
・対抗力＝<b>建物の引渡し</b>があれば第三者に対抗可能</p>
<p><b>【定期建物賃貸借】</b>更新がなく、期間満了で確定的に終了する借家契約です。成立要件：<br>
① <b>書面</b>（公正証書でなくてもOK）による契約<br>
② 契約前に「更新がなく期間満了で終了する」旨を<b>書面で説明</b>する<br>
→ この書面説明を怠ると<b>普通借家契約</b>になってしまう（頻出ひっかけ）</p>
<p><b>【定期借家の中途解約】</b>原則として中途解約はできません。例外として、<b>床面積200㎡未満の居住用</b>建物で、やむを得ない事情がある場合に限り、借主から中途解約の申入れが可能です。</p>
<p><b>【造作買取請求権】</b>賃貸人の同意を得て付加した造作について、賃貸借終了時に賃貸人に買取りを請求できる権利です。ただし<b>特約で排除可能</b>（強行規定ではない）です。</p>`,
traps:["<b>1年未満</b>の期間の定め＝「期間の定めなし」とみなす","定期借家＝<b>書面で説明</b>しないと普通借家になる","中途解約＝<b>200㎡未満の居住用</b>のみ可","造作買取請求権＝特約で<b>排除可能</b>"]},

{id:"k10",cat:"kenri",topic:"相続",freq:4,
desc:`<p><b>【法定相続分】</b>暗記必須の数字です。<br>
<table class="compare-table"><tr><th>相続人の組合せ</th><th>配偶者</th><th>他方</th></tr>
<tr><td>配偶者＋子</td><td>1/2</td><td>1/2</td></tr>
<tr><td>配偶者＋直系尊属</td><td>2/3</td><td>1/3</td></tr>
<tr><td>配偶者＋兄弟姉妹</td><td>3/4</td><td>1/4</td></tr></table>
子・直系尊属・兄弟姉妹が複数いる場合は均等に分けます。代襲相続（子が先に死亡→孫が代わりに相続）にも注意。</p>
<p><b>【遺留分】</b>一定の相続人に保証される最低限の取り分です。<br>
・<b>直系尊属のみが相続人</b>→被相続人の財産の<b>1/3</b><br>
・<b>それ以外</b>→被相続人の財産の<b>1/2</b><br>
兄弟姉妹には遺留分がありません。</p>
<p><b>【遺留分侵害額請求（R1改正）】</b>旧法では「減殺請求」で現物返還でしたが、改正後は<b>金銭請求に一本化</b>されました。「お金で解決する」という制度に変わった点が重要です。</p>
<p><b>【相続放棄】</b>相続開始を知った時から3ヶ月以内に<b>家庭裁判所に申述</b>して行います。相続人間の合意だけでは相続放棄にはなりません。放棄した者は最初から相続人でなかったものとみなされます。</p>`,
traps:["法定相続分：配偶者＋子＝<b>1/2ずつ</b>、＋直系尊属＝<b>2/3:1/3</b>、＋兄弟姉妹＝<b>3/4:1/4</b>","遺留分侵害額請求は<b>金銭請求に一本化</b>（現物返還ではない）","相続放棄は<b>家庭裁判所への申述</b>が必要"]},

{id:"k11",cat:"kenri",topic:"区分所有法",freq:4,
desc:`<p>マンションの法律関係を規律する法律です。集会の決議要件の数字が頻出です。</p>
<p><b>【決議要件の比較】</b><br>
<table class="compare-table"><tr><th>事項</th><th>要件</th></tr>
<tr><td>普通決議（管理行為等）</td><td>区分所有者及び議決権の各<b>過半数</b></td></tr>
<tr><td>規約の設定・変更・廃止</td><td>各<b>3/4以上</b></td></tr>
<tr><td>共用部分の重大変更</td><td>各<b>3/4以上</b></td></tr>
<tr><td><b>建替え決議</b></td><td>各<b>4/5以上</b></td></tr></table></p>
<p><b>【共用部分の管理・変更】</b><br>
・<b>保存行為</b>＝各共有者が単独で可能<br>
・<b>管理行為</b>（通常の管理）＝過半数で決定<br>
・<b>変更行為</b>（形状又は効用の著しい変更）＝3/4以上</p>
<p><b>【管理者】</b>集会の決議で選任。<b>区分所有者以外の者も管理者になれます</b>（法人も可）。管理者は共用部分等の保存・管理に関して区分所有者を代理します。</p>
<p><b>【規約の効力】</b>規約は区分所有者の特定承継人（購入者）にも効力が及びます。賃借人などの占有者は「建物の使用」に関する規約に従う義務があります。</p>`,
traps:["建替え決議＝各<b>4/5以上</b>（最も厳しい要件）","規約の設定変更廃止＝各<b>3/4以上</b>","管理者は<b>区分所有者以外</b>でもなれる（法人も可）"]},

{id:"k12",cat:"kenri",topic:"不動産登記法",freq:4,
desc:`<p><b>【登記制度の基本原則】</b><br>
日本の不動産登記には<b>推定力</b>（登記された権利関係は一応正しいと推定される）はありますが、<b>公信力はありません</b>。つまり、登記を信頼して取引しても、登記が実体と異なれば権利を取得できません。</p>
<p><b>【登記申請の原則】</b><br>
・<b>共同申請主義</b>＝登記権利者と登記義務者が共同で申請するのが原則<br>
・<b>単独申請</b>が認められる例外：所有権保存登記、相続登記、判決による登記、仮登記の抹消（仮登記名義人）等</p>
<p><b>【仮登記】</b>本登記をするための手続上の条件が備わっていない場合に、将来の本登記の<b>順位を保全</b>するための登記です。<b>仮登記には対抗力がありません</b>。本登記をして初めて対抗力が発生しますが、その順位は仮登記の順位に遡ります。</p>
<p><b>【相続登記の義務化（R6年4月施行）】</b>不動産を取得した相続人は、取得を知った日から<b>3年以内</b>に相続登記を申請しなければなりません。正当な理由なく怠ると過料の対象になります。</p>`,
traps:["登記には<b>公信力はない</b>（推定力はある）","仮登記は<b>対抗力なし</b>→<b>順位保全効</b>のみ","相続登記の義務化＝<b>3年以内</b>に申請"]},

// ========== 宅建業法 ==========
{id:"t01",cat:"takken",topic:"重要事項説明（35条書面）",freq:5,
desc:`<p>宅建業法で最も出題数が多い最重要論点です。物件を取得し、又は借りようとする者に対し、契約が成立する<b>前</b>に、取引に関する重要な事項を説明する制度です。</p>
<p><b>【誰が・誰に・いつ】</b><br>
・<b>説明者</b>＝<b>宅地建物取引士</b>が行い、35条書面に<b>記名</b>する（R4改正で押印廃止）<br>
・<b>交付</b>＝宅建士でなくても可能（事務員でもOK）<br>
・<b>相手方</b>＝取得者・借主に対して行う<br>
・<b>時期</b>＝契約成立<b>前</b>（契約と同時ではダメ）</p>
<p><b>【業者が買主の場合】</b>重要事項の<b>説明は省略</b>できますが、35条書面の<b>交付は省略できません</b>。プロ相手でも書面は渡す必要がある点がひっかけポイントです。</p>
<p><b>【35条と37条の記載事項の振分け】</b>超頻出です。<br>
・<b>35条にあって37条にない</b>もの：法令に基づく制限の概要、飲用水等の供給施設<br>
・<b>37条にあって35条にない</b>もの：<b>代金の額</b>、支払時期・方法、引渡し時期<br>
・<b>両方にある</b>もの：契約不適合担保責任の定めがあるときはその内容</p>
<p><b>【IT重説】</b>R3年以降、売買でもオンラインによる重説が可能になりました。</p>`,
traps:["説明は<b>宅建士</b>が行う（交付は誰でもOK）","<b>代金の額</b>は35条ではなく<b>37条</b>の記載事項","業者が買主でも35条書面の<b>交付は必要</b>（説明は省略可）"]},

{id:"t02",cat:"takken",topic:"37条書面（契約書面）",freq:5,
desc:`<p>宅建業者は、契約が成立したときは、遅滞なく、契約の内容を記載した<b>37条書面を交付</b>しなければなりません。</p>
<p><b>【35条との違い】</b><br>
<table class="compare-table"><tr><th></th><th>35条書面</th><th>37条書面</th></tr>
<tr><td>交付時期</td><td>契約<b>前</b></td><td>契約<b>後</b></td></tr>
<tr><td>説明義務</td><td><b>あり</b>（宅建士が説明）</td><td><b>なし</b>（交付のみ）</td></tr>
<tr><td>記名</td><td>宅建士が記名</td><td>宅建士が記名</td></tr>
<tr><td>交付先</td><td>取得者・借主</td><td><b>両当事者</b></td></tr></table></p>
<p><b>【必要的記載事項】</b>（定めの有無に関わらず必ず記載）<br>
・当事者の氏名住所、物件の所在・面積<br>
・<b>代金の額・支払時期・方法</b>（35条にはない！）<br>
・物件の引渡し時期、移転登記の申請時期</p>
<p><b>【任意的記載事項】</b>（定めがあるときのみ記載）<br>
・<b>損害賠償の予定額・違約金</b><br>
・契約不適合担保責任の内容<br>
・ローン不成立の場合の措置</p>`,
traps:["<b>代金の額</b>は37条の<b>必要的</b>記載事項（35条にはない）","37条書面は<b>説明不要</b>（記名＋交付のみ）","交付先は<b>売主買主双方</b>（35条は取得者・借主のみ）"]},

{id:"t03",cat:"takken",topic:"8種制限（自ら売主制限）",freq:5,
desc:`<p>宅建業者が<b>自ら売主</b>となり、<b>一般消費者が買主</b>となる場合に適用される消費者保護規定です。8つの制限があります。</p>
<p><b>【最重要ポイント】業者間取引には8種制限は一切適用されません。</b>これが最大のひっかけです。</p>
<p><b>【主な制限の内容】</b><br>
<b>① クーリングオフ</b>：<b>事務所等以外</b>の場所で申込み・契約をした場合、<b>書面で告げられた日から8日以内</b>に書面で撤回可能。ただし引渡し＋代金全額支払い後は不可。</p>
<p><b>② 手付の額の制限</b>：代金の<b>20%（10分の2）を超える手付は受領不可</b>。受領した手付は<b>解約手付とみなす</b>（証約手付・違約手付としても、解約手付の性質が認められる）。</p>
<p><b>③ 損害賠償の予定等の制限</b>：損害賠償の予定＋違約金の合計が代金の<b>20%を超える部分は無効</b>（全体が無効ではなく、超える部分のみ無効）。</p>
<p><b>④ 自己の所有に属しない物件の売買制限</b>：原則として他人物売買・未完成物件の売買は禁止。ただし、確実に取得できる場合（売買契約等がある場合）は例外的に可能。</p>`,
traps:["<b>業者間取引には適用なし</b>（最重要ひっかけ）","クーリングオフ＝「<b>事務所等以外</b>」で申込み→<b>書面で8日以内</b>","手付は代金の<b>20%超は受領不可</b>、性質は<b>解約手付</b>とみなす","損害賠償の予定＝20%超の<b>部分</b>が無効（全体ではない）"]},

{id:"t04",cat:"takken",topic:"免許制度",freq:4,
desc:`<p><b>【宅建業とは】</b>宅地又は建物の<b>売買・交換</b>を自ら行うこと、又は売買・交換・<b>賃借の媒介・代理</b>を業として行うことです。<br>
<b>「自ら賃貸」は宅建業に該当しません</b>（最重要）。アパート経営、サブリース業者も免許不要です。</p>
<p><b>【免許の種類】</b><br>
・<b>国土交通大臣免許</b>＝2以上の都道府県に事務所を設置<br>
・<b>都道府県知事免許</b>＝1の都道府県のみに事務所を設置<br>
基準は<b>事務所の所在地</b>であり、取引を行う場所ではありません。</p>
<p><b>【有効期間と更新】</b><br>
・有効期間＝<b>5年</b><br>
・更新申請＝期間満了の<b>90日前から30日前</b>まで<br>
・更新申請中に期間満了→処分があるまで従前の免許は有効</p>
<p><b>【欠格事由】</b>以下に該当すると免許を受けられません（主要なもの）：<br>
・禁錮以上の刑に処せられ、執行終了から<b>5年</b>を経過しない者<br>
・宅建業法違反等で罰金刑に処せられ、執行終了から<b>5年</b>を経過しない者<br>
・免許取消処分を受けてから<b>5年</b>を経過しない者<br>
・法人の<b>役員</b>が欠格事由に該当→法人も免許不可</p>`,
traps:["<b>自ら賃貸は宅建業に該当しない</b>（最重要）","免許の有効期間＝<b>5年</b>、更新は<b>90日前〜30日前</b>","法人の<b>役員</b>が欠格事由→<b>法人も</b>免許取消し"]},

{id:"t05",cat:"takken",topic:"宅建士制度",freq:4,
desc:`<p><b>【独占業務】</b>宅建士でなければできない業務は<b>3つだけ</b>です：<br>
① <b>重要事項の説明</b>（35条）<br>
② <b>35条書面への記名</b><br>
③ <b>37条書面への記名</b><br>
これ以外（書面の交付、物件案内、契約の勧誘等）は宅建士でなくてもOKです。</p>
<p><b>【専任の宅建士の設置義務】</b><br>
事務所ごとに、業務に従事する者<b>5人に1人以上</b>の割合で、専任の宅建士を設置しなければなりません。不足した場合は<b>2週間以内</b>に補充しなければなりません。</p>
<p><b>【登録と宅建士証】</b><br>
・登録＝試験合格地の<b>都道府県知事</b>に登録（一度登録すれば一生有効）<br>
・<b>登録の移転</b>＝他の都道府県に移る場合は任意（義務ではない）。新たな試験は不要<br>
・<b>宅建士証</b>＝有効期間<b>5年</b>。更新には法定講習の受講が必要<br>
・事務禁止処分中でも登録の移転は可能（よく出る）</p>`,
traps:["独占業務＝<b>3つだけ</b>（重説・35条記名・37条記名）","専任の宅建士＝<b>5人に1人</b>以上","登録の移転＝<b>任意</b>（義務ではない）、新試験<b>不要</b>"]},

{id:"t06",cat:"takken",topic:"営業保証金・保証協会",freq:4,
desc:`<p>取引の相手方を保護するため、宅建業者は<b>営業保証金の供託</b>か<b>保証協会への加入</b>のいずれかが必要です。</p>
<p><b>【営業保証金 vs 弁済業務保証金分担金】</b><br>
<table class="compare-table"><tr><th></th><th>営業保証金</th><th>分担金</th></tr>
<tr><td>主たる事務所</td><td><b>1,000万円</b></td><td><b>60万円</b></td></tr>
<tr><td>従たる事務所</td><td><b>500万円</b></td><td><b>30万円</b></td></tr>
<tr><td>供託先</td><td>主たる事務所の最寄りの供託所</td><td>保証協会に納付</td></tr></table></p>
<p><b>【保証協会のルール】</b><br>
・保証協会は<b>2つ</b>（全宅、全日）あり、<b>二重加入は不可</b><br>
・保証協会の社員は営業保証金を供託する必要なし<br>
・社員でなくなった場合は、<b>1週間以内</b>に営業保証金を供託</p>
<p><b>【還付後の補充】</b><br>
・営業保証金の場合：通知書の送付を受けてから<b>2週間以内</b>に不足額を供託<br>
・弁済業務保証金の場合：社員は通知を受けてから<b>2週間以内</b>に分担金を納付</p>`,
traps:["営業保証金＝主<b>1,000万</b>/従<b>500万</b>（分担金は主60万/従30万）","保証協会の<b>二重加入不可</b>","還付後の補充＝いずれも<b>2週間以内</b>"]},

{id:"t07",cat:"takken",topic:"媒介契約",freq:4,
desc:`<p>媒介契約には3つの類型があり、規制内容が異なります。数字の正確な暗記が必須です。</p>
<p><b>【3類型の比較表】</b><br>
<table class="compare-table"><tr><th></th><th>一般</th><th>専任</th><th>専属専任</th></tr>
<tr><td>他業者への依頼</td><td>可</td><td><b>不可</b></td><td><b>不可</b></td></tr>
<tr><td>自己発見取引</td><td>可</td><td>可</td><td><b>不可</b></td></tr>
<tr><td>レインズ登録</td><td>義務なし</td><td><b>7日以内</b></td><td><b>5日以内</b></td></tr>
<tr><td>業務報告</td><td>義務なし</td><td><b>2週間に1回</b></td><td><b>1週間に1回</b></td></tr>
<tr><td>有効期間</td><td>制限なし</td><td><b>3ヶ月以内</b></td><td><b>3ヶ月以内</b></td></tr></table></p>
<p><b>【有効期間の注意点】</b>専任・専属専任は3ヶ月以内で、<b>自動更新は不可</b>です。更新は依頼者からの申出がある場合に限られます。3ヶ月を超える特約は3ヶ月に短縮されます。</p>`,
traps:["専属専任＝自己発見取引<b>不可</b>・レインズ<b>5日</b>・報告<b>1週間に1回</b>","専任＝レインズ<b>7日</b>・報告<b>2週間に1回</b>","有効期間＝<b>3ヶ月以内</b>（<b>自動更新不可</b>）"]},

{id:"t08",cat:"takken",topic:"報酬額の制限",freq:5,
desc:`<p>宅建業者が受領できる報酬額には法定の上限があります。計算問題が毎年出題されます。</p>
<p><b>【売買の媒介報酬（速算式）】</b><br>
<table class="compare-table"><tr><th>売買代金（税抜）</th><th>報酬率</th></tr>
<tr><td>200万円以下</td><td>5%</td></tr>
<tr><td>200万円超〜400万円以下</td><td>4%+2万円</td></tr>
<tr><td><b>400万円超</b></td><td><b>3%+6万円</b></td></tr></table>
※ 税抜の本耐火格に対して計算し、最後に<b>消費税を加算</b>します。<br>
※ 媒介の場合、<b>片方の当事者</b>から受領できる上限額。双方から受領する場合は×2。</p>
<p><b>【賃貸の媒介報酬】</b><br>
貸主と借主の<b>合計で借賃の1ヶ月分＋消費税</b>が上限です。居住用建物の場合、依頼者の承諾がなければ、一方から受領できるのは<b>半月分</b>が上限です。</p>
<p><b>【低廉な空家等の特例】</b>400万円以下の売買で、通常より多くの現地調査費用がかかる場合、売主から受領できる報酬は<b>18万円＋消費税</b>まで可能です。</p>`,
traps:["400万円<b>超</b>＝3%+6万円（ちょうど400万円は4%+2万円）","賃貸の報酬＝<b>合計</b>で借賃の<b>1ヶ月分</b>","低廉な空家＝売主から<b>18万円+税</b>まで可"]},

// ========== 法令上の制限 ==========
{id:"h01",cat:"hourei",topic:"都市計画法（用途地域・開発許可）",freq:5,
desc:`<p><b>【都市計画区域の構成】</b><br>
・<b>市街化区域</b>＝すでに市街地or10年以内に市街化を図る区域。<b>用途地域を必ず定める</b><br>
・<b>市街化調整区域</b>＝市街化を抑制する区域。用途地域は<b>原則定めない</b><br>
・<b>非線引き区域</b>＝区域区分を定めていない区域</p>
<p><b>【開発許可制度】</b>開発行為（建築物の建築等を目的とした土地の区画形質の変更）を行うには許可が必要です。面積要件の暗記が必須です。<br>
<table class="compare-table"><tr><th>区域</th><th>許可が必要な面積</th></tr>
<tr><td><b>市街化区域</b></td><td><b>1,000㎡以上</b></td></tr>
<tr><td><b>市街化調整区域</b></td><td><b>面積問わず原則必要</b></td></tr>
<tr><td>非線引き・準都市計画区域</td><td>3,000㎡以上</td></tr>
<tr><td>都市計画区域外</td><td>10,000㎡以上</td></tr></table></p>
<p><b>【許可不要の例外】</b><br>
・<b>農林漁業用の建築物</b>＝市街化区域<b>以外</b>では許可不要。市街化区域では許可必要<br>
・公益上必要な建築物（駅舎、図書館、公民館等）<br>
・都市計画事業の施行として行う開発行為</p>`,
traps:["市街化区域＝<b>1,000㎡以上</b>で許可必要","市街化調整区域＝<b>面積問わず原則必要</b>","農林漁業用建築物は<b>市街化区域では許可必要</b>（区域外では不要）"]},

{id:"h02",cat:"hourei",topic:"建築基準法（容積率・建ぺい率）",freq:5,
desc:`<p><b>【容積率】</b>＝延べ面積÷敷地面積。建物の総ボリュームを制限します。<br>
前面道路の幅員が<b>12m未満</b>の場合、以下の計算値と指定容積率の<b>小さい方</b>が適用されます：<br>
・<b>住居系</b>用途地域→幅員×<b>4/10</b><br>
・<b>その他</b>（商業系等）→幅員×<b>6/10</b><br>
例：第一種住居地域、前面道路6m、指定容積率300%の場合→6m×4/10=240% < 300% → <b>240%</b>が適用</p>
<p><b>【建ぺい率】</b>＝建築面積÷敷地面積。敷地に対する建物の広がりを制限します。<br>
<b>緩和措置</b>（加算）：<br>
・<b>角地</b>→<b>+10%</b><br>
・<b>防火地域内の耐火建築物</b>→<b>+10%</b><br>
・両方該当→<b>+20%</b>（併用可能）<br>
・建ぺい率が8/10の地域で、かつ防火地域内の耐火建築物→<b>建ぺい率制限なし</b></p>
<p><b>【セットバック】</b>2項道路（幅員4m未満の道路）に面する敷地では、道路中心から2mの線まで後退が必要です。<b>セットバック部分は敷地面積に算入できません</b>。</p>
<p><b>【日影規制】</b><b>商業・工業・工業専用地域</b>には適用されません。</p>`,
traps:["前面道路12m未満→住居系は<b>幅員×4/10</b>、その他は<b>×6/10</b>","角地<b>+10%</b>＋防火地域内耐火<b>+10%</b>＝<b>+20%</b>併用可","セットバック部分は<b>敷地面積に算入しない</b>"]},

{id:"h03",cat:"hourei",topic:"建築基準法（道路・建築確認）",freq:4,
desc:`<p><b>【建築基準法上の道路】</b>原則として幅員<b>4m以上</b>のものです（特定行政庁指定区域では6m）。<br>
<b>2項道路（みなし道路）</b>＝建築基準法施行時（昭和25年）に既に建物が立ち並んでいた幅員4m未満の道で、特定行政庁が指定したもの。道路の<b>中心線から2m</b>の線まで後退（セットバック）が必要です。</p>
<p><b>【接道義務】</b>建築物の敷地は、建築基準法上の道路に<b>2m以上</b>接しなければなりません。地方公共団体の条例でこの要件を<b>付加</b>することは可能（例：3m以上）ですが、<b>緩和</b>はできません。</p>
<p><b>【建築確認】</b>建築物を建築する前に、建築計画が法令に適合しているか確認を受ける手続です。<br>
・<b>都市計画区域内</b>＝すべての建築物に確認が必要<br>
・<b>都市計画区域外</b>＝特殊建築物（200㎡超）や大規模建築物のみ確認必要</p>
<p><b>【用途変更】</b>建築物の用途を変更する場合、類似用途間（例：劇場→映画館）の変更は確認不要。<b>200㎡超</b>の特殊建築物への用途変更は確認が必要です。</p>`,
traps:["道路＝原則幅員<b>4m以上</b>","2項道路→<b>中心から2m</b>セットバック","接道義務＝道路に<b>2m以上</b>接すること"]},

{id:"h04",cat:"hourei",topic:"農地法",freq:4,
desc:`<p>農地の権利移動や転用を規制する法律です。3条・4条・5条の区別が核心です。</p>
<p><b>【3条・4条・5条の比較】</b><br>
<table class="compare-table"><tr><th></th><th>3条（権利移動）</th><th>4条（転用）</th><th>5条（転用目的の権利移動）</th></tr>
<tr><td>内容</td><td>農地のまま売買・貸借</td><td>自分の農地を農地以外に</td><td>農地を転用目的で売買等</td></tr>
<tr><td>許可権者</td><td><b>農業委員会</b></td><td><b>都道府県知事</b></td><td><b>都道府県知事</b></td></tr>
<tr><td>市街化区域の特例</td><td><b>なし（許可必要）</b></td><td>届出でOK</td><td>届出でOK</td></tr></table></p>
<p><b>【重要ポイント】</b><br>
・市街化区域内の農地は4条・5条については<b>農業委員会への届出</b>で足りますが、<b>3条は市街化区域内でも許可が必要</b>です（ひっかけ注意）<br>
・<b>相続</b>による取得→3条<b>許可不要</b>。ただし農業委員会への<b>届出は必要</b><br>
・許可なく転用した場合→<b>原状回復命令</b>の対象</p>`,
traps:["3条＝<b>農業委員会</b>、4条・5条＝<b>都道府県知事</b>","市街化区域内→4条5条は<b>届出でOK</b>だが<b>3条は許可必要</b>","相続＝許可不要だが<b>届出は必要</b>"]},

{id:"h05",cat:"hourei",topic:"国土利用計画法",freq:3,
desc:`<p>一定面積以上の土地取引について、都道府県知事への届出を義務づける法律です。</p>
<p><b>【事後届出の面積要件】</b><br>
<table class="compare-table"><tr><th>区域</th><th>届出が必要な面積</th></tr>
<tr><td>市街化区域</td><td><b>2,000㎡以上</b></td></tr>
<tr><td>市街化調整区域・非線引き</td><td><b>5,000㎡以上</b></td></tr>
<tr><td>都市計画区域外</td><td><b>10,000㎡以上</b></td></tr></table></p>
<p><b>【届出の手続】</b><br>
・届出義務者＝<b>権利取得者（買主）</b>（売主ではない）<br>
・届出時期＝契約締結後<b>2週間以内</b><br>
・届出先＝土地が所在する市町村長を経由して都道府県知事へ</p>
<p><b>【届出不要の取引】</b><br>
・当事者の一方が<b>国・地方公共団体</b>の場合<br>
・農地法3条の許可を受けた場合<br>
・民事調停法による調停に基づく場合 等</p>`,
traps:["面積＝市街化<b>2,000㎡</b>／調整等<b>5,000㎡</b>／区域外<b>10,000㎡</b>","届出義務者＝<b>買主</b>（売主ではない）","届出は契約後<b>2週間以内</b>"]},

// ========== 税・その他 ==========
{id:"z01",cat:"zei",topic:"不動産取得税・固定資産税",freq:4,
desc:`<p><b>【不動産取得税】</b><br>
・課税主体＝<b>都道府県</b>（国税ではない）<br>
・課税対象＝不動産の取得（売買・贈与・建築等）<br>
・<b>非課税</b>＝<b>相続</b>による取得、包括遺贈。ただし<b>贈与は課税</b>される<br>
・特定遺贈（特定の財産を指定する遺贈）は<b>課税</b><br>
・住宅の課税標準特例＝<b>1,200万円控除</b>（認定長期優良住宅は1,300万円）<br>
・免税点＝土地<b>10万円</b>、家屋（建築）<b>23万円</b>、家屋（売買）<b>12万円</b></p>
<p><b>【固定資産税】</b><br>
・課税主体＝<b>市町村</b>（東京23区は都）<br>
・賦課期日＝毎年<b>1月1日</b>の所有者に課税（年途中の売買でも1/1の所有者が納税義務者）<br>
・住宅用地の特例：<b>小規模住宅用地</b>（200㎡以下）＝課税標準×<b>1/6</b>、<b>一般住宅用地</b>＝課税標準×<b>1/3</b><br>
・新築住宅の減額＝<b>3年間</b>（3階建以上の耐火建築物は<b>5年間</b>）税額を<b>1/2</b>に減額<br>
・免税点＝土地<b>30万円</b>、家屋<b>20万円</b></p>`,
traps:["不動産取得税：<b>相続は非課税</b>、贈与は課税","固定資産税の賦課期日＝<b>1月1日</b>（4月1日ではない）","住宅用地の特例＝小規模<b>1/6</b>、一般<b>1/3</b>"]},

{id:"z02",cat:"zei",topic:"譲渡所得税",freq:4,
desc:`<p>不動産を譲渡した場合の所得税に関する特例です。居住用財産の特例が頻出します。</p>
<p><b>【3,000万円特別控除】</b><br>
・居住用財産を譲渡した場合、譲渡所得から<b>3,000万円を控除</b>できる<br>
・所有期間の長短は<b>問わない</b>（短期でも適用可）<br>
・居住しなくなってから<b>3年目の年末まで</b>に譲渡すれば適用可<br>
・<b>配偶者・直系血族</b>への譲渡は適用除外</p>
<p><b>【軽減税率の特例】</b><br>
・所有期間<b>10年超</b>の居住用財産を譲渡した場合に適用<br>
・6,000万円以下の部分→<b>14%</b>（所得税10%＋住民税4%）<br>
・3,000万円控除と<b>併用可能</b></p>
<p><b>【買換え特例】</b><br>
・居住用財産を売って新たに居住用財産を取得した場合、譲渡所得の課税を繰延べ<br>
・3,000万円控除とは<b>選択適用</b>（<b>併用不可</b>）</p>`,
traps:["3,000万円控除＝所有期間<b>問わず</b>適用可","軽減税率＝所有期間<b>10年超</b>が要件。3,000万円控除と<b>併用可</b>","買換え特例と3,000万円控除は<b>併用不可</b>（選択適用）"]},

{id:"z03",cat:"zei",topic:"景品表示法・住宅金融支援機構",freq:3,
desc:`<p><b>【景品表示法（不動産の表示に関する公正競争規約）】</b><br>
・徒歩時間＝道路距離<b>80m</b>につき<b>1分</b>で算出。端数は<b>切上げ</b>（例：160m=2分、240m=3分）<br>
・「<b>新築</b>」と表示できる条件＝建築後<b>1年未満</b>かつ<b>未入居</b>（どちらか一方でも欠ければ不可）<br>
・<b>最上級表現</b>（「日本一」「完全」「最高」等）は、合理的根拠がなければ使用不可<br>
・おとり広告＝実際には取引できない物件の広告は禁止</p>
<p><b>【住宅金融支援機構法】</b><br>
・機構は<b>直接融資を原則行わない</b>（証券化支援業務が中心）<br>
・<b>フラット35の仕組み</b>：民間金融機関が融資→機構が住宅ローン債権を買い取り→MBS（住宅ローン担保証券）として投資家に売却<br>
・融資対象の床面積＝一戸建て<b>70㎡以上</b>、マンション<b>30㎡以上</b><br>
・直接融資の例外＝災害復興住宅、マンション共用部分リフォーム、財形住宅融資等</p>`,
traps:["徒歩＝<b>80mにつき1分</b>（端数切上げ）","新築＝建築後<b>1年未満</b>かつ<b>未入居</b>","機構は<b>直接融資を原則行わない</b>（証券化支援が中心）"]}
];

の文場を行う案内所を設置し当該案内所において建物の売買契約を締結する場合国土交通大臣へ免許への申請をしなければならない","a":false,"e":"事務所を設置したわけではないので免許外は不要となります"},{"f":"menkyo","fn":"免許","q":"法人Cの役員のうちに障害の罪を犯し罰金1年の経にさせられその経行猶予期間を経過したがその経過した日から5年を経過しないものがいる場合Cは免許を受けることができない","a":false,"e":"執行猶予期間が経過したらすぐに免許を受けることができます"},{"f":"menkyo","fn":"免許","q":"A社国土交通大臣免許は貢献に本店おに支店を設置しているがおの支店を廃止し本件を含む全ての事務所を貢献内にのみ設置して事業を営むこととし貢献知事へ免許の申請を行った","a":true,"e":"貢献に本店お付けに支店で貢献内のみにした場合貢献知事へ申請を行います"},{"f":"menkyo","fn":"免許","q":"建業者D社の代表取り締まり役が法人税法違反により公金系に蘇せられたとしても執行猶予がふされれればD社の免許は取り消されることはない","a":false,"e":"執行猶予がついていても役員が罰金なので欠格要因となります"},{"f":"menkyo","fn":"免許","q":"建業者F社が株主総会の決議により解散することとなった場合その清算人は当該解散の日から30日以内にその胸を免許権者に届けでなければならないこち<passage7>らの","a":true,"e":"解散となった場合清算人が30日以内に届出を行います"},{"f":"menkyo","fn":"免許","q":"建業者A社が免許を受けていないB社との合併により消滅する場合存続会社であるB社はA社の免許を承継することはできない","a":true,"e":"この場合免許を承継することはできないとされています"},{"f":"menkyo","fn":"免許","q":"法人である宅建業者Aは役員の住所について変更がある場合その日から30日以内に当該変更にかかる時効を記載した届出を免許権者に提出しなければならない","a":false,"e":"役員の住所は提出しなくても良いとされています"},{"f":"menkyo","fn":"免許","q":"社はH社の吸収合併で消滅したH社を代表する役員愛は当該合併の日から30日以内に社が消滅したことを免許権者に届けてなければならない","a":false,"e":"消滅した会社の代表者であったものが届けで行います消滅して暇な人が行うという感じで覚えておきましょう"},{"f":"menkyo","fn":"免許","q":"B社貢献知事免許は貢献の事務所を廃止しおつけ内で新たに事務所を設置して宅地建物取引業を営むため貢献知事へ廃業の届出を行うとともにお建知事へ免許外の申請を行った","a":false,"e":"廃業の届けでは不要となっています"},{"f":"menkyo","fn":"免許","q":"地建物取引を営もうとするものは同一県内に2以上の事務所を設置してその事業を営もうとする場合にあっては知事の免許を受けなければならない","a":true,"e":"同一県内なので知事免許<passage8>となります"},{"f":"menkyo","fn":"免許","q":"AがB社が後継に所有するマンションを貸主として不特定多数のものに反復継続して賃貸する場合Aは貢献知事の免許を受けなければならない","a":false,"e":"間違えてしまった人もいるかもしれませんが自ら貸主賃貸は宅建業に当てはまらないので免許不要となります"},{"f":"menkyo","fn":"免許","q":"地建物取引を営もうとするものの免許の有効期間は5年である","a":true,"e":"有効期間は5年とされています"},{"f":"menkyo","fn":"免許","q":"免許の更新を受けようとする宅建業者は免許の有効期間満了の日の2週間前までに免許申請書を提出しなければならない","a":false,"e":"免許の有効期間満了の日の90日前から30日前となっています"},{"f":"menkyo","fn":"免許","q":"本店及び指定一箇所を有する法人映画貢献内の本店では建設業のみを営みお付け内の支店では宅地建物取引業のみを営む場合Aは乙県知事の免許を受けなければならない","a":false,"e":"本店が建設業支店が宅建業だと本店も宅建業と見なされますなので国土交通大臣の免許となります"},{"f":"menkyo","fn":"免許","q":"免許を受けようとするに暴行の罪により交流の刑に処せられたものが役員として在籍している場合その経行が終わってから5年を経過していなければC者は免許を受けることができない","a":false,"e":"今回だと交流になるので結に該当しないということで新者は免許を受けることができるとされています"},{"f":"menkyo","fn":"免許","q":"法人である宅建業者Bが合併<passage9>により消滅した場合Bを代表する役員であったものはその日から30日以内にその胸を免許権者に届けてなければならない","a":true,"e":"その日から30日以内に合併により消滅した場合は届出るとされています"},{"f":"menkyo","fn":"免許","q":"法人である宅建業者Aは役員の住所について変更があった場合その日から30日以内に免許権者に提出しなければならない","a":false,"e":"役員の住所の場合届出不要となっています氏名は届出が必要なので注意しましょう"},{"f":"menkyo","fn":"免許","q":"営業に関し成年者と同一の行為能力を有しない未成年者であるFの法定代理人であるGが配人罪で罰金の経に処せられた場合その経行が終わった日から5年を経過していなければFは免許を受けることができない","a":true,"e":"人罪で罰金なので5年を経過していないと免許を受けることができないとされています"},{"f":"menkyo","fn":"免許","q":"D社の取り締まり役がかつて破産手続き開始の決定を受けたことがある場合で復を得てから5年を経過しない時D社は免許を受けることができない","a":false,"e":"を得たらすぐに免許を受けることができるとされています"},{"f":"menkyo","fn":"免許","q":"法人Bの役員のうちに宅建の規定に違反したことにより罰金の経にられその経行が終わった日から5年を経過しないものがいる場合Bは免許を受けることができない","a":true,"e":"宅建業法に違反して罰金の経にせられているので5年間は免許を受け<passage10>ることができないとされています"},{"f":"menkyo","fn":"免許","q":"不正の手段で免許を取得したとして免許を取り消された取り締まり役は当該取り消しにかかる聴聞の記述及び場所の工事の日の30日前に取り締まり役を退任した免許取り消しの日から5年を経過していない場合Cは免許を受けることができない","a":true,"e":"不正の手段で免許を取得したとして免許を取り消されたということなので免許取り消しにかかる聴聞工事の日前60日以内に法人の役員であっても取り消しの日から5年間は免許を受けることができないとされています"},{"f":"menkyo","fn":"免許","q":"業務停止処分についての聴聞の記述及び場所を工事されたがその工事後問前に相当の理由なく宅地建物取引企業を廃止した胸の届出をしたその届出手の日から5年を経過していない場合免許を受けることができない","a":false,"e":"間違えた人もいるかもしれませんが今回は業務定処分ということで免許取消し処分の場合は処分の日から廃業の届出手があった場合まで届出の日から5年間は免許を受けることができないとされていますが業務低処分なので今回は免許を受けることができるとされています間違いやすいので注意しておきましょう"},{"f":"menkyo","fn":"免許","q":"法人Dの役員のうちに道路交通法の規定に違反したことにより過料に処せられその系の執行が終わった日から5年を経過しないものがいる場合Dは免許を受けることができない","a":false,"e":"今回は過料<passage11>なので結には該当しないとされています"},{"f":"takkenshi","fn":"宅地建物取引士","q":"貢献知事の宅建士の登録を受けているものがその住所をおけに変更した場合貢献知事を経由して乙県知事に対し登録の移転を申請することができる","a":false,"e":"勤務値が変わった場合には登録の移転は可能ですが引っ越しをした場合この場合は登録の移定は不可となっています"},{"f":"takkenshi","fn":"宅地建物取引士","q":"宅建士の登録を受けているものが本籍を変更した場合遅滞なく登録をしている都道府県知事に変更の登録を申請しなければならない","a":true,"e":"本籍を変更した場合変更の登録を申請する必要があります"},{"f":"takkenshi","fn":"宅地建物取引士","q":"建業者は文場建物の売買契約の申し込みのみを受ける案内所上を設置し売買契約の締結は事務所で行う場合当該案内所には専任の宅建士を置く必要はない","a":false,"e":"申し込みまたは契約をする案内所には1人以上の専任の宅建士を置く必要があるとされています"},{"f":"takkenshi","fn":"宅地建物取引士","q":"宅地建物取引し資格試験に合格した日から1年以内に宅建障の交付を受けようとするものは登録をしている都道府県知事の指定する講習を受行する必要はない","a":true,"e":"合格から1年以内は知事の指定する講習を受行する必要はないとされています"},{"f":"takkenshi","fn":"宅地建物取引士","q":"平知事から宅建市相の交付を受けている宅建士が宅建市相の有効期間の更新を受けようとする時は平知事に申請しその申請前6ヶ月以<passage12>内に行われる国土交通大臣の指定する講習を受行しなければならない","a":false,"e":"国土交通大臣ではなく知事が指定する法定講習となっています"},{"f":"takkenshi","fn":"宅地建物取引士","q":"地建物取引士は登録消除の処分を受けた時は宅地建物取引をその交付を受けた都道府県知事に返納しなければならない","a":true,"e":"登録症状を受けると返しなければならないとされています"},{"f":"takkenshi","fn":"宅地建物取引士","q":"地建物取引士の登録を受けているものが死亡した場合その相続人は死亡した日から30日以内に登録をしている都道府県知事に届出をしなければならない","a":false,"e":"死亡した日からではなく死亡の事実を知った日から30日以内となっています"},{"f":"takkenshi","fn":"宅地建物取引士","q":"宅地建物取引士は事務禁止の処分を受けた時は宅地建物取引支障をその交付を受けた都道府県知事に提出しなくてはならない","a":true,"e":"事務禁止処分を受けると提出しなくてはならないとされています"},{"f":"takkenshi","fn":"宅地建物取引士","q":"建士は法第35条の規定による重要事項説明を行うにあたり相手方から請求があった場合にのみ宅建障を提示すれば良い","a":false,"e":"請求がなくても見せつける必要があります"},{"f":"takkenshi","fn":"宅地建物取引士","q":"貢献知事から宅建の交付を受けている宅建士はその住所を変更した時は遅滞なく変更の登録の申請をするとともに宅建市の書き換え交付の申請を貢献知事に対してしなければならない","a":true,"e":"住所を変更した時は変更の登録の申<passage13>請をする必要があります"},{"f":"takkenshi","fn":"宅地建物取引士","q":"建物取引士の登録を受けているものが本籍を変更した場合遅滞なく登録をしている都道府県知事に変更の登録を申請しなければならない","a":true,"e":"本籍を変更すると変更の登録の必要があります"},{"f":"takkenshi","fn":"宅地建物取引士","q":"貢献で宅地建物取引し試験に合格した後1年以上登録の申請をしてこなかったものが宅建業者お建知事免許に勤務することとなった時は乙県知事当てに登録の申請をしなければならない","a":false,"e":"試験合格地の貢献知事に対して行うとされています"},{"f":"takkenshi","fn":"宅地建物取引士","q":"宅地建物取引し資格試験に合格したもので宅地建物の取引に関し2年以上の実務経験を有するものまたは国土交通大臣がその実務経験を有するものと同等以上の能力を有すると認めたものは登録を受けることができる","a":true,"e":"2年以上の実務または国土交通大臣が認めるものとされる場合は登録を受けることができます"},{"f":"takkenshi","fn":"宅地建物取引士","q":"金以上の経にられた宅建士は登録を受けている都道府県知事から登録の消除の処分を受けの執行が終わった日から5年を経過するまで宅建士の登録をすることができない","a":true,"e":"金系以上の場合は計の執行が終わった日から5年を経過するまで登録は不可となっています"},{"f":"takkenshi","fn":"宅地建物取引士","q":"登録を受けているものは住所に変更があっても登録を受けている都道府県知事に変更の登録を申請する必要はない","a":true,"e":"が変更された場合変<passage14>更の登録を申請する必要があります"},{"f":"takkenshi","fn":"宅地建物取引士","q":"地建物取引に記載される宅地建物取引士の氏名について急制仕用を希望するものが申請をすれば宅建障に急制を併記することが認められている","a":true,"e":"希望者は急制を併記することができるとされています"},{"f":"takkenshi","fn":"宅地建物取引士","q":"平知事登録の宅地建物取引士が事務の禁止の処分を受けた場合その禁止の期間が満了するまで宅建士の登録の移転を長知事に申請することができない","a":true,"e":"事務禁止の処分を受けている時は登録の移転は不可となっています"},{"f":"takkenshi","fn":"宅地建物取引士","q":"建物取引士貢献知事登録が事務禁止処分を受けた場合地建物取引支障を貢献知事に速やかに提出しなければならず速やかに提出しなかった時は10万円以下の過料にさせられることがある","a":true,"e":"に提出しないと10万円以下の過料となります"},{"f":"takkenshi","fn":"宅地建物取引士","q":"建障の防質によりその再補を受けた後防した宅建障を発見した時は速やかに再付された宅建障をその交付を受けた免許権者に返納しなければならない","a":false,"e":"古い宅建障を変能するとされています"},{"f":"takkenshi","fn":"宅地建物取引士","q":"地建物取引士が登録の移転をした時当該登録移転前に効力を受けていた宅地建物取引はその効力を失う","a":true,"e":"この場合効力を失うとされています"},{"f":"takkenshi","fn":"宅地建物取引士","q":"地建物取引士は登録がされた時は速やかに宅地建物取引支障を排棄しなければならない","a":false,"e":"速やかに<passage15>宅を返納するとされています返納せずに廃棄はダめということです"},{"f":"takkenshi","fn":"宅地建物取引士","q":"宅地建物取引士は有効期間の満了日が到来する宅地建物取引支障を更新する場合知事が指定する講習を受行しなければならずまた当該宅地建物取引支障の有効期間は5年である","a":true,"e":"この場合知事が指定する講習を受けそして有効期間は5年とされています"},{"f":"takkenshi","fn":"宅地建物取引士","q":"都道府県知事は不正の手段によって宅地建物取引し試験を受けようとしたものに対してはその試験を受けることを禁止することができる","a":true,"e":"この場合禁止することができるとされています"},{"f":"takkenshi","fn":"宅地建物取引士","q":"宅地建物取引しAが死亡した時はその相続人が破産した時はA自らが届けで押しなければならない","a":true,"e":"死亡時は相続破産の場合は自らが届出をするとされています"},{"f":"takkenshi","fn":"宅地建物取引士","q":"氏が心身の故障により宅建士の事務を適正に行うことができないものになった時は必ず本人がその日から30日以内にその胸を登録している都道府県知事に届けなければならない","a":false,"e":"必ず本人ではなく代理の人でも可能となっています"},{"f":"takkenshi","fn":"宅地建物取引士","q":"登録の移転を受けたものは移転後の都道府県知事から宅地建物取引支障の交付を受けなければ宅地建物取引士の業務を行うことができない","a":true,"e":"交付を受けないと業務は不可となっています"},{"f":"takkenshi","fn":"宅地建物取引士","q":"建障を提示する際個人情報保護の観点から宅建障の住所欄にシール<passage16>を貼った上で提示することが認められている","a":true,"e":"シールで住所を隠すことは可能とされています"},{"f":"takkenshi","fn":"宅地建物取引士","q":"建障を防止しその再付を申請しているものは再付を受けるまでの間重要時効の説明をする時は宅建障に変えて最の移しを提示すれば良い","a":false,"e":"不可となっています"},{"f":"takkenshi","fn":"宅地建物取引士","q":"登録を受けているもので宅建障の交付を受けていないものが重要事項説明を行いその上場が特に重いと認められる場合は当該登録の消除の処分を受けその処分の日から5年を経過するまでは再び登録を受けることができない","a":true,"e":"この場合5年を経過するまで登録は不可となります"},{"f":"takkenshi","fn":"宅地建物取引士","q":"宅建業にかかる営業に関し成年者と統一の行為能力を有しない未成年者でも登録実務行使を終了すれば法定代理人から宅建業を営むことについての許可を受けていなくても登録を受けることができる","a":false,"e":"この場合登録を受けることはできないとされています"},{"f":"hoshokin","fn":"営業保証金","q":"建業者は営業保証金を本店及び支店ごとにそれぞれ最寄りぬ託所に供託しなければならない","a":false,"e":"本店最寄りの供託所に供託するとされています"},{"f":"hoshokin","fn":"営業保証金","q":"宅建業者Aとの取引により生じた電気工事業者の工事代金債権につき電気工事事業者は営業継続中のAが供託している営業保証金からその弁済を受ける権利を有する","a":false,"e":"に<passage17>なります電気工事事業者は弁済を受けることができないとされています"},{"f":"hoshokin","fn":"営業保証金","q":"営業保証金の還付により営業保証金の額が不足することとなった場合宅建業者は免許権者から不足額を供託すべき胸の通知書の送負を受けた日から2週間以内にその不足額を供託しなければならない","a":true,"e":"通知書の送を受けた日から2週間以内となっています不足が生じた日ではなく負を受けた日からなので注意しましょう"},{"f":"hoshokin","fn":"営業保証金","q":"宅建業者は宅地建物取引企業保証協会の社員となった後において社員となる前に供託していた営業保証金を取り戻す場合は還付請求検査に対する広告をすることなく営業保証金を取り戻すことができる","a":true,"e":"保証協会の社員となった後は広告をすることなく取り戻すことができます"},{"f":"hoshokin","fn":"営業保証金","q":"宅建業者が新たに支店を設置した時は本店の供託所に政令で定める額の営業保証金を供託すれば当該支店での事業を開始することができる","a":false,"e":"届出手出が必要なのでまだ授業を開始することはできないとされています"},{"f":"hoshokin","fn":"営業保証金","q":"建業者は本店を移転しその供託所が変更した場合国際証券で営業保証金の供託をしている時は遅滞なく従前の本店の売りの供託所に対し営業保証金の保管考えを請求しなければならない","a":false,"e":"保管考えは金銭のみで供託している場合のみ可能となります"},{"f":"hoshokin","fn":"営業保証金","q":"建業者が貢献内に本店及び2つの支店を設置して宅地建物取引<passage18>を営もうとする場合すべき営業保証金の合計額は1200万円である","a":false,"e":"本店と支店2つということで本店は1000万円支店等1箇所は500万円ということで1000万円+500万円+500万円で2000万円となります"},{"f":"hoshokin","fn":"営業保証金","q":"宅建業者は不正の手段により免許を受けたことを理由に免許を取り消された場合であっても営業保証金を取り戻すことができる","a":true,"e":"不正の手段で免許を取り消されても営業保証金は取り戻すことができるとされています"},{"f":"hoshokin","fn":"営業保証金","q":"宅建業者は免許の有効期間満了に伴い営業保証金を取り戻す場合は還付請求権者に対する広告をすることなく営業保証金を取り戻すことができる","a":false,"e":"6ヶ月以上の期間を定めて広告する必要があるとされています"},{"f":"hoshokin","fn":"営業保証金","q":"宅建業者Aが営業保証金を供託した旨は供託所から国土交通大臣当てに通知されることからAがその胸を直接国土交通大臣に届出る必要はない","a":false,"e":"この場合Aが届出る必要があります"},{"f":"hoshokin","fn":"営業保証金","q":"建業者は区域内に新たに2つの指定を設け宅地建物取引を営もうとする場合学命金額1000万円の地方最小を供託して営業保証金に当てれば足りる","a":false,"e":"地方最権は学面の90%ということで今回だと900万円分なので不足するとされています"},{"f":"hoshokin","fn":"営業保証金","q":"建業者Aが販売するマンションの広告を自宅した広告代理店はその広告代金債権に関しAが供託した営業保証金からその<passage19>債権の弁済を受ける権利を有しない","a":true,"e":"広告代理店の場合は弁済を受ける権利を持っていません"},{"f":"hoshokin","fn":"営業保証金","q":"建業者は営業保証金の額が政令で定める額に不足することとなった時通知書の送負を受けた日から2週間以内に不足額を金銭で供託しなければならない","a":false,"e":"間違えてしまった方もいるかもしれませんが金銭で供託しなければならないわけではないので注意しましょう"},{"f":"hoshokin","fn":"営業保証金","q":"建業者は免許の有効期間の満了に伴い営業保証金の取り戻しをするための広告をした時は遅滞なくその胸を免許検査に届けでなければならない","a":true,"e":"この場合免許権者に届出るとされています"},{"f":"hoshokin","fn":"営業保証金","q":"営業保証金の供託は株式で行っても良い","a":false,"e":"債権は可能ですが株式は不可となっています"},{"f":"hoshokin","fn":"営業保証金","q":"宅建業者は営業保証金の還付が行われ営業保証金が政令で定める額に不足することになった時その胸の通知書の送を受けた日から2週間以内にその不足額を供託しなければ免許取り消しの処分を受けることがある","a":true,"e":"この場合免許取り消しの処分を受ける可能性があります"},{"f":"hoshokin","fn":"営業保証金","q":"宅建業者が地方最小権を営業保証金に当てる場合その価格は学面金額の90である","a":true,"e":"この場合地方債は90とされています"},{"f":"hoshokin","fn":"営業保証金","q":"営業保証金の供託は必ず主たる事務所の最寄りの供託所に金銭を供託する方法になければならないこちら<passage20>の","a":false,"e":"金銭ではなく有価証券でも可能とされています"},{"f":"hoshokin","fn":"営業保証金","q":"営業保証金の供託は金銭のみならず一定の有価証券を持って行うこともできるが営業保証金の不足額の供託は金銭により行わなければならない","a":false,"e":"不足額の場合でも金銭と有価証券で可能とされています"},{"f":"hoshokin","fn":"営業保証金","q":"宅建業者は貢献内にある主たる事務所とは別におけ内に新たに主たる事務所を設置した時営業保証金を主タル事務所の最寄りの供託所に供託しなければならない","a":true,"e":"したる事務所の最寄りの供託所に供託するとされています<passage21>"},{"f":"hoshokin","fn":"営業保証金","q":"宅建業者は営業保証金が減ぜられたため免許権者から不足額を供託すべき胸の通知書の送法を受けた時その日から14日以内に不足額を供託しなければならない","a":true,"e":"送付を受けた時から14日以内とされています"},{"f":"hoshokin","fn":"営業保証金","q":"建業者が営業保証金を供託する場合において金銭と有価証券を併用して供託することができるが主たる事務所を設置した時の営業保証金については金銭のみを持って供託しなければならない","a":false,"e":"金銭のみではなく有価証券でも可能とされています"},{"f":"hoshokin","fn":"営業保証金","q":"宅建業者は買主に対し土地付き建物の売買契約を締結する前に営業保証金を供託した主タル事務所の最寄りの供託所及びその所材値について説明するようにしなければならない","a":true,"e":"供託所そして所材値を説明する必要があるとされています注意して欲しいのは買主が宅建業者の場合は説明不要なので注意しましょう"},{"f":"hoshokin","fn":"営業保証金","q":"宅建業者Aが免許権者から営業保証金の供託の届出をすべき旨の最国を受けたがその最国が到達した日から1ヶ月以内に届出をしない場合Aは実際に共託をしていても免許の取消処分を受けることがある","a":true,"e":"届出をしないと取引処分を受ける可能性があります"},{"f":"hoshokin","fn":"営業保証金","q":"宅建業者は営業保証金がカ付され営業保証金の不足額を供託した時は供託書の移しを添付して30日以内にその胸を貢献知事に届けてなければならない","a":false,"e":"30日以内ではなく2週間以内となっています"},{"f":"hoshokin","fn":"営業保証金","q":"宅建業者と宅建業に関し取引をしたものはその取引により生じた債権に関し債権の弁済を受ける権利を有するが取引をしたものが宅建業者に該当する場合はその権利は有しない","a":true,"e":"取引相手が宅建業者だとその権利を有しないとされています"},{"f":"hoshokin","fn":"営業保証金","q":"保証金を供託しその旨の届けでするまでは宅地建物の売買契約をすることは元り広告をすることもできない","a":true,"e":"この場合届けでするまでは広告不可となっています"},{"f":"hoshokin","fn":"営業保証金","q":"有価証券を営業保証金に当てる場合における当該有価証券の価格は地方最小の場合はその学面金額の80である","a":false,"e":"90とされています"},{"f":"hoshokin","fn":"営業保証金","q":"建業者は宅建業者の相手方に対して供託所等の<passage22>説明を行う際に書面を交付することは要求されていないが重要事項説明書に記載して説明することが望ましい","a":true,"e":"この場合強制ではないですが重要事項説明書に記載して説明することが望ましいとされています"},{"f":"hoshokin","fn":"営業保証金","q":"宅建業者Aの設置した指定においてAと宅地建物取引に関する取引をしたものはその取引により生じた債権に関し500万円を限度としてその債権の弁済を受ける権利を有する","a":false,"e":"例え支店で行った場合でもその宅建業者が供託した全ての営業保証金の範囲内となっています500万円を限度というわけではないので注意しましょう"},{"f":"kyokai","fn":"保証協会","q":"宅建業に関し取引をしたもの宅建業者に該当するものを除くが弁済を受ける権利を実行する時は当該保証協会の認証を受けるとともに当該保証協会に対し請求をしなければならない","a":false,"e":"くしくは認証は保証協会ですが還付請求は供託所となっています"},{"f":"kyokai","fn":"保証協会","q":"保証協会は弁済業務保証金の還付があった時当該還付額に相当する額の還付重をその主たる事務所の最寄りの供託所に供託すべきことを通知しなければならない","a":false,"e":"保証教会に納付すべきことを通知するとされています"},{"f":"kyokai","fn":"保証協会","q":"保証協会は弁済業務保証金分担金の納付を受けた時はその納付を受けた額に相当する額の弁済業務保証金を供託しなければならないこちらの答え<passage23>は丸になります弁済業務保証金分担金に相当する額の米業務保証金を供託するとされています","a":true,"e":""},{"f":"kyokai","fn":"保証協会","q":"宅建業者は保証協会の社員の地位を失った時当該地位を失った日から2週間以内に営業保証金を主タル事務所の最寄りの供託所に供託しなければならない","a":false,"e":"2週間以内ではなく1週間以内とされています"},{"f":"kyokai","fn":"保証協会","q":"300万円の弁済業務保証金分担金を保証協会に納付し当該保証協会の社員となったものと宅建業に関し取引をしたものは6000万円を限度とし当該保証協会が供託した弁済業務保証金から弁済を受ける権利を有する","a":false,"e":"300万円ということは本店60万円にそこから引いた支店240万円となります支店は30万円ということで支店の数は8点ということになりますなので営業保証金は1000万円+500万円×8で5000万円が限度となります"},{"f":"kyokai","fn":"保証協会","q":"宅建業者が保証協会に加入しようとする時は当該保証協会に弁済業務保証金分担金を金銭または有価証券で納付することができる","a":false,"e":"保証協会に対して納付する分担金は金銭のみとなっています"},{"f":"kyokai","fn":"保証協会","q":"宅建業者で保証協会に加入しようとするものはその加入の日から2週間以内に弁済業務保証金分担金を保証協会に納付しなければならない","a":fals 付金と保管事業について国土交通大臣の承認を受けた場合社員が自ら売り主となって行う宅地または建物の売買で宅地の増成または建築に関する工事の完了前における買主からの手付金等の授量について当該事業の対象とすることができる","a":true,"e":"ちょっと細かいんですけどここは発制限でもやるとこなので後で確認しておいてください未完成物件の場合保証または保険のみとなっていて指定保管期間は不可ということになっていますなので今回は対象外ということになります"},{"f":"kyokai","fn":"保証協会","q":"建業者が保証協会の社員となる前に当該宅建業者と宅建業に関し取引をしたもの宅建業者に該当するものを除くばその取引により生じた債権に関し弁済業務保証金について弁済を受ける権利を有する","a":true,"e":"になり<passage27>ます保証協会の社員となる前においても弁済を受ける権利を有しています"},{"f":"kyokai","fn":"保証協会","q":"宅建業者Aは本を移転しまの業供託所が変更した前の営業保証金を取り戻す時一定期間内に申し出るべき旨の広告は不要である","a":true,"e":"今回は本を移転したということなのでこの場合は広告は不要となっています"},{"f":"kyokai","fn":"保証協会","q":"付重金を納付すべき2週間の期間内に納付しなかった場合業者の免許は効力を失う","a":false,"e":"この場合業者の免許は効力を失わないとされています2週間という数字も覚えておきましょう"},{"f":"kyokai","fn":"保証協会","q":"保証協会から還付重を納付すべきことの通知を受けた社員はその通知を受けた日から1ヶ月以内にその通知された額の還付重を当該保証協会に納付しなければならない","a":false,"e":"1ヶ月以内ではなく2週間以内となっています"},{"f":"kyokai","fn":"保証協会","q":"保証協会は社員である宅建業者Aの取引の相手方から宅建業にかかる取引に関する苦情を受けた場合Aに対し文書または後頭による説明を求めることができる","a":true,"e":"苦情を受けた場合説明を求めることができます"},{"f":"kyokai","fn":"保証協会","q":"保証協会は新たに宅建業者がその社員として加入しようとする時はあかじめその胸を当該宅建業者が免許を受けた免許権者に報告しなければならない","a":false,"e":"あかじめではなく加入後直ちに報告するとされています"},{"f":"kyokai","fn":"保証協会","q":"保証協会に加入している宅建業者は保証を手厚く<passage28>するため別の保証協会に加入することができる","a":false,"e":"入れるのは一社のみとなっています"},{"f":"kyokai","fn":"保証協会","q":"建業者は免許の有効期間の満了に伴い営業保証金の取り戻しをするための広告をした時は違体なくその胸を免許権に届けなければならない","a":true,"e":"正しい選択肢となっています"},{"f":"kyokai","fn":"保証協会","q":"保証協会は一部の事務所を廃止した場合一定期間内に認証を受けるため申し出るべき旨の広告は不要である","a":true,"e":"一部の事務所を廃止した場合広告は不要となります"},{"f":"kyokai","fn":"保証協会","q":"保証協会は社員の取り扱った宅建業にかかる取引に関する苦上につき宅建業者の相手方等からの解決の申し出及びその解決の結果を社員に周知させなければならない","a":true,"e":"正しい選択肢となります発見業を"},{"f":"gyomu","fn":"業務上の規制・事務所等","q":"事務所ごとに一定の数の成年者である人の宅建士を置かなければならないがこれを満たさなくなった場合は30日以内に必要な措置を取らなければならない","a":false,"e":"くは30日以内ではなく2週間以内となっています"},{"f":"gyomu","fn":"業務上の規制・事務所等","q":"建業者はその主タル事務所に宅建業者免許所を掲げなくとも良いが国の交通症例で定める標識を掲げなければならない","a":true,"e":"免許症は必要ありませんが標識は必要となっています"},{"f":"gyomu","fn":"業務上の規制・事務所等","q":"建業者はその事務所ごとに従業者名簿を備えなければ<passage29>ならない","a":true,"e":"事務所ごとに備える必要があります"},{"f":"gyomu","fn":"業務上の規制・事務所等","q":"宅建業者は業務に関する帳簿を備え取引の関係者から請求があった時は閲覧に教なければならない","a":false,"e":"帳簿は閲覧制度はなしとなっています大事なものなので見せないという風に覚えておきましょう"},{"f":"gyomu","fn":"業務上の規制・事務所等","q":"宅建業者は事務所ごとにその業務に関する帳簿を備えなければならず簿の閉鎖後5年間当該宅建業者が自ら売主となる新築住宅にかかるものにあっては10年間当該帳簿を保存しなければならない","a":true,"e":"帳簿は閉鎖後5年間ですが自ら売り主となる場合は10年間となっています帳簿5年間と抑えて5000兆円と覚えておきましょう"},{"f":"gyomu","fn":"業務上の規制・事務所等","q":"建業者は事務所以外の継続的に業務を行うことができる施設を有する場所であっても契約を締結せずかつその申し込みを受けない場合当該場所に専任の宅建士を置く必要はない","a":true,"e":"契約を締結せずを受けない場合は宅建士を吹く必要はないとされています"},{"f":"gyomu","fn":"業務上の規制・事務所等","q":"宅建業者貢献知事免許がオ津県に処するマンションを分現地に案内所を設置し契約の申し込みを受ける時貢献知事及びお知事にその業務を開始する日の10日前までに届出をしなければならない","a":true,"e":"県知事と乙県知事2人に対して10日前までに届けで行う必要があるとされています"},{"f":"gyomu","fn":"業務上の規制・事務所等","q":"事務所とは契約締結権限を有するものをき継続的に業務を行うことがで<passage30>きる施設を有する場所を指すものであるが商業等規模に搭載されていない営業書または指定は事務所には該当しない","a":false,"e":"この場合は事務所には該当するとされています"},{"f":"gyomu","fn":"業務上の規制・事務所等","q":"宅建業者は従業者名簿を最終の記載をした日から10年間保存しなければならない","a":true,"e":"従業者名簿は10年間10で覚えておきましょう"},{"f":"gyomu","fn":"業務上の規制・事務所等","q":"宅建業者はその事務所ごとに従業者名簿を備える義務を行った場合監督処分を受けることはあっても罰則の敵を受けることはない","a":false,"e":"罰則の適用もあるとされています<passage31>"},{"f":"gyomu","fn":"業務上の規制・事務所等","q":"宅建業を営まず他の業業務のみを営んでいる支店は事務所には該当しない","a":true,"e":"この場合は事務所には該当しないとされています"},{"f":"gyomu","fn":"業務上の規制・事務所等","q":"宅建業者は非常金役員には従業者であることを表する証明書を携帯させる必要はない","a":false,"e":"この場合は携帯させる必要があるとされています"},{"f":"gyomu","fn":"業務上の規制・事務所等","q":"宅建業者は退職した従業者に関する時効は個人情報を保護の観点から従業者名簿から消去しなければならない","a":false,"e":"従業者名簿は最終の記載をした日から10年間保存する必要があるということで消去しなければならないこちらが不適切となります"},{"f":"gyomu","fn":"業務上の規制・事務所等","q":"建業者は従業者名簿の閲覧の請求があった時は取引の関係者が田舎を問わず請求したものの閲覧に教なければならない","a":false,"e":"取引の関係者だった場合は見せる必要がありますが取引の関係者でない場合閲覧させなくても良いとされています"},{"f":"gyomu","fn":"業務上の規制・事務所等","q":"建業者は各事務所の業務に関する帳簿を事務所ごとに備え取引のあった都度その年月日その取引に関する宅地または建物の所材及び面積等の時効を記載しなければならない","a":true,"e":"取引のあった都度この時効を記載する必要があるとされています"},{"f":"gyomu","fn":"業務上の規制・事務所等","q":"従業者名簿に従業者の氏名及び主たる職務内容を記載したが宅地建物取引士であるか田舎の別は記載しなかった","a":false,"e":"宅建士であるかいか記載する必要があるとされています"},{"f":"gyomu","fn":"業務上の規制・事務所等","q":"従業者名簿をそれぞれの事務所ごとに作成して備えつけしる事務所に一括して備えつけることはしなかった","a":true,"e":"それぞれの事務所ごとに備えつける必要があるとされています"},{"f":"gyomu","fn":"業務上の規制・事務所等","q":"建業者は本店と複数の支店がある場合支店には帳簿を備えつけず本店に支店の分もまとめて備えつけておけば良い","a":false,"e":"事務所ごとに備え付ける必要があるとされています"},{"f":"gyomu","fn":"業務上の規制・事務所等","q":"引の関係者から従業者名簿の閲覧を求められたが秘密を守る義務を理由にこの申し出を断った","a":false,"e":"取引の関係者からの場合この申し出を断ることはできないとされています"},{"f":"art34","fn":"34条書面(媒介)","q":"依頼者の申し出により契約の行を6ヶ月と定めた任媒介会契約を結した場合その契約は全て効うである答え<passage32>は罰になります6ヶ月と定めた場合3ヶ月に短縮され無効になるわけではないので注意しましょう","a":true,"e":""},{"f":"art34","fn":"34条書面(媒介)","q":"宅建業者は依頼者との間で締結した媒介契約が専任媒介契約であるか否に関わらず所定の事故を指定流通機構に登録しなければならない","a":false,"e":"一般媒会は登録義務はないので注意しましょう"},{"f":"art34","fn":"34条書面(媒介)","q":"宅建業者が依頼者との間に専属線人媒介契約を締結した時は当該契約の締結の日から5日以内休業日を除くに所定の時効を登録しなければならない","a":true,"e":"専属線に媒介契約は5日以内そして休業日を除くというところは必ずチェックしておきましょう"},{"f":"art34","fn":"34条書面(媒介)","q":"宅建業者が依頼者Bとの間で有効期間を2ヶ月とする専任媒介契約を締結する際Bが媒介契約を更新する旨を申し出ない場合は有効期間満了により自動更新するものとする胸の特約を定めることができる","a":false,"e":"指導更新は無効となるので注意しましょう"},{"f":"art34","fn":"34条書面(媒介)","q":"建業者Aが依頼者と媒介契約を締結した場合当該土地付き建物の売買契約が成立した時はA社は遅滞なく登録番号取引価格及び売買契約の成立した年月日費日を指定流通機構に通知しなければならない","a":true,"e":"通知内容は登録番号価格年月日でいう感じで覚えておきましょう"},{"f":"art34","fn":"34条書面(媒介)","q":"建業者Aが依頼者Bと一般媒介契約を締結しA社がBに対し当該土地付き建物の科学または評価額について意見を述べる時は根拠を明らかにしなけれ<passage33>ばならない","a":true,"e":"意見を述べる時は根拠を明らかにする必要があるとされています"},{"f":"art34","fn":"34条書面(媒介)","q":"宅建業者Aと依頼者B間で専属人媒介契約を締結した場合AはBに対し当該契約の業務の処理状況を2週間に1回以上報告しなければならない","a":false,"e":"専属任媒介契約の場合1週間に1回そして休業日を含むというところはチェックしておきましょう"},{"f":"art34","fn":"34条書面(媒介)","q":"宅建業者Aが依頼者Bと専任媒介契約を締結した時はAは法第34条に規定する契約内容を記載した書面を依頼者に交付しなければならないが一般媒介契約を締結した時は当該書面の交付をしなくても良い","a":false,"e":"一般媒会でも交付は必要とされています"},{"f":"art34","fn":"34条書面(媒介)","q":"建業者は媒介契約の有効期間及び解除に関する時効を法第34条に基づき交付すべき書面に記載しなければならない","a":true,"e":"急行期間及び解除は記載事項となっています"},{"f":"art34","fn":"34条書面(媒介)","q":"宅地建物取引業者は法第34条の交付すべき書面に宅地建物取引をしていさせなければならない","a":false,"e":"宅建士ではなく宅建業者の義務となっています"},{"f":"art34","fn":"34条書面(媒介)","q":"登録にかかる宅地の都市計画法その他の法令に基づく制限で使用なものは指定流通機構への登録事項に該当する","a":true,"e":"登録事項とされています"},{"f":"art34","fn":"34条書面(媒介)","q":"宅建業者Aが依頼者Bと一般媒介契約を締結した場合当該宅地の売買の媒介を担当するAの宅<passage34>地建物取引士は法第34条の署名に期名する必要はない","a":true,"e":"の場合をする必要はないとされています"},{"f":"art34","fn":"34条書面(媒介)","q":"宅建業者が宅地の売却の依頼者と媒介契約を締結した場合購入の申し込みがあった時は売却の依頼者が宅地建物取引業者であっても遅滞なくその胸を当該依頼者に報告しなければならない","a":true,"e":"時代なく報告する必要があるとされています"},{"f":"art34","fn":"34条書面(媒介)","q":"依頼者が宅建業者である場合権業者は当該人媒介契約にかかる業務の処理状況の報告をする必要はない","a":false,"e":"依頼者が宅建業者であっても業務の処理状況の報告をする必要はあるとされています"},{"f":"art34","fn":"34条書面(媒介)","q":"建業者Aと依頼者B間で専属性に媒介契約を締結した場合BはAが探索した相手方以外のものと売買契約を締結することができない","a":true,"e":"先続媒介契約の正しい選択肢となっています"},{"f":"art34","fn":"34条書面(媒介)","q":"建業者はマンションの貸借の媒介を行ったマンションの貸主から媒介の依頼を受けて承諾したが媒介契約書を作成せず貸主に交付しなかった","a":true,"e":"間違えてしまった人もいるかもしれませんがこの34条面の交付義務が発生するのは売買交換の場合ということで貸借は含まれないので注意しましょう"},{"f":"art34","fn":"34条書面(媒介)","q":"登録にかかる宅地の所有者の氏名及び住所は指定流通機構への登録事項に該当する","a":false,"e":"所有者の氏名及び住所は登録事項に該当しない<passage35>とされています"},{"f":"art34","fn":"34条書面(媒介)","q":"建業者Aと依頼者Bとの間で全任媒介契約を締結した場合当該宅地の売買契約が成立したとしてもその胸を指定流通機構に通知する必要はない","a":false,"e":"この場合は契約が成立した時は通知する必要があるとされています"},{"f":"art34","fn":"34条書面(媒介)","q":"登録にかかる宅地の所材規模及びは指定流通機構への登録事項に該当する","a":true,"e":"登録事項に該当するとされています"},{"f":"art34","fn":"34条書面(媒介)","q":"宅建業者Aは依頼者Bと一般媒介契約を締結し所定の時効を伝えなく指定流通機号に登録したがその登録を表する署名を登録してから14日後にBに交付した","a":true,"e":"一般媒介契約の場合指定流通機構への登録登録書の引き渡しは義務がないとされていますなので14日後に交付しても特に問題はないとされています"},{"f":"art34","fn":"34条書面(媒介)","q":"建業者Aが依頼者Bと一般媒会契約を締結した場合AがBに対し当該土地付き建物の科学について意見を述べるために行った科学の査程に応した費用をBに請求することはできない","a":true,"e":"この場合Bに請求することはできないとされています"},{"f":"art34","fn":"34条書面(媒介)","q":"建業者Aが依頼者Bとの間で一般媒会契約を締結した場合AがBに対し当該宅地の科学について意見を述べる時は不動産鑑定士に評価を依頼してその根拠を明らかにしなければならない","a":false,"e":"不動産鑑定士に評価をしなくても根拠を明らかに<passage36>すれば良いとされています"},{"f":"art34","fn":"34条書面(媒介)","q":"建業者Aが依頼者Bとの間に締結した人媒介契約の有効期間はBからの申し出により更新することができるが更新の時から3ヶ月を超えることができない","a":true,"e":"正しい選択肢となっています"},{"f":"art34","fn":"34条書面(媒介)","q":"宅建業者は高住宅の科学について意見を述べる場合依頼者に対してその根拠を高等ではなく書面で明示しなければならない","a":false,"e":"書面でなくても高等でも可能とされています"},{"f":"art34","fn":"34条書面(媒介)","q":"宅建業者Aは人媒介契約を依頼者Bと締結し中古住宅の売買契約が成立しても当該中古住宅の引き渡しが完了していなければ売買契約が成立した旨を指定流通機構に通知する必要はない","a":false,"e":"契約が成立した時に通知する必要があるとされています"},{"f":"art34","fn":"34条書面(媒介)","q":"建業者Aが依頼者Bとの間で専属性任媒介契約を締結した場合Aは当該中古住宅の取引の申し込みの受付に関する状況を指定流通機構に登録しなければならない","a":true,"e":"取引の申し込みの受付状況を登録するとされています"},{"f":"art34","fn":"34条書面(媒介)","q":"依頼者Bが宅建業者である場合当該契約が国土交通大臣が定める標準媒介契約薬間に基づくものであるか否かの別を法第34条に規定する書面に規定する必要はない","a":false,"e":"依頼者が宅建業者であってもに基づいているかいないかこれは記載する必要があるとされています"},{"f":"art34","fn":"34条書面(媒介)","q":"任売媒介契約の締結にあたっ<passage37>て当該契約にかかる業務の処理状況の報告日を毎週金曜日とする旨の特約は宅建違反ではない","a":true,"e":"人媒介契約ということでこの場合は報告日は2週間に1回でも可能なので毎週金曜日とするという特約は有効となっています"},{"f":"art34","fn":"34条書面(媒介)","q":"建業者Aが依頼者Bと一般媒介契約を締結した受けの申し込みはなかったがAはBに対し本件契約にかかる業務の処理状況の報告を後等により14日に1回以上の頻度で行った","a":true,"e":"一般媒介契約の場合報告義務自体はないとされているので14日に1回以上特に問題はないとされています"},{"f":"art34","fn":"34条書面(媒介)","q":"宅建業者は依頼主が宅建業者であったので宅地建物取引第34条に規定する署名を作成しなかった","a":false,"e":"依頼主が宅建業者であっても書面を作成する必要はあるので注意しましょう宅建"},{"f":"art35","fn":"35条書面(重要事項説明)","q":"重要事項説明書は宅建業者が作成義務を負う","a":true,"e":"重要事項説明書は宅建業者が作成義務をいます宅建士ではないので注意しましょう"},{"f":"art35","fn":"35条書面(重要事項説明)","q":"宅建業者は中古マンションの売買を行う場合抵当権が設定されている時は契約日までにその登記が抹消される予定であっても低件の内容について35条面で説明しなければならない","a":true,"e":"抵当権が消滅される予定であっても説明する必要があるとされています"},{"f":"art35","fn":"35条書面(重要事項説明)","q":"業者は宅地または建物の<passage38>売買について売主となる場合買主が宅建業者であっても重要事項説明は行わなければならないが35乗面の交付は省略して良い","a":false,"e":"説明は省略可能で交付は省略不可となっています"},{"f":"art35","fn":"35条書面(重要事項説明)","q":"35条面では建物の貸借の媒介を行う場合カチ賃以外に受される金銭の額については説明しなければならないが金銭の受々の目的については説明する必要はない","a":false,"e":"の額及び受々の目的両方セットとなります"},{"f":"art35","fn":"35条書面(重要事項説明)","q":"昭和60年1985年10月1日に新築の工事に着手し完成した建物の売買の売解を行う場合建物が指定確認診断を受けたものであってもその内容は35条面で説明する必要はない","a":true,"e":"年数をしっかりと覚えておきましょう1981年6月1日以降に完成した建物の場合は説明が不要となっています"},{"f":"art35","fn":"35条書面(重要事項説明)","q":"建物の貸借の媒介を行う場合貸借の契約が定期建物賃体借契約である時は宅建業者はその胸を35乗面で説明しなければならない","a":true,"e":"35条面で説明するとされています"},{"f":"art35","fn":"35条書面(重要事項説明)","q":"建物の売買の売解を行う場合建物についてアスベストの使用の調査の結果が記録されていない時は宅建業者は自らアスベストの使用のうの調査を行った上でその結果の内容を35条面で説明しなければならない","a":false,"e":"記録がない胸の説明をすればよく自分で調査をする必要はないとされています"},{"f":"art35","fn":"35条書面(重要事項説明)","q":"区分所有<passage39>建物の売買において売主及び買主が宅建業者である場合であっても売主は買主に対し供託所等の説明を35条面でする必要がある","a":false,"e":"買主が宅建業者の場合供託所の説明は不要となっています"},{"f":"art35","fn":"35条書面(重要事項説明)","q":"区分所有建物の売買において1等の建物にかかる計画的な維持修繕のための修繕積み立て金積み立て総額及び売買の対象となる先衛部分にかかる修繕積み立て金額の説明をすれば滞能があることについては35条面で説明をしなくても良い","a":false,"e":"大能がある場合滞能があるという胸の説明をする必要があるとされています"},{"f":"art35","fn":"35条書面(重要事項説明)","q":"宅地の売買の媒介を行う場合売買代金の額並びにその支払いの時期及び方法について35条面で説明しなければならない","a":false,"e":"37条面の記載事項となっています"},{"f":"art35","fn":"35条書面(重要事項説明)","q":"建物の貸借の媒介を行う場合重要事項説明書では建物が水法法思考の規定により市町村の腸が提供する図面にその位置が表示されている場合には図面が存在していることを説明すれば足りる","a":false,"e":"水外ハザードマップを提示し概の位置を示す必要があります"},{"f":"art35","fn":"35条書面(重要事項説明)","q":"水道電気及び下水道は完備年ガスは未整備である胸を説明したがその整備の見通しまでは説明しなかった","a":false,"e":"整備の見通しまで説明が必要です"},{"f":"art35","fn":"35条書面(重要事項説明)","q":"率容積率の場合売買は説明必要ですが貸借は説明不要となっています","a":true,"e":""},{"f":"art35","fn":"35条書面(重要事項説明)","q":"指導の負担の場合建物の貸借の場合説明は不要となります","a":true,"e":""},{"f":"art35","fn":"35条書面(重要事項説明)","q":"住宅性能評価は売買の場合説明必要ですが貸借の場合は説明不要となります","a":true,"e":""},{"f":"art35","fn":"35条書面(重要事項説明)","q":"使用者の氏名及び住所については説明は不要となります","a":false,"e":""},{"f":"art35","fn":"35条書面(重要事項説明)","q":"区分所有建物売買で計画修繕費用の減免の定めがある場合、買主が原面対象者であるか否かに関わらずその内容を説明しなければならない","a":true,"e":""},{"f":"art35","fn":"35条書面(重要事項説明)","q":"すでに積み立てられている修繕積立金の額についても説明する必要がある","a":false,"e":""},{"f":"art35","fn":"35条書面(重要事項説明)","q":"金銭の保管方法は説明不要となります","a":false,"e":""},{"f":"art35","fn":"35条書面(重要事項説明)","q":"占油部分の用途利用制限の定めがある時はその内容を説明しなければならない","a":true,"e":""},{"f":"art35","fn":"35条書面(重要事項説明)","q":"津波災害警戒区域内にある時はその胸を説明しなければならない","a":true,"e":""},{"f":"art35","fn":"35条書面(重要事項説明)","q":"重要時効を説明する際にはどこで行っても説明は良いとされています","a":false,"e":""},{"f":"art35","fn":"35条書面(重要事項説明)","q":"調査不足のため事実と異なる内容を記載したものではなくても宅地建物取引違反となる","a":true,"e":""},{"f":"art35","fn":"35条書面(重要事項説明)","q":"有効期間が満了している宅建士は記名も説明も不可です","a":false,"e":""},{"f":"art35","fn":"35条書面(重要事項説明)","q":"土地のカップ販売の媒介を行う場合現金販売価格も説明しなければいけない","a":true,"e":""},{"f":"art35","fn":"35条書面(重要事項説明)","q":"支障を提示しなかった時は10万円以下の火料（過料）となります","a":false,"e":""},{"f":"art35","fn":"35条書面(重要事項説明)","q":"買主である宅建業者は重要事項説明書の作成義務を負わない","a":true,"e":""},{"f":"art35","fn":"35条書面(重要事項説明)","q":"天災その他不可効力による損害の負担に関する定めは37条面の記載事項となります","a":false,"e":""},{"f":"art35","fn":"35条書面(重要事項説明)","q":"建物が建築工事の完了前のものである時は完成状況を35条面で説明するとされています","a":true,"e":""},{"f":"art35","fn":"35条書面(重要事項説明)","q":"買主が宅地建物取引業者であっても重要事項説明書は交付しなければならない","a":true,"e":""},{"f":"art35","fn":"35条書面(重要事項説明)","q":"主の自宅で提供して説明は可能となっています","a":true,"e":""},{"f":"art35","fn":"35条書面(重要事項説明)","q":"増成宅地防災区域内にある時は貸借であってもその胸を説明する必要はある","a":false,"e":""},{"f":"art35","fn":"35条書面(重要事項説明)","q":"信託の受益権の売買の相手方が宅建業者であっても重要時効の説明が必要とされています","a":true,"e":""},{"f":"art35","fn":"35条書面(重要事項説明)","q":"建物の引き渡し時期は35条書面では説明不要です","a":false,"e":""},{"f":"art35","fn":"35条書面(重要事項説明)","q":"歴史的風地形整権物である時はその増築に際し市町村長への届出が必要である旨を説明しなければならない","a":true,"e":""},{"f":"art35","fn":"35条書面(重要事項説明)","q":"式金の生産に関する事項について35条面で説明しなければならない","a":true,"e":""},{"f":"art35","fn":"35条書面(重要事項説明)","q":"管理会社の称号または名称及びその主タル事務所の所材値を説明しなければならない","a":true,"e":""},{"f":"art35","fn":"35条書面(重要事項説明)","q":"宅地の一部が指導の敷地となっていた場合、指導の負担に関する時効を説明しなければならない","a":false,"e":""},{"f":"art35","fn":"35条書面(重要事項説明)","q":"既存住宅の売買で検査済み証の保存状況について、存在しない場合はその旨を説明する","a":true,"e":""},{"f":"art35","fn":"35条書面(重要事項説明)","q":"2年以内に建物状況調査を実施している場合のその結果の概要を説明する。1年6ヶ月前のため説明が必要です","a":true,"e":""},{"f":"art35","fn":"35条書面(重要事項説明)","q":"土砂災害警戒区域内にある時はその胸を説明しなければならない","a":true,"e":""},{"f":"art35","fn":"35条書面(重要事項説明)","q":"共有部分に関する規約がまだ案の段階でもその内容を説明しなければならない","a":true,"e":""},{"f":"art35","fn":"35条書面(重要事項説明)","q":"借地の上の建物の取り壊しに関する時効を定めようとする時はその内容を説明しなければならない","a":true,"e":""},{"f":"art35","fn":"35条書面(重要事項説明)","q":"建物の引き渡しの時期については35条書面では不要で37条書面の説明事項です","a":false,"e":""},{"f":"art35","fn":"35条書面(重要事項説明)","q":"休憩者地崩壊危険区域内における行為の制限の概要については説明が必要とされています","a":false,"e":""},{"f":"art35","fn":"35条書面(重要事項説明)","q":"貸借の媒介で以外に呪される金銭の額受の目的は説明事項です","a":true,"e":""},{"f":"art35","fn":"35条書面(重要事項説明)","q":"ITを活用して重要時効の説明を行う時も取引書の提示を省略することはできません","a":true,"e":""},{"f":"art35","fn":"35条書面(重要事項説明)","q":"貸借の場合はこの建ぺい率容積率は説明不要となります","a":false,"e":""},{"f":"art35","fn":"35条書面(重要事項説明)","q":"契約が成立するまでの間に買主に交付する必要があります","a":false,"e":""},{"f":"art35","fn":"35条書面(重要事項説明)","q":"宅建士の期名が必要とされています","a":false,"e":"宅建を"},{"f":"art37","fn":"37条書面(契約書面)","q":"宅建業者は人の宅地建物取引をして37条署名の内容を当該契約の買主に説明させなければならない","a":false,"e":"37条書面は説明義務はありません（記名と交付が必要です）"},{"f":"art37","fn":"37条書面(契約書面)","q":"建物の引き渡しの時期は37条面に必ず記載しなければならない","a":true,"e":""},{"f":"art37","fn":"37条書面(契約書面)","q":"損害賠償額の予定または医薬金に関する定めがある時は37条面に必ず記載しなければならない","a":true,"e":""},{"f":"art37","fn":"37条書面(契約書面)","q":"天災その他不可効力による損害の負担に関する定めがある時37条面に必ず記載しなければならない","a":true,"e":""},{"f":"art37","fn":"37条書面(契約書面)","q":"カリチンの額並びにその支払いの時期及び方法は37条面に必ず記載しなければならない","a":true,"e":""},{"f":"art37","fn":"37条書面(契約書面)","q":"カリチン以外の金星の受々の方法は37条面に必ず記載しなければならない","a":false,"e":""},{"f":"art37","fn":"37条書面(契約書面)","q":"保証人の氏名及び住所は37条面に必ず記載しなければならない","a":false,"e":"記載事項ではありません"},{"f":"art37","fn":"37条書面(契約書面)","q":"37条面の作成を宅建士でない従業者に行わせることができる","a":true,"e":"記名は宅建士が必要ですが、作成自体は誰でも可能です"},{"f":"art37","fn":"37条書面(契約書面)","q":"37条面に期名する宅建士は35乗面に記名した宅建士と必ず師も同じものである必要はない","a":true,"e":""},{"f":"art37","fn":"37条書面(契約書面)","q":"買主に対し37条面の交付を省略することはできない","a":true,"e":""},{"f":"art37","fn":"37条書面(契約書面)","q":"移転当期の申請の時期を37条面に記載しなくてはならない","a":true,"e":""},{"f":"art37","fn":"37条書面(契約書面)","q":"供託所等に関する時効を37条面に記載しなければならない","a":false,"e":""},{"f":"art37","fn":"37条書面(契約書面)","q":"重要事項説明書に記載して説明を行ったので37条面に記載しなかった","a":false,"e":"35条で説明していても37条への記載は省略できません"},{"f":"art37","fn":"37条書面(契約書面)","q":"既存住宅の売買で建物の構造体力上な部分等の状況について当事者双法が確認した時効を記載しなければならない","a":true,"e":""},{"f":"art37","fn":"37条書面(契約書面)","q":"建物の貸借の媒介で種類品質不適合責任を担保すべき定めがある時は37条書面に必ず記載しなければならない","a":false,"e":"貸借では任意的記載事項です"},{"f":"art37","fn":"37条書面(契約書面)","q":"宅建障を提示せずに当該書面を交付した","a":true,"e":"37条書面の交付時には宅建士証の提示義務はありません"},{"f":"art37","fn":"37条書面(契約書面)","q":"自ら貸主として宅地の契約を締結した場合37条書面の作成交付は不要です","a":false,"e":"自ら貸借は宅建業法の適用外のため不要というのが正しいです"},{"f":"art37","fn":"37条書面(契約書面)","q":"建物を特定するために必要な表示について重要時効の説明において使用した図書の交付により行った","a":true,"e":""},{"f":"art37","fn":"37条書面(契約書面)","q":"天災その他不可効力による損害の負担に関する定めがある時はその内容について37条面に記載する必要がある","a":true,"e":""},{"f":"art37","fn":"37条書面(契約書面)","q":"媒介に関する報酬の額は37条面に必ず記載しなければならない","a":false,"e":"記載事項ではありません"},{"f":"art37","fn":"37条書面(契約書面)","q":"代金の額及びその支払いの時期について契約書面には記載しなかった","a":false,"e":"35条で説明していても契約書面（37条）には必ず記載が必要です<passage50>"},{"f":"art37","fn":"37条書面(契約書面)","q":"抵当権が設定されている建物を売却する場合当該抵当権の内容について37条面に記載しなければならない","a":false,"e":"記載事項となっていないので移転登記の申請時期とごっちゃごちゃにならないよう注意しましょう"},{"f":"art37","fn":"37条書面(契約書面)","q":"宅建業者は買主が宅地建物取引業者であっても37条面名を遅滞なく交付するかまたは電磁的方法による提供をしなければならない","a":true,"e":"買主が宅建業者であっても交付または提供しなければならないとされています"},{"f":"art37","fn":"37条書面(契約書面)","q":"宅地建物取引業者は宅地の売買を媒介した場合損害賠償額の予定または医薬金に関する定めがある時はその内容について37条面に記載しなければならない","a":true,"e":"損害賠償額の予定医薬金は記載事項となっています"},{"f":"art37","fn":"37条書面(契約書面)","q":"宅地または建物にかかる素税その他の効果の負担に関する定めがない場合定めがない胸を37条面に記載しなければならない","a":false,"e":"任意的記載事項となっています"},{"f":"art37","fn":"37条書面(契約書面)","q":"宅建業者Aが売主B買主Cとする建物の売買を媒介しようとしているAは契約の解除に関する事項について売買契約が成立するまでの間にCに説明しなかったが過失はあったものの恋はなかった","a":false,"e":"例え恋でなかったとしてもこの場合違反となります"},{"f":"art37","fn":"37条書面(契約書面)","q":"建物の賃貸借の媒介をするAは37条書面を交付するにあたり宅地建物取引しをしてその内容を説明させなくても良い","a":true,"e":"発見をして説明をさせなくても良いとされています"},{"f":"art37","fn":"37条書面(契約書面)","q":"Aは自ら売り主として建物を売却する場合重要事項説明書に記載しなければならない契約の解除に関する事項については契約に定めがなくても37条面に全て記載しなければならない","a":false,"e":"解除については任意的記載事項とされています"},{"f":"art37","fn":"37条書面(契約書面)","q":"代金についての金制の対策の斡旋に関する定めがある場合当該圧にかかる金銭の対策が成立しない時の措置については37条面に記載する必要はない","a":false,"e":"圧については任意的記載事項となっています"},{"f":"art37","fn":"37条書面(契約書面)","q":"宅建業者は自ら売主として宅地建物取引業者でない法人との間で建物の売買契約を締結した場合当該法人において当該契約の人にあたっているものの氏名を37条面に記載しなければならない","a":false,"e":"37条面は宅建士の期名が必要ということで法人代表者の期名は不要となっています宅建を"},{"f":"koukoku","fn":"広告・取引の規制","q":"開発許可建築確認その他法令に基づく許可等の申請をした後でなければ売買その他の業務に関する広告をしてはならない","a":false,"e":"許可等を得た後でなければ広告不可ということで申請ではダめということです"},{"f":"koukoku","fn":"広告・取引の規制","q":"新たに宅建業の免許を受けようとするものは免許申請中である胸を表示すれば免許取得後の営業に備えて広告をすることができる","a":false,"e":"免許申請中である胸を表示すればとありますが免許申請中では不可となります"},{"f":"koukoku","fn":"広告・取引の規制","q":"建業者は土地付き建物の売買価格について建物売買にかかる消費税額を含む土地付き建物を売買価格のみを表示し消費税額を明示しない広告を行うことができる","a":true,"e":"消費税を含む価格のみを表示し消費税額を明示しない広告も可能となっています"},{"f":"koukoku","fn":"広告・取引の規制","q":"宅建業者は建物の販売に際して買主が手付けとして必要な額を持ち合わせていなかったため手付けを貸し付けることにより契約の締結を有意した","a":false,"e":"手付けの貸し付け分割払いは宅建違反となります"},{"f":"koukoku","fn":"広告・取引の規制","q":"マンションの販売に際して買主が手付けとして必要な額を持ち合わせていなかったため手付けを分割図することにより契約の締結を有意した","a":false,"e":"手付けの分割授業も宅建違反となります"},{"f":"koukoku","fn":"広告・取引の規制","q":"宅建業者は建物の販売に際して売買契約の締結後買主から手付き放棄による契約解除の申し出を受けたが正当な理由なくこれを拒ばんだ","a":false,"e":"正当な理由なく5番ではいけないとされています"},{"f":"koukoku","fn":"広告・取引の規制","q":"複数の区画がある文場値の売買について数回に分けて広告をする場合は最初に行う広告だけではなく自回以降の広告の都度取引要体の別を明示しなければならない","a":true,"e":"毎回明示しなければならないというところは注意しましょう"},{"f":"koukoku","fn":"広告・取引の規制","q":"宅地の売買に際して相手方が契約の締結をするかどうか明日まで考えさせて欲しいと申し出たのに対し事実を歪めて明日では契約締結できなくなるので今日しか待てないと告げた","a":false,"e":"こうやって事実を歪めて脅して契約を取るのは当然ですがダメとされています"},{"f":"koukoku","fn":"広告・取引の規制","q":"建業者は建築確認の済んでいない建築工事完了前の賃貸住宅の貸主から当該住宅の対策の代理を依頼され代理人として借主との間で当該住宅の賃貸借契約薬を締結した","a":true,"e":"貸借の場合は建築確認前でも可能となっています"},{"f":"koukoku","fn":"広告・取引の規制","q":"宅建業者は建築に済んでいない建築工事完了前の賃貸住宅の貸主から当該住宅の貸借の媒介を依頼され取引要体を媒介と明示して募集広告を行った","a":false,"e":"広告は建築確認を受けた後でないと不可ととなるので注意しましょう"},{"f":"koukoku","fn":"広告・取引の規制","q":"建物の販売に際して不当に高額の報酬を要求したが実際には国土交通大臣が定める額を超えない報酬を受け取ったこれは宅建に違反する","a":true,"e":"たえ受け取っていなくても要求をした時点で違反となります"},{"f":"koukoku","fn":"広告・取引の規制","q":"宅建業者が業務停止の処分を受けた場合宅地建物の販売をすることはできないが当該処分期間後の販売に関しあらかじめ広告をすることができる","a":false,"e":"業務停止処分中の広告は不可となります"},{"f":"koukoku","fn":"広告・取引の規制","q":"の文場について建築確認が降りる前に建築確認申請中として新聞広告をした場合に違反して50万円以下の罰金にさせられることがある","a":false,"e":"指示処分を受けるが罰則の対象ではないです"},{"f":"koukoku","fn":"広告・取引の規制","q":"宅建業者は建築確認の済んだ建築工事前の建売り住宅の売主との間で当該住宅の売却の専任媒介契約を締結し媒介業務を行った","a":true,"e":"建築確認が積んでいるので特に問題ないです"},{"f":"koukoku","fn":"広告・取引の規制","q":"建業者は業務上取り扱ったことについて知りた秘密に関し税務所の職員から質問検査権の規定に基づき質問を受けた時でも回答してはならない","a":false,"e":"正当な理由の場合は回答しても大丈夫です"},{"f":"koukoku","fn":"広告・取引の規制","q":"建業者Aは賃貸物件の媒介の広告を行うにあたり存在しない低賃の物件の広告を出したAは業務定処分を受けることがある","a":true,"e":"お取り広告をした場合業務低処分の可能性があります"},{"f":"koukoku","fn":"広告・取引の規制","q":"建物の所有者と賃貸借計薬を締結し当該建物を自らが貸し主となって貸借転するための広告をする場合においては自らが契約の当事者となって釈を成立させる旨を当該広告に明示しなくても規定に違反しない","a":true,"e":"自ら貸主貸借は宅建の対象外です"},{"f":"koukoku","fn":"広告・取引の規制","q":"宅地の販売に関する広告をインターネットで行った場合売買契約が成立した後も継続して広告を掲載していた場合当該広告を掲載し続けることは規定に違反する","a":true,"e":""},{"f":"koukoku","fn":"広告・取引の規制","q":"建物の販売に際して利益を生ずることが確実であると誤解させる的判断を提供する行為をしたが実際に売買契約の成立には至らなかった","a":false,"e":"断定的判断をした時点で違反です"},{"f":"koukoku","fn":"広告・取引の規制","q":"建物の貸借の媒介に際して賃借契約の申し込みをしたものがその撤開を申し出たが物件案内等に経費がかかったため預かり金を変換しなかった","a":false,"e":"預かり金は変換しないと違反です宅建"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"買主B宅建業者ではないは自ら指定したホテルのロビーで買受けの申し込みをしその際に宅建業者Aからクーリングオフについて何も告げられずその3日後Aのモデルルームで契約を締結した場合Bは売買契約を解除することができる","a":true,"e":""},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"主B宅建業者ではないは自らの希望により勤務先で売買契約に関する説明を受けて外の申し込みをしその際に宅地建物取引業者からクーリングオフについて何も告げられずに契約を締結したこの場合Bは当該契約の締結の日から8日を経過するまでは契約の解除をすることができる","a":false,"e":"勤務先での申し込みはクーリングオフ不可です"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"買主B宅建業者ではないはテト張りの案内所で買受けの申し込みをしその際に宅建業者からクーリングオフについて書面で告げられ契約を締結したその5日後代金の全部を支払い翌日に宅地の引き渡しを受けたこの場合Bは売買契約を解除することができる","a":false,"e":"引き渡しを受け、代金全額を支払った後はクーリングオフ不可です"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"宅建業者でない買主は喫茶店でマンションの買い受けの申し込みをした場合その5日後宅建業者の事務所で売買契約を締結した時であってもクーリングオフによる契約の解除をすることができる","a":true,"e":""},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"宅建業者は契約解除に伴う医薬金の定めがある場合クーリングオフによる契約の解除が行われた時であっても医薬金の支払いを請求することができる","a":false,"e":"クーリングオフによる解除では違約金請求は不可です"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"宅建業者はクーリングオフによる契約の解除が行われた場合受けの申し込みまたは売買契約の締結に際した手付け金その他の金銭の倍額を買主に召喚しなければならない","a":false,"e":"受け取った額を返せばよく、倍額を返す必要はありません"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"Cは喫茶店で買受けの申し込みをし、その際に宅建業者からクーリングオフについて何も告げられずに契約を締結した。Cは当該契約の締結後においては契約の解除をすることができる。","a":true,"e":"告知がなければいつまでも解除可能です"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"宅建業者Aが自ら売主として宅建業者でない買主Bと売買契約を締結したBは自らの申し出でBが融資を受ける銀行宅建業者ではないにおいて宅地の買い受けの申し込み及びAとの売買契約の締結をした場合クーリングオフによる当該売買契約の解除を行うことができない","a":false,"e":"銀行は事務所等に該当しないためクーリングオフ可能です"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"宅建業者Aがクーリングオフについて告げる時に交付すべき書面にはAの称号または名称及び住所並びに免許症番号の記載は必要であるがAの宅地建物取引士の期名は必要ない","a":true,"e":""},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"告知書面にはクーリングによる買受けの申し込みの撤開または売買契約の解除があった時は宅建業者はその会受けの申し込みの撤開または売買契約の解除に伴う損害賠償または医薬金の支払いを請求することができないことを記載しなければならない","a":true,"e":""},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"建業者でない買主が行うクーリングオフは書面を発しなくても契約の解除をすることができる","a":false,"e":"クーリングオフは書面（または電磁的記録）で行う必要があります"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"クーリングオフによる解除は国土交通大臣が定める書式の書面を持って行わなければならない","a":false,"e":"特定の書式である必要はありません"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"建業者でない買主から電磁的方法で提供することについての承諾を得た場合クーリングオフについて電磁的方法で告げることができる","a":false,"e":"電磁的方法で告げることはできません"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"クーリングオフの告知書面には売主及び媒介を行う宅建業者の称号または名称及び住所並びに免許症番号を記載しなければならない","a":false,"e":"媒介業者の記載は不要です"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"宅建業者の事務所において宅建業者でない買主から買受けの申し込みを受け売買契約を締結したが売主はクーリン合婦の適用はないと判断し空付について買主に告げる初面の交付は行わなかった","a":true,"e":"事務所での申し込みのためクーリングオフは適用外です"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"宅建業者Aが買主B宅建業者ではないから手付け金として1500万円を受領しようとする場合において建築工事前のマーションについてBへの所有権移転の登記がされた時はAは保全措置を講じなくても良い","a":true,"e":"登記がなされた場合は保全措置不要です"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"建業者Aは宅建業者でないBとの間で建築工事前の建物を5000万円で販売する契約を締結し手付金等の補税措置を講じずに200万円を手付金として治療したこれは宅建に違反する","a":false,"e":"（バツ）になります未完成物件で代金の5%（250万円）以下のため保全措置不要です"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"建業者Aは宅建業者でないBとの間で建築工事が完了した建物を5000万円で販売する契約を締結し手付金等の保全措置を講じず当該建物の引き渡し前に700万円を手付け金として受領したこれは宅建に違反する","a":true,"e":"完成物件で代金の10%（500万円）を超えているため保全措置が必要です"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"建業者Aが自ら売り主として宅建業者ではないBとの間で建物の売買契約を締結する場合AはあかじめBの承諾を書面で得た場合でも売買代金の額の2/10を超える額の手付けを受することはできない","a":true,"e":""},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"宅建業者は宅建業者である買主との間で建築工事が完了した建物を1億円で販売する契約を締結し手付け金等の保全措置を講じずに当該建物の引き渡し前に2500万円を手付け金として受領した","a":true,"e":"相手が宅建業者のため制限は適用されません"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"建業者Aが保全措置を講じずにBから手付金100万円を受領する場合その旨を重要事項説明書に記載する必要があるが37条面に記載する必要はない","a":true,"e":""},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"建業者は工事完了前のマンション代金5000万円を売却するにあたり宅建業者でない買主から手付金500万円を受領したが手付金の保全措置を講ずる必要はないと判断し付け金保全措置の概要について重要事項説明書への記載は省略した","a":false,"e":"5%を超えているため保全措置が必要であり、省略は不可です"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"愛の所有する宅地について宅建業者は愛と停止条件付きで取得する売買契約を締結しその条件がする前に当該物件について税と売買契約を締結した","a":false,"e":"自己の所有に属しない宅地建物の売買は、停止条件付き契約では不可です"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"宅建業者Aは宅建業者でないカヌCとの間でカップ販売の契約を締結したがCが不払い金の支払いを遅延した社は20日の期間を定めて書面にて支払いを再告したがCがその期間内に不払い金を支払わなかったため契約を解除した","a":false,"e":"30日以上の期間を定めて書面で催告する必要があります"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"宅建業者が建物のカップ販売を行った場合建物を買主に引き渡しかつ代金の額の3/10を超える額の支払いを受けた後は担保の目的で当該建物を譲り受けてはならない","a":true,"e":""},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"険業者が買主との間で売主は売買物件の引き渡しの日から1年間に限り当該物件の種類または品質に関して契約の内容に適合しない場合におけるその不適合を担保する責任を負うとする胸の特約を設けることができる","a":false,"e":"引き渡しの日から2年以上とする特約を除き、民法より不利な特約は無効です"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"建業者Aが契約締結時に手付金として500万円をB宅建業者ではないから受領している場合Bが契約の履行に着手していない時AはBに500万円を現実に提供すれば当該売買契約を解除することができる","a":false,"e":"売主からは手付金の倍額（1000万円）を償還する必要があります"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"2500万円の宅地について宅建業者が売買契約の締結を行い損害賠償の額の予定及び利金の定めをする場合その合計額を500万円と設計することができる","a":true,"e":"代金の20%（500万円）以下のため可能です"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"宅建業者A社が自ら売り主としてマンション代金3000万円の売買契約に関し宅建業者でないカ主シとの売買契約の締結をした当事者の債務振を理由とする契約改図に伴う損害賠償の予定額900万円を定めたが医薬金については全て無効である","a":false,"e":"20%（600万円）を超える部分のみが無効となります"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"宅建業者Aは宅建業者である買主B社との間で3000万円の宅地の売買契約を締結したB社の債務振行を理由とする契約解除を行い契約者の医薬金の定めに基づきB社から1000万円の医薬金を受け取ったこれは宅建業法に違反する","a":false,"e":"（お答えは「に」になっていますが、解説からバツ）になります相手が宅建業者のため違反しません宅建を"},{"f":"houshu","fn":"報酬に関する制限","q":"代理の依頼を受け代金3000万円で売買契約を成立させ、報酬として126万円を受領した","a":true,"e":"計算式：3000万*3%+6万=96万。代理は2倍の192万(税別)、税込211.2万以内のため適法です"},{"f":"houshu","fn":"報酬に関する制限","q":"媒介の依頼を受け代金1000万円で売買契約を成立させ、報酬30万円の他に広告に用した実費10万円を受領した","a":true,"e":"実費は依頼者の依頼によるものは受領可能です"},{"f":"houshu","fn":"報酬に関する制限","q":"建物の対策の売解契約を締結しB及びCからそれぞれ建物の仮の1ヶ月分ずつを治療した","a":false,"e":"合計で1ヶ月分（税込1.1ヶ月分）を超えることはできません"},{"f":"houshu","fn":"報酬に関する制限","q":"居住用建物以外の建物の貸借の売解で権利金の知事がある時、いずれか低い方の額を上限としなければならない","a":false,"e":"いずれか高い方の額を上限とすることができます"},{"f":"houshu","fn":"報酬に関する制限","q":"居住用以外の建物の貸借でAが受ける報酬の合計は依頼者の双法からどのような割合で報酬を受けてもよくまた一方のみから受けることもできる","a":true,"e":""},{"f":"houshu","fn":"報酬に関する制限","q":"あかじめ報酬の額を定めていなかった時は依頼者は宅建業者に対し報酬の限度額を報酬として支払わなければならない","a":false,"e":"限度額がそのまま報酬額になるわけではありません"},{"f":"houshu","fn":"報酬に関する制限","q":"宅地代金200万円の売買の代理につき売主Bに対して説明し合意をしていた場合には66万円を上限として報酬を受領することができる","a":true,"e":"低廉な空き家等の売買の特例（上限30万、代理は2倍の60万、税込66万）が適用されます"},{"f":"houshu","fn":"報酬に関する制限","q":"相手方が行意で支払う借金はこの限度額とは別に受領することができる","a":false,"e":"いかなる名目でも限度額を超えて受け取ることはできません"},{"f":"houshu","fn":"報酬に関する制限","q":"不当の工額の報酬を要求した場合例え受領していなくても宅地建物取引違反となる","a":true,"e":""},{"f":"houshu","fn":"報酬に関する制限","q":"居住用建物の双報から媒介の依頼を受けるにあたって借主から承諾を得ていなければ借主から仮ちの1.1ヶ月分の報酬を受領することはできない","a":true,"e":"承諾がなければ0.55ヶ月分が上限です"},{"f":"houshu","fn":"報酬に関する制限","q":"買主から報酬をその限度額まで受領できる他に重要時効の説明を行った耐火として報酬を受領することができる","a":false,"e":""},{"f":"houshu","fn":"報酬に関する制限","q":"科学の査程に用した費用をBに請求することはできない","a":true,"e":""},{"f":"houshu","fn":"報酬に関する制限","q":"建物を居住用として貸借する場合保証金が全額変換される呪がある時報酬の限度額の合計は11万円である","a":false,"e":"居住用では保証金を売買代金とみなす規定は適用されず、借賃基準となります"},{"f":"houshu","fn":"報酬に関する制限","q":"代金900万円の売買で低廉な空き家等の特例を適用して上限を超えて報酬を受け取ることができる","a":false,"e":"特例は800万円以下の物件にのみ適用されます"},{"f":"houshu","fn":"報酬に関する制限","q":"宅地代計200万円の売買で特段の事情がない場合でも合意があれば33万円を報酬として受領することができる","a":false,"e":"事情がない場合は通常の上限（11万円）となります"},{"f":"houshu","fn":"報酬に関する制限","q":"既存住宅の売買で建物の状況調査を実施するものの斡旋にかかる料金を報酬とは別に受領することはできない","a":true,"e":""},{"f":"houshu","fn":"報酬に関する制限","q":"貸借の媒介において、低廉な空き家等の特例を適用して22万円の報酬を受けることができる","a":false,"e":"特例は売買・交換のみに適用され、貸借には適用されません"},{"f":"houshu","fn":"報酬に関する制限","q":"依頼者の依頼によらない通常の広告の料金に相当する額をベッド受領することができる","a":false,"e":""},{"f":"houshu","fn":"報酬に関する制限","q":"代金1000万円の売買で売主から代理、買主から媒介の依頼を受け、買主から30万3000円の報酬を受領する場合売主からは48万9000円を上限として報酬を治療することができる","a":true,"e":"合計限度額（代理の2倍=79.2万）の範囲内であれば受領可能です"},{"f":"houshu","fn":"報酬に関する制限","q":"居住用賃貸借で、免税業者Bが借主から特段の承諾なしに6.5万円（借賃12万円）を受領した","a":false,"e":"承諾がない場合、免税業者の上限は6万円*1.04=6.24万円となり、上限を超えています宅建法"},{"f":"kantoku","fn":"監督・罰則","q":"貢献知事免許の業者がおけ内において違反となる広告を行った。お知事から業務停止の処分を受けることがある","a":true,"e":""},{"f":"kantoku","fn":"監督・罰則","q":"免許申請中である胸を表示すれば広告をすることができる","a":false,"e":""},{"f":"kantoku","fn":"監督・罰則","q":"業務停止処分に違反した場合、国土交通大臣から免許を取り消されることはない","a":false,"e":"業務停止処分違反は免許取消事由です"},{"f":"kantoku","fn":"監督・罰則","q":"貢献知事は指示処分をした時はその胸を貢献の候補等により報告しなければならない","a":false,"e":"指示処分は公告不要です"},{"f":"kantoku","fn":"監督・罰則","q":"不正の手段により免許の交付を受けた場合、他県の知事から登録を抹消されることはない","a":true,"e":"登録抹消は登録を受けている知事のみ可能です"},{"f":"kantoku","fn":"監督・罰則","q":"免許を受けてから1年以内に事業を開始しない時は免許を取り消さなければならない","a":true,"e":""},{"f":"kantoku","fn":"監督・罰則","q":"必要な勧告をした時は伝えなくその胸を貢献知事に通知しなければならない","a":false,"e":""},{"f":"kantoku","fn":"監督・罰則","q":"登録外の知事から指示処分をしようとする時は、あらかじめ登録先の知事に協議しなければならない","a":false,"e":""},{"f":"kantoku","fn":"監督・罰則","q":"事務所の所在地を特定できない場合、広告の日から30日を経過しても申し出がない時は免許を取り消すことができる","a":true,"e":""},{"f":"kantoku","fn":"監督・罰則","q":"業務の停止の処分をした時はその胸の広告はしなくても良い","a":false,"e":"業務停止処分は公告が必要です"},{"f":"kantoku","fn":"監督・罰則","q":"指示に従わない場合、その業務の全部または一部の停止を明ることができ、違反した場合免許を取り消さなければならない","a":true,"e":""},{"f":"kantoku","fn":"監督・罰則","q":"届けで押し案内所を設置して業務を行っていたが違反している事実が判明した。乙県知事から指示処分を受けることがある","a":true,"e":""},{"f":"kantoku","fn":"監督・罰則","q":"自ら所有している物件について賃体借計薬を締結し重要時効の説明を行わなかった。業務停止を命じられることがある","a":false,"e":"自ら貸借は宅建業法の適用外です"},{"f":"kantoku","fn":"監督・罰則","q":"乙県知事から指示処分を受けた時は宅建業者名簿には当該指示の年月日費日及び内容が記載される","a":true,"e":""},{"f":"kantoku","fn":"監督・罰則","q":"免許の取り消しの処分をしようとする時聴聞を行わなければならないが公開されない","a":false,"e":"聴聞は原則公開です"},{"f":"kantoku","fn":"監督・罰則","q":"土地の売買に関し契約締結を共容していた。上場が特に重いと判断した時免許を取り消さなければならない","a":true,"e":""},{"f":"kantoku","fn":"監督・罰則","q":"従業員が契約の締結につき恋に事実を告げなかった場合、業者に1億円以下の罰金が貸されることがある","a":true,"e":""},{"f":"kantoku","fn":"監督・罰則","q":"国土交通大臣免許の業者に対し、県知事が業務停止処分をしようとする時、あらかじめ内閣総理大臣に協議しなければならない","a":false,"e":"知事からの処分には協議は不要です"},{"f":"kantoku","fn":"監督・罰則","q":"国土交通大臣免許の業者が他県で不当な行為をしたとして、自社の本店所在地の知事から業務停止処分を受けることがある","a":false,"e":"処分できるのは免許権者か、違反行為地の知事です"},{"f":"kantoku","fn":"監督・罰則","q":"業務に係わる帳簿を備えていないことが判明した。県知事から必要な報告を求められ、指導を受けることがある","a":true,"e":"宅建業法"},{"f":"kashi","fn":"住宅瑕疵担保履行法","q":"宅建業者である買主との間で新築住宅の売買契約を締結し当該住宅を引き渡す場合資力加工措置を講ずる義務を負う","a":false,"e":"買主が宅建業者の場合は資力確保措置は不要です"},{"f":"kashi","fn":"住宅瑕疵担保履行法","q":"新築住宅の売買の媒介をする場合においても資力確保措置を講ずる義務を負う","a":false,"e":"義務を負うのは「自ら売主」となる宅建業者です"},{"f":"kashi","fn":"住宅瑕疵担保履行法","q":"住宅の床面積が55m以下である時は新築住宅の合計個数の算定にあたって2個を持って1個と数える","a":true,"e":""},{"f":"kashi","fn":"住宅瑕疵担保履行法","q":"状況についての届出をしなければ、基準日から1ヶ月を経過した日以降においては、新たに自ら売主となる新築住宅の売買契約を締結してはならない","a":false,"e":"（バツ）になります基準日から50日を経過した日以降に締結制限となります"},{"f":"kashi","fn":"住宅瑕疵担保履行法","q":"住宅販売瑕疵担保責任保険を締結した場合、引き渡しから10年間、給水設備またはガス設備の瑕疵によって生じた損害について保険金の支払いを受けることができる","a":false,"e":"保険対象は構造耐力上主要な部分または雨水の浸入を防止する部分です"},{"f":"kashi","fn":"住宅瑕疵担保履行法","q":"住宅販売貸担保保証金の供託をする場合供託所の所材値等について書面の交付及び説明を新築住宅を引き渡すまでに行えば良い","a":false,"e":"契約を締結するまでに行う必要があります"},{"f":"kashi","fn":"住宅瑕疵担保履行法","q":"基準日ごとに当該準備にかかる資力加工措置の状況についてその免許を受けた国土交通大臣または都道府県知事に届けなければならない","a":true,"e":""},{"f":"kashi","fn":"住宅瑕疵担保履行法","q":"当該住宅の最寄りの供託所へ住宅販売担保保証金の供託をしなければならない","a":false,"e":"主たる事務所の最寄りの供託所です"},{"f":"kashi","fn":"住宅瑕疵担保履行法","q":"信託会社等で宅建業を営むものである場合住宅販売貸担保保証金の供託等を行う義務を追わい（負わない）","a":false,"e":"信託会社等であっても資力確保措置の義務を負います"},{"f":"kashi","fn":"住宅瑕疵担保履行法","q":"瑕疵担保責任追わない旨の特約があった場合においても義務を負う","a":true,"e":"特約があっても義務は免除されません"},{"f":"kashi","fn":"住宅瑕疵担保履行法","q":"買主Bが建設業者である場合義務を追わない","a":false,"e":"買主が「建設業者」であっても、宅建業者でなければ資力確保措置の義務を負います"},{"f":"kashi","fn":"住宅瑕疵担保履行法","q":"住宅紛争処理機関に申請をすることにより、新築住宅の瑕疵に関する紛争についてあっせん、調停、仲裁を受けることができる","a":true,"e":""},{"f":"kashi","fn":"住宅瑕疵担保履行法","q":"住宅販売瑕疵担保責任保険契約は、宅建業者でない買主が保険料を支払うものではない","a":true,"e":""},{"f":"kashi","fn":"住宅瑕疵担保履行法","q":"保険契約は、買主が引き渡しを受けた時から2年以上の期間にわたって有効なものでなければならない","a":false,"e":"引き渡し時から10年間有効である必要があります"},{"f":"kashi","fn":"住宅瑕疵担保履行法","q":"供託所の所材値等について買主の承諾を得ても書面の交付に変えて電磁的方法により提供することはできない","a":false,"e":"承諾を得ていれば電磁的方法による提供も可能です"}];
const HQ=[{"f":"toshi","fn":"都市計画法","q":"市街区域については少なくとも用途地域を定めるものとし区域については原則として用途地域を定めないものとされている","a":true,"e":"市街区域は必ず用途地域を定め紫市街化調整区域は原則として用途地域を定めないものとします"},{"f":"toshi","fn":"都市計画法","q":"高度地区は用途地域内において市街地の環境を維持しまたは土地利用の増進を図るため建築物の高さの最高限度または最低限度を定める地区とされている","a":true,"e":"高度地区のキーワードは高さの最高限度と最低限度となっていますコード利用地区との入れ替えが品質なので注意しましょう"},{"f":"toshi","fn":"都市計画法","q":"準都市計画区域については用途地域が定められている土地の区域であっても市街地開発事業に関する都市計画を定めることができない","a":true,"e":"準市計画区域は市街地開発事業を定めることはできないとされています"},{"f":"toshi","fn":"都市計画法","q":"都市計画事業の認可の工事があった後当該都市計画事業を施行する土地内で当該事業の思考の障害となる恐れがある土地の警出の変更を行おうとするものは都道府県知事市の区域内にあっては当該市の庁及び当該事業の思考者の許可を受けなければならない","a":false,"e":"都道府県知事の許可を受けなければならないとされていますなので当該事業の思考者の許可は不要となります"},{"f":"toshi","fn":"都市計画法","q":"開発行為とは首として建築物の建築のように共る目的で行う土地の区画の変更を指し特定工作物の建設のように共目的で行う土地の区画出の変更は開発行為には該当しない","a":false,"e":"開発行為は主として建築物の建築または特定工作物の建設のように共る目的で行う土地の区画計出の変更のことを言います"},{"f":"toshi","fn":"都市計画法","q":"市紫化調整区域において行う開発行為でその規模が300mであるものについては常に開発許可は不要である","a":false,"e":"市街化調整区域は規模の代償に関わらず許可が必要となっています"},{"f":"toshi","fn":"都市計画法","q":"非常災害のため必要な応急措置として行う開発行為であっても当該開発行為が市街化調整区域において行われるものであって当該開発行為の規模が3000平m以上である場合には開発許可が必要である","a":false,"e":"非常災害のための応急措置は開発許可不要となります"},{"f":"toshi","fn":"都市計画法","q":"準都市計画区域において店舗の建築を目的とした4000mの土地の区画計出の変更を行おうとするものはあかじめ都道府県知事の許可を受けなければならない","a":true,"e":"都市計画区域は3000m以上の場合開発許可が必要となっています"},{"f":"toshi","fn":"都市計画法","q":"用途地域等の定めがない土地のうち開発許可を受けた開発区域内は開発行為に関する工事完了の広告があった後は都道府県知事の許可を受ければ当該開発許可にかかる予定建築物以外の建築物を進築することができる","a":true,"e":"工事完了の広告後は原則予定建築物等以外のものは建築できませんが都道府県知事が許可した時等は建築可能となります"},{"f":"toshi","fn":"都市計画法","q":"開発許可を受けたものは開発行為に関する工事の廃止をしようとする時は都道府県知事の許可を受けなければならない","a":false,"e":"工事の廃止の場合は許可ではなく都道府県知事に届けでなければならないとされています"},{"f":"toshi","fn":"都市計画法","q":"開発行為に同意していない土地の所有者は当該開発行為に関する工事完了の広告前に当該開発許可を受けた開発区益内においてその権利の行使として自己の土地に建築物を建築することができる","a":true,"e":"原則開発許可を受けた開発区域内の土地は工事広告があるまで建築物の建築等は不可となっていますが例外として権利の行使として自己の土地に建築物を建築することは可能とされています"},{"f":"toshi","fn":"都市計画法","q":"開発行為を行おうとするものは開発行為を受けてから開発行為に着手するまでの間に開発行為に関係がある公共施設の管理者と協議し同意を得なければならない","a":false,"e":"開発許可を受けてから開発行為に着手するまでの間ではなくあかじめ公共施設の管理者と協議同意を得なければならないとされていますいつまでかというのは引っかけポイントなので注意しましょう"},{"f":"toshi","fn":"都市計画法","q":"開発許可を受けた開発区域内の土地で用途地域等が定められていない時都道府県知事に届出れば開発行為に関する工事完了の広告があった後当該開発許可にかかる予定建築物以外の建築物を建築することができる","a":false,"e":"原職工事完了の広告後というのは予定建築物と以外のものは建築不可ですが例外が2つあります1つ目は都道府県知事が許可した時2つ目は開発区域内の土地について用途地域等が定められている時この2つとなっています今回は用途地域等が定められていなくそして都道府県知事に届けで許可ではなく届出となっているのので建築することはできないとされています"},{"f":"toshi","fn":"都市計画法","q":"市街化調整区域のうち開発許可を受けた開発区域以外の区域内において公民館を建築する場合は都道府県知事の許可を受けなくて良い","a":true,"e":"公民館は許可不要の1つとされています"},{"f":"toshi","fn":"都市計画法","q":"開発許可を受けた土地において都道府県は開発行為に関する工事完了の広告があった後都道府県知事との協議が成立したとしても当該開発許可にかかる予定建築物以外の建築物を建築することはできない","a":false,"e":"今回だと都道府県知事との競技が成立しているということで予定建築物以外のものを建築することはできるとされています"},{"f":"toshi","fn":"都市計画法","q":"市紫外域内において都市公園法に規定する公園施設である建築物の建築を目的とした5000mの土地の区画出の変更を行おうとするものはあかじめ都道府県知事の許可を受けなければならない","a":false,"e":"ちょっと細かいんですけど都市講演法に規定する公演施設は許可不要となるので許可がいらないという形になります"},{"f":"toshi","fn":"都市計画法","q":"用途地域の1つである準の遠動としての地域の特性にふさわしい業務のリベンの増を図りつつこれと調和した住居の環境を保護するために定める地域である","a":true,"e":"順地域の説明となっています"},{"f":"toshi","fn":"都市計画法","q":"都道府県知事は開発許可の申請があった時は申請があった日から21日以内に許可または不許可の処分をしなければならない","a":false,"e":"遅滞なく処分をするとされています"},{"f":"toshi","fn":"都市計画法","q":"開発許可を受けようとするものは開発行為に関する工事の受けは受け契約によらないで自らその工事を施行するものを記載した申請書を都道府県知事に提出しなければならない","a":true,"e":"申請書は知事に提出しなければならないとされています"},{"f":"toshi","fn":"都市計画法","q":"特定街区については都市計画に建築物の容積率並びに建築物の高さの最高限度及び壁面の位置の制限を定めるものとされている","a":true,"e":"特定街区の説明となっています"},{"f":"toshi","fn":"都市計画法","q":"区域区は指定都市中核士の区域の全部または一部を含む都市計画区域には必ず定めるものとされている","a":false,"e":"必ず定めるではなく原則必要に応じて定めるとされています"},{"f":"toshi","fn":"都市計画法","q":"市街各域で市町村が設置する医療法に規定する診療所の建築のように共る目的で行うもので当該開発行為の規模が1500mの場合開発許可は必要である","a":true,"e":"一見診療所は許可不要に見えるんですけど許可が必要になるので注意しましょうまた今回は市街各域の1500mということで許可が必要となります"},{"f":"toshi","fn":"都市計画法","q":"特別用途地区は用途地域内の一定の地区における当該地区の特性にふさわしい土地利用の増進環境の保護等の特別の目的の実現を図るため当該用途地域の指定を保管して定める地区である","a":true,"e":"特別用途地区のキーワードは用途地域ないということで引っかけに注意しましょう"},{"f":"toshi","fn":"都市計画法","q":"都市計画の決定または変更の提案は当該提案にかかる都市計画の素
