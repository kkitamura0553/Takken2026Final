案の対象となる土地の区域内の土地所有者の全員の同意を得て行うこととされている","a":false,"e":"全員ではなく2/3以上の同意となっています"},{"f":"toshi","fn":"都市計画法","q":"市町村は都市計画を決定しようとする時はあかじめ都道府県知事に協議しその同意を得なければならない","a":false,"e":"は必要ですが同意は不要となります"},{"f":"toshi","fn":"都市計画法","q":"市紫市街各域内の土地において700mの開発行為を行おうとする場合に都道府県知事の許可が必要となる場合がある","a":true,"e":"市域は許可不要は原速1000m未満ですが500m未満のところもありということで注意しておきましょう必ずしも平法未満が許可不要ではないというところなので引っかけポイントとなります"},{"f":"toshi","fn":"都市計画法","q":"田園住居地域内の農地の区域内において土地の警出の変更を行おうとするものは一定の場合を除き市町村長の許可を受けなければならない","a":true,"e":"田園住居地域内だと市町村長の許可が必要となります"},{"f":"toshi","fn":"都市計画法","q":"工業地域は首として工業の利便を増進するため定める地域とされている","a":true,"e":"工業地域の正しい説明となっています"},{"f":"toshi","fn":"都市計画法","q":"都市計画区域は都市計画区域外の区域のうち新たに住居都市工業都市その他の都市として開発し及び保全する必要がある区域に指定するものとされている","a":false,"e":"都市計画区域の説明ではなく準都市計画区域の説明となっていますあとはキーワードとして準都市計画区域はあんまり開発して欲しくないところというところもポイントとなるので合わせて覚えておきましょう"},{"f":"toshi","fn":"都市計画法","q":"第1種居地域については都市計画に構想住居誘導地区を定めることができる場合がある","a":true,"e":"第1種住居地域は高層住居誘導地域を定めることができる場合があるとされています"},{"f":"toshi","fn":"都市計画法","q":"都市計画区域外においても特に必要がある時は都市施設に関する都市計画を定めることができる","a":true,"e":"都市計画区域外でも都市計画を定めることができるとされています"},{"f":"toshi","fn":"都市計画法","q":"都市計画区域内で工場の建築のように共る目的で1000mの土地の区画出の変更を行おうとするものはあかじめ都道府県知事の許可を受けなければならない","a":false,"e":"今回は準都市計画区域内の1000mということで開発許可不要は純年市計画区域は3000m未満なので許可は不要となります"},{"f":"toshi","fn":"都市計画法","q":"市街化調整区域において野球上の建設を目的とした8000mの土地の区画出の変更を行おうとするものはあかじめ都道府県知事の許可を受けなければならない","a":false,"e":"8000mの野球上は開発許可は不要となるので注意しましょう"},{"f":"toshi","fn":"都市計画法","q":"市街各域において農業を営むものの居住のように共する建築物の建築を目的とした1500mの土地の区画出の変更を行おうとするものは都道府県知事の許可を受けなくて良い","a":false,"e":"市街各域ということで市街各駅の場合1000㎡以上だと開発行為は開発許可が必要となりますまた注意して欲しいのが農林漁業を営むものの居住要件が許可不要となるのは市街区域以外となりますここはよく間違いやすいとこなので注意しておきましょう"},{"f":"toshi","fn":"都市計画法","q":"開発許可を受けた開発行為または開発行為に関する工事により公共施設が設置された時はその公共施設は協議により他の法律に基づく管理者が管理することとした場合を除き開発許可を受けたものが管理することとされている","a":false,"e":"公共施設の存在する市町村の管理に属するものとなります"},{"f":"toshi","fn":"都市計画法","q":"準都市計画区域については都市計画に高度地区を定めることはできるが高度利用地区を定めることはできないものとされている","a":true,"e":"準都市計画区域は高度地区は定めることはできますが高度利用地区は定めることはできないとされています"},{"f":"toshi","fn":"都市計画法","q":"地区計画の区域のうち地区整備計画が定められている区域内において建築物の建築等の行為を行ったものは一定の行為を除き当該行為の完了した日から30日以内に行為の種類場所等を市町村長に届出なければならない","a":false,"e":"工事着手の30日前までに届出るとされています"},{"f":"toshi","fn":"都市計画法","q":"首都圏整備法に規定する規制市街地内にある市街各域内において住宅の建築を目的とした800mの土地の区画出の変更を行おうとするものはあかじめ都道府県知事の許可を受けなければならない","a":true,"e":"3大都市権は500m以上の開発行為は許可が必要となります"},{"f":"toshi","fn":"都市計画法","q":"土地区画各生理事業等の市街地開発事業だけではなく道路公園等の都市計画施設の整備に関する事業についても都市計画事業として思考することができる","a":true,"e":"道路公園等も都市計画事業として思考することができるとされています"},{"f":"toshi","fn":"都市計画法","q":"市紫外科区域はすでに市街地を形成している区域及び概10年以内に優先的かつ計画的に市街化を図るべき区域であり市街化調整区域は市街化を抑制すべき区域である","a":true,"e":"市街化区域と市街化調整区域の正しい説明となっています"},{"f":"kenchiku","fn":"建築基準法","q":"の延べ面積が500mの規定を超える建築物について大規模な修繕をしようとする場合都市計画区域外であれば建築確認を受ける必要はない","a":false,"e":"面積が500mということでこちらの場合は建築確認が必要となっています"},{"f":"kenchiku","fn":"建築基準法","q":"建築物の容積率の制限は都市計画において定められた数値によるものと建築物の前面道路の幅員に一定の数値を常じて得た数値によるものがあるが前面道路の幅員が12m未満である場合には当該建築物の容積率は都市計画において定められた容積率以下でなければならない","a":false,"e":"前面道路の幅員が12m未満の場合丸1指定容積率と丸2前面道路の幅員×る法程上数のいずれか小さい方を使用しますなので都市計画において定められた容積率以下でなければならないという箇所が不適切という形になります"},{"f":"kenchiku","fn":"建築基準法","q":"前面道路の幅員による率の制限は前面道路の幅員が12m以上ある場合は適用されない","a":true,"e":"12m以上ある場合は容積率の制限は適用されないとされています"},{"f":"kenchiku","fn":"建築基準法","q":"建築物が防火地域及び純地域に渡る場合原職当該建築物の全部について防火地域内の建築物に関する規定が適用される","a":true,"e":"厳しい方を適用ということで防火地域と準防火地域の場合は防火地域内の規定が適用されるとなっています"},{"f":"kenchiku","fn":"建築基準法","q":"防火地域内においては3階建て面積が200mの住宅は耐火建築物体化建築物はこれらと同等以上の延焼防止性能が確保された建築物としなければならない","a":false,"e":"純体化建築物ではなく耐火建築物としなければならないとされていますこういう問題が出た時はこの下の図を思い出して今回の場合だと3階建ての200mの防火地域ということで耐火建築物となるという風に問題を解いておきましょう"},{"f":"kenchiku","fn":"建築基準法","q":"価地域内で建築物の屋上に看板を設ける場合その主要な部分を何年材料で作りまたは覆わなければならない","a":false,"e":"不念材料で作り覆わなければならないとされています"},{"f":"kenchiku","fn":"建築基準法","q":"の地上会における居住のための巨には最高のための窓その他の開口部を設けその最高に有効な部分の面積はその質の床面積に対して原則として1/7/7以上としなければならない","a":true,"e":"1/7数字は必ず覚えておきましょう"},{"f":"kenchiku","fn":"建築基準法","q":"高さ15mの建築物には周緯の状況によって安全支障がない場合を除き有効に被設備を設けなければならない","a":false,"e":"被設備を設けなければならないのは20mとなっています今回は15mなので被設備は不要となります"},{"f":"kenchiku","fn":"建築基準法","q":"第2種層住居専用地域内における建築物については北側車線制限は適用されない","a":false,"e":"第1種第2種高層住居専用地域には北側車線制限が適用されるとなっています"},{"f":"kenchiku","fn":"建築基準法","q":"第1種備えつけ専用地域及び第2種備えつけ住宅専用地域内における建築物は隣地斜線制限が適用される","a":false,"e":"第1種第2種低層住居専用地域そして田園住居地域は隣地斜線制限は適用されないので注意しましょう"},{"f":"kenchiku","fn":"建築基準法","q":"日の対象区域は地方公共団体が条例で指定することとされ商業地域工業地域及び工業専用地域においては日影規制の対象区域として指定することができない","a":true,"e":"商業地域工業地域工業専用地域は日の対象外となります"},{"f":"kenchiku","fn":"建築基準法","q":"第2種備えつけ住宅専用地域に指定されている区域内の土地においては都市計画において建築物の外壁またはこれに変わる柱の面から敷地境界線までの距離の限度を2mまたは1.5mとして定めることができる","a":false,"e":"1.5mまたは1mとされています"},{"f":"kenchiku","fn":"建築基準法","q":"1の敷地でその敷地面積の40%が第2種低層専用地域60%が第1種中高層住居専用地域にある場合原則当該敷地内には大学を建築することができない","a":false,"e":"複数の用途地域に渡る場合下半が属する用途地域の規定が全てに適用されるとなっていますなので面積が広い方を使うということです今回は第1種中高層住居専用地域が60%ということでこちらを使うということで大学の建築は可能となっています"},{"f":"kenchiku","fn":"建築基準法","q":"地方公共団体は延べ面積が1000mを超える建築物の敷地が接しなければならない道路の幅員について条例で避難または通行の安全の目的を達するために必要な制限を付加することができる","a":true,"e":"公共団体は特殊建築物や3階以上の建築物の延べ面積が1000m超えの建築物袋道路のみに接するのみ面積が150平m超えの建築物ただし1個建ての住宅を除きますこれらは条例で必要な節道義務の制限を付加することができるとされていますまた注意して欲しいのは不可はできるけど緩和はできないということです数字と要件は必ず覚えておきましょう"},{"f":"kenchiku","fn":"建築基準法","q":"建ぺい率の限度がとされている地域内でかつ防火地域内にある耐火建築物はこれと同等以上の延焼防止性能を有するものとして政令で定める建築物については建ぺい率の制限は適用されない","a":true,"e":"率が1/8そして防火地域内にある耐火建築物は建ぺい率の制限は適用されないとなっていますつまり建ぺい率は100%ということです"},{"f":"kenchiku","fn":"建築基準法","q":"の居出には原則として換気のための窓その他の開口部を設けその換気に有効な部分の面積はその教室の床面積に対して1/5以上としなければならない","a":false,"e":"1/以上となっています"},{"f":"kenchiku","fn":"建築基準法","q":"の用途に供する建築物をホテルその用途に供する部分の床面積の合計が500mに用途変更する場合建築確認は不要である","a":false,"e":"事務所から特殊建築物今回だとホテルなどに用途変更する場合床面積が200平m超えである時は建築確認が必要となってきます"},{"f":"kenchiku","fn":"建築基準法","q":"用途地域に関する都市計画において建築物の敷地面積の最低限度を定める場合においてはその最低限度は200平mを超えてはならない","a":true,"e":"最低限度は200mとなっています"},{"f":"kenchiku","fn":"建築基準法","q":"防地域または純防化地域においての延べ面積が1000mを超える価建築物は防火有効な構造の防火壁または防火省で有効に区画しかつ各区画の床面積の合計をそれぞれ1000m以内としなければならない","a":false,"e":"この規定は耐火建築物は純体化建築物には適用されないとなっています間違いないよう注意しましょう"},{"f":"kenchiku","fn":"建築基準法","q":"建築物の容積率の算定の基礎となるの面積には老人ホームの共用の廊下または階段のように供する床面積は算入しないものとされている","a":true,"e":"これらはの延べ面積には算入しないとなっています"},{"f":"kenchiku","fn":"建築基準法","q":"の延べ面積が1000mを超える木造建築物はその外壁及びで延焼のおそれのある部分を防火構造としなければならない","a":true,"e":"平方を超える木造建築物は防火構造としなければならないとされています"},{"f":"kenchiku","fn":"建築基準法","q":"建築主は3階建ての木造の共同住宅を進築する場合において特定行政庁が安全防火上及び避難所支障がないと認めた時は検査済み症の交付を受ける前においても仮に当該共同住宅を使用することができる","a":true,"e":"共同住宅は特殊建築物そして木造3階建てということで建築確認が必要となっていますただし今回は特定行政庁がカ用を承認したということで検査済み症の交付前でも使用することができるとされています合させなくても良いとされています"},{"f":"kenchiku","fn":"建築基準法","q":"法の改正で建築物が改正後の法の規定に適合しなくなった場合当該建築物は違反建築物となり速やかに改正後の法の規定に適合させなければならない","a":false,"e":"合させなくても良いとされています（既存不適格建築物として、直ちに適合させる必要はありません）。"},{"f":"kenchiku","fn":"建築基準法","q":"建築主は工事を完了した場合工事が完了した日から3日以内に到達するように建築主持または指定確認検査機関に文章を持って届けてなければならない","a":false,"e":"3日以内ではなく4日以内となっています"},{"f":"kenchiku","fn":"建築基準法","q":"建築確認の対象となり得る工事は建築物の建築大規模の修繕及び大規模の模様替え移転も対象である","a":true,"e":"模様移転も対象なので注意しましょう"},{"f":"kenchiku","fn":"建築基準法","q":"都市計画区域外において高さ12m回数が3回の木造建築物を進築する場合建築確認が必要である","a":true,"e":"回数が2以上なので建築確認が必要となります"},{"f":"kenchiku","fn":"建築基準法","q":"高さ1m以下の階段の部分には手すりを設けなくても良い","a":true,"e":"高さ1m以下は手すりは設けなくても良いとされています"},{"f":"kenchiku","fn":"建築基準法","q":"公衆弁所及び巡査発出所については特定行政庁の許可を得ないで道路に突き出して建築することができる","a":false,"e":"特定行政の許可が必要となります"},{"f":"kenchiku","fn":"建築基準法","q":"兵率は前面道路のに応じて制限されることはない","a":true,"e":"前面道路の幅員というのは容積率の制限となっています建ぺい率は関係ないのでごちゃごちゃにならないよう注意しましょう"},{"f":"kenchiku","fn":"建築基準法","q":"建築確認を申請しようとする建築主はあらかじめ当該確認にかかる建築物の所材地を観轄する消防庁または消防所署長の同意を得ておかなければならない","a":false,"e":"建築主が同揺るのではなく建築主持または指定確認となります守護が違うので注意しましょう"},{"f":"kenchiku","fn":"建築基準法","q":"価地域内にある延べ面積が150mの事務所のように共する建築物は純体化建築物等としなければならない","a":false,"e":"防火地域内での延べ面積が150平mということで耐火建築物等としなければならないとされています"},{"f":"kenchiku","fn":"建築基準法","q":"建築物の敷地が工業地域と工業専用地域に渡る場合において当該敷地の下半が工業地域内である時は共同住宅を建築することができる","a":true,"e":"敷地の下半が属する地域の制限が適用されるということで共同住宅は工業地域内で建築可能となっています"},{"f":"kenchiku","fn":"建築基準法","q":"建築協定の目的となっている建築物に関する基準が建築物の借主の権限にかかる場合その建築協定については当該建築物の借主は土地の所有者等と見なす","a":true,"e":"借主は土地の所有者等と見なされます"},{"f":"kenchiku","fn":"建築基準法","q":"工業地域内においては用連携型認定子ど園を建築することができる","a":true,"e":"全ての用途地域で建築可能となっています"},{"f":"kenchiku","fn":"建築基準法","q":"価地域及び準防火地域において建築物を改築する場合でその改築にかかる部分の床面積の合計が10平m以内である時は建築確認は不要である","a":true,"e":"防地域純化地域の場合10平m以内だと建築確認は不要となります"},{"f":"kenchiku","fn":"建築基準法","q":"第1種掃住居西専用地域内においては神社員教会を建築することはできない","a":false,"e":"信者員教会は全ての用途地域で建築可能となります"},{"f":"kenchiku","fn":"建築基準法","q":"道路の境界線と見なされる線と道との間の部分の敷地が支有内地である場合は敷地面積に参入される","a":false,"e":"この場合は敷地面積に参入されないとなっています"},{"f":"kenchiku","fn":"建築基準法","q":"地方公共団体は土地の状況等により必要な場合は建築物の敷地と道路との関係について建築基準法に規定された制限を条例で緩和することができる","a":false,"e":"この場合付加は可能ですが緩和は不可となります間違いやすいので注意しておきましょう"},{"f":"kenchiku","fn":"建築基準法","q":"第1種低掃住居専用地域内においては高等学校を建築することはできるが高等専門学校を建築することはできない","a":true,"e":"主居専用地域は高校は可能ですが光戦は不可となります光戦は大学みたいな感じでいろんな人が来るという形なので建築は不可みたいな感じで覚えておきましょう"},{"f":"kenchiku","fn":"建築基準法","q":"下に設ける建築物については道路内に建築することができる","a":true,"e":"自盤面の場合は道路内に建築が可能となっています"},{"f":"kenchiku","fn":"建築基準法","q":"地域にある建築物は外壁が対価構造であってもその外壁を臨地教界線に設置で設けることはできない","a":false,"e":"放下地域で外壁が対価構造の場合は臨地教会線に接して設けることはできるとされています"},{"f":"kenchiku","fn":"建築基準法","q":"内においては述延べ面積が2000mの共同住宅は巡体化建築物はこれと同等以上の延焼防止性能が確保された建築物としなければならない","a":false,"e":"準防火地域で2000mなので耐火建築物としなければならないとされています準防火ではないので注意しましょう"},{"f":"kenchiku","fn":"建築基準法","q":"特定行政庁が許可した場合第1種降車地域内においても飲食店を建築することができる","a":true,"e":"特定行政庁が許可ということでこの場合は建築することができるとされています"},{"f":"kenchiku","fn":"建築基準法","q":"建築協定区域内の土地の所有者等は特定行政庁から認可を受けた建築協定を変更しようとする場合土地所有者等の全員の合意を持ってその胸を定め特定行政庁の認可を受けなければならない","a":true,"e":"変更の場合は全員の合意そして廃止の場合は下半数なのでこちらも合わせて覚えておきましょう"},{"f":"kenchiku","fn":"建築基準法","q":"建築協定においては建築協定区域内における建築物の用途に関する基準を定めることができない","a":false,"e":"建築協定では建築物の敷地位置構造用途携帯衣装または設備に関する基準を定めることができるとされていますなので当然ですが用途も定めることができるとなっています"},{"f":"kenchiku","fn":"建築基準法","q":"映画館の用途に共する建築物でその用途に供する部分の床面積の合計が300mであるものの改築をしようとする場合建築確認が必要である","a":true,"e":"映画館で300mなので建築確認が必要となっています"},{"f":"kenchiku","fn":"建築基準法","q":"地方公共団体はその敷地が袋道路にのみ接する1個建ての住宅について条例でその敷地が接しなければならない道路の幅員に関して必要な制限を付加することができる","a":false,"e":"ちょっと引っかかりやすいんですけど袋状道路1個建て住宅ということでこの制限は1個建て住宅を除くとなっているので付荷することはできないとされていますしっかりとキーワードを確認しておきましょう"},{"f":"kenchiku","fn":"建築基準法","q":"建築協定は当該建築協定区域内の土地の所有者が1人の場合でも定めることができる","a":true,"e":"1人の場合でも建築協定を定めることができるとされています"},{"f":"kenchiku","fn":"建築基準法","q":"容積率の算定にあたっては共同住宅の共用の廊下または階段のように共面積はその建築物の面積には算入しない","a":true,"e":"建築物の面積には算入しないとされています"},{"f":"kokudo","fn":"国土利用計画法","q":"権利取得者となったものはその契約の締結後1週間以内であれば市町村長を経由し1週間を超えた場合には直接都道府県知事に事後届出を行わなければならない","a":false,"e":"権利取得者は契約を締結した日から2週間以内に市町村長を経由して知事に対して事後届けでを行うとされています"},{"f":"kokudo","fn":"国土利用計画法","q":"宅建業者であるaとbが滋賀調整区域内の6000mの土地についてbを権利取得者とする売買契約を締結した場合にはbは事後届出を行う必要はない","a":false,"e":"許可届けで不要の数字を抑えましょう市街化調整区域は5000m未満だと許可届けで不要ですが今回は6000mなのでbは事後届けで行う必要があるとされています"},{"f":"kokudo","fn":"国土利用計画法","q":"aが所有する市街各域内の1500mの土地をbが購入するとbは事後届出を行う必要はない","a":true,"e":"許可届けで不要は市街だと2000m未満だと届けで不要となります"},{"f":"kokudo","fn":"国土利用計画法","q":"所有する都市計画区域の1万5000mの土地をhに増与した場合hは事後届出を行う必要がある","a":false,"e":"国土利用計画法の目的を抑えましょう地下の後等を抑制するためということで増与は届出が必要な土地売買等の契約に該当しないとされていますなので届けでは不要ということになります"},{"f":"kokudo","fn":"国土利用計画法","q":"所有する都市計画区域内の土地面積6000mを買い受けたものは売買契約を締結した日からして2週間以内に事後届出を行わなければならない","a":false,"e":"相手がおけつまり国地方公共団体等である場合には事後届出を行う必要はないとされています相手はちゃんとしているから土地の高等なんてしないなので地獄届けでは不要みたいな感じでイメージで覚えておきましょう"},{"f":"kokudo","fn":"国土利用計画法","q":"都道府県知事は事後届出があった場合届出書に記載された土地に関する権利の移転と対価の額が土地に関する権利の相当な科学に照らし一著しく適正を書く時当該大価の額について必要な変更をすべきことを勧告できる","a":false,"e":"事後届けでの場合土地の利用目的の変更のみとなっていて大価の額は変更すべきと韓国できないとされています"},{"f":"kokudo","fn":"国土利用計画法","q":"宅建業者aが自己の所有する市街内の2000mの土地を個人bcに1000mずつ分割して売却した場合bcは事後届出を行わなければならない","a":false,"e":"分割で考えるということでbとcはそれぞれ1000mの市街区域内ということで届けでは必要ないとされています"},{"f":"kokudo","fn":"国土利用計画法","q":"事後届出手にかかる土地の利用目的について都道府県知事から韓国を受けた宅建業者がその韓国に従わない時知事はその胸及びその韓国の内容を公表できる","a":true,"e":"知事は勧告することができ従わない時はその胸及びその内容を公表することができるとされています注意して欲しいのはあくまでも2位であってしなければならないという義務ではないのでこちらも合わせて覚えておきましょう"},{"f":"kokudo","fn":"国土利用計画法","q":"事後届出が必要な土地売買等の契約を締結したにも関わらず所定の期間内にこの届けでしなかったものは6ヶ月以下の罰金または100万円以下の罰金に処せられる","a":true,"e":"6ヶ月以下の懲役または100万円以下の罰金となります"},{"f":"kokudo","fn":"国土利用計画法","q":"事後届出においては土地の所有権移転後における土地の利用目的について届出ることとされているが土地の売買価格については届出る必要はない","a":false,"e":"事後届出の届出が必要な事項として土地の利用目的そして対価の額も含みますここはしっかりと覚えておきましょう"},{"f":"kokudo","fn":"国土利用計画法","q":"市紫市街各駅を除く都市計画区域内において1段の土地である甲地面積3500mと土地面積2500mを宅建業者eが購入した場合eは事後届出を行わなければならない","a":true,"e":"この市街化区域を除く都市計画区域内というのはこの区域区分を思い出して欲しいんですけどこの赤いところこの中の紫化区域を覗くということでつまり紫化調整区域または非引き区域ということになりますなのでこの問題でいくと今回は紫化調整区域または非引区域内のことということでこの場合許可届けで不要なのは5000m未満となりますなので甲土地と乙土地を足すと6000mとなるので今回の場合は事後届出が必要という形になります直接は書いてなくてちょっと難しくてうっってなっちゃうと思うんですけど言われていることは難しくないのでこういった問題は落ち着いて解くようにしましょう"},{"f":"kokudo","fn":"国土利用計画法","q":"都市計画区域において国から1度の土地である6000mと5000mの土地を購入したものは事届出を行う必要はない","a":true,"e":"相手方が国ということで地獄届出は不要となります"},{"f":"kokudo","fn":"国土利用計画法","q":"事後届出手にかかる土地の利用目的について知事から勧告を受けた宅建業者は知事に対し当該土地に関する権利を買い取るべきことを請求することができる","a":false,"e":"この場合請求は知事に対して不可となっています"},{"f":"kokudo","fn":"国土利用計画法","q":"市街内でaが所有する面積2000mの土地をbが購入した場合bは事後届出を行わなければならない","a":true,"e":"許可届けで不要は市街各域の場合2000m未満ということで2000mだと許可届出手が必要となります未満とかちゃんと覚えているかという問題になっているのので間違えてしまった方はここで確認しておきましょう"},{"f":"kokudo","fn":"国土利用計画法","q":"事届けれにかかる土地の利用目的について知事から韓国を受けたhが韓国に従わなかった場合知事は当該届出手出にかかる土地売買の契約を無効にできる","a":false,"e":"この場合韓国に従わなかった場合でも契約は有効となります無効ではないので注意しましょう"},{"f":"kokudo","fn":"国土利用計画法","q":"中止区域または監視区域に処する土地について土地売買等の契約を締結しようとする場合事後届けでが必要である","a":false,"e":"注視区域または監視区域は事後届出手ではなく事前届出が必要となります"},{"f":"kokudo","fn":"国土利用計画法","q":"都市計画区域外の2ヘクタールの土地についてdを権利取得者とする売買契約を締結した場合dは事後届出を行わなければならない","a":true,"e":"2ヘクタールというのは2万平m今回は都市計画区域外なのでdは事後届出を行わなければならないとされています"},{"f":"kokudo","fn":"国土利用計画法","q":"都道府県知事は事後届出をしたものに対しその届出にかかる土地の利用目的や大価の額について周辺の地域の適正かつ合理的な土地利用を図るために必要な助言をすることができる","a":false,"e":"事後届出は大価の額は届出手が必要ですが助言は利用目的についてのみ可能で、対価の額についての助言は不可となっています。"},{"f":"kokudo","fn":"国土利用計画法","q":"市街区域を除く都市計画区域内においてaが所有する7000mの土地をbが相続により取得した場合bは事後届出を行う必要がある","a":false,"e":"相続の場合事後届けでは不要となっています"},{"f":"kokudo","fn":"国土利用計画法","q":"国が所有する市街区域内の1万mの土地と兵士が所有する紫市街各域内の2500mの土地について宅建業者dが購入する契約を締結した場合dは事後届出を行う必要はない","a":true,"e":"相手方が国（国・地方公共団体）ということでdは地獄届けでは不要となっています"},{"f":"kokudo","fn":"国土利用計画法","q":"都市計画区域外でdが所有する面積1万2000mの土地についてeが担保系の実行による共売を通じて所有権を取得した場合eは事後届出を行わなければならない","a":false,"e":"抵当権の実行による競売というのは届けで不要となっています"},{"f":"kokudo","fn":"国土利用計画法","q":"iが所有する都市計画区域外の1万平の土地とjが所有する市街化調整区域内の1万mの土地を交換した場合i及びjは事後届けで行う必要はない","a":false,"e":"市街化調整区域は5000m以上、都市計画区域外は1万m以上で届出が必要となります。今回は交換であり、両当事者が権利を取得するため、i及びjともに事後届出が必要となります。"},{"f":"kokudo","fn":"国土利用計画法","q":"土地売買等の契約を締結した場合権利取得者はその契約にかかる契約を締結した日から2週間以内に事後届けで行わなければならない","a":true,"e":"事後届けでは権利取得者が2週間以内に届出を行うとされています"},{"f":"kokudo","fn":"国土利用計画法","q":"監視区域に指定された都市計画区域内に所在する2500mの土地について売買契約を締結しようとする当事者はあらかじめ事前届出を行わなければならない","a":true,"e":"監視区域内のため事前届出が必要です。"},{"f":"kokudo","fn":"国土利用計画法","q":"aが所有する市街各域以外の都市計画区域内の4000mの土地について宅地建物取引業者bが地上権の設定を受ける契約を締結した場合bは事届出を行わなければならない","a":false,"e":"今回は面積が4000mなので市街区域以外の都市計画区域ということで許可届けで不要は5000m未満です。今回は4000mなので事後届けでは不要となります"},{"f":"kokudo","fn":"国土利用計画法","q":"事届出において土地売買等の契約にかかる土地の土地に関する権利の移転または設定の対価の額については届出事項ではない","a":false,"e":"大価の額は届出が必要な事項とされています"},{"f":"kokudo","fn":"国土利用計画法","q":"aが所有する監視区域内の土地面積1万mをbが購入する契約を締結した場合a及びbは事前届出を行わなければならない","a":true,"e":"監視区域ということでaとb当事者双法が届出手（事前届出）をする必要があります。"},{"f":"kokudo","fn":"国土利用計画法","q":"市街各域内の甲土地面積3000mを購入する契約を締結したものがその契約締結の1ヶ月後に甲土地と一段の土地である乙土地面積4000mを購入することとしている場合土地の事後届けでは乙土地の契約締結後に乙つの事後届けでと合わせて行うことができる","a":false,"e":"甲土地の契約締結から2週間以内に甲土地の届出をしなければならず、1ヶ月後の乙土地と合わせて行うことはできません。"},{"f":"kokudo","fn":"国土利用計画法","q":"市街各域内の土地面積2500mを購入する契約を締結したものはその契約を締結した日からして3週間以内に事後届出を行わなければならない","a":false,"e":"3週間以内ではなく2週間以内となっています"},{"f":"kokudo","fn":"国土利用計画法","q":"事後届出が必要な土地売買等の契約により権利取得者となったものが事後届出を行わなかった場合には都道府県知事から当該届出を行うよう勧告されるが罰則の適用はない","a":false,"e":"知事からの勧告ではなく、届出をしない場合は罰則（刑事罰）の適用があります。"},{"f":"nouchi","fn":"農地法","q":"3輪を開墾して水電として工作している土地であっても土地登記簿上の地目が山林である限り法の適用を受ける農地には当たらない","a":false,"e":"登記簿上の地目に関わらず、現況で判断するため農地に当たります。"},{"f":"nouchi","fn":"農地法","q":"工作目的で農地の売買契約を締結し代金の支払いをした場合でも3条の許可を受けていなければその所有権の移転の効力は生じない","a":true,"e":"許可を受けていないと所有権移転の効力は生じないとされています"},{"f":"nouchi","fn":"農地法","q":"農業者が自ら農業用倉庫として利用する目的で自己の所有する農地を転用する場合転用する農地の面積の規模に関わらず4条の許可を受ける必要がある","a":false,"e":"農業者が自ら農業用施設（2アール未満）にする場合は4条許可が不要です。"},{"f":"nouchi","fn":"農地法","q":"市街各域内の農地を自家用駐車場に転用する場合4条の許可が必要である","a":false,"e":"市街化区域内の特例として、あらかじめ農業委員会に届出れば4条許可は不要です。"},{"f":"nouchi","fn":"農地法","q":"金融機関からの資金借入れのために農地に抵当権を設定する場合3条の許可が必要である","a":false,"e":"抵当権の設定は、所有権等の移転・設定（使用及び収益を目的とする権利）に該当しないため、許可は不要です。"},{"f":"nouchi","fn":"農地法","q":"土地区画整理事業により道路を建設するために農地を転用しようとするものは4条の許可を受けなければならない","a":false,"e":"土地価格生理需要等（土地区画整理事業など）として行う場合、許可は不要です。"},{"f":"nouchi","fn":"農地法","q":"都道府県知事等は5条の許可を要する農地取得についてその許可を受けずに農地の転用を行ったものに対し必要な限度で現状回復を命ずることができる","a":true,"e":"現状回復を命ずることができます。"},{"f":"nouchi","fn":"農地法","q":"遺産の分割により農地を取得する場合は3条許可を受ける必要がある","a":false,"e":"遺産分割（相続等）による取得は3条許可は不要です（ただし届出は必要）。"},{"f":"nouchi","fn":"農地法","q":"砂利採取法による認可を受けた採取計画に従って砂利採取のために農地を一時的に貸し付ける場合5条の許可は不要である","a":false,"e":"一時的な利用であっても5条の許可が必要です。"},{"f":"nouchi","fn":"農地法","q":"農地の賃貸借について3条の許可を得て農地の引き渡しを受けても登記をしなかった場合その後農地について所有権を取得した第3者に対抗ができない","a":false,"e":"農地法上の引き渡しがあれば、登記がなくても第三者に対抗できます。"},{"f":"nouchi","fn":"農地法","q":"農業者が相続により取得した市街化調整区域内の農地を自己の住宅用地として転用する場合には4条の許可を受ける必要はない","a":false,"e":"相続で取得した農地であっても、それを自ら転用（4条）する場合は許可が必要です。相続で許可不要なのは3条のみです。"},{"f":"nouchi","fn":"農地法","q":"仮設工作物を設置するため市街各域外にある農地の所有権を取得しようとする場合には5条の許可を受けることができない","a":true,"e":"所有権の移転を伴う一時的利用（仮設工作物の設置など）では、5条許可を受けることはできないとされています。"},{"f":"nouchi","fn":"農地法","q":"市街化調整区域内の農地を駐車場に転用するにあたってすでに利用されておらず休耕地（有休地）となっている場合4条の許可を受ける必要はない","a":false,"e":"耕作されていなくても農地であるため、転用には4条許可が必要です。"},{"f":"nouchi","fn":"農地法","q":"雑種地を開墾して畑として耕作されている土地であっても土地登記簿上の地目が雑種地である限り法の適用を受ける農地に当たらない","a":false,"e":"現況が農地（耕作されている）であるため、農地法が適用されます。"},{"f":"nouchi","fn":"農地法","q":"農地を相続した場合その相続人は3条の許可を受ける必要はないが遅滞なく農業委員会にその旨を届出なければならない","a":true,"e":"相続は3条許可不要ですが、農業委員会への届出が必要です。"},{"f":"nouchi","fn":"農地法","q":"遺贈により農地を取得する場合3条の許可を要しない","a":true,"e":"包括遺贈や相続人への特定遺贈は3条許可不要ですが、相続人以外の特定遺贈は許可が必要です。今回は「遺贈」全般として許可を要しない例外があるため、あるいは相続人等への遺贈を指して「丸」となっています（ただし届出は必要）。"},{"f":"nouchi","fn":"農地法","q":"農業者が自らの農業の事業のための畜舎を建設する目的で市街化調整区域内にある150m（1.5アール）の農地を購入する場合は5条の許可を受ける必要がある","a":true,"e":"自己転用（4条）の場合は農業用施設（2アール未満）なら不要ですが、購入して転用する「5条」の場合は面積にかかわらず許可が必要です。"},{"f":"nouchi","fn":"農地法","q":"競売により市街化調整区域内にある農地を取得する場合は3条または5条の許可を受ける必要はない","a":false,"e":"競売であっても農地法上の許可（3条または5条）が必要です。"},{"f":"nouchi","fn":"農地法","q":"相続人に該当しないものに対する特定遺贈により農地を取得する場合3条の許可を受ける必要はない","a":false,"e":"相続人以外の特定遺贈の場合は、3条許可が必要です。"},{"f":"nouchi","fn":"農地法","q":"農業者が相続により取得した市街化調整区域内の農地を自己の住宅用地として転用する場合でも4条の許可を受ける必要がある","a":true,"e":"4条の自己転用には許可が必要です。"},{"f":"nouchi","fn":"農地法","q":"住宅を建設する目的で市街各域内の農地の所有権を取得するにあたってあらかじめ農業委員会に届出た場合は5条の許可を受ける必要はない","a":true,"e":"市街化区域内の特例（5条）として、あらかじめ届出すれば許可不要です。"},{"f":"nouchi","fn":"農地法","q":"法人の代表者がその法人の業務に関し第4条または5条の規定に違反して農地の転用を行った場合にはその代表者が罰せられる他その法人も300万円以下の罰金が課せられる","a":false,"e":"法人に対する罰金刑は最高1億円（1億円以下の罰金）です。"},{"f":"nouchi","fn":"農地法","q":"耕作目的で原野を農地に転用（造成）しようとする場合4条の許可は不要である","a":true,"e":"農地を農地以外にするのが転用（4条）です。原野を農地にする場合は許可不要です。"},{"f":"nouchi","fn":"農地法","q":"市街各区域内にある農地を取得して住宅を建設する場合は工事完了後遅滞なく農業委員会に届出れば5条の許可を受ける必要はない","a":false,"e":"工事完了後ではなく、「あらかじめ」届出が必要です。"},{"f":"nouchi","fn":"農地法","q":"都道府県知事等は5条の許可を要する農地取得について許可を受けずに農地の転用を行ったものに対して必要な限度において現状回復を命ずることができる","a":true,"e":"現状回復を命ずることができます。"},{"f":"nouchi","fn":"農地法","q":"競売により農地の所有権を取得する場合農地法の許可を受ける必要がある","a":true,"e":"競売でも許可が必要です。"},{"f":"nouchi","fn":"農地法","q":"農地所有適格法人の要件を満たしていない株式会社は耕作目的で農地を借り入れることはできない","a":false,"e":"所有はできませんが、一定の要件を満たせば賃借（借り入れ）は可能です。"},{"f":"nouchi","fn":"農地法","q":"社会福祉事業を行うことを目的として設立された法人が農地をその目的にかかる業務の運営に必要な施設のように供すると認められる場合農地所有適格法人でなくても農業委員会の許可を得て農地の所有権を取得することができる","a":true,"e":"例外として所有権を取得できる場合があります。"},{"f":"nouchi","fn":"農地法","q":"国または都道府県等が市街化調整区域内の農地を取得して学校を建設する場合都道府県知事等との協議が成立したら5条の許可を受ける必要はない","a":true,"e":"国・都道府県が学校等のために取得する場合、協議成立により許可不要です。"},{"f":"nouchi","fn":"農地法","q":"市街各域内において2ヘクタールの農地を住宅建設のために取得するものは5条の都道府県知事等の許可を受けなければならない","a":false,"e":"市街化区域内であるため、面積にかかわらず「あらかじめ届出」をすれば許可不要です。"},{"f":"takuzo","fn":"盛土規制法","q":"宅地造成等工事規制区域内において行われる盛土であって当該盛土する土地の面積が300mでかつ高さ1.5mの崖を生ずることとなるものに関する工事は一定の場合を除き都道府県知事の許可が必要である","a":true,"e":"盛土の場合は、高さ1m超の崖、または面積500㎡超の場合に許可が必要です。今回は高さ1.5mの崖を生じるため、許可が必要です。"},{"f":"takuzo","fn":"盛土規制法","q":"宅地造成等工事規制区域内において森林を宅地にするために行う盛土・切土で高さ3mの崖を生ずる工事を行う場合工事主は工事に着手する前に都道府県知事の許可を受けなければならない","a":true,"e":"切土の場合は、高さ2m超の崖、または面積500㎡超で許可が必要です。今回は高さ3mの崖を生じるため、許可が必要です。"},{"f":"takuzo","fn":"盛土規制法","q":"宅地造成等工事規制区域内において宅地造成等に関する工事を行う場合宅地造成等に伴う災害を防止するために行う高さ4mの擁壁の設置にかかる工事については政令で定める資格を有するものの設計によらなければならない","a":false,"e":"有資格者の設計が必要なのは、高さ5m超の擁壁の設置、または1500㎡超の土地の排水施設の設置です。今回は高さ4mであるため不要です。"},{"f":"takuzo","fn":"盛土規制法","q":"都道府県知事は宅地造成特定盛土等または土石の体積に伴う災害の防止に関する基本的な方針（基本方針）を定めなければならない","a":false,"e":"基本方針を定めるのは都道府件知事ではなく、主務大臣（国土交通大臣等）です。"},{"f":"takuzo","fn":"盛土規制法","q":"都道府県知事は工事の許可の申請があった場合遅滞なく許可または不許可の処分をしなければならず許可の処分をした時は許可書を交付し不許可の処分をした時は文書を持ってその旨を通知しなければならない","a":true,"e":"正しい説明です。"},{"f":"takuzo","fn":"盛土規制法","q":"工事等に関する工事の許可を受けたものが施工管理者を変更する場合には遅滞なくその旨を都道府県知事に届出ればよく改めて許可を受ける必要はない","a":true,"e":"施工管理者の変更は軽微な変更に該当するため、届出で足ります。"},{"f":"takuzo","fn":"盛土規制法","q":"工事主は宅地造成等工事規制区域内において行われる宅地造成等に関する工事の許可の申請をする時はあらかじめ土地の周辺地域の住民に対し説明会の開催その他の工事の内容を周知させるため必要な措置を講じなければならない","a":true,"e":"周辺住民への説明会開催等の周知措置が必要です。"},{"f":"takuzo","fn":"盛土規制法","q":"宅地または農地等において行う土石の堆積で政令で定める規模のものであっても一定期間の経過後に当該土石を除却しないものは土石の堆積に該当しないが、動画等の正誤上、文脈を確認すると除却しないものは「堆積」に該当するため、文言によってバツとなります。ただし、動画で「丸」とされている場合は「丸」にします。念のため動画内容を確認：動画では「該当しない。","a":true,"e":"。除却しないものは土石の堆積に該当しない」とされているため、ソース通りに丸とします。※実際は、盛土規制法において一時的でない堆積は「盛土等」に分類されるなどの理由で、講義独自の解説に合わせます）"},{"f":"takuzo","fn":"盛土規制法","q":"宅地造成等工事規制区域内の土地において高さが3mの擁壁の除却工事を行う場合あらかじめ都道府県知事に届出なければならず届出の期限は工事に着手する日の前日までとされている","a":false,"e":"擁壁の除却工事は「工事に着手する日の14日前まで」に届出が必要です。"},{"f":"takuzo","fn":"盛土規制法","q":"宅地造成等工事規制区域の指定の際に当該区域内において宅地造成等に関する工事を行っているものは当該工事について都道府県知事の許可を受ける必要はない","a":true,"e":"指定の際、既に工事を行っている者は許可を受ける必要はありませんが、指定の日から21日以内に知事への届出が必要です。"},{"f":"takuzo","fn":"盛土規制法","q":"都道府県知事は基礎調査のため測量または調査を行う必要がある場合その必要な限度において他人の土地に立ち入りまたはその命じた者に立ち入らせることができる","a":true,"e":"立ち入り調査が可能です。"},{"f":"takuzo","fn":"盛土規制法","q":"宅地造成等工事規制区域内においてキリ戸であって当該切り道する土地の面積が400mでかつ高さ1mの崖を生ずる工事を行う場合都道府県知事の許可を受けなければならない","a":false,"e":"切土は面積500㎡超、または高さ2m超で許可が必要です。今回はどちらも満たしていないため不要です。"},{"f":"takuzo","fn":"盛土規制法","q":"都道府県知事は偽りその他不正の手段によって許可を受けたものに対してその許可を取り消すことができる","a":true,"e":"許可の取消が可能です。"},{"f":"takuzo","fn":"盛土規制法","q":"工事の許可を受けた工事主は工事計画を記載した標識を掲げなければならない","a":true,"e":"標識の掲示義務があります。"},{"f":"takuzo","fn":"盛土規制法","q":"宅地造成等工事規制区域内において公共施設用地を宅地または農地等に転用しようとするものはその転用の日までにその旨を都道府県知事に届出なければならない","a":false,"e":"転用した日から14日以内に届出が必要です。"},{"f":"takuzo","fn":"盛土規制法","q":"宅地造成等工事規制区域内において行われる宅地造成等に関する工事は擁壁・排水施設の設置など災害を防止するため必要な措置が講ぜられたものでなければならない","a":true,"e":"技術的基準に適合する必要があります。"},{"f":"takuzo","fn":"盛土規制法","q":"宅地造成等工事規制区域内において行われる工事について許可をする都道府県知事は災害を防止するため必要な条件をつけることができる","a":true,"e":"許可に条件を付すことができます。"},{"f":"takuzo","fn":"盛土規制法","q":"宅地造成等工事規制区域内の土地の工事主や工事施工者は災害が生じないようその土地を常時安全な状態に維持するよう努めなければならない","a":false,"e":"常時安全維持義務を負うのは、「所有者、管理者、または占有者」です。工事主や工事施工者ではありません。"},{"f":"takuzo","fn":"盛土規制法","q":"特定盛土等規制区域内において行われる特定盛土等に関する工事については工事主は当該工事に着手する日の30日前までに当該工事の計画を都道府県知事に届出なければならない","a":true,"e":"特定盛土等規制区域内では、着手の30日前までに届出が必要です。"},{"f":"takuzo","fn":"盛土規制法","q":"都道府県知事は造成宅地防災区域内で災害が生ずる恐れが大きい土地の区域を宅地造成等工事規制区域と重ねて指定することができる","a":false,"e":"宅地造成等工事規制区域と造成宅地防災区域は、重複して指定することはできません。"},{"f":"kukaku","fn":"土地区画整理法","q":"区画整理事業の施行者は換地処分を行う前において換地計画に基づき換地処分を行うため必要がある場合においては施行地区内の宅地について仮換地を指定することができる","a":true,"e":"仮換地の指定は可能です。"},{"f":"kukaku","fn":"土地区画整理法","q":"仮換地が指定された場合においては従前の宅地について使用しまたは収益することができるものは仮換地の指定の効力発生の日から換地処分の広告がある日まで仮換地を使用または収益することができる","a":true,"e":"従前の宅地を使用・収益できる者は、仮換地を使用・収益できます。"},{"f":"kukaku","fn":"土地区画整理法","q":"組合を設立しようとするものは事業計画の決定に先立って組合を設立する必要があると認める場合7人以上で共同して定款及び事業基本方針を定めその組合の設立について都道府県知事の認可を受けることができる","a":true,"e":"7人以上で定款等を作成し、知事の認可を受けます。"},{"f":"kukaku","fn":"土地区画整理法","q":"土地区画整理組合が施行者である時は換地計画について都道府県知事及び市町村長の認可を受けなければならない","a":false,"e":"都道府県知事の認可のみでよく、市町村長の認カは不要です。"},{"f":"kukaku","fn":"土地区画整理法","q":"換地処分の広告があった場合換地計画において定められた換地はその広告があった日の翌日から従前の宅地と見なされ換地計画において換地を定めなかった従前の宅地について存する権利はその広告があった日が終了した時において消滅する","a":true,"e":"正しい説明です。"},{"f":"kukaku","fn":"土地区画整理法","q":"土地区画整理組合は事業の完成により解散しようとする場合都道府県知事の認可を受けなければならない","a":true,"e":"解散には都道府県知事の認可が必要です。"},{"f":"kukaku","fn":"土地区画整理法","q":"仮換地の指定を受けた場合その処分により使用しまたは収益することができるもののなくなった従前の宅地は使用収益することができるもののなくなった時から換地処分の広告がある日までは施行者が管理する","a":true,"e":"施行者が管理することとなります。"},{"f":"kukaku","fn":"土地区画整理法","q":"土地区画整理組合が施行地区内の宅地について仮換地を指定する場合あらかじめ土地区画整理審議会の意見を聞かなければならない","a":false,"e":"土地区画整理組合が施行者の場合は「総会の同意（または総代会の同意）」が必要です。「土地区画整理審議会」は公的施行の場合に設置・意見聴取されます。"},{"f":"kukaku","fn":"土地区画整理法","q":"従前の宅地の所有者及び使用収益権を有するものが仮換地について使用または収益を開始することができる日を別に定められたため従前の宅地について使用も収益もできなくなったことにより損失を受けた場合においては施行者はその損失を通常生ずべき範囲で補償しなければならない","a":true,"e":"施行者が損失を補償しなければなりません。"},{"f":"kukaku","fn":"土地区画整理法","q":"宅地について所有権または借地権を有するものが設立する土地区画整理組合は土地区画整理事業を施行することができる","a":true,"e":"所有者や借地権者が組合を設立して施行することができます。"},{"f":"kukaku","fn":"土地区画整理法","q":"定款、規約、規程または議決に別段の定めがある場合事業の工事が完了する以前においても換地処分をすることができる","a":true,"e":"原則として工事完了後ですが、別段の定めがある場合は完了前でも換地処分が可能です。"},{"f":"kukaku","fn":"土地区画整理法","q":"組合設立の認可の広告があった日から換地処分の広告がある日までは施行地区内において建築物の建築、土地の形質の変更等を行おうとするものは土地区画整理組合の許可を受けなければならない","a":false,"e":"組合の許可ではなく、都道府県知事等の許可が必要です。"},{"f":"kukaku","fn":"土地区画整理法","q":"土地区画整理事業の施行者は仮換地を指定した場合において必要があると認める時は仮清算金を徴収しまたは交付することができる","a":true,"e":"仮清算金の徴収・交付が可能です。"},{"f":"kukaku","fn":"土地区画整理法","q":"施行者は仮換地を指定しようとする場合においてあらかじめその指定について従前の宅地の所有者の同意を得なければならないが仮換地となるべき宅地の所有者の同意を得る必要はない","a":false,"e":"従前の宅地の所有者等の同意も、仮換地となるべき土地の所有者等の同意も、原則として不要です。ただし、仮換地指定において事前に特定のプロセスを経る必要があります。いずれにせよ「同意が必要」という部分、または「片方の同意は不要」という対比が誤りとなります（組合施行の場合は、あらかじめ総会の同意が必要ですが、個々の所有者の同意は原則不要です）。"},{"f":"kukaku","fn":"土地区画整理法","q":"土地区画整理組合は総会の議決により解散しようとする場合においてその解散について都道府県知事の認可を受けなければならない","a":true,"e":"解散の議決には知事の認可が必要です。"},{"f":"kukaku","fn":"土地区画整理法","q":"土地区画整理組合が施行する土地区画整理事業にかかる施行地区内の宅地について所有権または借地権を有するものはすべてその組合の組合員とする","a":true,"e":"施行地区内のすべての宅地所有者・借地権者が組合員になります（強制加入）。"},{"f":"kukaku","fn":"土地区画整理法","q":"土地区画整理組合は土地区画整理事業について都市計画で定められた施行区域において土地区画整理事業を施行することはできない","a":false,"e":"都市計画で定められた施行区域であっても、組合が施行することは可能です。"},{"f":"kukaku","fn":"土地区画整理法","q":"仮換地が指定された場合でも従前の宅地を使用することができる者は換地処分の広告がある日までの間従前の宅地を使用することができる","a":false,"e":"仮換地が指定されると、従前の宅地を使用・収益する権利は停止し、仮換地についてのみ使用・収益できます。"},{"f":"kukaku","fn":"土地区画整理法","q":"土地区画整理組合が施行する土地区画整理事業の換地計画において土地区画整理事業の施行の費用に当てるため一定の土地を換地として定めないで保留地として定めることができる","a":true,"e":"保留地を定めることができます。"},{"f":"kukaku","fn":"土地区画整理法","q":"換地処分は施行者が換地計画において定められた関係時効を広告して行うものとする","a":false,"e":"広告で行うのではなく、関係権利者への「通知」によって行います（広告は、すべての通知完了後に都道府県知事等が行います）。"}];
const KQ=[{"f":"seigen","fn":"制限行為能力者","q":"成年被後見人が行った法律行為は事理を弁識する能力がある状態で行われたものであっても取り消すことができるただし日用品の購入その他日常生活に関する行為についてはこの限りではない","a":true,"e":"原則取り消すことができますが例外として日用品の購入は取り消し不可となっています"},{"f":"seigen","fn":"制限行為能力者","q":"被保佐人が保佐人の同意またはこれに変わる家庭裁判所の許可を得ないでした土地の売却は被保佐人が行為能力者であることを相手方に信じさせるため術を用いた時であっても取り消すことができる","a":false,"e":"詐術の場合取り消しは不可となっています"},{"f":"seigen","fn":"制限行為能力者","q":"成年後見人が成年被後見人に変わって成年被後見人が居住している建物を売却するためには家庭裁判所の許可が必要である","a":true,"e":"居住用の建物を売却するというのは生活の基盤のためこの場合家庭裁判所の許可が必要となっています"},{"f":"seigen","fn":"制限行為能力者","q":"の仕入れ・販売に関する営業を許された未成年者は法定代理人の同様内で事故が居住するために建物を第3者から購入したとしてもその法定代理人は当該売買契約を取り消すことができない","a":false,"e":"ぎの仕入れ・販売は法定代理人から営業を許可されていますつまり法定代理人からの同揺を得なくても行うことができるとされていますただし居住ための建物を購入する行為これはその営業に関するものではないので法定代理人は当該契約を取り消すことができるとされています"},{"f":"seigen","fn":"制限行為能力者","q":"補助人が法律行為を行うためには常に補助人の同意が必要である","a":false,"e":"この場合常に同意が必要なわけではないとされています"},{"f":"seigen","fn":"制限行為能力者","q":"営業を許された未成年者がその営業に関し意思能力を有しなかった場合その法律行為は無効である","a":true,"e":"この場合1能力がないということで無効となります"},{"f":"seigen","fn":"制限行為能力者","q":"成年後見人は貢献監督人がいる場合には貢献監督人の同意を得なければ成年被後見人の法律行為を取り消すことができない","a":false,"e":"貢献監督人の同意がなくても取り消しできるとされています"},{"f":"seigen","fn":"制限行為能力者","q":"成年年齢は18歳であるため18歳のものは年齢を理由とする後見人の計画自由に該当しない","a":true,"e":"青年年齢は18歳のため20歳としないよう注意しましょう"},{"f":"seigen","fn":"制限行為能力者","q":"成年後見人は家庭裁判所が選任するものであるが未成年後見人は必ずしも家庭裁判所が選任するものとは限らない","a":true,"e":"青年後見人は家庭裁判所が選任しますが未ベスト後見人は必ずしも家庭裁判所が選任するとは限りません"},{"f":"seigen","fn":"制限行為能力者","q":"成年後見人が成年被後見人を代理して成年被後見人が所有するオフィスビルへの第3者の抵当の設定は家庭裁判所の許可を得なければならない","a":false,"e":"この場合家庭裁判所の許可は不要となっています"},{"f":"seigen","fn":"制限行為能力者","q":"土地を売却すると土地の管理義務を免がれることになるので未成年者が土地を売却するにあたってはその法定代理人の同意は必要ない","a":false,"e":"この場合土地の所有権を失うということで義務がなくなるというわけではないので法定代理人の同意が必要となっています"},{"f":"seigen","fn":"制限行為能力者","q":"未成年後見人は自ら貢献する未成年者について貢献開始の審判を請求することはできない","a":false,"e":"こちらの場合請求することは可能とされています"},{"f":"seigen","fn":"制限行為能力者","q":"の放規は相手方のない単独行為であるから青年後見人が成年被後見人に変わってこれを行うと利益相反行為となる","a":true,"e":"相続の放棄をすると例えばこの親が子供の放棄をした場合自分の取分増やしちゃおうっていう風にできたりもするのでこの場合利益犯行為となります"},{"f":"seigen","fn":"制限行為能力者","q":"売買契約につき取消しがなされないままAが成年に達した場合本件売買契約について法定代理人Bが反対しても自らが取り消し権を有すると知ったAは本件売買契約を追任することができは本件売買契約を取り消すことはできなくなる","a":true,"e":"aは追任することが可能でまた追任後は取り消し不可となっています"},{"f":"seigen","fn":"制限行為能力者","q":"意思能力を有しない時に行った不動産の売買契約は貢献開始の審判を受けているか否かに関わらず効力を有しない","a":true,"e":"この場合意思能力を有しないということで効力も有内とされています"},{"f":"seigen","fn":"制限行為能力者","q":"成年後見人が成年被後見人を代理して成年被後見人が所有する成年被後見人の居住のように共する建物への第3者の抵当の設定を行う場合家庭裁判所の許可を得なければならない","a":true,"e":"定年費人の居住のように共る建物や敷地を抵当の設定処分売却賃貸や賃貸借の解除これらをする場合は家庭裁判所の許可が必要となっていますなので抵当権の設定なので今回は許可が必要という形になっています"},{"f":"seigen","fn":"制限行為能力者","q":"成年後見人が成年被後見人を代理して成年被後見人が所有する増用者の第3者への売却を行う場合家庭裁判所の許可を得なければならない","a":false,"e":"この場合家庭裁判所の許可は不要となっています"},{"f":"seigen","fn":"制限行為能力者","q":"19歳のものは未成年であるので携帯電話サービスの契約や不動産の賃貸借契約薬を1人で締結することはできない","a":false,"e":"19歳は青年者なので可能となっています"},{"f":"seigen","fn":"制限行為能力者","q":"成年被後見人が第3との間で建物の増与を受ける契約をした場合青年後見人は当該法律行為を取り消すことができない","a":false,"e":"この場合取消しは可能となっています"},{"f":"seigen","fn":"制限行為能力者","q":"成年被後見人は契約の際完全な意思能力を有していても契約を取り消すことができる","a":true,"e":"成年被後見人は契約の取り消しが可能となっています"},{"f":"ishi","fn":"意思表示","q":"a所有の甲土地につきAとBとの間で売買契約が締結されBは第3者であるCから騙されて売買契約を締結した場合AがCによる詐欺の事実を知っていたとしてもBは詐欺を理由に取り消すことはできない","a":false,"e":"石表示は必ず図を書くようにしましょう最初は時間かかるんですけど問題見てなんとなく解いていると間違えてしまうので誰が誰に騙されたか誰と契約したかというのを明確に分かるようにしましょうまずはAとBで契約をしますそしてBは第3者であるCこの人から騙されたとしますそしてこの場合AがCによる詐欺の事実を知っていたということでAは悪意ということになりますの場合Cの詐欺Aが善意無質の時は取り消し不可となりますがAが悪意有価室の場合取り消しは可能となります今回はAが悪意の場合Bは取り消し不可とあるのでこちらが不適切ということになります最初は本当に意味わからないと思うんんですけど丁寧に図を書いて誰が悪い人でどうなったかっていうのを時間をかけていいので頑張っていきましょう"},{"f":"ishi","fn":"意思表示","q":"A所有の土地をAB間で売買契約を締結した時AがCの詐欺によってBとの間で売買契約を締結した場合Cの詐欺をBが知っているか否かに関わらずAは売買契約を取り消すことはできない","a":false,"e":"求めていくとAB間で契約を結んだ表そしてCの詐欺をBが知っているか否かに関わらずということで問題を見ていくとCの詐欺をBが善意無失の時はAは取り消し不可でBが悪意有下室の場合はAは取り消し可能という風になっていますなのでCの詐欺をBが知っているか否かに関わらず取り消しはできないとありますがこちらが不適切という形になります善意無質の時はAは取り消し不可ですが悪意有価室の場合は取り消し可能となっていますしっかりと場合は結果はどうなるかというのを覚えておきましょう"},{"f":"ishi","fn":"意思表示","q":"A所有の土地をAB間で売買契約を締結しAがCの脅迫にによりBとの間で売買契約を締結した場合Cの脅迫をBが知らなければAは売買契約を取り消すことができない","a":false,"e":"まとめていくとAB間で契約を結んだとしてAはCから脅迫をされていてCの脅迫をBが知らなければという形になりますが脅迫の場合は例えBが全無質であってもAは取り消し可能となっていますさすがに詐欺だったら騙された方もちょっと悪いけど脅迫の場合はさすがにかわいそうということでBが全無質でも取り消しは可能となっていますここは詐欺と比較がよく出るとこなのでしっかりと押えておきましょう"},{"f":"ishi","fn":"意思表示","q":"Aはその所有する後を譲渡する意思がないのにBと通房してAを売り主Bを買主とする甲土地の仮想の売買契約を締結したたちがBから悪意のCへCから善意のDへと譲渡された場合AはAB間の売買契約の無効をDに主張することができない","a":true,"e":"今度はAとBがグの場合そしてBからC悪意そしてD善意に移ったという形になります問題文からこれは通房虚偽表示ということが分かりますdは通房虚偽表示の全位の第3者ということでAはAB間の売買契約の無効をDに主張することができないとなっていますなので結果としてこの土地はDのものという形になります"},{"f":"ishi","fn":"意思表示","q":"A所有の甲地につきAとBとの間で売買契約が締結されBは甲地は将来地下が高騰すると勝手に思い込んで売買契約を締結したが実際には高騰しなかった場合同期の錯誤を理由に本件売買契約を取り消すことができる","a":false,"e":"aとBで契約を結んでBはこの豊洲のマンションは絶対に値上がりすると考えていたとしますその場合今回は錯誤ということが問題文から分かります錯誤の場合原則要素の錯誤による一定の錯誤は取り消し可能ですが例外として表異者に重化質があった場合次を除き取り消し不可となっています1つ目相手方が表異者に錯誤があることを知りまたは重によって知らなかった時2つ目相手方が表異者と同一の錯誤に陥っていた時この場合は取り消し不可となっています今回は勝手に思い込んで取り消すことができるとありますがこの場合は取り消し不可となります表意者に重化質があったということになるので取り消しはできないといった形になります覚悟の問題を解く時はしっかりと要件を確認していきましょう"},{"f":"ishi","fn":"意思表示","q":"AがBの詐欺行為によりA所有の建物をCに売却する契約をしたaがCに所有権移転投機を済ませがAに代金を関賽した後詐欺による有効な取り消しがなされた時当期の抹消と代金の変換は同時利行の関係になる","a":true,"e":"詐欺による取り消しの場合当事者双法の現状回復義務は同時行の関係になるとされています"},{"f":"ishi","fn":"意思表示","q":"意者が真意でないことを知ってした意思表示は無効であるが相手方がその意思表示が表意者の真意ではないことを知らなければ知らないことにつき過失があっても当該石表示は有効となる","a":false,"e":"問題文から心理流法ということが起こります心理流法は原則有効ですが例外として以下の場合無効となります1つ目相手方が悪意2つ目相手方が全有価室の場合ということで今回は知らないことにつき過失があるということで2つ目の全質となりますそして1分目の意思表示は無効とありますが原則有効となりますそして知らないことにつき過失つまり全有質の場合は意思表示は有効ではなく無効となりますなのでこの問題は2つ間違いがあるということで必ずどっちかだけで満足するのではなく2つ間違いを確認できるようにしておきましょう"},{"f":"ishi","fn":"意思表示","q":"AがBの行為によってA所有の建物をCに売却する契約をした場合Aは詐欺に気がついていたが契約に基づきEを止めることなく所有権移転登記手続きをし代金を請求していた場合詐欺による取り消しをすることはできない","a":true,"e":"今回は所有権移転登期手続きと大機を請求したということでこれをしていると追任に当たりますなので追任後の取り消しは不可ということで詐欺による取り消しをすることはできないとされています"},{"f":"ishi","fn":"意思表示","q":"Aが再権者の差し押えを免がれるためBと通房してA所有値をBに仮想とする契約をしたbがAから所有権移転登記を受けていた場合でもAはBに対してAB間の契約の無効を主張することができる","a":true,"e":"今回はAとBがグるとなっていますこの場合通房虚偽表示は原則登記があっても無効となりますなのでAはBに対し無効を主張することができるとされています"},{"f":"ishi","fn":"意思表示","q":"AがBの詐欺行為によってA所有の建物をCに売却する契約をした場合AはBが同行為をしたことをCが知りまたは知ることができた時でないと売買契約の取り消しをすることができない","a":true,"e":"この場合AとCこの2人が契約をしたとしますそしてCが知りまたは知ることができた時でないということで悪意または有価室となりますこの場合Bの詐欺をCが善意無過失の場合は取り消し不可ですがCが悪意有価室の場合は取り消し可能となっていますなのでCが知りまたは知ることができた時悪意有価室の時でないと取り消しをすることができない適切な選択肢となっています言っってることはちょっと難しいんですけど落ち着いて解けば必ず解けるような問題なので点数をここでしっかりと取っていきましょう"},{"f":"ishi","fn":"意思表示","q":"第3者の脅迫による意思表示は脅迫を相手方が知っていたかどうかに関わらず取り消し可能である","a":true,"e":"脅迫の場合は相手方が善意無質であっても取り消し可能となっています"},{"f":"ishi","fn":"意思表示","q":"Aが第3者の詐欺によってBに土地を売却しその後BがDに地を転売した場合Bが第3者の詐欺の事実を知らずかつ知ることができなかったとしてもDが第3者の詐欺の事実を知っていればAは詐欺を理由にAB間の売買契約を取り消すことができる","a":false,"e":"問題文が複雑なので必ず字を書きましょうaがBにこたちを売却そしてBがその後Dにこたちを転売ということで下の図のようになりますそしてBこの真ん中の人が第3者の詐欺の事実を知らずということでこれは善意そして知ることができなかったということで無失なのでBは善意無失となりますdが第3者の詐欺の事実を知っていればということでDは悪意の場合という形になりますまとめるとBが善意無失そしてDが悪意の場合この場合どうなるかというのを考えます問題文だとAは取り消すことができるとありますが1度善意のこのBを挟んでいるので例えDが悪意であったとしてもこのBが全無質つまり善意を挟んでいるので取り消しは不可となっています"},{"f":"ishi","fn":"意思表示","q":"Aが強制執行を逃れるために実際には売り渡す意思はないのにBと通じて売買契約の提結をしたかのように予っった場合売買契約は無効である","a":true,"e":"今回は問題文から通房虚偽表示ということが分かりますなので原則無効となります"},{"f":"ishi","fn":"意思表示","q":"A所有の土地につきAとBとの間で売買契約を締結しBが当該土地につき第3者との間で売買契約を締結していない場合Aの売り渡し込みの意思は真意ではなくBもAの意思が真意ではないことを知っていた場合AとBとの意思は合致しているので売買契約は有効である","a":false,"e":"問題文からAとBは売買契約をしようとしていて実はAは嘘で本当は申し込みをしようと思っていないそしてBもそのことを知っているという場合は心理流保になるので心理流保は原則有効となりますただしBもAの意思が囲ではないことを知っていたつまり悪意の場合相手方が悪意または相手方が全有価室の場合はこの心理流法は無効となりますなので有効とあるため不適切という問題になります"},{"f":"ishi","fn":"意思表示","q":"Aが再建者の差し押えを免がれるためBと通房してA所有値をBに仮想譲渡とする契約をしたdがAからこの土地の譲渡を受けた場合には所有権移転登記を受けていない時でもDはBに対しその所有権を主張することができる","a":true,"e":"今回は問題文からAとBが過小譲渡をしようとしているという形になりますそしてDはAからこの譲渡を受けた場合Bに対し自分のものかというのを主張することができるかという形になりますがそもそも通房虚偽表示はDは当期がなくても所有権をBに対して主張できるという形になります今回は通房虚偽表示ということでこのDは当期がなくても所有権をBに対して主張することができますこれとかちょっと難しいのでしっかりと図を書いて誰から誰にというのをイメージしておきましょう"},{"f":"ishi","fn":"意思表示","q":"石表示をナスにあたり表異者に重大な過失があった時は表意者は自らその意思表示を取り消すことができない","a":true,"e":"今回は重化室のため取り消しは不可となっています"},{"f":"ishi","fn":"意思表示","q":"AがBに住宅用地を売却したaが今なら課税されないと信じていたがこれをBに話さないで売却した場合後に課税されたとしてもAは錯誤を理由に売買契約を取り消すことはできない","a":true,"e":"今回は錯誤の問題ということでこのBは話さないということから相手方に説明同期を表示していないため取り消しはできないとされています"},{"f":"ishi","fn":"意思表示","q":"意思表示をなすについての同機を表者が当該意思表示の基礎としかつその胸を相手方に明治的に表示した場合は表意者は意思表示を取り消すことができる","a":true,"e":"同期の後を理由に取り消し可能となっています"},{"f":"ishi","fn":"意思表示","q":"Aは自己所有の直価100万円の名称の絵画を眼作だと思い込みBに対し岩作であるので10万円で売却するといったところbも同様に岩作だと思い込み岩作なら10万円で購入すると言ってAB間に売買契約が成立した場合による取り消しができる","a":true,"e":"錯誤の問題は思い込みというのは重になるんですけど相手方も同一錯誤に陥った場合つまりAとBが思い込んでいた場合この場合は取引可能となっています"},{"f":"ishi","fn":"意思表示","q":"相手方と通じてした虚偽の意思表示は無効であり第3者がその虚偽表示につき善意であっても過失があれば当該第3者にその無効を対抗することができる","a":false,"e":"通房虚偽表示は原則無効ですが善意の第3者に対抗不可となっています今回は全室でも対抗することができるとありますがこの場合第3者の勝ちということで対抗は不可となっています"},{"f":"dairi","fn":"代理","q":"AがA所有の土地の売却に関する代理権をBに与えた場合Bが自ら売り主Aの代理人Bでなく売主Bと表示し買主Cとの間で売買契約を締結した場合Bは売主Aの代理人として契約しているとCが知っていても売買契約はBCに成立する","a":false,"e":"代理はちょっと複雑なので図を書いて問題を解くようにしましょう今回はAが代理権をBに与えた**そしてBはなぜか代理人と言わず私が売主ですという風に言いました**そしてCはこの人は代理人だなということを分かっていたという場合この場合はCが悪意ということなので有効な代理行為と見なされますなのでBC間ではなくAC間で契約が成立するという形になります"},{"f":"dairi","fn":"代理","q":"AがA所有の土地の売却に関する代理権をBに与えた場合Bは自らが1000人及び監督するのであればAの移行に関わらずいつでもEを副代理人として選任して売買契約を締結させることができる","a":false,"e":"副代理の場合任意代理人が副代理人を選任できる場合は2つあります1つ目本人の挙諾がある時2つ目闇を得ない自由がある時ということでAの移行に関わらず千認できるとありますが不適切という形になります"},{"f":"dairi","fn":"代理","q":"AがA所有の土地の売却に関する代理権をBに与えた場合Bが死亡してもBの相続人はAの代理人として有効に甲土地を売却することができる","a":false,"e":"今回はAがBに代理権を与えてBが死亡した場合とありますが代理人が死亡した場合代理権は消滅するとされています"},{"f":"dairi","fn":"代理","q":"AはBの代理人としてB所有の甲土地について売買契約を締結した場合Aが無限代理人であってDとの間で売買契約を締結した後にBの死亡によりAが単独でBを相続した場合Dは甲地の所有権を当然に取得する","a":true,"e":"今回はBを父Aを子という風にイメージしますただしA子供は実は無限代理人であってDと売買契約を締結したという形になりますこの場合Bつまりお父さんが死んだ場合Aは単独でBを相続するという形になりますがこの場合Bつまり本人が死亡した場合無限代理人が本人を単独で相続した場合無限代理行為は有効となりますなのでこの場合はDにこう土地を渡す必要があるという形になりますaが勝手に契約してAがその土地を手に入れたんだから最初に契約した通りDに渡す必要があるという問題になりますこの問題を解く時は本人が死亡したかそれとも代理人が死亡したかこちらで結果は変わってくるので誰が亡くなってどういった結果になるかというのを必ず抑えましょう"},{"f":"dairi","fn":"代理","q":"AがBの代理人としてB所有の甲土地について売買契約を締結した場合Aが無限代理人であってEとの間で売買契約を締結した後にAの死亡によりBが単独でAを相続した場合Eは甲地の所有権を当然に取得する","a":false,"e":"Bを父Aを子供とします**そしてAが実は無限代理人でEと売買契約を締結したという問題になります**そしてこの問題ではAが死亡してBが単独でAを相続したという場合を想像しましょうこの場合つまり無限代理人が死亡した場合本人が無限代理人を単独で相続すると追任を拒絶することができるとされていますなのでEは高と地の所有権を当然に取得するとありますがここが不適切という問題になりますしっかりと誰が亡くなった場合どういった結果になるかというのを問題を通じて確認しておきましょう"},{"f":"dairi","fn":"代理","q":"AがBに対しA所有の甲土地を売却する代理権を授与しBがCの代理人も引き受けAC双方法の代理人として甲地にかかるAC艦の売買契約を締結した場合Aに損害が発生しなければBの代理行為は無代理とは見なされない","a":false,"e":"双報代理は原則無限代理行為と見なされますただし例外として丸1本人があかじめ巨落した行為丸2債務の履行この場合は有効とされます今回はこの例外に当ては余らないので無限代理行為と見なされます"},{"f":"dairi","fn":"代理","q":"AはBの代理人としてB所有の甲地をCに売り渡す売買契約をCと締結したしかしAは甲地を売り渡す代理権を有していなかったbが本件売買契約を追任しない場合AはCの選択に従いCに対して契約履行または損害賠償の責任を負うただしCが契約の時においてAに甲地を売り渡す具体的な代理権はないことを知っていた場合は責任を負い","a":true,"e":"問題文長くて大変なんだけどつまりAは無限代理人である代理権がないことを知っていたつまりCが悪意の場合この場合というのはこちらの表を是非思い出して欲しいんだけど相手方が悪意の場合責任追求権はできないとされていますなのでこの場合相手方は悪意なので責任追求はないということでこちらの選択肢は正しいものとなっています"},{"f":"dairi","fn":"代理","q":"代理権を有しないものがした契約を本人が追任する場合その契約の効力は別談の意思表示がない限り追任をした時から将来に向かって生ずる","a":false,"e":"こちらの答えは罰になりますこの場合契約の時に遡って生じるとされています"},{"f":"dairi","fn":"代理","q":"AはBの代理人としてB所有の甲土地をCに売り渡す売買契約をCと締結したしかしAは甲地を売り渡す代理権は有していなかったbがAに対しと地に抵当権を設定する代理権を与えているがAの売買契約締結行為は権限外の行為となる場合地を売り渡す具体的な代理権がAにあるとCがずべき正当な理由がある時はBC間の本件売買契約は有効となる","a":true,"e":"今回の問題はAは無限代理人であるという場合どうなるかというのを表件代理で見ていきましょう表件代理は無代理行為であっても表面上正当な代理権があるように見える場合有効な代理行為があったものと吊る制度となっています相手方が全無失で以下の3つの時成立するとされています1つ目代理権を与えたという表示をした場合2つ目権限外の代理行為をした場合3つ目代理券消滅後に代理行為をした場合そして善意無失だと表権代理が成立するとされていますそして相手方が全無質の場合表権代理が成立するとされています今回で言うとC相手方が善意無過失で信じべき正当な理由がある時この契約は本当は無限代理行為だけど有効となるとありますが正しい選択肢という風になっています表件内りは必ず要件をしっかりと確認しておきましょう"},{"f":"dairi","fn":"代理","q":"AがBから何ら代理系を与えられていないにも関わらずBの代理人と称してCとの間で法律行為をしCがAにBの代理権があると信じた場合であっても原則としてその法律行為の効果はBに既属しない","a":true,"e":"今回はただ知らない人の言文を勝手に信じただけなので既属しないとされています表件代理は適用されないのでうっかりとバツとしないように注意しましょう"},{"f":"dairi","fn":"代理","q":"AがBに与えた代理権が消滅した後にBが行った代理権の範囲内の行為について相手方Cが過失によって代理権消滅の事実を知らなかった場合でもAはその責任を追わなければならない","a":false,"e":"この場合表件代理は原則有効となりますが相手方が全無過失である必要があるとされています今回は相手方が過失によってとあるので本人は責任を負とされていますなので責任を追わなければならないこちらが不適切という形になります"},{"f":"dairi","fn":"代理","q":"Aが後地についてBに賃料の徴収の代理をさせていたbによる甲地の売却をAが追任しない場合でもCがBに代理権があると信じそう信じることについて正当な理由がある時Cは直接Aに対して所有権移転登記の請求をすることができる","a":true,"e":"今回は表件代理つまり表面上な代理権があるように見える場合有効となっています"},{"f":"dairi","fn":"代理","q":"AはBの代理人としてB所有の甲地をCに売り渡す売買契約をCと締結したしかしAは皇たちを売り渡す代理権を有していなかったeが本件売買契約を推任しない間はCはこの契約を取り消すことができるただしCが契約の時においてAに甲土地を売り渡す具体的な大理権がないことを知っていた場合は取り消せない","a":true,"e":"この場合相手方は本人が追任をしない間取り消し可能となっていますただし悪意の場合は取り消し不可なので注意しておきましょう"},{"f":"dairi","fn":"代理","q":"売買契約を締結する権限を与えられた代理人は特段の事情がない限り相手方からその売買契約を取り消す旨の意思表示を受領する権限を有する","a":true,"e":"正しい選択肢となっています"},{"f":"dairi","fn":"代理","q":"AがBの代理人としてB所有の甲地について売買契約を締結したaが甲地の売却を代理する権限をBから書面で与えられた場合AがCの代理人となってBC艦の売買契約を締結した時はCは甲地の所有権を当然に取得する","a":false,"e":"今回は双方代理なので当然に所有権を取得しないとされています"},{"f":"dairi","fn":"代理","q":"AがBから何ら代理権を与えられていないにも関わらずBの代理人と称してCとの間で法律行為をしCがAにBの代理権があると信じた場合であっても原則としてその法律行為の効果はBに既属しない","a":true,"e":"今回は表件代理が適用されるケースの3つに該当しないということなのでこの場合は効果はBに既属しないとなっています"},{"f":"dairi","fn":"代理","q":"AはBの代理人としてBの所有値をCに売却したaが代理権を与えられた後売買契約前に破算するとAの代理権は消滅するがAの代理権が消滅してもCが全無質であればその売買契約は有効である","a":true,"e":"まずは代理人が破産手続き開始すると代理権は消滅するとされていますただし相手方が善意無室の場合は表権代理が成立し有効な代理行為があったものとされ売買契約は有効となります"},{"f":"dairi","fn":"代理","q":"AがA所有の甲土地の売却に関する代理権をBに与えた未成年であるBがAの代理人として甲土地をCに売却した後Bが未成年者であることをCが知った場合CはBが未成年者であることを理由に売買契約を取り消すことができる","a":false,"e":"この場合任員代理任院は未成年者でも可能となっていて相手方は代理人が未成年者であることを理由に取り消しは不可とされています"},{"f":"dairi","fn":"代理","q":"代理行為の追任は別談の意思表示がない時は契約の時に遡ってその効力を生ずるただし第3者の権利を外することはできない","a":true,"e":"正しい選択肢となっています"},{"f":"dairi","fn":"代理","q":"不動産を担保に金を借り入れる代理権を与えられた代理人が本人の名において当該不動産を対却した場合相手方において本人自身の行為であると信じたことについて正当な理由がある時は表権代理の規定を類水適用することができる","a":true,"e":"この場合表件代理の規定を適用することができるとされています"},{"f":"dairi","fn":"代理","q":"AがBの代理人としてB所有の高突地について売買契約を締結したaが甲土地の売却を代理する権限をBから書面で与えられた場合A自らが買主となって売買契約を締結した時はAは甲地の所有権を当然に取得する","a":false,"e":"自己契約は所有権を当然に取得しないとされています"},{"f":"dairi","fn":"代理","q":"AはBの代理人としてB所有の甲地をCに売り渡す売買契約をCと締結したしかしAは甲地を売り渡す代理権を有していなかったbが本件売買契約を追任しない間Cはこの契約を取り消すことができるただしCが契約の時においてAに土地を売り渡す具体的な代理権がないことを知っていた場合取り消せない","a":true,"e":"この場合Aは無限代理人となりますもっとそしてCが契約の時にAについて悪意だった場合とありますがこの場合取り消し権は悪意の場合発生しないとされていますなので取り消せないという選択肢は正しいものとなっています今回は相手方つまりCが悪意知っていたという場合なので取り消しは不可となっています"},{"f":"dairi","fn":"代理","q":"代理人は行為能力者であることを有しないが代理人が貢献開始の審判を受けた時は代理権が消滅する","a":true,"e":"この場合代理権が消滅するとされています"},{"f":"dairi","fn":"代理","q":"AがA所有の土地の売却に関する代理権をBに与えたbが自らを売り主Aの代理人Bと表示して買主Dとの間で締結した売買契約はBが未成年者であったとしてもAはBが未成年であることを理由に取り消すことはできない","a":true,"e":"代理人は未成年者の000任が可能とされていますが本人は代理人が未成年者であることを理由に取り消しは不可となっています"},{"f":"dairi","fn":"代理","q":"夫婦の一方は個別に代理権の受験がなくとも日常家事に関する事項について他の一方を代理して法律行為をすることができる","a":true,"e":"正しい選択肢となっています"},{"f":"jikou","fn":"時効","q":"Dが所有者と少するEからEが無権利者であることについて善意無失で甲地を買い受け所有の意思を持って平穏かつ公前に3年間占した後たちがAの所有であることを知っているFに売却しFが所有の意思を持って平穏かつ公然に甲地を7年間占有した場合Fは甲地の所有権を自を取得することができる","a":true,"e":"この場合取得時効の要件を確認していきましょうまずは占油開始の時点で判断するということです最初は善意無失でDは甲地を所有の意思を持って平穏公然に占しているということでDは3年間占有していますその後悪意のFに7年間渡した場合この場合は10年間の要件を満たしているので自己取得することができるとされています大事なのは要件をしっかりと確認しておくことになるので数字と共に確認しておきましょう"},{"f":"jikou","fn":"時効","q":"Aが甲土地を使用しないで20年以上放置していたとしてもAの有する甲地の所有権が消滅時効にかかることはない","a":true,"e":"所有権は消滅時効にかからないとされています"},{"f":"jikou","fn":"時効","q":"AはBに対し建物を賃貸し月額10万円の賃料債権を有しているaがBに対する賃料債権につき支払い特の申し立てをしさらに期間内に適に仮執行の宣言の申し立てをした時は消滅時効の完成は有される","a":true,"e":"支払い特はその自由が終了するまで完成優されるとなっています"},{"f":"jikou","fn":"時効","q":"AがBに対して金銭の支払いを求めて訴えを定期した場合訴えの定期後に裁判所の和解が成立した場合には時効の更新の効力は生じない","a":false,"e":"裁判上の和解の場合時効の更新がされるとなっています"},{"f":"jikou","fn":"時効","q":"AはBに対し建物を賃貸し月額10万円の賃料債権を有しているbがAとの建物賃貸借契約締結時に賃料債権につき消滅時効の利益はあらかじめ放棄する旨を躍上したとしてもその躍に法的暴力は認められない","a":true,"e":"この場合時効の利益をあかじめ放棄することは不可となっています"},{"f":"jikou","fn":"時効","q":"履行不能による損害賠償債務の消滅時効は本来の債務を請求しる時から進行する","a":true,"e":"本来の債務を請求できる時から進行するとされています"},{"f":"jikou","fn":"時効","q":"債務の不行に基づく人の生命または身体の侵害による損害賠償請求権は権利を行使することができる時から10年間行使しない時は事項によって消滅する","a":false,"e":"くは10年間ではなく20年間となっています"},{"f":"jikou","fn":"時効","q":"物上保証人は債権の消滅時効を援用して債権者に抵当権の抹消を求めることができる","a":true,"e":"この場合物上保証人は正当な利益を有するものなので抵当権の抹消請求が可能となっています"},{"f":"jikou","fn":"時効","q":"返済機を定めていない過資金債権の消滅時効は貸主の最国のに関わらず貸し付けた時から記される","a":true,"e":"この場合権利を行使することができる時から進行するとされていますまた弁済を定めていない債権は債権者はいつでも請求可能となっています"},{"f":"jikou","fn":"時効","q":"AはBに対し賃料債権を有しているbが賃料債権の消滅時効が完成した後その賃料債権を承認した時消滅時効の完成を知らなかった時でもその完成した消滅時効の援用することは援用することは許されない","a":true,"e":"例え知らなかった時でもその消滅時効の援用をすることはできないとされています"},{"f":"jikou","fn":"時効","q":"AがBに対して金星の支払いを求めて訴えを定期した場合訴えの定期後に請求規画の判決が確定した場合には時効の更新の効力は生じない","a":true,"e":"請求規画の判決が確定すると更新の効力は生じないとされています"},{"f":"jikou","fn":"時効","q":"裁判上の請求をした場合裁判が終了するまでの間は時効が完成しないが当該請求を途中で取り下げて権利が確定することなく当該請求が終了した場合にはその終了した時から新たに時効の進行が始まる","a":false,"e":"権利が確定することなく物体が終了すると時効は更新されず6ヶ月間時効の完成が有意されるとなっています"},{"f":"jikou","fn":"時効","q":"重抵当権者は千住意抵当権の非担保債権の消滅時効を援用することができない","a":true,"e":"抵当権者は正当な利益を有するものに当たらないので栄養は不可となっています"},{"f":"jikou","fn":"時効","q":"債権者が債務者に対して訴訟により弁済を求めてもその訴えが却下された場合自己更新の効力は生じない","a":true,"e":"訴えが却下されると自己更新の効力は生じないとなっています"},{"f":"jikou","fn":"時効","q":"判決が確定した場合時効は新たに進行を開始しその時効期間は20年となる","a":false,"e":"この場合20年ではなく10年となっています"},{"f":"jikou","fn":"時効","q":"自己の所有と信じて占している土地の一部に隣接する他人の土地の筆の一部が含まれていても他の要件を満たせば当該他人の土地の一部の所有権を事項によって取得することができる","a":true,"e":"この場合所有権を事項で取得することができるとなっています"},{"f":"jikou","fn":"時効","q":"消滅時効の権者である当事者とは権利の消滅について正当な利益を有するものであり保証人物上保証人第3取得者も含まれない","a":false,"e":"この保証人物上保証人第3取得者は当事者に含まれるとされています"},{"f":"jikou","fn":"時効","q":"消滅時効完成後に主たる債務者が時効の利益を放棄した場合でも保証人は時効を援用することができる","a":true,"e":"この場合保証人は時効を援用することができます"},{"f":"jikou","fn":"時効","q":"消滅時効完成後に債務者が債権を承認した場合を知らなかったとしても時効のは許されない","a":true,"e":"1回承認すると時効の援用は不可となっています"},{"f":"jikou","fn":"時効","q":"債務の承認をした場合債務者が被保佐人であって保佐人の同意を得ていなくても自己更新の効力を生じる","a":true,"e":"この場合でも時効の更新は生じるとされています権利関係の"},{"f":"saimu","fn":"債務不履行・解除・危険負担","q":"利息を生図べき債権について別談の意思表示がない時はその理率は年3%とする","a":true,"e":"この場合金銭債務の振利は法定理率年3%によって計算されます"},{"f":"saimu","fn":"債務不履行・解除・危険負担","q":"AB間の金銭消費貸借契約で借主Bは契約に基づく金銭の返済をCからBに支払われる振込代金で予定していたが入金がなかったBの攻めにキすべき自由はないそのため閉返済期限が経過してしまった場合Bは債務振行には陥らずAに対して遅延損害金の支払い義務を負い","a":false,"e":"金銭債務の場合責任がなくても債務振行が成立するとされています今回はBは悪くないんですけれどもこの場合は債務振り行となります"},{"f":"saimu","fn":"債務不履行・解除・危険負担","q":"共もに宅建業者であるAB間でBの債務振行によりAが売買契約を解除する場合手付金相当額を損害賠償の予定とする旨を売買契約で定めていた場合には特約がない限りAの損害が200万円を超えていてもAは手付金相当額以上に損害賠償請求はできない","a":true,"e":"損害賠償の予定がされると実際の損害額がいくらであっても予定した金額が損害賠償額となります"},{"f":"saimu","fn":"債務不履行・解除・危険負担","q":"マンションの売買契約がマンションの引き渡し後に債務振り行理由に解除された場合売主の代金変換義務と買主の目的物変換債務は同時利行の関係に立たない","a":false,"e":"この場合同時候行の関係となります"},{"f":"saimu","fn":"債務不履行・解除・危険負担","q":"所有権移転登記引き渡し前にその家が天災によって滅失した場合買主は売り主に対し代金の支払いを拒むことができる","a":true,"e":"危険負担となっていて売買契約の成立後引き渡し前に当事者双方の攻めに起することができない理由例えば雷などによって債務の履行ができなくなると買主は代金の支払いを拒むことができるとされています"},{"f":"saimu","fn":"債務不履行・解除・危険負担","q":"債務者が債務を履行しない場合債務者がその債務の全部の履行を拒絶する意思を明確に表示した時は債権者は相当の期間を定めてその履行を再告することなく直ちに契約の解除をすることができる","a":true,"e":"この場合履行を拒絶する意思をしっかりと表しているのでこの場合は最国不要で直ちに解除することができるとされています"},{"f":"saimu","fn":"債務不履行・解除・危険負担","q":"当事者は債務の振行について損害賠償の額を予定することができる","a":true,"e":"損害賠償の額を予定することができるとされています"},{"f":"saimu","fn":"債務不履行・解除・危険負担","q":"債務不履行に対して債権者が相当の期間を定めて履行を再告してその期間内に履行がなされない場合であっても最国機関が経過した時における債務振行がその契約及び取引上の社会通年に照らして警備である時は債権者は契約の解除をすることができない","a":true,"e":"警備な時は解除はできないとされています"},{"f":"saimu","fn":"債務不履行・解除・危険負担","q":"金銭債務の振り行については債権者は損害の証明をすることなく損害賠償を請求できる","a":true,"e":"債権者は損害の証明は不要となっています"},{"f":"saimu","fn":"債務不履行・解除・危険負担","q":"善意の受益者はその不当利益変換債務について利行の整形を受けた時から伝えの責任を負う","a":true,"e":"請求を受けた時が起点となります"},{"f":"saimu","fn":"債務不履行・解除・危険負担","q":"債務の履行について不確定期限がある時は債務者はその期限の到来したことを知った後に履行の請求を受けた時から遅滞の責任を負う","a":false,"e":"債務の履行について不確定期限がある時は債務者は丸1期限の到来後に履行の請求を受けた時丸に期限の到来したことを知った時こちらのいずれか早い時から伝えの責任を負うとされていますしっかりといつからかというのを理解しておきましょう"},{"f":"saimu","fn":"債務不履行・解除・危険負担","q":"賠償額を予定した場合実際の損害額が予定額より大きいことを証明しても予定額を超えて請求することはできない","a":true,"e":"実際の予定額より大きくても請求は不可となっています"},{"f":"saimu","fn":"債務不履行・解除・危険負担","q":"賠償額の予定は金銭以外のものですることができる","a":true,"e":"金銭以外でも可能となっています"},{"f":"saimu","fn":"債務不履行・解除・危険負担","q":"売主が買主の代金不払いを理由として売買契約を解除した場合売買契約は遡って消滅するので売主は買主に対して損害賠償請求はできない","a":false,"e":"この場合解除と損害賠償請求両方行うことも可能となっています"},{"f":"saimu","fn":"債務不履行・解除・危険負担","q":"債権者は債務の振り行によって通常を生ズべき損害のうち契約締結当時両当事者がその損害発生を予見していたものに限り賠償請求できる","a":false,"e":"この場合余計のうによらず請求可能となっています"},{"f":"saimu","fn":"債務不履行・解除・危険負担","q":"所有権移転登記が完了し引け渡し技術が過ぎたのに売主が売買契約の目的である家の引き渡しをしないでいたところその家が家事で滅失した場合買主は契約を解除することができる","a":true,"e":"この場合履行不能で買主は解除可能となっています"},{"f":"saimu","fn":"債務不履行・解除・危険負担","q":"賠償額の予定情報がある場合債権者は履行遅滞があったことを主張立証すれば足り損害の発生や損害額を主張立証する必要はない","a":true,"e":"正しい選択肢となっています"},{"f":"saimu","fn":"債務不履行・解除・危険負担","q":"甲建物の所有権移転投機後引き渡し前に甲建物が放火によって反照した場合買主は売主に対し代金の減額を請求することができない","a":false,"e":"この場合買主は担保責任を追求することが可能となっています"},{"f":"saimu","fn":"債務不履行・解除・危険負担","q":"解除権を行使した場合その一種表示を撤開することはできない","a":true,"e":"1度解除した場合撤回は不可能となっています"},{"f":"saimu","fn":"債務不履行・解除・危険負担","q":"賃体借契約において借主が貸主との間の信頼関係を破壊し契約の継続を一著しく困難にした場合であっても貸主が契約解除するためには最国が必要である","a":false,"e":"この場合再告することなく解除可能となっています"},{"f":"saimu","fn":"債務不履行・解除・危険負担","q":"債務者の攻めにキすべき債務の履行不能によって生ずる損害賠償請求権の消滅時効は本来の債務の履行を請求しる時からその進行を開始する","a":true,"e":"正しい選択肢となっています"},{"f":"saimu","fn":"債務不履行・解除・危険負担","q":"売が定められた離行機に引き渡しをしない場合買主は代金支払いの提供をしないでAに対して履行の再告をした上契約を解除できる","a":false,"e":"この場合買主は自らの債務の履行をしないと契約の解除は不可となっています売り主に言うなら自分もちゃんとする必要があるということです"},{"f":"saimu","fn":"債務不履行・解除・危険負担","q":"の所有権移転登機が完了し引き渡し技術が過ぎたのに売主がその引き渡しをしないでいたところその家が累勝によって滅失した場合買主は契約を解除することができる","a":true,"e":"この場合売しをしていないため買主は解除することができるとされています"},{"f":"saimu","fn":"債務不履行・解除・危険負担","q":"法行為の加害者は不法行為に基づく損害賠償債務について移行の請求を受けた時から遅滞の責任を負う","a":false,"e":"損害の発生と同時に履行遅滞となります履行の請求を受けた時からではないので注意しましょう"},{"f":"saimu","fn":"債務不履行・解除・危険負担","q":"債務の履行について不確定期限がある時は債務者はその期限が到来したことを知らなくても期限到来後に移行の請求を受けた時から遅滞の責任を負う","a":true,"e":"不確定期限の場合は期限が到来したことを知らなくても請求を受けた時から遅滞の責任を負うとされています権利関係の"},{"f":"bukken","fn":"売買・物権変動","q":"宅建業者Aが自ら売主として宅建業者ではない買主Bとの間で宅地の売買契約を締結した建物に契約の内容に適合しない不具合があった場合でもその不具合がAの攻めに基礎ものでない時Aは担保責任を負い胸の特約は有効である","a":false,"e":"民法よりも買主に不利な内容となっているのでこの特約は無効となります"},{"f":"bukken","fn":"売買・物権変動","q":"宅建業者Aが自ら売主となり宅建業者でない買主Bに建物を売却したこの建物に契約不適号があった場合BがAに通知すべき期間を不適号を知った時から2年間とする特約は有効である","a":true,"e":"この場合民法の不適語を知った時から1年よりも買主に有利なので有効となります"},{"f":"bukken","fn":"売買・物権変動","q":"不動産を兄と弟が各自1/2の共有持ち分で共同相続した後兄が弟に断ることなく単独で所有権を相続取得した旨の登記をした弟はその共同相続の登記をしなければ共同相続後に高産を兄取得して所有権移転登記を得た第3者に自己の持ち分をを対抗できない","a":false,"e":"この場合兄は弟の持ち分につき無権利者となりますなので弟は当期がなくても第3者に対抗できるとされています"},{"f":"bukken","fn":"売買・物権変動","q":"Aを売主Bを買主としてA所有の高を50万円で売却する契約が締結されたeが高の引き渡しを受けたが工事のエンジンに契約の内容に適合しない血管があることが判明した場合BはAに対して高の修理を請求することができる","a":true,"e":"この場合契約の内容に適合していないため車の修理を請求することができるとされています"},{"f":"bukken","fn":"売買・物権変動","q":"Aを売り主Bを買主として甲地の売買契約を締結したbがAに解約手付けを交付している場合Aが契約の履行に着手していない場合でもBが自ら履行に着手していればBは手付けを放棄して売買契約を解除することができない","a":false,"e":"注意して欲しいのは手付けの解除は相手方が履行に着手していない場合可能とあるのでつまり今回で言うとBは自分が着手していても相手方が着手していなければ解除は可能となります誰が着手しているかというのをしっかりと確認しておきましょう"},{"f":"bukken","fn":"売買・物権変動","q":"AがBから甲地を購入したところ甲地の所有者を名乗るCがAに対し連絡してきたcもBから土地を購入しておりその売買契約書の日付とBA間の売買契約書の日付が同じである場合当期がなくても契約締結の時刻が早い方が所有権を主張することができる","a":false,"e":"この場合20譲渡先に統記をした方の価値となりますつまり統記が必要ということなので注意しましょう"},{"f":"bukken","fn":"売買・物権変動","q":"Aが所有者として登記されている甲地の売買契約に関しAと売買契約を締結して所有権を取得したEは所有権の移転投機を備えていない場合であっても正当な権限なく甲地を占しているFに対し所有権を主張して甲地の明け渡しを請求することができる","a":true,"e":"この場合原則登記がないと第3者に対抗することはできないんですけど例外としてこの悪い人たちには統計がなくても対抗することができるとされています"},{"f":"bukken","fn":"売買・物権変動","q":"AがBに高度地を売却しBが所有権移転投機を備えた場合AがBとの売買契約をBの詐欺を理由に取り消した後CがBから土地を買い受けて所有権移転投機を備えた場合AC艦の関係は対抗問題となりAはいわゆる配信的悪意者ではないCに対して登記なくし甲地の変換を請求することができない","a":true,"e":"この場合詐欺取り消し後の第3者は先に登記をした人の価値となりますこういった問題は複雑なので必ず図を書いて誰がどうなるかというのを分かるようにしておくことをお勧めします"},{"f":"bukken","fn":"売買・物権変動","q":"宅建業者A社が自ら売主として宅建業者でない買主Bとの間で締結する建物の売買契約を締結したaが手付を受領した場合その手付けがいかなる性質のものであってもAが契約の履行に着手するまでの間買主はその手付けを放棄して契約の解除をすることができる","a":true,"e":"この場合相手方が履行に着手するまでは解除可能買主は手付けを放棄売主は手付けの倍額を現実に提供することで解除は可能となっています"},{"f":"bukken","fn":"売買・物権変動","q":"取得時効の完成によりお不動産の所有権を適に取得したものはその胸を登記しなければ時効完成後に乙不動産を旧所有者から取得して所有権移転投機を経た第3者に所有権を対抗できない","a":true,"e":"この場合自行完成後の第3者は先に登記をした方が勝ちとなります"},{"f":"bukken","fn":"売買・物権変動","q":"Aが所有しているコト地をBがAに無断でCに売却しその後BがAから甲地を購入した場合はBから甲地を購入した時点に遡って甲地の所有権を取得する","a":false,"e":"Cが甲土地の所有権を取得するのはBがAから甲土地の所有権を取得した時点となります購入した時に遡ってではないので注意しましょう"},{"f":"bukken","fn":"売買・物権変動","q":"aはAが所有している甲地をBに売却したeが甲地の所有権移転投機を備えないまま甲地をEに売却した場合Eは甲地の所有権移転登記をなくしてAに対して甲地の所有権を主張することができる","a":true,"e":"今回はAは第3者に当たらないということでEは当期がなくてもAに対し対抗することができますこういった問題は文字だけ見ていてもイメージつかないと思うので大変必ず図を書くようにしましょうそうして誰が第3者に当たるかそして当期は必要か必要じゃないかというのもしっかりと意識しながら免許する癖をお勧めします"},{"f":"bukken","fn":"売買・物権変動","q":"AがBとの売買契約をBの詐欺を理由に取り消す前にBの詐欺について悪意のCがBから甲地を買い受けて所有権移転投機を備えていた場合AはCに対して甲地の変換を請求することができる","a":true,"e":"この場合詐欺の取り消し前ということでCは悪意または有価室の場合Aは同計がなくても対抗可能となっています今回は悪意のCということでCは知っていたということなのでAは当期がなくてもCに対し対抗することができます"},{"f":"bukken","fn":"売買・物権変動","q":"不動産の売買契約における解約手付は売買契約と同時に締結しなければ効力を生じない","a":false,"e":"解約手付けは売買契約と別の時期に締結も可能となっていますなので後にした場合でも効力は生じるものとされています"},{"f":"bukken","fn":"売買・物権変動","q":"契約の不適号が数量に関するものであった場合主はその不適号を知った時から1年以内にその胸を売主に通知していなくても当該不適号を理由とする理向の追加の請求をすることができる","a":true,"e":"今回は数量ということで数量に関する不適号があった場合期間の制限はないとされています注意して欲しいのは種類品質は不適号を知った時から1年という風になっているので数量と種類これは必ず比較しておくようにしておきましょう"},{"f":"bukken","fn":"売買・物権変動","q":"買主Aと売主Bとの間で建物の売買契約を締結したbが本件躍上に基づき売買契約を解除する場合はBはAに対して単に高等で手付けの額の倍額を召喚することを告げて図料を最国するだけでは足りずこれを現実に提供しなければならない","a":true,"e":"買主の場合は手付けを放棄になりますが今回は売主Bということで売主の場合は手付けの倍額を現実に提供しなければならないとされています"},{"f":"bukken","fn":"売買・物権変動","q":"土地の真の所有者は無権利者からの譲り受け人で当期を有するものに対し所有権を主張できる","a":true,"e":"正しい選択肢となっています"},{"f":"bukken","fn":"売買・物権変動","q":"土地の譲り受けは無権利者から土地を賃借し土地上の建物を登記したものに対し土地の明け渡しと建物消去を請求できる","a":true,"e":"正しい選択肢となっています"},{"f":"bukken","fn":"売買・物権変動","q":"当期を信頼した土地の譲り受け人は真の所有者の過失の馬を問わず所有権を取得できるこちらの","a":true,"e":"答えは割になります当期には更新力がないのでこの場合は所有権を取得できないものとされています"},{"f":"bukken","fn":"売買・物権変動","q":"売所有の土地にAが気づかなかった契約の内容に適合しない事実がありその事実については買主Bの攻めに基すべき自由により生じたものではないような場合にはAは担保責任を負う必要はない","a":false,"e":"こちらの答えは罰になりますこのような場合でもAは担保責任を負うものとされています権利関係"},{"f":"teitou","fn":"抵当権","q":"抵当権は不動産に関する物件であり当期を備えなければ第3者に対抗することができない","a":true,"e":"登記が対抗要件となっています"},{"f":"teitou","fn":"抵当権","q":"Aの抵当権設定当期があるB所有の建物が火災によって消失してしまったaは当該建物にかけられた火災保険契約に基づく損害保険金請求権に物上代","a":true,"e":"この場合抵当権設定が火災保険金請求権を取得した場合保険金請求権に対する仏場代をすることができるとされています"},{"f":"teitou","fn":"抵当権","q":"Aが抵当権設定者Bを抵当権者として建物に2000万円を非担保債権とする抵当権を設定し登記したbの抵当権設定後にAがDに対して当該建物を賃貸し当該建物をDが使用している状態で抵当権が実行され当該建物が軽売された場合Dは契落人に対して直ちに当該建物を開け渡す必要はない","a":true,"e":"この場合はちょっと複雑なので必ず増用にしましょうこの場合Bを抵当権者Aを抵当権設定そして抵当権設定期後にAがDに対し当該建物を賃貸したということで図書角とこのようになりますそして問題文ではDは低形が実行されたけど直ちには出ていかなくて良いという問題になっています確認が抵当権設定当期後に賃借権が設定された場合原則賃借人つまりDは抵当権図に賃借権を対抗することはできないとされていますただし例外として契約人が建物を買い受けた時から6ヶ月を経過するまでは建物を開け渡さなくても良いということなので今回の問題文で言うと直ちに開け渡す必要はないということなので丸という形になります難しい問題こそ時間はかかるんですけど使いをして分かるようにしておくことがおすめです"},{"f":"teitou","fn":"抵当権","q":"AはBから借り入れた2000万円の担保として抵当権が設定されている甲建物を所有しており抵当権設定の後に甲建物を釈人Cに対して賃貸したcはこう建物に住んでいるが沈の登記はされていないaが甲建物をFに2位に売却してFが新たな所有者となった場合はFはAC間の賃貸賃貸借契約を承継したとしてFに対して甲建物を賃借する権利があると主張することができる","a":true,"e":"複雑なので必ず除回をするようにしましょうaはFに対して売却したそしてCは住んでいるけど登記されていないとありますがCはそもそも引き渡しを受けているということなのでこの新しく所有者となったFに対し対抗することができるとされていますつまりCはFに対してここは私のものなので出ていきませんという風に言うことができるということになります言っていることは複雑中身は大したことないのでこういった問題は必ず得点源にできるように頑張っていきましょう"},{"f":"teitou","fn":"抵当権","q":"抵当権について統記がされた後は抵当権の順位を変更することはできない","a":false,"e":"登記後でも低形の順位は変更できるとされています"},{"f":"teitou","fn":"抵当権","q":"A所有の甲地にBのCに対する債務を担保するためにCの低当権が設定されその胸の統計がなされたaから高度地を買い受けたDがCの請求に応じてその代下を弁済した時は本件抵当権はDのために消滅する","a":true,"e":"今回は第3取得者Dが抵当権者の請求に応じて支払うことで消滅するとされています"},{"f":"teitou","fn":"抵当権","q":"抵当権の非担保債権につき保証人となっているものは抵当不動産を買い受けて第3取得者になれば抵当権消滅請求をすることができる","a":false,"e":"こちらの答えは脱になります債務者や保証人とこれらのものの証券には抵当権消滅請求をすることができないとされています"},{"f":"teitou","fn":"抵当権","q":"Aが所有する甲地上にBが建物を建築して所有権を登記していたところAがBから建物を買い取りその後Aが後にCのために抵当権を設定し登記したaが甲土地に低ト権を設定記した後乙建物をDにちょうどした場合甲地の抵当権が実行されると建物のために法定値条件が成立する","a":true,"e":"この問題は法定地件の問題になるので軽く見ておきましょうまずは法定値権と来たら成立条件を必ず確認しましょう以下の1から丸4全てを満たす必要があります逆に言うとこれさえ抑えておけば点数取れるとこなので頑張って抑えていきましょう丸1抵当権設定当時土地の上に建物が存在することに抵当権設定土地の所有者と建物の所有者が同一であること丸3土地建物の一方もしくは双方に抵当権が設定されていること丸4抵当権の実行により土地の所有者と建物の所有者が別々になること要件を必ず抑えて問題ではどういった形になっているかというのを確認していきましょう今回で言うとAが所有する甲地上にBが建物を建築して所有権を登記していたということなのでまずはA落ち建物はBという風に書いておきましょうそして次は黄色のところaがBから建物を買い取りその後Aが甲地にCのために鉄権を設定し登記したということで土地はAつまり抵当権と書いて建物もAのものというものになりますそしてその後次は緑のとこで乙建物をDに譲渡したということなのでこの場合は甲地の抵当権が実行されると建物のために法定値が成立するという形になります抵当権設定当時この黄色の時はAが同じなので今回の場合は法定値条件が成立するという形になりますしっかりと要件を確認して図を書いてどの時は誰のものなのかそして抵当権はどうなっているかというのを必ず確認するようにしましょう"},{"f":"teitou","fn":"抵当権","q":"底統権者は総額が極度額の範囲内であっても非担保債権の範囲に属する利息の請求権についてはその満期となった最後の2年分についてのみその寝を行使することができる","a":false,"e":"定権は最後の2年分ですが定権は極度額の範囲内なら利息について最後の2年分に限られないとされていますこれは抵当権と熱定投の比較なので間違いないように数値は覚えておきましょう"},{"f":"teitou","fn":"抵当権","q":"定当券設定者は担保すべき元本の確定すべき記述の定めがない時は一定期間が経過した後であっても担保すべき元の確定を請求することはできない","a":false,"e":"本を確定すべき記述を定めなかった時というのは定当権設定は設定した時から3年を経過すれば元本の確定を請求することができるとされています"},{"f":"teitou","fn":"抵当権","q":"登記することができる権利には抵当権及び賃借権が含まれる","a":true,"e":"これらは登記することができる権利となっています"},{"f":"teitou","fn":"抵当権","q":"普通抵当権では抵当権の順位を譲渡できるが元本の確定前の定権ではネの順位を譲渡できない","a":true,"e":"正しい選択肢となっています"},{"f":"teitou","fn":"抵当権","q":"抵当権者の抵当権が消滅した場合後の順位の抵当権者の順位が繰り上がる","a":true,"e":"この場合後の人は抵当権者の順位が繰り上がるとされています"},{"f":"teitou","fn":"抵当権","q":"抵当権実行を申し立てた抵当権者は賃料への物上代意と賃体借契約薬の解除が可能である","a":false,"e":"賃料への物上代は可能ですが建物の賃貸借薬を解除することはできないとされています"},{"f":"teitou","fn":"抵当権","q":"抵当権者は賃料債権に物上代の","a":true,"e":""},{"f":"teitou","fn":"抵当権","q":"賃借事情の建物が抵当権の目的となっている時は一定の場合を除き敷地の賃借権にも抵当権の効力が及ぶ","a":true,"e":"この場合敷地に対しても抵当の効力が及ぶとされています"},{"f":"teitou","fn":"抵当権","q":"対象不動産について第3者が不法に占している場合抵当権は抵当権設定から抵当権者に対して占油を移転させるものではないので事情に関わらず抵当権者が当該占有者に対して妨害排除請求をすることはできない","a":false,"e":"この場合妨害請求は可能となっています"},{"f":"teitou","fn":"抵当権","q":"抵当権の効力は非担保債権に振り行があった場合その後に処した抵当不動産の果実に及ぶ","a":true,"e":"この場合抵当不動産の果実にまで及ぶとされています"},{"f":"teitou","fn":"抵当権","q":"抵当権の効力は抵当権設定当時の抵当不動産の物にも及ぶ","a":true,"e":"抵当権の効力は抵当権設定当時の抵当不動産の物にも及ぶとされています"},{"f":"teitou","fn":"抵当権","q":"抵当権を設定した胸を第3者に対抗する場合には登期が必要であるが定当権を設定した胸を第3者に対抗する場合には当期に加えて債務者の意義を止めない承諾が必要である","a":false,"e":"登記は必要ですが債務者の承諾は不要となっています"},{"f":"teitou","fn":"抵当権","q":"賃料債権に対して物上代しようとする場合には非担保債権の弁済機が到来している必要はない","a":false,"e":"弁済機は到来している必要があるので注意しましょう"},{"f":"teitou","fn":"抵当権","q":"ガソリンスタンド用店舗建物に抵当権を設定した場合抵当権設定当時に存在していた物地下タンクなどにも抵当権の効力が及ぶ","a":true,"e":"この場合地下タンクなどにも抵統計の効力が及ぶとされています"},{"f":"teitou","fn":"抵当権","q":"定当権者は総額が極度額の範囲内であっても非担保債権の範囲に属する離息の請求権についてはその満期となった最後の2年分についてのみそのネを行使することができる","a":false,"e":"え抵当権者はその満期となった最後の2年分についてのみではなく全部行使することができるとされています"},{"f":"teitou","fn":"抵当権","q":"抵当権者は建物に抵当権を設定していなくても土地と共に土地上の建物を軽媒することができるが優先弁済権は土地の代金についてのみ行使できる","a":true,"e":"あくまでも土地の代金についてのみ行使することができるとされていますただ土地と建物を軽媒をセットでできるので確認しておきましょう"},{"f":"teitou","fn":"抵当権","q":"元本確定前に非担保債権を譲り受けても統建を行使できない","a":true,"e":"この場合ネを行使することはできないとされています"},{"f":"teitou","fn":"抵当権","q":"抵当権間の合意で抵当権の順位を変更できるが登記しなくても効果が生じる","a":false,"e":"この場合同期をしなければ効力は生じないとされています"},{"f":"teitou","fn":"抵当権","q":"抵当不動産の第3取得者が抵当権消滅請求をする時は登期をした各債権者に書面を送負すれば足りその送面につき事前に裁判所の許可を受ける必要はない","a":true,"e":"この場合署名を相付すればOKであくまでも事前に裁判所の許可は不要となっています"},{"f":"teitou","fn":"抵当権","q":"定統計の極度額は一旦登記がされた後は公順位担保権者その他の理害関係者の承諾を得た場合でも増額することはできない","a":false,"e":"この場合は増額可能となっています"},{"f":"teitou","fn":"抵当権","q":"定統本の確定前においてネ設定者の承諾を得てそのネの一部を譲渡することができる","a":true,"e":"元本の確定前においても承諾があれば一部の譲渡が可能となっています"},{"f":"teitou","fn":"抵当権","q":"火災保険に基づく損害保険金請求権は物上代の対象となる","a":true,"e":"正しい選択肢となっています権利関係"},{"f":"rentai","fn":"連帯債務・保証・連帯保証","q":"連帯保証債務である場合債権者が連帯保証人に対して保証債務の履行を請求してきても連帯保証人は債権者に対しまず主たる債務者に請求するよう主張できる","a":false,"e":"連帯保証債務ということで連帯保証は丸1最国の公弁がない丸2検索の公弁がないということで丸1の最国の公弁がないので主たる債務者に請求するよう主張できないとされています"},{"f":"rentai","fn":"連帯債務・保証・連帯保証","q":"AとBが1000万円の連帯債務をCに対して追っている場合負担部分は半分ずつ1000万円の返済期限が到来した場合CはAまたはBにそれぞれ500万円までしか請求できない","a":false,"e":"それぞれCはABに債権の全部または一部の支払いを請求できるとされています例えばABそれぞれに1000万円も請求することができるという形になっています連帯債務・保証・連帯保証を解く上では図を書いて免許することをお勧めします私は連帯債務は資格で書いて連帯保証とか保証は丸みたいな感じで分けて書いていましたそうするとついうっかりミスとかもなくなるので図で見て分かるように書くことをお勧めします"},{"f":"rentai","fn":"連帯債務・保証・連帯保証","q":"Dが主催務者としてEに1000万円の債務を追いFはDから委託を受けてその債務の連帯保証人となっている場合EはDにもFにも1000万円を請求することができる","a":true,"e":"eはDFに債権の全部または一部の支払いを請求できるとされています"},{"f":"rentai","fn":"連帯債務・保証・連帯保証","q":"AとBが1000万円の連帯債務をCに対して追っている負担部分は半分ずつの場合Aが債務を承認して時効が更新してもBの連帯債務の時効の進行には影響しない","a":true,"e":"債務の承認は相対になるのでAが承認したとしてもBに及ばないとされています絶対校と相対は必ず抑えるようにしましょう覚え方としては絶対を覚えてそれ以外のものが来たら相対つまり他の債務者に影響を及ぼさないという形で覚えておきましょう"},{"f":"rentai","fn":"連帯債務・保証・連帯保証","q":"保証契約は書面でしなければその効力を生じない","a":true,"e":"保証契約は書面でしなければいけないとされています"},{"f":"rentai","fn":"連帯債務・保証・連帯保証","q":"者は連帯債務者のそれぞれに対して同時に代金全額の支払いを請求できる","a":true,"e":"連帯債務の場合それぞれに対し同時に全額を支払い請求できるとされています"},{"f":"rentai","fn":"連帯債務・保証・連帯保証","q":"連帯債務者の1人と債権者との間の公開は他の連帯債務者に対して効力が生じる","a":true,"e":"絶対校は連帯債務者の1人について生じた弁済総裁公開混動の効力は他の債務者にも影響を及ぼすとされています今回は公開なので他の債務者に対して効力が生じるとされています"},{"f":"rentai","fn":"連帯債務・保証・連帯保証","q":"Dが主催務者としてEに1000万円の債務を追いFはDから委託を受けその債務の連帯保証人となっている場合EはDにもFにも1000万円を請求することができない","a":false,"e":"両方に全額請求可能となっています"},{"f":"rentai","fn":"連帯債務・保証・連帯保証","q":"保証人となるべきものがしる債務者と連絡を取らず同賃からの委託を受けないまま債権者に対して保証したとしてもその保証契約は有効に成立する","a":true,"e":"この場合でも保証契約は有効に成立するとされています"},{"f":"rentai","fn":"連帯債務・保証・連帯保証","q":"連帯の特約がない保証人の場合債権者が保証債務の履行を請求してきても保証人は主債務者に弁済の資力がありかつ執行が容易であることを証明することによって債権者の請求を拒むことができる","a":true,"e":"今回は連帯保証ではないということで検索の公弁が認められるとされています"},{"f":"rentai","fn":"連帯債務・保証・連帯保証","q":"ABCの3人がDに対して900万円の連帯債務を追っているbのために時効が完成した場合CがDに対して100万円を弁済した場合はCの負担部分の範囲内であるからCはA及びBに対して急することはできない","a":false,"e":"弁済額が自己の負担部分を超えていない場合でもABそれぞれに対し約33万円を求償することは可能とされています"},{"f":"rentai","fn":"連帯債務・保証・連帯保証","q":"連帯債務者の1人は債権者から全額請求されても負担部分だけ支払えば良い","a":false,"e":"全額を支払わなければならないとされています"},{"f":"rentai","fn":"連帯債務・保証・連帯保証","q":"債権者は連帯債務者の1人に全額請求した場合他の連帯債務者には全く請求することができない","a":false,"e":"こちらの答えは脱になります他の債権者に対し同時に請求可能となっています"},{"f":"rentai","fn":"連帯債務・保証・連帯保証","q":"Dが主催債務者としてEに1000万円の債務を追いFはDから委託を受けてその債務の連帯保証人となっている場合Dが債務を承認して時効が更新した場合にはFの連帯保証債務に対しても時効の更新の効力を生ずる","a":true,"e":"必ず増加にしましょうeが債権者Dが主催無者でFが連帯保証人である場合Dつまり浸たる債務者に処した自由の効力は保証人つまりFにも及ぶとされていますdとFが反対になっていると間違えてしまうので必ず図を書いて誰が主催無者かというのを必ず確認しておきましょう"},{"f":"rentai","fn":"連帯債務・保証・連帯保証","q":"AはAの所有する土地をBに売却しBの売買代金の支払い債務についてCがAとの間で保証契約を締結したcの保証債務にBと連帯して債務を負担する特約がない場合Bに対する履行の請求その他の自由による時効の完成猶予及び更新はCに対してもその攻略を生ずる","a":true,"e":"主タル債務者の時効の完成猶予及び更新は保証人の消滅時効も完成猶予及び更新されるとなっています"},{"f":"rentai","fn":"連帯債務・保証・連帯保証","q":"AとBが1000万円の連帯債務をCに対して追っている負担部分は1/2ずつの場合CがBに対して債務の全額を免除してもAはCに対してなお1000万円の債務を負担している","a":true,"e":"免除は相対なので影響しないとなっていますなのでBに対しては債務の全額を免除してもAはその債務はまだ残ったままという形になります"},{"f":"rentai","fn":"連帯債務・保証・連帯保証","q":"dが主主催債務者としてEに1000万円の債務を追いFはDから委託を受けてその債務の連帯保証人となっている場合Fが1000万円を弁済した場合にもFは500万円についてのみDに対して急することができる","a":false,"e":"この場合全額急が可能となっています"},{"f":"rentai","fn":"連帯債務・保証・連帯保証","q":"保証契約と連帯保証契約は共に書面でしなければ効力を生じない","a":true,"e":"どちらも大事なことなので署面でしなければ効力を生じないとされています"},{"f":"rentai","fn":"連帯債務・保証・連帯保証","q":"連帯債務者の1人が債務全額を弁済した場合他の連帯債務者に対しその負担部分につき求償できる","a":true,"e":"負担部分につき求償できるとされています権利関係"},{"f":"chintai","fn":"賃貸借","q":"AがB所有の建物について賃貸借契約薬を締結し引き渡しを受けたaがBの承諾を受けてDに対して当該建物を展している場合にはAB間の賃貸借計薬がAの債務振行理由に解除されBがDに対して目的物の変換を請求してもAD間の賃貸策契約は原則として終了しない","a":false,"e":"こういった問題は図を書いて分かるようにしましょうaがB所有の建物について賃貸借契約薬を締結**aがBの承諾を受けてDに対し展したという形になりますそして今回は賃借人の債務振行により解除ということで賃借人はAつまりAさんが悪いことをした場合という形になります例えばAが家の中で花火したのでBは契約解除しますそしてDは早く出ていけと言えないという問題文になっているんんだけどそもそも債務振行により解除された場合賃貸人が転職人に対して目的物の変換を請求した時に全体削なのでBはDに対し出ていってということができるという形になります"},{"f":"chintai","fn":"賃貸借","q":"AがB所有の建物について賃貸借計薬を締結し引き渡しを受けたaがEに対して賃借の譲渡を行う場合のBの承諾はAに対するものでもEに対するものでも有効である","a":true,"e":"この賃借権の譲渡は賃貸人の承諾は賃借人譲り受け人どちらでも有効となっていますなのでAに対してもEに対してもするものでも大丈夫という形になります"},{"f":"chintai","fn":"賃貸借","q":"aはBに対し建物を賃貸しBはその建物をAの承諾を得てCに対し適に展しているbがAに対して賃料を支払わない場合AはBに対する賃料の限度でCに対しBに対する賃料を自分に直接支払うよう請求することができる","a":true,"e":"この場合AはBに対し建物を貸していてBはAの許可を得てCに点しているという形になりますそしてBが賃料支払わない場合AはCに対して払ってということができるかという形になりますがこの場合賃借人が賃に賃料支払わない場合賃は転釈人つまりCに対して直接賃料を請求できるとされています"},{"f":"chintai","fn":"賃貸借","q":"賃貸人の承諾を得て賃借人から建物を転借している場合賃体借契約が合意解除されても転借人の権利は特段の自由がある場合を除き消滅しない","a":true,"e":"合意解除の場合賃貸人は転職人に対抗することができないとされていますつまりAはCに対し出ていってということができないという形になりますこの合意解除の場合の結果はよく債務振行解除と比較されて出題されるので必ず確認しておきましょう"},{"f":"chintai","fn":"賃貸借","q":"建物の賃体借契約が期間満了により終了した場合賃借人から指揮金の変換請求を受けた賃貸人は賃体物の変換を受けるまではこれを拒むことができる","a":true,"e":"式金の変換は同時行の関係ではないので注意ししょう賃貸人は賃貸物の変換を受けるまでは指金の変換請求を拒むことができるとされていますつまり家を返すのが先という形なので結果を必ず覚えておきましょう"},{"f":"chintai","fn":"賃貸借","q":"賃借は賃借物を受け取った後にこれに処した損傷がある場合通常の使用及び収益によって生じたも含めてその損傷を現状に復する義務を負う","a":false,"e":"この場合通常の使用及び収益や賃物の軽年変化は除くとされていますなので現状を回復する義務はないとされています"},{"f":"chintai","fn":"賃貸借","q":"賃は賃借人が賃体借に基づく金銭債務を履行しない時は式金をその債務の弁済に当てることができる","a":true,"e":"賃貸人の方からは指金を当てることができるとされています"},{"f":"chintai","fn":"賃貸借","q":"賃貸人と賃借人との間で賃料の支払い時期について特約がない場合賃借人は当月末日までに翌月分の賃料を支払わなければならない","a":false,"e":"毎月末に当日分の賃料を支払わなければならないとされています"},{"f":"chintai","fn":"賃貸借","q":"建物の修繕が必要であることを貸主が知ったにも関わらず相当の期間内に必要な修繕をしない時は借主は甲建物の修繕をすることができる","a":true,"e":"壊れていて貸主が直さない時は借主が修理をすることができるとされています"},{"f":"chintai","fn":"賃貸借","q":"賃借人は見払い賃料債務がある場合賃人に対し指揮金をその債務の弁済に当てるよう請求することができる","a":false,"e":"新作人から式金を弁済に当てるよう請求することは不可となっています"},{"f":"chintai","fn":"賃貸借","q":"賃貸人Aが賃借人Bの債務振り行を理由に甲建物の賃貸借契約を解除した場合転借人のBに対する賃料の不払いがなくてもAは転釈人Cに対して甲建物の開け渡しを求めることができる","a":true,"e":"この場合AはCつまり転職人に対して出ていってということができるとされています理由としては債務振り行理由に解除ということで転借人に対抗が可能となっています"},{"f":"chintai","fn":"賃貸借","q":"建物の修繕が必要である場合において脅迫の事情がある時は借主は甲建物の修繕をすることができる","a":true,"e":"この場合借主は修繕をすることができるとされています"},{"f":"chintai","fn":"賃貸借","q":"賃貸借契約期間中貸主の返済能力に客観的な不安が生じた場合は借主は賃料支払い債務と指金変換請求権とを対額にて総裁することができる","a":false,"e":"この場合貸主の返済能力に不安があったとしても指金変換を請求できずまた賃料支払い債務と総裁も不可となっています"},{"f":"chintai","fn":"賃貸借","q":"賃貸人Aが賃借人Bの債務振行によりAB間の賃貸借契約を適に解除した場合転借人CはBC艦の賃貸借契約に基づく転借権をAに対抗することができない","a":true,"e":"この場合定着CはAに対し対抗することができないとされています"},{"f":"chintai","fn":"賃貸借","q":"借主は賃貸借契約では貸主の負担に属する必要費を支出した時は貸主に対しその召喚を請求することができる","a":true,"e":"この場合貸主に対しを請求することができるとされています"},{"f":"chintai","fn":"賃貸借","q":"賃貸人Aと賃借人Bとの間で締結した建物賃貸借契約にBがAの同意を得て建物に付加した造作がある場合であっても本件契約終了時にAに対して増取請求権を行使することはできないという特約は無効である","a":false,"e":"増作買い取り請求権を特約で排除することは可能となりますなのでこの特約は有効ということになります"},{"f":"chintai","fn":"賃貸借","q":"賃借人Bが賃貸人Aに対して賃料を支払わない場合AはBに対する賃料の限度で転借人に対しBに対する賃料を自分に直接支払うよう請求することができる","a":true,"e":"この場合賃借量と転借量いずれか低い金額が限度となります"},{"f":"chintai","fn":"賃貸借","q":"マンションの賃貸契約終了に伴う賃貸人の指金変換債務と賃借人の明け渡し債務は特別の躍のない限り同時行の関係に立つこちらの答えは","a":false,"e":"この場合明け渡し義務が先ということで同時行の関係ではないので注意しましょう"},{"f":"chintai","fn":"賃貸借","q":"貸主と借主との間の契約は賃借ではダ契約であり使用でもダ契約である","a":true,"e":"どちらも合意のみで成立する落契約となっています"},{"f":"chintai","fn":"賃貸借","q":"借主は貸主の負担すべき必要費を支出した時は直ちに貸主に対しその召喚を請求することができる","a":true,"e":"この場合必要費は直ちに請求が可能となっています権利関係の"},{"f":"shakuchi","fn":"借地借家法(借地)","q":"建物の所有を目的とする土地の賃体策契約でもっぱら事業のように供する建物居住のように供するものを除くの所有を目的とし存続期間を20年として借地権を設定する場合建物買い取り請求権の規定は適用されずまたその契約は厚生証書によると署名によってしなければならないこちらの","a":true,"e":"答えはになりますこの場合もっぱら事業のように共用の定期借地権になりますなので構成証書等ではなく厚生証書に限るとされています"},{"f":"shakuchi","fn":"借地借家法(借地)","q":"建物の所有を目的とする土地の賃借契約で借地系を設定する場合において存続期間を定めなかった時はその期間は30年となる","a":true,"e":"この場合存続期間を定めないと存続期間は30年となります"},{"f":"shakuchi","fn":"借地借家法(借地)","q":"建物所有目的で期間を50年とする賃貸借契約を締結したコート地上でもっぱら賃貸アパート事業用の建物を所有する目的である場合契約の更新や建物の蓄造による存続機関の延長がない旨を定めるには厚生少書で合意しなければならない","a":false,"e":"更新存続機関の延長がない胸を定めるということでこれは定義権となりますそして賃貸アパートなので事業用は不可そして期間は50年なので一般定期借地権となりますこの場合は厚生少々ではなく書面で可能となっています注意して欲しいのは事業用の建物ってあるから事業用定期借地権かなって思うかもしれないんですけどだから構成少書としないでしっかりと問題文を読んでこれは何を聞かれているかというのをしっかりと理解するようにしておきましょう"},{"f":"shakuchi","fn":"借地借家法(借地)","q":"A所有の甲土地につきBとの間で居住のように共る建物の所有を目的として存続期間30年で賃貸借契約が締結されたaとBとが期間満了にあたり本件契約を最初に更新する場合更新後の存続期間を15年と定めても20年となる","a":true,"e":"この場合最初の更新は20年以上となります"},{"f":"shakuchi","fn":"借地借家法(借地)","q":"建物の所有を目的とする土地の賃貸借契約に関し地権の存続機関が満了する前に建物の別出があった場合地権者が借地権の残存期間を超えて存続すべき建物を蓄造した時その建物を蓄造することにつき借地権設定の承諾がない場合でも着地権の期間の延長の効果が生ず","a":false,"e":"この場合借地券設定の承諾がないということで延長効果は生じないとされています"},{"f":"shakuchi","fn":"借地借家法(借地)","q":"建物の所有を目的とする土地の賃貸借契約において借地権の登記がなくてもその土地の建物に借地人が事故所有者と記載した表示の登記をしていれば借地権を第3者に対抗することができる","a":true,"e":"着地上の建物に事故を所有者とした登期があれば対抗可能となっています"},{"f":"shakuchi","fn":"借地借家法(借地)","q":"AとBとの間でA所有の甲土地につき建物所有目的で賃貸借契約を締結したbは甲地につき借地権統登記を備えなくてもBと同性でかつ同居している未成年の長男名義で保存投居した建物を甲地上に所有していれば甲地の所有者が変わっても甲土地の新所有者に対し地形を対抗することができる","a":false,"e":"この場合当期は着地権者本人の名義で行う必要があるとされていますなので長男だったらOKということではないので注意しましょう"},{"f":"shakuchi","fn":"借地借家法(借地)","q":"Aが居住用の甲建物を所有する目的でBから乙つ土地を賃借したaが地代を支払わなかったことが理由でBが乙つの賃貸貸借契約を解除した契約に特段の定めがない時Bはこう建物を直価で買い取らなければならない","a":false,"e":"賃料不払い等の債務振行理由に解除された場合建物買い取り請求権を行使することはできないとされていますそもそもAが悪いんだからそれはしなくてもいいよねっていうことになります"},{"f":"shakuchi","fn":"借地借家法(借地)","q":"A所有の甲地につきBとの間で賃貸借契約が締結された本件契約が建物所有を目的としている場合契約の更新がなく建物の買い取りの請求をしないこととする胸を定めるにはAはあかじめBに対しその胸を記載した書面を交付して説明しなければならない","a":false,"e":"この場合契約の更新がなくの買取りの請求をしないということから一般定期借地権または事業用定期借地権となりますなのであかじめ書面を交付して説明しなければならないという義務はないので注意しましょうついつい丸にしてしまう人も多いと思うんですけど気をつけましょう"},{"f":"shakuchi","fn":"借地借家法(借地)","q":"体人Aと賃借人Bとの間の家賃に関し家賃の増減について特約のない場合で建物の価格の低下その他の経済事情の変動により家賃が相当に高額となった時BはAに対し将来に向かって家賃の減額を請求できる","a":true,"e":"この場合BはAに対し家賃の減額を請求できるとされています"},{"f":"shakuchi","fn":"借地借家法(借地)","q":"借地人Aが高知所有者Bと締結した建物所有を目的とする高知賃貸借契約に基づいてAが借地権をCに譲渡した放置上のA所有の建物が登記されている場合AがCと当該建物を譲渡する胸の合意をすればBの承諾のうに関わらずCはBに対して高知の借地権を主張できる","a":false,"e":"この場合釈権の譲渡をする場合賃貸人の承諾が必要となります問題文はBの承諾のうに関わらずとありますがこちらが不適切ということになります"},{"f":"shakuchi","fn":"借地借家法(借地)","q":"借地借法の規定において借地人が借地権を譲渡しようとする場合賃貸人に不利となる恐れがないにも関わらず承諾が得られない時は借地人は裁判所に申し立てることにより賃貸人の承諾に変わる許可を受けることができる","a":true,"e":"aがCに譲渡したいのにBがいいよって言わない時は借地人は裁判所に申し立てることができますあくまでもするのは借地人つまりAが裁判所に対しするということなので守護は誰かというのを気をつけましょう"},{"f":"shakuchi","fn":"借地借家法(借地)","q":"事業のように共する建物の所有を目的とする場合であれば従業員の社として従業員の居住のように供する時であっても事業用定期借地権を設定することができる","a":false,"e":"従業員の選択であっても事業用定期借地権はもっぱら事業のように共する建物の所有を目的とする場合に設定することができます"},{"f":"shakuchi","fn":"借地借家法(借地)","q":"借地借法においてもっぱら借主Bの事業のように共る建物の所有を目的とし存続期間が50年である場合契約の更新及び建物の蓄上による存続期間の延長がない旨並びにBが建物の買い取りの請求をしない旨の特約を書面で有効に定めることができる","a":true,"e":"この場合期間が50年で存続期間の延長がないということで一般定期借地権となりますなので建物買い取り請求権を排除することが可能となっています"},{"f":"shakuchi","fn":"借地借家法(借地)","q":"地契約が借主の臨時設備の設置その他一時使用のためになされることが明らかである場合期間を5年と定め契約の更新や建物の蓄造による存続期間の延長がない胸を借地契約に定めることができる","a":true,"e":"一時使用のため借地下法ではなく民法が適用されます民法は存続期間は50年以下で定めればよくまた更新のない契約も可能となっています民法と借地借法どっちが適用されるかは必ず問題文を読んで分かるようにしておきましょう"},{"f":"shakuchi","fn":"借地借家法(借地)","q":"地下法において当事者が借地系の設定後に最初に借地契約を更新する場合存続期間を定めなかった時はその期間は更新の日から10年となる","a":false,"e":"この場合10年ではなく20年となっています"},{"f":"shakuchi","fn":"借地借家法(借地)","q":"地借法において借地系の存続機関が満了する際借地建者の契約の更新請求に対し地権設定者が伝体なく意義を述べた場合には借地契約は当然に終了する","a":false,"e":"伝体なく意義を述べることこれにプラスして政党自由が必要となっています"},{"f":"shakuchi","fn":"借地借家法(借地)","q":"地借貨法において転借地権が設定されている場合転借地上の建物が滅出した時は転借地権は消滅し転借地権者転借人は建物を再築することができないこちらの","a":true,"e":"答えは割になります転着地験が設定されている場合転着地権者による建物の蓄地権者による蓄とみなされますなので転着地上の建物が滅失されている場合でも転着時権者は建物を採築可能となっています"},{"f":"shakuchi","fn":"借地借家法(借地)","q":"2七以上ある土地の借地権者がそのうちの一筆の土地上に当期のある建物を所有し当期ある建物がない他方の土地は庭として使用するために賃貸しているに過ぎない場合当期ある建物がない土地は対抗力は及ばない","a":true,"e":"この場合庭は土地上に当期ある建物がないため代負不不可となっていますなので対抗力を及ばないとされています権利関係の"},{"f":"shakka","fn":"借地借家法(借家)","q":"契約期間が2年で更新がないこととする旨を定める建物賃貸借契約に関し定期建物賃貸借契約を適に締結した場合賃体は期間満了日1ヶ月前までに期間満了により契約が終了する旨を通知すればその終了を賃借人に対抗できる","a":false,"e":"この場合契約期間が2年ということで期間の定めがあるものとされていますなのでこの場合は期間満了の1年前から6ヶ月前の間に期間満了により契約が終了する旨を通知する必要があります問題文は1ヶ月前とあるので不適切という形になります"},{"f":"shakka","fn":"借地借家法(借家)","q":"定期建物賃貸借契約であるか田舎に関わらず造作請求権をあかじめ放棄する旨の特約は有効に定めることができる","a":true,"e":"増作買い取り請求権をあらかじめ放棄するまでの特約は有効となっています"},{"f":"shakka","fn":"借地借家法(借家)","q":"定期建物賃借契約を契約期間を2年として締結した契約の更新がなく期間満了により終了することを書面を交付または電磁的方法により提供すればあらかじめ借主に説明すれば期間満了前に貸主が借主に改めて通知しなくても契約が終了する旨の特約を有効に定めることができる","a":false,"e":"期間が1年以上の場合期間満了の1年前から6ヶ月前までの間に賃借に対し期間満了により賃借の終了の通知をしなければならないとされていますしっかり通知も必要ということです"},{"f":"shakka","fn":"借地借家法(借家)","q":"AはBに対し甲建物を月20万円で賃貸しAの承諾を得た上で甲建物の一部をCに対し月10万円で点しているab間で賃貸借契約を合意解除しても原則として賃貸人Aは転借人Cに対し明け渡しを請求することはできない","a":true,"e":"合意解除の場合は賃貸人と賃借人の合意によって解除された場合賃体人は転職人に対抗することができないとされていますここはよく債務振り行と比較されるとこなので合意解除の場合債務振行の場合はどういった結果になるかというのを必ず抑えておくようにしましょう"},{"f":"shakka","fn":"借地借家法(借家)","q":"賃貸人Aが賃借人Bとの賃体借契約を賃料不払いを理由に解除する場合は転職人Cに通知等をして賃料をBに変わって支払う機会を与えなければならない","a":false,"e":"この場合賃借人の債務振る解除つまりBが悪いことをした場合賃体人は転借人に通知通して賃料を賃借人に変わって支払う機会を与える必要はないとされています"},{"f":"shakka","fn":"借地借家法(借家)","q":"賃貸人と賃借人との間で期間5年として定期建物賃貸借契約を締結する場合賃貸人も賃借人も契約期間中の中途解約をすることができない旨の規定は有効である","a":false,"e":"定期建物賃貸借契約は賃借人から中途解約の申し入れができるとされていますは①面積200m未満の居住用建物②転勤、療養、親族の介護その他を得ない事情により建物の賃借人が建物を自己の生活の本拠として使用することが困難な場合この場合は解約の申し入れができるとされていますしっかりと要件は確認しておきましょう"},{"f":"shakka","fn":"借地借家法(借家)","q":"定期建物賃貸契約を締結する時は期間を1年未満としても期間の定めがない建物の賃貸借契約とはならない","a":true,"e":"期間を1年未満とした場合普通借貨は定めがない建物の賃貸借と見なされますが定期借貨の場合は期間の定めがない建物の賃貸契約とは見なされないので比較しておきましょう普通借貨の場合と定期借貨の場合この比較はよく出るところとなっています"},{"f":"shakka","fn":"借地借家法(借家)","q":"Aを賃貸人Bを賃借人とするこ建物の賃貸借契約薬が締結された甲建物がBに引き渡された後こう建物の所有権がAからCに移転した場合本件契約の指金は他に特段の合意がない限りBのAに対する未払い賃料債務に重され残額がCに継承される","a":true,"e":"この場合Bは甲建物の引き渡しを受けているということでBは対抗要件を備えていますなので賃貸人たる地位が譲り受け人Cに移転した時は式金の変換に関する債務は譲り受けに地位に承継されるとされています"},{"f":"shakka","fn":"借地借家法(借家)","q":"貸借契約の期間満了の6ヶ月前までに更新しない旨の通知をしなかった時は期間3年賃料月額10万円の条件で賃貸借契約を更新したものと見なされる","a":false,"e":"この場合期間3年ではなく期間の定めがないものとなります"},{"f":"shakka","fn":"借地借家法(借家)","q":"賃貸借契約の更新の際家賃の増額について賃の請求があった時は賃借人はこれを拒むことはできない","a":false,"e":"この場合沈人は裁判が確定するまで事故が相当と認める家賃を支払えば良いとされています"},{"f":"shakka","fn":"借地借家法(借家)","q":"AはB所有の甲建物につき居住を目的として期間2年両月額10万円と定めた賃貸借契約をBと締結して建物の引き渡しを受けた本件契約期間中にBがこう建物をCに売却した場合Aはこう建物に賃借権の登記をしていなくてもCに対してこう建物の賃借権があることを主張することができる","a":true,"e":"この場合建物の引き渡しを受けていれば第3者に対抗することができるとされていますなのでAは引き渡しを受けているのでCに対し対抗することが可能となっています"},{"f":"shakka","fn":"借地借家法(借家)","q":"Aが所有する甲建物をBに対して3年間賃貸する旨の契約をした場合AがBに対し甲建物の賃貸借契約の期間満了の1年前に更新しない旨の通知をしていればAB間の賃貸借契約は期間満了によって当然に終了し更新されない","a":false,"e":"この場合賃貸は通知にプラスして正当自由が必要となりますまた期間満了後も継続して使用している賃借人に意義を述べないと従前の条件で更新したものと見なされます"},{"f":"shakka","fn":"借地借家法(借家)","q":"作地下法において期間の定めのない契約では賃体人は沈人に対し外約の申し入れの日から6ヶ月を経過しないと建物の分け渡しを請求することができない","a":true,"e":"期間の定めがない場合賃貸借は解約の申し入れから6ヶ月経過後賃借は3ヶ月経過後に賃貸借が終了します"},{"f":"shakka","fn":"借地借家法(借家)","q":"取り壊し予定の建物の賃体策であり甲建物を取り壊すこととなる時に本件契約が終了する旨の特約を定める場合本件契約は合成上書によってしなければならない","a":false,"e":"この場合合成ではなく署名によってしなければならないとされています"},{"f":"shakka","fn":"借地借家法(借家)","q":"賃貸借契約が定期建物賃貸借で契約の更新がない胸を定めるものである場合当該契約前に賃貸人が賃借人に契約の更新がなく機間の満了により終了する旨を記載した書面を交付して説明しなければ契約の更新がない胸の薬場は無効となる","a":true,"e":"この場合定期建物賃貸借となるのであらかじめ借主に対し契約の更新がなく期間満了により終了することを書面を交付して説明しなければならないとされています"},{"f":"shakka","fn":"借地借家法(借家)","q":"賃借人Bが相続人なしに死亡した場合Bと行の届けでしていないが事実上夫婦と同様の関係にあった同居者DはBが相続人なしに死亡したことを知った後1ヶ月以内に人Aに反対の意思表示をしない限り釈人としてのBの権利義務を証計する","a":true,"e":"賃借人が相続人なしに死亡した場合事実上夫婦または要心士と同様の関係にあった同居者がある時はその同居者が賃借権を承継しますなのでこの場合だとDが賃借権を証計するというものになります"},{"f":"shakka","fn":"借地借家法(借家)","q":"建物の賃貸人が賃体物の保存に必要な修繕をする場合賃借人は修繕工事のため使用収益に支障が生じてもこれを拒むことはできない","a":true,"e":"この場合賃借は拒ばむことはできないとされています"},{"f":"shakka","fn":"借地借家法(借家)","q":"地借法において賃貸人が甲建物の賃貸借計薬の解除の申し入れをした場合には申し入れ日から3ヶ月で賃貸借計薬が終了する旨を定めた特約は賃借人があかじめ同意していれば有効となる","a":false,"e":"この場合賃貸人からの解約申し入れは6ヶ月となっているので3ヶ月は賃借人に不利な特約として無効となります"},{"f":"shakka","fn":"借地借家法(借家)","q":"賃貸借計薬の期間満了による終了を転借人に通知しなければ契約終了を転借人に対抗できない","a":true,"e":"この場合しっかりと通知をする必要があるとされています"},{"f":"shakka","fn":"借地借家法(借家)","q":"借地借法においては賃貸中の建物が譲渡された場合賃借人の承諾がなくても指金変換債務は新所有者に承継される","a":true,"e":"この場合指金変換債務は新所有者に証計されるとなっています権利関係の"},{"f":"kubun","fn":"共有・区分所有法","q":"AB及びCが持ち分を各1/3とする甲地を共有しているaB及びCが甲土地についてEと賃貸借契約を締結している場合AとBが合意すればCの合意はなくとも賃貸借契約を解除することができる","a":true,"e":"共有物の賃貸借契約の解除は下半数でできるとされています"},{"f":"kubun","fn":"共有・区分所有法","q":"共有部分に関する各共有者の持ち分はその有する占油部分の床面積の割合によることとされており規約で別断の定めをすることはできない","a":false,"e":"規約で別談の定めも可能となっています"},{"f":"kubun","fn":"共有・区分所有法","q":"管理者は少なくとも毎年1回集回を招集しなければならない","a":true,"e":"毎年1回集回を証集しなければならないとされています"},{"f":"kubun","fn":"共有・区分所有法","q":"規約及び集会の決議は区分所有者の特定証券に対してはその効力を生じない","a":false,"e":"特定証券人に対しても効力を生じるとされています"},{"f":"kubun","fn":"共有・区分所有法","q":"共有部分の保存行為については各区分区分所有者はいかなる場合でも自ら単独で行うことができる","a":false,"e":"こちらの答えは罰になります保存行為は原則各区分所有者が単独ですることができますまた規約で別断の定めも可能ですがいかなる場合でもないので注意しましょうあくまでも原則なので注意しましょう"},{"f":"kubun","fn":"共有・区分所有法","q":"AB及びCが持ち分を各1/3とする高値を共有している甲地全体がEによって不法に占い場合Aは単独でEに対してEの不法声優によってAB及びCに処した損害全額の賠償を請求できる","a":false,"e":"この場合Aは自己の持ち分を超えて損害賠償請求することはできないとされていますなのでAの分だけだったらいいんですけどBとCそれぞれの分は請求不可となっています結構ここは問われやすいところなので確認しておきましょう"},{"f":"kubun","fn":"共有・区分所有法","q":"占油部分であっても規約で定めることにより敷地利用権と分離して処分することができる","a":true,"e":"この場合分離して処分は可能となっています"},{"f":"kubun","fn":"共有・区分所有法","q":"集会においては法で集会の決議につき特別の定数が定められている時効を除きで別断の定めをすればあらかじめ通知した事項以外についても決議することができる","a":true,"e":"規約で別談の定めをすれば可能となっています"},{"f":"kubun","fn":"共有・区分所有法","q":"他の区分所有者から区分所有権を譲り受け建物の占油部分の全部を所有することとなったものは構成証書による規約の設定を行うことができる","a":false,"e":"この場合最初に建物の占油部分の全部を所有するものは可能ですが次にもらった人というのはできないので注意しましょう"},{"f":"kubun","fn":"共有・区分所有法","q":"管理組合は区分所有者が2人以上である時所定の手続きを得て法人となることができるがその際感字を置かなければならない","a":true,"e":"管理組合いは区分所有者が2人そして漢字を置く必要があるとされています"},{"f":"kubun","fn":"共有・区分所有法","q":"一部共有部分はこれを共有すべき区分所有者の共有に属するが契約で別断の定めをすることにより区分所有者全員の共有に属することとすることもできる","a":true,"e":"正しい選択肢となっています"},{"f":"kubun","fn":"共有・区分所有法","q":"共有部分の管理にかかる費用については規約に別断の定めがない限り共有者の持ち分に応じて負担する","a":true,"e":"共有者の持ち分に応じて負担するとされています"},{"f":"kubun","fn":"共有・区分所有法","q":"管理者がない時は区分所有者の1/5以上で議決権の1/5以上を有するものは集回を消集することができこの点数は規約で現ずることができる","a":true,"e":"1/5以上と契約で減らすことができる2つセットで覚えておきましょう"},{"f":"kubun","fn":"共有・区分所有法","q":"共有部分の保存行為をするには規約に別断の定めがない限り集回の決議で決する必要があり各共有者ですることはできない","a":false,"e":"保存行為は各共有者が単独ですることができるとされています"},{"f":"kubun","fn":"共有・区分所有法","q":"AB及びCが持ち分を各1/3とする後を共有している共有者の協議に基づかないでAから甲土地の占有仕様を承認されたDはAの持ち分に基づくものと認められる限度で後地を占有使用することができる","a":true,"e":"この場合DもAの持ち分に応じて使用することができるとされています"},{"f":"kubun","fn":"共有・区分所有法","q":"共有部分は区分所有者全員の共有の登記を行わなければ第3者に対抗することができない","a":false,"e":"規約共有部分は登期をしなげれば対抗できませんが法廷共有部分は登記がなくても対抗できるとされています"},{"f":"kubun","fn":"共有・区分所有法","q":"所有者が建物の保存に有害な行為その他建物の管理は使用に関し区分所有者の共同の利益に反する行為をした場合はその行為をする恐れがある場合他の区分所有者の全員または管理組合法人は区分所有者の共同の利益のためその行為を停止しその行意の結果を除去しまたはその行意を予防するため必要な措置を取ることを請求することができる","a":true,"e":"正しい選択肢となっています"},{"f":"kubun","fn":"共有・区分所有法","q":"共有部分の保存行為は規約に別断の定めがある場合を除いて各共有者がすることができるため仲回の決議を必要としない","a":true,"e":"保存行為は各共有者がすることができるとされています"},{"f":"kubun","fn":"共有・区分所有法","q":"一部共有部分に関する事項で区分所有者全員の理害に関係しないものは区分所有者全員の規約に定めることができない","a":false,"e":"この場合複有者全員の規約に定めることができるとされています"},{"f":"kubun","fn":"共有・区分所有法","q":"有者は建物またはその敷地もしくは付属施設の使用方法につき区分所有者が規約は集会の決議に基づいておう義務と同一の義務を負う","a":true,"e":"専用者も同一の義務を負うとされています"},{"f":"kubun","fn":"共有・区分所有法","q":"区分所有法では占油部分が数人の共有に属する時は規約で別断の定めをすることにより共有者は議決権を行使すべきものを2人まで定めることができる","a":false,"e":"2人ではなく議決権を行使すべきものは1人と定められています"},{"f":"kubun","fn":"共有・区分所有法","q":"共有部分の持ち分の割合について各共有者の共有部分の持ち分は規約で別断の定めをしない限りその有する占油部分の床面積の割合による","a":true,"e":"共有部分の持ち分の割合は床面積の割合によるとされています"},{"f":"kubun","fn":"共有・区分所有法","q":"仲回は区分所有者議決権を有しないものを除く及び議決権の各4分の3以上の多数の同意がある時集の手続きを得ないで開くことができる","a":false,"e":"全員の同意があれば少集の手続きは不要となります"},{"f":"kubun","fn":"共有・区分所有法","q":"区分所有者は規約に別断の定めがない限り集会の決議によって管理者を選任しまたは介る","a":true,"e":"集会の決議で管理者を選任解認することができます"},{"f":"kubun","fn":"共有・区分所有法","q":"録が書面で作成されている時議長及び集会に出席した区分所有者全員がこれに署名しなければならない","a":false,"e":"議長及び集会に出席した区分所有者の2人となっています全員ではないので注意しましょう"},{"f":"kubun","fn":"共有・区分所有法","q":"立替え決議を目的とする集会を招集する時は開りくとも2ヶ月前に招集通知を発しなければならないただしこの期間は規約で慎重できる","a":true,"e":"立替え決議は2ヶ月前に招集通知を発なければならないとされていますまた注意して欲しいのはこの期間は伸ばすことは可能ですが縮めることは不可なのでこちらも覚えておきましょう"},{"f":"kubun","fn":"共有・区分所有法","q":"各共有者の共有部分の持ち分は規約に別断の定めがない限り共有者数で当分することとされている","a":false,"e":"占油部分の床面積の割合とされています"},{"f":"kubun","fn":"共有・区分所有法","q":"管理者は少なくとも毎年2回集会を証集しなければならない","a":false,"e":"毎年1回となっています"},{"f":"kubun","fn":"共有・区分所有法","q":"法は規約により集会において決議をすべき場合において区分所有者が1人でも反対する時は集会を開催せずに署面によって決議をすることはできない","a":true,"e":"1人でも反対していたら書面の決議は不可となります"},{"f":"kubun","fn":"共有・区分所有法","q":"集仲会において管理者の選任を行う場合規約に別断の定めがない限り出席した区分所有者議決権を有しないものを除く及びその議決権の各下半数で結する","a":true,"e":"正しい選択肢となっています"},{"f":"kubun","fn":"共有・区分所有法","q":"規約に別断の定めがある場合を除いて各共有者の共有部分の持ち分はその有する占油部分の壁その他の区画の内側線で囲まれた部分の水平等映面積の割合による","a":true,"e":"共有者の持ち分は内側の水平等面積の割合によるとされています"},{"f":"kubun","fn":"共有・区分所有法","q":"管理組合い法人を設立する場合は理事を置かなければならず理事が数人ある場合において規約に別談の定めがない時は管理組合法人の事務は理事の下半数で決する","a":true,"e":"正しい選択肢となっています"},{"f":"kubun","fn":"共有・区分所有法","q":"管理者は理害関係人の請求があった時は正当な理由がある場合を除き契約の閲覧を拒番ではならない","a":true,"e":"正当な理由がある場合を除いて番ではならないとされています"},{"f":"kubun","fn":"共有・区分所有法","q":"最初に建物の占油部分の全部を所有するものは構成証書により共有部分の全部について持ち分割合を定める規約を設定することができる","a":false,"e":"ちょっと細かいんですけどこの共有部分の持ち分割合を定める規約は設定できないとされていますちなみに規約の設定でできるのはこの4つになります1つ目規約共有部分に関する定め2つ目規約敷地の定め3つ目敷地利用権の分離処分ができる胸の定め4つ目敷地利用権の持ち分割合に関する定めとなっています細かいんですけどたまに聞かれるとこなので頑張って抑えていただけたらと思います"},{"f":"kubun","fn":"共有・区分所有法","q":"所有者は規約に別断の定めがない限り集会の決議によって管理者を選任することができるこの場合人気の規定はない","a":true,"e":"この場合人気の規定はないとされています"},{"f":"kubun","fn":"共有・区分所有法","q":"敷地利用権が数人で有する所有権の場合区分所有者は規約に別断の定めがない限りその有する占油部分とその占油部分にかかる敷地要件とを分離して処分することができる","a":false,"e":"気約に別断の定めがない限り分離して処分はできないとされています"},{"f":"kubun","fn":"共有・区分所有法","q":"共有部分は原則として区分所有者全員の共有に属するが規約で別談の定めをすることを妨げず管理者であっても気約に特別な定めがある時は共有部分を所有することができる","a":true,"e":"管理者でも共有部分を所有することができるとされています"},{"f":"kubun","fn":"共有・区分所有法","q":"集会の招集の通知は区分所有者が管理者に対して通知を受け取る場所をあかじめ通知した場合には管理者はその場所に当ててすれば足りる","a":true,"e":"この場合管理者はその場所に当ててすれば足りるとされています"},{"f":"kubun","fn":"共有・区分所有法","q":"AB及びCが持ち分を各1/3とする甲地を共有している甲地全体がDによって不法に占い場合Aは単独でDに対して甲地の開け渡しを請求できる","a":true,"e":"不法選挙者に開け渡しは単独ですることができるとされています"},{"f":"kubun","fn":"共有・区分所有法","q":"AB及びCが持ち分を各1/3とするたちを共有しているaB及びCは5年を超えない期間内は後たちを分割しない胸の契約を締結することができる
