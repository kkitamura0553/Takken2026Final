<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1e3a5f">
<title>宅建マスター</title>
<style>

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f8f9fb;--card:#fff;--card2:#f8fafc;--text:#111827;--text2:#6b7280;--text3:#9ca3af;--border:#e5e7eb;--green:#10b981;--green-bg:#f0fdf4;--green-border:#d1fae5;--red:#dc2626;--red-bg:#fef2f2;--amber:#f59e0b;--blue:#2563eb;--navy:#1e3a5f}
@media(prefers-color-scheme:dark){:root{--bg:#0f1117;--card:#1a1d27;--card2:#1f2233;--text:#e5e7eb;--text2:#9ca3af;--text3:#6b7280;--border:#2d3040;--green-bg:#052e16;--green-border:#064e3b;--red-bg:#1c0a0a}}
body{font-family:-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;overscroll-behavior:none}
.header{background:linear-gradient(135deg,#1e3a5f 0%,#2563eb 100%);color:#fff;padding:calc(env(safe-area-inset-top,20px) + 12px) 16px 14px;position:sticky;top:0;z-index:20}
.header-sub{font-size:10px;letter-spacing:2px;opacity:.65;margin-bottom:2px}
.header h1{font-size:19px;font-weight:800;line-height:1.3}
.mode-tabs{display:flex;gap:4px;margin-top:10px}
.mode-tab{flex:1;padding:7px;border-radius:8px;border:none;font-size:12px;font-weight:700;cursor:pointer;text-align:center;transition:.15s;background:rgba(255,255,255,.15);color:rgba(255,255,255,.7)}
.mode-tab.active{background:#fff;color:#1e3a5f}
.progress-row{margin-top:8px;display:flex;align-items:center;gap:10px}
.progress-bar{flex:1;background:rgba(255,255,255,.2);border-radius:6px;height:7px;overflow:hidden}
.progress-fill{height:100%;background:#34d399;border-radius:6px;transition:width .3s}
.progress-label{font-size:11px;white-space:nowrap}
.tabs{display:flex;gap:5px;padding:8px 10px;overflow-x:auto;position:sticky;top:0;z-index:15;background:var(--bg);border-bottom:1px solid var(--border);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:6px 11px;border-radius:18px;border:none;font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:.15s;background:#e5e7eb;color:#374151}
.tab.active{color:#fff}
.cat-bar{padding:7px 16px;display:flex;justify-content:space-between;font-size:11.5px;font-weight:600;border-bottom:2px solid currentColor}
.info-bar{padding:6px 16px;font-size:11px;color:var(--text3);display:flex;justify-content:space-between}
.cards{padding:0 10px 100px}
.card{margin-bottom:7px;border-radius:10px;border:1px solid var(--border);background:var(--card);overflow:hidden;transition:.15s}
.card.done{border-color:var(--green-border);background:var(--green-bg)}
.card-head{display:flex;align-items:flex-start;gap:10px;padding:11px 11px 9px}
.chk{width:26px;height:26px;min-width:26px;border-radius:7px;border:2px solid #d1d5db;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:1px;transition:.15s;font-size:13px;font-weight:800;color:#fff}
.chk.on{border-color:var(--green);background:var(--green)}
.card-body{flex:1;min-width:0;cursor:pointer}
.badges{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-bottom:3px}
.badge{font-size:9.5px;padding:2px 6px;border-radius:4px;color:#fff;font-weight:600}
.stars{font-size:11.5px;color:var(--amber);letter-spacing:-1px}
.topic-name{font-size:13.5px;font-weight:700;line-height:1.4;transition:.15s}
.card.done .topic-name{color:var(--text2);text-decoration:line-through}
.tap-hint{font-size:10px;color:var(--text3);margin-top:1px}
.detail{padding:0 11px 13px 11px;font-size:12.5px;line-height:1.7;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.sec{margin-bottom:12px}
.sec-title{font-weight:700;font-size:11px;letter-spacing:1px;margin-bottom:4px;display:flex;align-items:center;gap:4px}
.sec-box{padding:10px;border-radius:8px;border-left:3px solid;background:var(--card2);font-size:12.5px;line-height:1.75}
.sec-box p{margin-bottom:6px}
.sec-box p:last-child{margin-bottom:0}
.rule{display:flex;gap:6px;margin-bottom:4px;font-size:12px}
.rule-label{font-weight:700;min-width:auto;white-space:nowrap;color:var(--navy)}
.compare-table{width:100%;border-collapse:collapse;font-size:11px;margin:6px 0}
.compare-table th,.compare-table td{border:1px solid var(--border);padding:4px 6px;text-align:center}
.compare-table th{background:var(--card2);font-weight:700;font-size:10px}
.trap-item{display:flex;gap:5px;margin-bottom:5px}
.trap-num{color:var(--red);font-weight:700;font-size:11.5px;min-width:15px}
.trap-text{font-size:12px;line-height:1.55}
.footer{padding:20px 16px;text-align:center}
.reset-btn{padding:10px 24px;border-radius:8px;border:1px solid #fca5a5;background:var(--card);color:var(--red);font-size:12.5px;font-weight:600;cursor:pointer}
.footer-note{font-size:10px;color:var(--text3);margin-top:12px;line-height:1.5}
.quiz-card{margin-bottom:10px;border-radius:10px;border:1px solid var(--border);background:var(--card);overflow:hidden}
.quiz-header{padding:10px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.quiz-cat{font-size:9.5px;padding:2px 6px;border-radius:4px;color:#fff;font-weight:600}
.quiz-num{font-size:11px;color:var(--text3)}
.quiz-q{padding:12px;font-size:13.5px;line-height:1.7;font-weight:500}
.quiz-btns{display:flex;gap:8px;padding:0 12px 12px}
.quiz-btn{flex:1;padding:12px;border-radius:8px;border:2px solid var(--border);background:var(--card);font-size:16px;font-weight:800;cursor:pointer;transition:.15s;text-align:center}
.quiz-btn:active{transform:scale(.96)}
.quiz-btn.correct{border-color:var(--green);background:var(--green-bg);color:var(--green)}
.quiz-btn.wrong{border-color:var(--red);background:var(--red-bg);color:var(--red)}
.quiz-btn.highlight{border-color:var(--green);background:var(--green-bg)}
.quiz-explanation{padding:0 12px 12px;animation:fadeIn .2s}
.quiz-exp-box{padding:10px;border-radius:8px;font-size:12px;line-height:1.6}
.quiz-exp-box.correct-bg{background:var(--green-bg);border:1px solid var(--green-border)}
.quiz-exp-box.wrong-bg{background:var(--red-bg);border:1px solid #fca5a5}
.quiz-result-icon{font-size:14px;font-weight:800;margin-bottom:4px}
.quiz-score{text-align:center;padding:20px;margin:10px;border-radius:12px;background:var(--card);border:1px solid var(--border)}
.quiz-score-num{font-size:36px;font-weight:800;color:var(--navy)}
.quiz-score-label{font-size:13px;color:var(--text2);margin-top:4px}
.quiz-next{display:block;width:100%;padding:12px;margin-top:8px;border-radius:8px;border:none;background:var(--navy);color:#fff;font-size:13px;font-weight:700;cursor:pointer}
.quiz-filter{display:flex;gap:6px;padding:8px 12px;flex-wrap:wrap}
.quiz-filter-btn{padding:5px 10px;border-radius:14px;border:1px solid var(--border);background:var(--card);font-size:11px;cursor:pointer;transition:.15s}
.quiz-filter-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}

.page-nav{display:flex;justify-content:center;gap:6px;padding:10px;flex-wrap:wrap}
.page-btn{padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--card);font-size:12px;cursor:pointer}
.page-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.page-btn:disabled{opacity:.4;cursor:default}
</style>
</head>
<body>
<div id="app"></div>
<script>
const C=[
{id:"kenri",name:"権利関係",color:"#2563eb",questions:"問1〜14",target:"7/14以上"},
{id:"takken",name:"宅建業法",color:"#059669",questions:"問26〜45",target:"17/20以上"},
{id:"hourei",name:"法令上の制限",color:"#d97706",questions:"問15〜22",target:"5/8以上"},
{id:"zei",name:"税・その他",color:"#7c3aed",questions:"問23〜25等",target:"5/8以上"}
];
const cM={};C.forEach(c=>cM[c.id]=c);
const fL=f=>"★".repeat(f)+"☆".repeat(5-f);
const T=[
// ========== 権利関係 ==========
{id:"k01",cat:"kenri",topic:"意思表示（詐欺・強迫・虚偽表示・錯誤）",freq:5,
desc:`<p>意思表示とは、法律効果の発生を望む意思を外部に表示する行為ですしかし、その意思に瑕疵（問題）がある場合、効力に影響が出ます。宅建では4類型の区別が最重要です。</p>
<p><b>① 心裡留保（93条）</b>＝冗談や嘘の意思表示。<b>原則有効</b>ですが、相手方が表意者の真意でないことを<b>知っていた（悪意）or 知ることができた（有過失）</b>場合は<b>無効</b>になります。善意の第三者には対抗できません。</p>
<p><b>② 虚偽表示（94条）</b>＝相手方と通じてする嘘の意思表示。<b>常に無効</b>です。ただし<b>善意の第三者</b>には対抗できません。ここで「善意」に過失の有無は問われない点が重要です。</p>
<p><b>③ 錯誤（95条）</b>＝勘違いによる意思表示。「意思表示に対応する意思を欠く錯誤」又は「動機の錯誤（動機が表示されている場合）」で、その錯誤が法律行為の目的等に照らし重要な場合に<b>取消し可能</b>です。ただし、表意者に<b>重大な過失</b>があれば原則取消し不可。例外として、相手方が悪意or重過失の場合、又は相手方も同一の錯誤の場合は取消し可能です。</p>
<p><b>④ 詐欺（96条）</b>＝だまされた意思表示は<b>取消し可能</b>。ただし取消しは<b>善意無過失の第三者に対抗できない</b>（R2改正で「無過失」が追加）。第三者による詐欺の場合は、相手方が悪意or有過失の場合にのみ取消し可能。</p>
<p><b>⑤ 強迫（96条）</b>＝脅された意思表示は<b>取消し可能</b>。詐欺と異なり<b>第三者保護規定がない</b>ため、善意無過失の第三者にも対抗できます。被害者保護が最も厚い類型です。</p>`,
traps:["詐欺の第三者保護＝善意<b>無過失</b>（R2改正）vs 強迫＝第三者保護なし","虚偽表示の「善意の第三者」に過失の有無は<b>不問</b>","錯誤の重大な過失→取消不可。ただし相手方が悪意/重過失なら<b>例外的に取消可</b>","心裡留保は<b>原則有効</b>（無効ではない）。相手方が悪意・有過失で無効"]},

{id:"k02",cat:"kenri",topic:"代理（無権代理・表見代理）",freq:5,
desc:`<p>代理とは、代理人が本人のために意思表示をし、その効果が直接本人に帰属する制度です。代理権がないのに代理行為をした場合が<b>無権代理</b>、代理権があるように見える外観がある場合が<b>表見代理</b>です。</p>
<p><b>【無権代理の効果】</b>本人に効果は帰属しません。ただし本人が<b>追認</b>すれば遡って有効になります。相手方には以下の権利があります：①催告権（本人に追認するか確答を求める）②取消権（善意の場合のみ）③無権代理人への責任追及（善意無過失の場合）</p>
<p><b>【無権代理と相続】</b>最頻出の複合論点です。<b>無権代理人が本人を相続</b>した場合→追認拒否は信義則に反し、<b>当然に有効</b>。逆に<b>本人が無権代理人を相続</b>した場合→本人としての追認拒否権は消滅せず、<b>追認拒否可能</b>です。</p>
<p><b>【表見代理の3類型】</b><br>
・<b>109条</b>：代理権授与の表示による表見代理（実際には代理権を与えていないのに与えたように見せた場合）<br>
・<b>110条</b>：権限外の行為の表見代理（与えた代理権の範囲を超えた行為をした場合）<br>
・<b>112条</b>：代理権消滅後の表見代理（代理権が消滅した後に代理行為をした場合）</p>
<p><b>【代理権の濫用】</b>R2改正で明文化。代理人が自己の利益のために代理権を行使した場合、相手方が悪意or有過失なら<b>無権代理とみなす</b>（本人に効果不帰属）。</p>`,
traps:["無権代理人→本人を相続＝<b>当然有効</b> vs 本人→無権代理人を相続＝<b>追認拒否可</b>","表見代理3類型（109条・110条・112条）の要件の混同","代理権の濫用＝相手方が悪意・有過失なら<b>無権代理とみなす</b>"]},

{id:"k03",cat:"kenri",topic:"時効（取得時効・消滅時効）",freq:4,
desc:`<p>時効とは、一定期間の経過により権利の取得（取得時効）や権利の消滅（消滅時効）を認める制度です。</p>
<p><b>【取得時効】</b>他人の物を一定期間占有し続けることで所有権を取得できます。<br>
・<b>善意無過失</b>で占有開始→<b>10年</b>で取得<br>
・<b>それ以外</b>（悪意or有過失）→<b>20年</b>で取得<br>
善意無過失の判定時期は<b>占有開始時</b>です。途中で悪意になっても影響しません。</p>
<p><b>【消滅時効（R2改正で統一）】</b>債権は以下のいずれか早い方で消滅します：<br>
・<b>権利を行使できることを知った時から5年</b>（主観的起算点）<br>
・<b>権利を行使できる時から10年</b>（客観的起算点）<br>
人の生命・身体の侵害による損害賠償請求権は、主観5年/客観<b>20年</b>に延長されます。</p>
<p><b>【時効の援用】</b>時効は自動的に適用されず、<b>当事者が援用</b>（主張）する必要があります。裁判所が職権で適用することはできません。援用できるのは、時効の完成により直接利益を受ける者です。</p>
<p><b>【時効完成後の債務承認】</b>時効が完成した後に債務者が債務を承認すると、信義則により、もはや時効の援用はできなくなります。</p>`,
traps:["消滅時効の二本立て＝<b>知った時から5年</b> or <b>行使できる時から10年</b>","時効の援用は<b>当事者が必要</b>（裁判所は職権で適用しない）","取得時効の善意無過失の判断時点は<b>占有開始時</b>","時効完成後の債務承認→もはや<b>時効援用不可</b>"]},

{id:"k04",cat:"kenri",topic:"不動産物権変動・対抗要件",freq:5,
desc:`<p>不動産の物権変動（所有権の移転等）は、<b>登記</b>がなければ第三者に対抗（主張）できません（177条）。ただし、ここでいう「第三者」は限定的に解釈されています。</p>
<p><b>【第三者に該当しない者】</b>以下の者には登記なくても対抗可能：<br>
・<b>背信的悪意者</b>＝単に悪意なだけでなく、信義に反する態様で登記の欠缺を主張する者<br>
・不法占拠者、無権利者、不法行為者<br>
・前主（売主）や相続人</p>
<p><b>【取消しと第三者】</b>極めて重要な論点です。<br>
・<b>取消し前</b>の第三者→第三者が<b>善意無過失</b>なら保護される（取消しを対抗できない）<br>
・<b>取消し後</b>の第三者→<b>対抗関係</b>になり、先に登記を備えた方が勝つ</p>
<p><b>【相続と登記（R1改正）】</b><br>
・<b>法定相続分の範囲内</b>→登記なくても第三者に対抗可<br>
・<b>法定相続分を超える部分</b>（遺言・遺産分割等）→<b>登記がなければ対抗できない</b><br>
この改正は、相続において登記の重要性を高めるために行われました。</p>`,
traps:["<b>背信的悪意者</b>は177条の「第三者」に該当しない","取消し<b>前</b>の第三者＝善意無過失で保護 / 取消し<b>後</b>の第三者＝登記の先後","相続でも法定相続分<b>超過</b>部分は<b>登記必要</b>（R1改正）"]},

{id:"k05",cat:"kenri",topic:"抵当権",freq:5,
desc:`<p>抵当権は、債務者が債務を弁済しない場合に、担保目的物から優先的に弁済を受けられる権利です。目的物の占有は移転せず、設定者が使用収益を続けられます。</p>
<p><b>【法定地上権（388条）】</b>抵当権の実行により土地と建物が別々の所有者に帰属した場合に、建物のために自動的に成立する地上権です。成立要件（すべて必要）：<br>
① <b>抵当権設定時に</b>土地上に建物が存在すること（←最重要！更地に抵当権→後に建物建築は×）<br>
② 抵当権設定時に土地と建物が<b>同一の所有者</b>に属すること<br>
③ 競売により土地と建物が<b>別々の所有者</b>になったこと</p>
<p><b>【物上代位】</b>抵当権の効力は、目的物の売却代金、賃料、損害賠償金などにも及びます。ただし、<b>払渡し又は引渡しの前に差押え</b>をすることが必要です。賃料への物上代位も認められています（判例）。</p>
<p><b>【抵当権消滅請求】</b>抵当不動産の<b>第三取得者</b>（抵当不動産を買い受けた人）が、抵当権者に対して一定の金額を払って抵当権の消滅を請求する制度です。<b>主たる債務者や保証人は請求できない</b>点に注意。</p>`,
traps:["法定地上権＝「<b>抵当権設定時に建物が存在</b>」が絶対条件","物上代位＝「<b>払渡し前に差押え</b>」が必要。賃料にも物上代位可","抵当権消滅請求＝<b>第三取得者のみ</b>可（主債務者・保証人は不可）"]},

{id:"k06",cat:"kenri",topic:"契約不適合責任",freq:4,
desc:`<p>R2年改正で、旧「瑕疵担保責任」が<b>「契約不適合責任」</b>に全面改正されました。引き渡された目的物が「種類・品質・数量」に関して契約の内容に適合しない場合、買主は以下の救済手段を行使できます。</p>
<p><b>【4つの救済手段】</b>（原則としてこの順序で行使）<br>
<b>① 追完請求</b>＝修補・代替物・不足分の引渡しを請求<br>
<b>② 代金減額請求</b>＝原則として<b>まず追完の催告が必要</b>。催告しても追完がない場合に減額請求可。例外として、追完が不能・売主が追完拒絶・定期行為・催告しても追完の見込みがない場合は催告不要<br>
<b>③ 損害賠償請求</b>＝売主に<b>帰責事由が必要</b><br>
<b>④ 解除</b>＝売主の<b>帰責事由は不要</b>（R2改正の重要ポイント）</p>
<p><b>【通知期間】</b>買主が不適合を<b>知った時から1年以内に通知</b>すれば足ります。旧法では「1年以内に権利行使」が必要でしたが、改正後は<b>通知だけ</b>でOKです。具体的な請求は通知後でも可能。</p>
<p><b>【数量に関する不適合】</b>数量不適合には期間制限がありません（通知なしで請求可）。種類・品質の不適合とは扱いが異なります。</p>`,
traps:["代金減額は原則「<b>まず追完の催告</b>」が必要","<b>解除は帰責事由不要</b>、損害賠償は帰責事由<b>必要</b>（R2改正）","不適合を「知った時から<b>1年以内に通知</b>」（権利行使ではない）"]},

{id:"k07",cat:"kenri",topic:"連帯債務・保証",freq:4,
desc:`<p><b>【連帯債務のR2改正】</b>連帯債務者の一人に処した事由が他の連帯債務者に影響するかが最重要論点です。R2改正で<b>絶対効は大幅に縮小</b>されました。</p>
<p><b>絶対効（他の債務者にも効力が及ぶ）</b>＝<b>弁済・更改・混同・相殺</b>の4つだけ<br>
<b>相対効（その債務者にしか効力が及ばない）</b>＝請求・免除・時効の完成など（旧法では絶対効だったが改正で相対効に変更）</p>
<p><b>【保証と連帯保証の違い】</b><br>
通常の保証人には①<b>催告の抗弁権</b>（まず主債務者に請求せよ）と②<b>検索の抗弁権</b>（主債務者の財産から先に執行せよ）があります。<br>
<b>連帯保証人にはこの2つの抗弁権がありません</b>。債権者は直接連帯保証人に全額請求できます。</p>
<p><b>【個人根保証（R2改正）】</b>一定の範囲に属する不特定の債務を保証する個人根保証契約は、<b>極度額を定めなければ無効</b>です。貸金等根保証契約に限らず、すべての個人根保証に拡大されました（例：賃貸借の連帯保証）。</p>
<p><b>【事業用融資の保証】</b>事業用融資の保証人になろうとする個人は、原則として<b>公正証書</b>で保証の意思を確認する必要があります。ただし、主債務者の配偶者等は例外。</p>`,
traps:["連帯債務の絶対効＝<b>弁済・更改・混同・相殺</b>の4つのみ","連帯保証人には<b>催告・検索の抗弁権なし</b>","個人根保証は<b>極度額の定めが必要</b>（なければ無効）"]},

{id:"k08",cat:"kenri",topic:"賃貸借・借地借家法",freq:5,
desc:`<p>不動産の賃貸借は民法の規定と借地借家法の特則が交差する最重要分野です。</p>
<p><b>【賃借権の対抗力】</b>以下のいずれかがあれば第三者に対抗可能：<br>
・賃借権の<b>登記</b>（民法の原則だが、貸主に協力義務なし）<br>
・<b>借地上の建物の登記</b>（借地権の場合）<br>
・<b>建物の引渡し</b>（借家権の場合）</p>
<p><b>【敷金（R2改正で明文化）】</b>敷金返還義務は、<b>賃貸借の終了＋目的物の明渡し</b>の両方が揃った時に発生します。賃貸借終了だけでは返還義務は生じません。また、賃貸人が変わった場合、敷金関係は<b>新賃貸人に当然に承継</b>されます。</p>
<p><b>【借地権の存続期間】</b><br>
<table class="compare-table"><tr><th></th><th>当初</th><th>1回目更新</th><th>2回目以降</th></tr>
<tr><td><b>普通借地権</b></td><td>30年</td><td>20年</td><td>10年</td></tr></table>
借知人に不利な特約は無効です（短縮する特約は無効）。</p>
<p><b>【定期借地権の3類型】</b><br>
<table class="compare-table"><tr><th>類型</th><th>期間</th><th>要件</th></tr>
<tr><td>一般定期</td><td>50年以上</td><td>書面で特約</td></tr>
<tr><td>建物譲渡特約付</td><td>30年以上</td><td>建物譲渡の特約</td></tr>
<tr><td>事業用定期</td><td>10年以上50年未満</td><td>公正証書</td></tr></table></p>`,
traps:["敷金返還＝「賃貸借終了」＋「<b>明渡し</b>」の<b>両方</b>が必要","普通借地権＝<b>30年→20年→10年</b>（短縮特約無効）","定期借地権3類型の期間・要件の混同が狙われる"]},

{id:"k09",cat:"kenri",topic:"借地借家法（借家権）",freq:5,
desc:`<p><b>【普通建物賃貸借】</b><br>
・期間の定めあり：1年以上（<b>1年未満の定めは「期間の定めなし」とみなす</b>）<br>
・更新拒絶には<b>正当事由</b>が必要（立退料の提供だけでは不十分、総合考慮）<br>
・対抗力＝<b>建物の引渡し</b>があれば第三者に対抗可能</p>
<p><b>【定期建物賃貸借】</b>更新がなく、期間満了で確定的に終了する借家契約です。成立要件：<br>
① <b>書面</b>（公正証書でなくてもOK）による契約<br>
② 契約前に「更新がなく期間満了で終了する」旨を<b>書面で説明</b>する<br>
→ この書面説明を怠ると<b>普通借家契約</b>になってしまう（頻出ひっかけ）</p>
<p><b>【定期借家の中途解約】</b>原則として中途解約はできません。例外として、<b>床面積200㎡未満の居住用</b>建物で、やむを得ない事情がある場合に限り、借主から中途解約の申入れが可能です。</p>
<p><b>【造作買取請求権】</b>賃貸人の同意を得て付加した造作について、賃貸借終了時に賃貸人に買取りを請求できる権利です。ただし<b>特約で排除可能</b>（強行規定ではない）です。</p>`,
traps:["<b>1年未満</b>の期間の定め＝「期間の定めなし」とみなす","定期借家＝<b>書面で説明</b>しないと普通借家になる","中途解約＝<b>200㎡未満の居住用</b>のみ可","造作買取請求権＝特約で<b>排除可能</b>"]},

{id:"k10",cat:"kenri",topic:"相続",freq:4,
desc:`<p><b>【法定相続分】</b>暗記必須の数字です。<br>
<table class="compare-table"><tr><th>相続人の組合せ</th><th>配偶者</th><th>他方</th></tr>
<tr><td>配偶者＋子</td><td>1/2</td><td>1/2</td></tr>
<tr><td>配偶者＋直系尊属</td><td>2/3</td><td>1/3</td></tr>
<tr><td>配偶者＋兄弟姉妹</td><td>3/4</td><td>1/4</td></tr></table>
子・直系尊属・兄弟姉妹が複数いる場合は均等に分けます。代襲相続（子が先に死亡→孫が代わりに相続）にも注意。</p>
<p><b>【遺留分】</b>一定の相続人に保証される最低限の取り分です。<br>
・<b>直系尊属のみが相続人</b>→被相続人の財産の<b>1/3</b><br>
・<b>それ以外</b>→被相続人の財産の<b>1/2</b><br>
兄弟姉妹には遺留分がありません。</p>
<p><b>【遺留分侵害額請求（R1改正）】</b>旧法では「減殺請求」で現物返還でしたが、改正後は<b>金銭請求に一本化</b>されました。「お金で解決する」という制度に変わった点が重要です。</p>
<p><b>【相続放棄】</b>相続開始を知った時から3ヶ月以内に<b>家庭裁判所に申述</b>して行います。相続人間の合意だけでは相続放棄にはなりません。放棄した者は最初から相続人でなかったものとみなされます。</p>`,
traps:["法定相続分：配偶者＋子＝<b>1/2ずつ</b>、＋直系尊属＝<b>2/3:1/3</b>、＋兄弟姉妹＝<b>3/4:1/4</b>","遺留分侵害額請求は<b>金銭請求に一本化</b>（現物返還ではない）","相続放棄は<b>家庭裁判所への申述</b>が必要"]},

{id:"k11",cat:"kenri",topic:"区分所有法",freq:4,
desc:`<p>マンションの法律関係を規律する法律です。集会の決議要件の数字が頻出です。</p>
<p><b>【決議要件の比較】</b><br>
<table class="compare-table"><tr><th>事項</th><th>要件</th></tr>
<tr><td>普通決議（管理行為等）</td><td>区分所有者及び議決権の各<b>過半数</b></td></tr>
<tr><td>規約の設定・変更・廃止</td><td>各<b>3/4以上</b></td></tr>
<tr><td>共用部分の重大変更</td><td>各<b>3/4以上</b></td></tr>
<tr><td><b>建替え決議</b></td><td>各<b>4/5以上</b></td></tr></table></p>
<p><b>【共用部分の管理・変更】</b><br>
・<b>保存行為</b>＝各共有者が単独で可能<br>
・<b>管理行為</b>（通常の管理）＝過半数で決定<br>
・<b>変更行為</b>（形状又は効用の著しい変更）＝3/4以上</p>
<p><b>【管理者】</b>集会の決議で選任。<b>区分所有者以外の者も管理者になれます</b>（法人も可）。管理者は共用部分等の保存・管理に関して区分所有者を代理します。</p>
<p><b>【規約の効力】</b>規約は区分所有者の特定承継人（購入者）にも効力が及びます。賃借人などの占有者は「建物の使用」に関する規約に従う義務があります。</p>`,
traps:["建替え決議＝各<b>4/5以上</b>（最も厳しい要件）","規約の設定変更廃止＝各<b>3/4以上</b>","管理者は<b>区分所有者以外</b>でもなれる（法人も可）"]},

{id:"k12",cat:"kenri",topic:"不動産登記法",freq:4,
desc:`<p><b>【登記制度の基本原則】</b><br>
日本の不動産登記には<b>推定力</b>（登記された権利関係は一応正しいと推定される）はありますが、<b>公信力はありません</b>。つまり、登記を信頼して取引しても、登記が実体と異なれば権利を取得できません。</p>
<p><b>【登記申請の原則】</b><br>
・<b>共同申請主義</b>＝登記権利者と登記義務者が共同で申請するのが原則<br>
・<b>単独申請</b>が認められる例外：所有権保存登記、相続登記、判決による登記、仮登記の抹消（仮登記名義人）等</p>
<p><b>【仮登記】</b>本登記をするための手続上の条件が備わっていない場合に、将来の本登記の<b>順位を保全</b>するための登記です。<b>仮登記には対抗力がありません</b>。本登記をして初めて対抗力が発生しますが、その順位は仮登記の順位に遡ります。</p>
<p><b>【相続登記の義務化（R6年4月施行）】</b>不動産を取得した相続人は、取得を知った日から<b>3年以内</b>に相続登記を申請しなければなりません。正当な理由なく怠ると過料の対象になります。</p>`,
traps:["登記には<b>公信力はない</b>（推定力はある）","仮登記は<b>対抗力なし</b>→<b>順位保全効</b>のみ","相続登記の義務化＝<b>3年以内</b>に申請"]},

// ========== 宅建業法 ==========
{id:"t01",cat:"takken",topic:"重要事項説明（35条書面）",freq:5,
desc:`<p>宅建業法で最も出題数が多い最重要論点です。物件を取得し、又は借りようとする者に対し、契約が成立する<b>前</b>に、取引に関する重要な事項を説明する制度です。</p>
<p><b>【誰が・誰に・いつ】</b><br>
・<b>説明者</b>＝<b>宅地建物取引士</b>が行い、35条書面に<b>記名</b>する（R4改正で押印廃止）<br>
・<b>交付</b>＝宅建士でなくても可能（事務員でもOK）<br>
・<b>相手方</b>＝取得者・借主に対して行う<br>
・<b>時期</b>＝契約成立<b>前</b>（契約と同時ではダメ）</p>
<p><b>【業者が買主の場合】</b>重要事項の<b>説明は省略</b>できますが、35条書面の<b>交付は省略できません</b>。プロ相手でも書面は渡す必要がある点がひっかけポイントです。</p>
<p><b>【35条と37条の記載事項の振分け】</b>超頻出です。<br>
・<b>35条にあって37条にない</b>もの：法令に基づく制限の概要、飲用水等の供給施設<br>
・<b>37条にあって35条にない</b>もの：<b>代金の額</b>、支払時期・方法、引渡し時期<br>
・<b>両方にある</b>もの：契約不適合担保責任の定めがあるときはその内容</p>
<p><b>【IT重説】</b>R3年以降、売買でもオンラインによる重説が可能になりました。</p>`,
traps:["説明は<b>宅建士</b>が行う（交付は誰でもOK）","<b>代金の額</b>は35条ではなく<b>37条</b>の記載事項","業者が買主でも35条書面の<b>交付は必要</b>（説明は省略可）"]},

{id:"t02",cat:"takken",topic:"37条書面（契約書面）",freq:5,
desc:`<p>宅建業者は、契約が成立したときは、遅滞なく、契約の内容を記載した<b>37条書面を交付</b>しなければなりません。</p>
<p><b>【35条との違い】</b><br>
<table class="compare-table"><tr><th></th><th>35条書面</th><th>37条書面</th></tr>
<tr><td>交付時期</td><td>契約<b>前</b></td><td>契約<b>後</b></td></tr>
<tr><td>説明義務</td><td><b>あり</b>（宅建士が説明）</td><td><b>なし</b>（交付のみ）</td></tr>
<tr><td>記名</td><td>宅建士が記名</td><td>宅建士が記名</td></tr>
<tr><td>交付先</td><td>取得者・借主</td><td><b>両当事者</b></td></tr></table></p>
<p><b>【必要的記載事項】</b>（定めの有無に関わらず必ず記載）<br>
・当事者の氏名住所、物件の所在・面積<br>
・<b>代金の額・支払時期・方法</b>（35条にはない！）<br>
・物件の引渡し時期、移転登記の申請時期</p>
<p><b>【任意的記載事項】</b>（定めがあるときのみ記載）<br>
・<b>損害賠償の予定額・違約金</b><br>
・契約不適合担保責任の内容<br>
・ローン不成立の場合の措置</p>`,
traps:["<b>代金の額</b>は37条の<b>必要的</b>記載事項（35条にはない）","37条書面は<b>説明不要</b>（記名＋交付のみ）","交付先は<b>売主買主双方</b>（35条は取得者・借主のみ）"]},

{id:"t03",cat:"takken",topic:"8種制限（自ら売主制限）",freq:5,
desc:`<p>宅建業者が<b>自ら売主</b>となり、<b>一般消費者が買主</b>となる場合に適用される消費者保護規定です。8つの制限があります。</p>
<p><b>【最重要ポイント】業者間取引には8種制限は一切適用されません。</b>これが最大のひっかけです。</p>
<p><b>【主な制限の内容】</b><br>
<b>① クーリングオフ</b>：<b>事務所等以外</b>の場所で申込み・契約をした場合、<b>書面で告げられた日から8日以内</b>に書面で撤回可能。ただし引渡し＋代金全額支払い後は不可。</p>
<p><b>② 手付の額の制限</b>：代金の<b>20%（10分の2）を超える手付は受領不可</b>。受領した手付は<b>解約手付とみなす</b>（証約手付・違約手付としても、解約手付の性質が認められる）。</p>
<p><b>③ 損害賠償の予定等の制限</b>：損害賠償の予定＋違約金の合計が代金の<b>20%を超える部分は無効</b>（全体が無効ではなく、超える部分のみ無効）。</p>
<p><b>④ 自己の所有に属しない物件の売買制限</b>：原則として他人物売買・未完成物件の売買は禁止。ただし、確実に取得できる場合（売買契約等がある場合）は例外的に可能。</p>`,
traps:["<b>業者間取引には適用なし</b>（最重要ひっかけ）","クーリングオフ＝「<b>事務所等以外</b>」で申込み→<b>書面で8日以内</b>","手付は代金の<b>20%超は受領不可</b>、性質は<b>解約手付</b>とみなす","損害賠償の予定＝20%超の<b>部分</b>が無効（全体ではない）"]},

{id:"t04",cat:"takken",topic:"免許制度",freq:4,
desc:`<p><b>【宅建業とは】</b>宅地又は建物の<b>売買・交換</b>を自ら行うこと、又は売買・交換・<b>賃借の媒介・代理</b>を業として行うことです。<br>
<b>「自ら賃貸」は宅建業に該当しません</b>（最重要）。アパート経営、サブリース業者も免許不要です。</p>
<p><b>【免許の種類】</b><br>
・<b>国土交通大臣免許</b>＝2以上の都道府県に事務所を設置<br>
・<b>都道府県知事免許</b>＝1の都道府県のみに事務所を設置<br>
基準は<b>事務所の所在地</b>であり、取引を行う場所ではありません。</p>
<p><b>【有効期間と更新】</b><br>
・有効期間＝<b>5年</b><br>
・更新申請＝期間満了の<b>90日前から30日前</b>まで<br>
・更新申請中に期間満了→処分があるまで従前の免許は有効</p>
<p><b>【欠格事由】</b>以下に該当すると免許を受けられません（主要なもの）：<br>
・拘禁刑以上の刑に処せられ、執行終了から<b>5年</b>を経過しない者<br>
・宅建業法違反等で罰金刑に処せられ、執行終了から<b>5年</b>を経過しない者<br>
・免許取消処分を受けてから<b>5年</b>を経過しない者<br>
・法人の<b>役員</b>が欠格事由に該当→法人も免許不可</p>`,
traps:["<b>自ら賃貸は宅建業に該当しない</b>（最重要）","免許の有効期間＝<b>5年</b>、更新は<b>90日前〜30日前</b>","法人の<b>役員</b>が欠格事由→<b>法人も</b>免許取消し"]},

{id:"t05",cat:"takken",topic:"宅建士制度",freq:4,
desc:`<p><b>【独占業務】</b>宅建士でなければできない業務は<b>3つだけ</b>です：<br>
① <b>重要事項の説明</b>（35条）<br>
② <b>35条書面への記名</b><br>
③ <b>37条書面への記名</b><br>
これ以外（書面の交付、物件案内、契約の勧誘等）は宅建士でなくてもOKです。</p>
<p><b>【専任の宅建士の設置義務】</b><br>
事務所ごとに、業務に従事する者<b>5人に1人以上</b>の割合で、専任の宅建士を設置しなければなりません。不足した場合は<b>2週間以内</b>に補充しなければなりません。</p>
<p><b>【登録と宅建士証】</b><br>
・登録＝試験合格地の<b>都道府県知事</b>に登録（一度登録すれば一生有効）<br>
・<b>登録の移転</b>＝他の都道府県に移る場合は任意（義務ではない）。新たな試験は不要<br>
・<b>宅建士証</b>＝有効期間<b>5年</b>。更新には法定講習の受講が必要<br>
・事務禁止処分中でも登録の移転は可能（よく出る）</p>`,
traps:["独占業務＝<b>3つだけ</b>（重説・35条記名・37条記名）","専任の宅建士＝<b>5人に1人</b>以上","登録の移転＝<b>任意</b>（義務ではない）、新試験<b>不要</b>"]},

{id:"t06",cat:"takken",topic:"営業保証金・保証協会",freq:4,
desc:`<p>取引の相手方を保護するため、宅建業者は<b>営業保証金の供託</b>か<b>保証協会への加入</b>のいずれかが必要です。</p>
<p><b>【営業保証金 vs 弁済業務保証金分担金】</b><br>
<table class="compare-table"><tr><th></th><th>営業保証金</th><th>分担金</th></tr>
<tr><td>主たる事務所</td><td><b>1,000万円</b></td><td><b>60万円</b></td></tr>
<tr><td>従たる事務所</td><td><b>500万円</b></td><td><b>30万円</b></td></tr>
<tr><td>供託先</td><td>主たる事務所の最寄りの供託所</td><td>保証協会に納付</td></tr></table></p>
<p><b>【保証協会のルール】</b><br>
・保証協会は<b>2つ</b>（全宅、全日）あり、<b>二重加入は不可</b><br>
・保証協会の社員は営業保証金を供託する必要なし<br>
・社員でなくなった場合は、<b>1週間以内</b>に営業保証金を供託</p>
<p><b>【還付後の補充】</b><br>
・営業保証金の場合：通知書の送付を受けてから<b>2週間以内</b>に不足額を供託<br>
・弁済業務保証金の場合：社員は通知を受けてから<b>2週間以内</b>に分担金を納付</p>`,
traps:["営業保証金＝主<b>1,000万</b>/従<b>500万</b>（分担金は主60万/従30万）","保証協会の<b>二重加入不可</b>","還付後の補充＝いずれも<b>2週間以内</b>"]},

{id:"t07",cat:"takken",topic:"媒介契約",freq:4,
desc:`<p>媒介契約には3つの類型があり、規制内容が異なります。数字の正確な暗記が必須です。</p>
<p><b>【3類型の比較表】</b><br>
<table class="compare-table"><tr><th></th><th>一般</th><th>専任</th><th>専属専任</th></tr>
<tr><td>他業者への依頼</td><td>可</td><td><b>不可</b></td><td><b>不可</b></td></tr>
<tr><td>自己発見取引</td><td>可</td><td>可</td><td><b>不可</b></td></tr>
<tr><td>レインズ登録</td><td>義務なし</td><td><b>7日以内</b></td><td><b>5日以内</b></td></tr>
<tr><td>業務報告</td><td>義務なし</td><td><b>2週間に1回</b></td><td><b>1週間に1回</b></td></tr>
<tr><td>有効期間</td><td>制限なし</td><td><b>3ヶ月以内</b></td><td><b>3ヶ月以内</b></td></tr></table></p>
<p><b>【有効期間の注意点】</b>専任・専属専任は3ヶ月以内で、<b>自動更新は不可</b>です。更新は依頼者からの申出がある場合に限られます。3ヶ月を超える特約は3ヶ月に短縮されます。</p>`,
traps:["専属専任＝自己発見取引<b>不可</b>・レインズ<b>5日</b>・報告<b>1週間に1回</b>","専任＝レインズ<b>7日</b>・報告<b>2週間に1回</b>","有効期間＝<b>3ヶ月以内</b>（<b>自動更新不可</b>）"]},

{id:"t08",cat:"takken",topic:"報酬額の制限",freq:5,
desc:`<p>宅建業者が受領できる報酬額には法定の上限があります。計算問題が毎年出題されます。</p>
<p><b>【売買の媒介報酬（速算式）】</b><br>
<table class="compare-table"><tr><th>売買代金（税抜）</th><th>報酬率</th></tr>
<tr><td>200万円以下</td><td>5%</td></tr>
<tr><td>200万円超〜400万円以下</td><td>4%+2万円</td></tr>
<tr><td><b>400万円超</b></td><td><b>3%+6万円</b></td></tr></table>
※ 税抜の本耐火格に対して計算し、最後に<b>消費税を加算</b>します。<br>
※ 媒介の場合、<b>片方の当事者</b>から受領できる上限額。双方から受領する場合は×2。</p>
<p><b>【賃貸の媒介報酬】</b><br>
貸主と借主の<b>合計で借賃の1ヶ月分＋消費税</b>が上限です。居住用建物の場合、依頼者の承諾がなければ、一方から受領できるのは<b>半月分</b>が上限です。</p>
<p><b>【低廉な空家等の特例】</b>400万円以下の売買で、通常より多くの現地調査費用がかかる場合、売主から受領できる報酬は<b>18万円＋消費税</b>まで可能です。</p>`,
traps:["400万円<b>超</b>＝3%+6万円（ちょうど400万円は4%+2万円）","賃貸の報酬＝<b>合計</b>で借賃の<b>1ヶ月分</b>","低廉な空家＝売主から<b>18万円+税</b>まで可"]},

// ========== 法令上の制限 ==========
{id:"h01",cat:"hourei",topic:"都市計画法（用途地域・開発許可）",freq:5,
desc:`<p><b>【都市計画区域の構成】</b><br>
・<b>市街化区域</b>＝すでに市街地or10年以内に市街化を図る区域。<b>用途地域を必ず定める</b><br>
・<b>市街化調整区域</b>＝市街化を抑制する区域。用途地域は<b>原則定めない</b><br>
・<b>非線引き区域</b>＝区域区分を定めていない区域</p>
<p><b>【開発許可制度】</b>開発行為（建築物の建築等を目的とした土地の区画形質の変更）を行うには許可が必要です。面積要件の暗記が必須です。<br>
<table class="compare-table"><tr><th>区域</th><th>許可が必要な面積</th></tr>
<tr><td><b>市街化区域</b></td><td><b>1,000㎡以上</b></td></tr>
<tr><td><b>市街化調整区域</b></td><td><b>面積問わず原則必要</b></td></tr>
<tr><td>非線引き・準都市計画区域</td><td>3,000㎡以上</td></tr>
<tr><td>都市計画区域外</td><td>10,000㎡以上</td></tr></table></p>
<p><b>【許可不要の例外】</b><br>
・<b>農林漁業用の建築物</b>＝市街化区域<b>以外</b>では許可不要。市街化区域では許可必要<br>
・公益上必要な建築物（駅舎、図書館、公民館等）<br>
・都市計画事業の施行として行う開発行為</p>`,
traps:["市街化区域＝<b>1,000㎡以上</b>で許可必要","市街化調整区域＝<b>面積問わず原則必要</b>","農林漁業用建築物は<b>市街化区域では許可必要</b>（区域外では不要）"]},

{id:"h02",cat:"hourei",topic:"建築基準法（容積率・建ぺい率）",freq:5,
desc:`<p><b>【容積率】</b>＝延べ面積÷敷地面積。建物の総ボリュームを制限します。<br>
前面道路の幅員が<b>12m未満</b>の場合、以下の計算値と指定容積率の<b>小さい方</b>が適用されます：<br>
・<b>住居系</b>用途地域→幅員×<b>4/10</b><br>
・<b>その他</b>（商業系等）→幅員×<b>6/10</b><br>
例：第一種住居地域、前面道路6m、指定容積率300%の場合→6m×4/10=240% < 300% → <b>240%</b>が適用</p>
<p><b>【建ぺい率】</b>＝建築面積÷敷地面積。敷地に対する建物の広がりを制限します。<br>
<b>緩和措置</b>（加算）：<br>
・<b>角地</b>→<b>+10%</b><br>
・<b>防火地域内の耐火建築物</b>→<b>+10%</b><br>
・両方該当→<b>+20%</b>（併用可能）<br>
・建ぺい率が8/10の地域で、かつ防火地域内の耐火建築物→<b>建ぺい率制限なし</b></p>
<p><b>【セットバック】</b>2項道路（幅員4m未満の道路）に面する敷地では、道路中心から2mの線まで後退が必要です。<b>セットバック部分は敷地面積に算入できません</b>。</p>
<p><b>【日影規制】</b><b>商業・工業・工業専用地域</b>には適用されません。</p>`,
traps:["前面道路12m未満→住居系は<b>幅員×4/10</b>、その他は<b>×6/10</b>","角地<b>+10%</b>＋防火地域内耐火<b>+10%</b>＝<b>+20%</b>併用可","セットバック部分は<b>敷地面積に算入しない</b>"]},

{id:"h03",cat:"hourei",topic:"建築基準法（道路・建築確認）",freq:4,
desc:`<p><b>【建築基準法上の道路】</b>原則として幅員<b>4m以上</b>のものです（特定行政庁指定区域では6m）。<br>
<b>2項道路（みなし道路）</b>＝建築基準法施行時（昭和25年）に既に建物が立ち並んでいた幅員4m未満の道で、特定行政庁が指定したもの。道路の<b>中心線から2m</b>の線まで後退（セットバック）が必要です。</p>
<p><b>【接道義務】</b>建築物の敷地は、建築基準法上の道路に<b>2m以上</b>接しなければなりません。地方公共団体の条例でこの要件を<b>付加</b>することは可能（例：3m以上）ですが、<b>緩和</b>はできません。</p>
<p><b>【建築確認】</b>建築物を建築する前に、建築計画が法令に適合しているか確認を受ける手続です。<br>
・<b>都市計画区域内</b>＝すべての建築物に確認が必要<br>
・<b>都市計画区域外</b>＝特殊建築物（200㎡超）や大規模建築物のみ確認必要</p>
<p><b>【用途変更】</b>建築物の用途を変更する場合、類似用途間（例：劇場→映画館）の変更は確認不要。<b>200㎡超</b>の特殊建築物への用途変更は確認が必要です。</p>`,
traps:["道路＝原則幅員<b>4m以上</b>","2項道路→<b>中心から2m</b>セットバック","接道義務＝道路に<b>2m以上</b>接すること"]},

{id:"h04",cat:"hourei",topic:"農地法",freq:4,
desc:`<p>農地の権利移動や転用を規制する法律です。3条・4条・5条の区別が核心です。</p>
<p><b>【3条・4条・5条の比較】</b><br>
<table class="compare-table"><tr><th></th><th>3条（権利移動）</th><th>4条（転用）</th><th>5条（転用目的の権利移動）</th></tr>
<tr><td>内容</td><td>農地のまま売買・貸借</td><td>自分の農地を農地以外に</td><td>農地を転用目的で売買等</td></tr>
<tr><td>許可権者</td><td><b>農業委員会</b></td><td><b>都道府県知事</b></td><td><b>都道府県知事</b></td></tr>
<tr><td>市街化区域の特例</td><td><b>なし（許可必要）</b></td><td>届出でOK</td><td>届出でOK</td></tr></table></p>
<p><b>【重要ポイント】</b><br>
・市街化区域内の農地は4条・5条については<b>農業委員会への届出</b>で足りますが、<b>3条は市街化区域内でも許可が必要</b>です（ひっかけ注意）<br>
・<b>相続</b>による取得→3条<b>許可不要</b>。ただし農業委員会への<b>届出は必要</b><br>
・許可なく転用した場合→<b>原状回復命令</b>の対象</p>`,
traps:["3条＝<b>農業委員会</b>、4条・5条＝<b>都道府県知事</b>","市街化区域内→4条5条は<b>届出でOK</b>だが<b>3条は許可必要</b>","相続＝許可不要だが<b>届出は必要</b>"]},

{id:"h05",cat:"hourei",topic:"国土利用計画法",freq:3,
desc:`<p>一定面積以上の土地取引について、都道府県知事への届出を義務づける法律です。</p>
<p><b>【事後届出の面積要件】</b><br>
<table class="compare-table"><tr><th>区域</th><th>届出が必要な面積</th></tr>
<tr><td>市街化区域</td><td><b>2,000㎡以上</b></td></tr>
<tr><td>市街化調整区域・非線引き</td><td><b>5,000㎡以上</b></td></tr>
<tr><td>都市計画区域外</td><td><b>10,000㎡以上</b></td></tr></table></p>
<p><b>【届出の手続】</b><br>
・届出義務者＝<b>権利取得者（買主）</b>（売主ではない）<br>
・届出時期＝契約締結後<b>2週間以内</b><br>
・届出先＝土地が所在する市町村長を経由して都道府県知事へ</p>
<p><b>【届出不要の取引】</b><br>
・当事者の一方が<b>国・地方公共団体</b>の場合<br>
・農地法3条の許可を受けた場合<br>
・民事調停法による調停に基づく場合 等</p>`,
traps:["面積＝市街化<b>2,000㎡</b>／調整等<b>5,000㎡</b>／区域外<b>10,000㎡</b>","届出義務者＝<b>買主</b>（売主ではない）","届出は契約後<b>2週間以内</b>"]},

// ========== 税・その他 ==========
{id:"z01",cat:"zei",topic:"不動産取得税・固定資産税",freq:4,
desc:`<p><b>【不動産取得税】</b><br>
・課税主体＝<b>都道府県</b>（国税ではない）<br>
・課税対象＝不動産の取得（売買・贈与・建築等）<br>
・<b>非課税</b>＝<b>相続</b>による取得、包括遺贈。ただし<b>贈与は課税</b>される<br>
・特定遺贈（特定の財産を指定する遺贈）は<b>課税</b><br>
・住宅の課税標準特例＝<b>1,200万円控除</b>（認定長期優良住宅は1,300万円）<br>
・免税点＝土地<b>10万円</b>、家屋（建築）<b>23万円</b>、家屋（売買）<b>12万円</b></p>
<p><b>【固定資産税】</b><br>
・課税主体＝<b>市町村</b>（東京23区は都）<br>
・賦課期日＝毎年<b>1月1日</b>の所有者に課税（年途中の売買でも1/1の所有者が納税義務者）<br>
・住宅用地の特例：<b>小規模住宅用地</b>（200㎡以下）＝課税標準×<b>1/6</b>、<b>一般住宅用地</b>＝課税標準×<b>1/3</b><br>
・新築住宅の減額＝<b>3年間</b>（3階建以上の耐火建築物は<b>5年間</b>）税額を<b>1/2</b>に減額<br>
・免税点＝土地<b>30万円</b>、家屋<b>20万円</b></p>`,
traps:["不動産取得税：<b>相続は非課税</b>、贈与は課税","固定資産税の賦課期日＝<b>1月1日</b>（4月1日ではない）","住宅用地の特例＝小規模<b>1/6</b>、一般<b>1/3</b>"]},

{id:"z02",cat:"zei",topic:"譲渡所得税",freq:4,
desc:`<p>不動産を譲渡した場合の所得税に関する特例です。居住用財産の特例が頻出します。</p>
<p><b>【3,000万円特別控除】</b><br>
・居住用財産を譲渡した場合、譲渡所得から<b>3,000万円を控除</b>できる<br>
・所有期間の長短は<b>問わない</b>（短期でも適用可）<br>
・居住しなくなってから<b>3年目の年末まで</b>に譲渡すれば適用可<br>
・<b>配偶者・直系血族</b>への譲渡は適用除外</p>
<p><b>【軽減税率の特例】</b><br>
・所有期間<b>10年超</b>の居住用財産を譲渡した場合に適用<br>
・6,000万円以下の部分→<b>14%</b>（所得税10%＋住民税4%）<br>
・3,000万円控除と<b>併用可能</b></p>
<p><b>【買換え特例】</b><br>
・居住用財産を売って新たに居住用財産を取得した場合、譲渡所得の課税を繰延べ<br>
・3,000万円控除とは<b>選択適用</b>（<b>併用不可</b>）</p>`,
traps:["3,000万円控除＝所有期間<b>問わず</b>適用可","軽減税率＝所有期間<b>10年超</b>が要件。3,000万円控除と<b>併用可</b>","買換え特例と3,000万円控除は<b>併用不可</b>（選択適用）"]},

{id:"z03",cat:"zei",topic:"景品表示法・住宅金融支援機構",freq:3,
desc:`<p><b>【景品表示法（不動産の表示に関する公正競争規約）】</b><br>
・徒歩時間＝道路距離<b>80m</b>につき<b>1分</b>で算出。端数は<b>切上げ</b>（例：160m=2分、240m=3分）<br>
・「<b>新築</b>」と表示できる条件＝建築後<b>1年未満</b>かつ<b>未入居</b>（どちらか一方でも欠ければ不可）<br>
・<b>最上級表現</b>（「日本一」「完全」「最高」等）は、合理的根拠がなければ使用不可<br>
・おとり広告＝実際には取引できない物件の広告は禁止</p>
<p><b>【住宅金融支援機構法】</b><br>
・機構は<b>直接融資を原則行わない</b>（証券化支援業務が中心）<br>
・<b>フラット35の仕組み</b>：民間金融機関が融資→機構が住宅ローン債権を買い取り→MBS（住宅ローン担保証券）として投資家に売却<br>
・融資対象の床面積＝一戸建て<b>70㎡以上</b>、マンション<b>30㎡以上</b><br>
・直接融資の例外＝災害復興住宅、マンション共用部分リフォーム、財形住宅融資等</p>`,
traps:["徒歩＝<b>80mにつき1分</b>（端数切上げ）","新築＝建築後<b>1年未満</b>かつ<b>未入居</b>","機構は<b>直接融資を原則行わない</b>（証券化支援が中心）"]}
];
const BQ=[{"f":"kihon","fn":"宅建業の基本","q":"宅地とは、建物の敷地に供する土地をいい、道路、公園、河川、広場及び水路に供するものは宅地には当たらない。","a":true,"e":"用途地域内の土地は原則として宅地に該当しますが、道路・公園・河川・広場・水路に供するものは除外されます。"},{"f":"kihon","fn":"宅建業の基本","q":"都市計画法に規定する用途地域内の土地は、建物の敷地に供されているかどうかに関わらず、すべて宅地に該当する。","a":false,"e":"用途地域内でも、道路・公園・河川・広場・水路に供する土地は宅地に該当しません。"},{"f":"kihon","fn":"宅建業の基本","q":"用途地域外の土地で、建物の敷地に供されていないものは、宅地に該当しない。","a":true,"e":"用途地域外では、現に建物の敷地に供されている土地のみが宅地に該当します。"},{"f":"kihon","fn":"宅建業の基本","q":"宅地建物取引業とは、宅地又は建物の売買、交換又は賃借の代理若しくは媒介を業として行うことをいう。","a":true,"e":"売買・交換を自ら行うこと、及び売買・交換・賃借の代理・媒介を業として行うことが宅建業です。"},{"f":"kihon","fn":"宅建業の基本","q":"自ら所有するアパートを賃貸する行為は、宅地建物取引業に該当する。","a":false,"e":"自ら貸主として賃貸することは宅建業に該当しません。免許不要です。"},{"f":"kihon","fn":"宅建業の基本","q":"農業協同組合が組合員の所有する宅地の売却の代理を業として営む場合、宅建業の免許が必要である。","a":true,"e":"農業協同組合は免許不要団体には該当しないため、宅建業を営む場合は免許が必要です。"},{"f":"kihon","fn":"宅建業の基本","q":"国及び地方公共団体は、宅地建物取引業の免許を受ける必要がない。","a":true,"e":"国・地方公共団体は宅建業法の適用除外であり、免許は不要です。"},{"f":"kihon","fn":"宅建業の基本","q":"信託会社が宅地建物取引業を営もうとする場合、国土交通大臣の免許を受けなければならない。","a":false,"e":"信託会社は免許不要で、国土交通大臣への届出により宅建業を営むことができます。"},{"f":"kihon","fn":"宅建業の基本","q":"Aが自己所有の宅地を10区画に区画割りし、宅建業者に販売代理を依頼して分譲する場合、Aは免許を受ける必要がある。","a":true,"e":"宅建業者に代理を依頼しても、Aが売主として反復継続的に取引を行うため、A自身にも免許が必要です。"},{"f":"kihon","fn":"宅建業の基本","q":"Aが一棟のマンションを購入し、自ら借主を募集して不特定多数の者に賃貸する場合、Aは免許が必要である。","a":false,"e":"自ら貸主として賃貸することは宅建業に該当しないため、免許は不要です。"},{"f":"kihon","fn":"宅建業の基本","q":"Aがその所有する農地を区画割りし、宅地に転用した上で不特定多数の者に反復継続して売却する場合、Aは免許が必要である。","a":true,"e":"宅地の分譲を業として行うため、免許が必要です。"},{"f":"kihon","fn":"宅建業の基本","q":"Aが借金の返済のため、自己所有の宅地を10区画に区画割りして知人又は友人に対して売却する場合、Aは免許が必要である。","a":true,"e":"知人・友人は不特定多数に該当します。区画割りして反復継続して売却するため、免許が必要です。"},{"f":"kihon","fn":"宅建業の基本","q":"Aが自己所有のマンション1棟を、友人Bに一括して売却する場合、Aは免許が必要である。","a":false,"e":"1回限りの売却であり、反復継続性がないため、宅建業には該当せず免許不要です。"},{"f":"kihon","fn":"宅建業の基本","q":"破産管財人が破産財団に属する宅地を売却する行為は、宅建業に該当する。","a":false,"e":"破産管財人の任務として行う売却は、業として行うものではないため宅建業に該当しません。"},{"f":"kihon","fn":"宅建業の基本","q":"宅建業者が自ら転貸する行為は、宅地建物取引業に該当する。","a":false,"e":"自ら転貸（サブリース）する行為も、自ら貸主として賃貸することと同様に宅建業に該当しません。"},{"f":"kihon","fn":"宅建業の基本","q":"宅地建物取引業における「業として行う」とは、不特定多数の者に対して反復継続して取引を行うことをいう。","a":true,"e":"「業として行う」には、①不特定多数を対象とすること、②反復継続して行うこと、③社会通念上事業と認められること、が必要です。"},{"f":"kihon","fn":"宅建業の基本","q":"Aが相続により取得した宅地を10区画に分割し、宅建業者に媒介を依頼して不特定多数の者に分譲する場合、Aは免許が必要である。","a":true,"e":"媒介を依頼しても、Aが売主として反復継続的に分譲するため、A自身にも免許が必要です。"},{"f":"kihon","fn":"宅建業の基本","q":"地方住宅供給公社は、宅地建物取引業の免許を受ける必要がない。","a":true,"e":"地方住宅供給公社は宅建業法の適用除外であり、免許は不要です。"},{"f":"kihon","fn":"宅建業の基本","q":"ソーラーパネルの設置のために土地を取得する行為は、宅地建物取引業に該当しない。","a":true,"e":"ソーラーパネルは建物に該当せず、その敷地も宅地に該当しないため、宅建業には該当しません。"},{"f":"kihon","fn":"宅建業の基本","q":"建設会社が建物の建築請負のみを行い、売買等を行わない場合、宅建業の免許は不要である。","a":true,"e":"建築請負は宅建業に該当しません。宅地又は建物の売買、交換、又はその代理・媒介を業として行う場合に免許が必要です。"},{"f":"menkyo","fn":"免許","q":"甲県のみに事務所を設置して宅建業を営もうとする者は、甲県知事の免許を受けなければならない。","a":true,"e":"1つの都道府県のみに事務所を設置する場合は、その都道府県知事の免許が必要です。"},{"f":"menkyo","fn":"免許","q":"甲県に本店、乙県に支店を設置して宅建業を営もうとする者は、国土交通大臣の免許を受けなければならない。","a":true,"e":"2以上の都道府県に事務所を設置する場合は国土交通大臣免許です。"},{"f":"menkyo","fn":"免許","q":"宅建業の免許の有効期間は3年である。","a":false,"e":"免許の有効期間は5年です。更新申請は期間満了の90日前から30日前までに行います。"},{"f":"menkyo","fn":"免許","q":"免許の更新申請中に有効期間が満了した場合、処分がなされるまで従前の免許は効力を有する。","a":true,"e":"更新申請中に期間満了しても、処分がなされるまでは従前の免許が引き続き有効です。"},{"f":"menkyo","fn":"免許","q":"甲県に本店、乙県に支店を有するA社が、乙県の支店でのみ宅建業を営む場合でも、国土交通大臣免許が必要である。","a":true,"e":"宅建業を営むかどうかに関わらず、2以上の都道府県に事務所がある以上、大臣免許が必要です。ただし、本店は宅建業を営むものとみなされます。"},{"f":"menkyo","fn":"免許","q":"宅建業者D社（甲県知事免許）が、乙県内に案内所を設置して分譲を行う場合、国土交通大臣への免許換えが必要である。","a":false,"e":"案内所は事務所ではないため、免許換えは不要です。"},{"f":"menkyo","fn":"免許","q":"A社（甲県知事免許）が甲県の事務所を廃止し、乙県のみに事務所を設置する場合、乙県知事へ免許換えの申請を行う。","a":true,"e":"事務所を置く都道府県が変わる場合、新たな免許権者へ免許換えの申請が必要です。廃業届出は不要です。"},{"f":"menkyo","fn":"免許","q":"法人の役員が拘禁刑以上の刑に処せられた場合、その法人は免許の欠格事由に該当する。","a":true,"e":"法人の役員が欠格事由に該当すると、法人自体も免許を受けることができません。"},{"f":"menkyo","fn":"免許","q":"法人の役員が傷害罪で罰金刑に処せられた場合、刑の執行終了から5年を経過しなければ法人は免許を受けられない。","a":true,"e":"傷害罪は欠格事由となる罪に該当するため、罰金刑でも5年間は免許を受けられません。"},{"f":"menkyo","fn":"免許","q":"法人の役員が道路交通法違反で罰金刑に処せられた場合、法人は免許の欠格事由に該当する。","a":false,"e":"道路交通法違反は欠格事由となる罪には該当しません。欠格事由となるのは宅建業法違反、暴力的犯罪、背任罪等による罰金刑です。"},{"f":"menkyo","fn":"免許","q":"暴行罪により拘留の刑に処せられた者が法人の役員にいる場合、当該法人は免許の欠格事由に該当する。","a":false,"e":"拘留は欠格事由に該当しません。欠格事由となるのは拘禁刑以上の刑です。"},{"f":"menkyo","fn":"免許","q":"破産手続開始の決定を受けた者は、復権を得てから5年を経過しなければ免許を受けることができない。","a":false,"e":"破産者は復権を得ればすぐに免許を受けることができます。5年間待つ必要はありません。"},{"f":"menkyo","fn":"免許","q":"宅建業法に違反して罰金刑に処せられた場合、刑の執行が終わった日から5年間は免許を受けることができない。","a":true,"e":"宅建業法違反による罰金刑は欠格事由に該当し、5年間は免許を受けることができません。"},{"f":"menkyo","fn":"免許","q":"免許取消処分を受けた者は、取消しの日から5年を経過しなければ免許を受けることができない。","a":true,"e":"免許取消処分から5年間は欠格事由に該当します。"},{"f":"menkyo","fn":"免許","q":"法人の代表取締役が法人税法違反により拘禁刑に処せられた場合、執行猶予が付されてもその法人は免許を取り消される。","a":true,"e":"拘禁刑（拘禁刑以上の刑）に処せられた場合、執行猶予が付されても欠格事由に該当し、免許は取り消されます。"},{"f":"menkyo","fn":"免許","q":"心身の故障により宅建業を適正に営むことができない者は、免許の欠格事由に該当する。","a":true,"e":"心身の故障により宅建業を適正に営むことができない者として国土交通省令で定めるものは、欠格事由に該当します。"},{"f":"menkyo","fn":"免許","q":"宅建業者が合併により消滅した場合、消滅した法人を代表する役員であった者が30日以内にその旨を届け出なければならない。","a":true,"e":"合併消滅の届出は、消滅した法人の代表者であった者が行います。届出期限は合併の日から30日以内です。"},{"f":"menkyo","fn":"免許","q":"個人である宅建業者が死亡した場合、その相続人は死亡した日から30日以内に届け出なければならない。","a":false,"e":"届出期限は「死亡した日から」ではなく「死亡を知った日から」30日以内です。"},{"f":"menkyo","fn":"免許","q":"法人である宅建業者が破産手続開始の決定を受けた場合、破産管財人が届け出なければならない。","a":true,"e":"破産の届出義務者は破産管財人です。届出期限は30日以内です。"},{"f":"menkyo","fn":"免許","q":"個人である宅建業者が廃業した場合、本人が届け出なければならない。","a":true,"e":"個人の廃業届出は本人が行います。届出期限は廃業の日から30日以内です。"},{"f":"menkyo","fn":"免許","q":"宅建業者の監査役の氏名に変更があった場合、30日以内に変更の届出をしなければならない。","a":true,"e":"役員の氏名は免許申請時の記載事項であるため、変更があれば30日以内に届出が必要です。"},{"f":"menkyo","fn":"免許","q":"宅建業者の使用人の本籍地が変更になった場合、変更の届出が必要である。","a":false,"e":"政令で定める使用人の本籍地の変更は、届出事項ではありません。届出が必要なのは氏名・住所の変更です。"},{"f":"menkyo","fn":"免許","q":"免許換えの場合、廃業の届出を行った上で新たな免許を申請しなければならない。","a":false,"e":"免許換えの場合、廃業届出は不要です。直接新たな免許権者に免許換えの申請を行います。"},{"f":"menkyo","fn":"免許","q":"宅建業者A（国土交通大臣免許）が、甲県の本店を廃止し、すべての事務所を乙県内に移した場合、乙県知事へ免許換えの申請を行う。","a":true,"e":"事務所が1つの都道府県のみとなるため、乙県知事免許への免許換えが必要です。"},{"f":"menkyo","fn":"免許","q":"免許申請中の者は、免許を受ける前であっても宅建業を営むことができる。","a":false,"e":"免許を受けるまでは宅建業を営むことはできません。無免許営業は罰則の対象です。"},{"f":"menkyo","fn":"免許","q":"執行猶予期間が満了した場合、その翌日から免許を受けることができる。","a":true,"e":"執行猶予期間が満了すると刑の言渡しの効力が失われるため、直ちに免許を受けることができます。5年間待つ必要はありません。"},{"f":"menkyo","fn":"免許","q":"成年者と同一の行為能力を有しない未成年者は、いかなる場合も免許を受けることができない。","a":false,"e":"未成年者であっても、法定代理人が欠格事由に該当しなければ免許を受けることができます。"},{"f":"menkyo","fn":"免許","q":"営業に関し成年者と同一の行為能力を有する未成年者は、その者自身が欠格事由に該当しなければ免許を受けることができる。","a":true,"e":"婚姻した未成年者や営業許可を受けた未成年者は、本人自身の欠格事由で判断されます。"},{"f":"menkyo","fn":"免許","q":"免許取消処分の聴聞の期日の公示日から処分決定日までの間に、相当の理由なく廃業届を提出した場合、届出から5年間は免許を受けることができない。","a":true,"e":"聴聞公示後に廃業届を提出して処分を免れようとした場合、廃業届の日から5年間は免許の欠格事由に該当します。"},{"f":"takkenshi","fn":"宅地建物取引士","q":"宅地建物取引士の独占業務は、重要事項の説明、35条書面への記名、及び37条書面への記名の3つである。","a":true,"e":"この3つが独占業務です。書面の交付自体は宅建士でなくても行えます。"},{"f":"takkenshi","fn":"宅地建物取引士","q":"専任の宅地建物取引士は、事務所ごとに業務に従事する者5人に1人以上の割合で設置しなければならない。","a":true,"e":"5人に1人以上です。不足した場合は2週間以内に補充しなければなりません。"},{"f":"takkenshi","fn":"宅地建物取引士","q":"宅建士が転居した場合、遅滞なく変更の登録を申請しなければならない。","a":true,"e":"氏名、住所、本籍、勤務先に変更があった場合、遅滞なく登録先の都道府県知事に変更の登録を申請します。"},{"f":"takkenshi","fn":"宅地建物取引士","q":"宅建士の登録の移転は義務であり、勤務先の都道府県が変わった場合は必ず移転しなければならない。","a":false,"e":"登録の移転は義務ではなく任意です。移転する場合でも新たな試験の合格は不要です。"},{"f":"takkenshi","fn":"宅地建物取引士","q":"宅建士証の有効期間は5年であり、更新には法定講習の受講が必要である。","a":true,"e":"宅建士証の有効期間は5年で、更新時には都道府県知事が指定する法定講習を受講しなければなりません。"},{"f":"takkenshi","fn":"宅地建物取引士","q":"事務禁止処分を受けた宅建士は、処分期間中であっても登録の移転をすることができる。","a":true,"e":"事務禁止処分中でも登録の移転は可能です。"},{"f":"takkenshi","fn":"宅地建物取引士","q":"宅建士証を亡失した場合、再交付の申請をしなければならない。","a":true,"e":"宅建士証の亡失・滅失の場合は、登録先の知事に再交付の申請を行います。"},{"f":"takkenshi","fn":"宅地建物取引士","q":"宅建士証の再交付を受けた後に亡失した宅建士証を発見した場合、発見した宅建士証を速やかに返納しなければならない。","a":true,"e":"再交付後に旧証を発見した場合は、速やかに旧証を返納します。"},{"f":"takkenshi","fn":"宅地建物取引士","q":"宅建士が拘禁刑以上の刑に処せられた場合、登録は消除される。","a":true,"e":"拘禁刑以上の刑は欠格事由に該当するため、登録は消除されます。本人は届出義務があります。"},{"f":"takkenshi","fn":"宅地建物取引士","q":"宅建士が登録の消除を受けた場合、宅建士証を返納しなければならない。","a":true,"e":"登録消除の場合は、速やかに宅建士証を交付を受けた知事に返納します。"},{"f":"takkenshi","fn":"宅地建物取引士","q":"宅建士は、取引の関係者から請求がなくても、重要事項の説明の際に宅建士証を提示しなければならない。","a":true,"e":"重要事項の説明時には、請求がなくても宅建士証の提示が義務です。"},{"f":"takkenshi","fn":"宅地建物取引士","q":"宅建士は、取引の関係者から請求があった場合、宅建士証を提示しなければならない。","a":true,"e":"取引関係者からの請求時は、重説の場面に限らず宅建士証を提示する義務があります。"},{"f":"takkenshi","fn":"宅地建物取引士","q":"宅建士の登録は、試験に合格した都道府県の知事に対して行う。","a":true,"e":"登録は合格した都道府県の知事に行います。他の都道府県への移転は任意です。"},{"f":"takkenshi","fn":"宅地建物取引士","q":"宅建士試験に合格した者は、合格後1年以内に登録をしなければ合格が無効になる。","a":false,"e":"登録に期限はありません。試験合格は一生有効で、いつでも登録が可能です。"},{"f":"takkenshi","fn":"宅地建物取引士","q":"宅建士が心身の故障により宅建士の事務を適正に行うことができなくなった場合、登録の消除事由に該当する。","a":true,"e":"心身の故障により事務を適正に行えない者は欠格事由に該当し、登録が消除されます。"},{"f":"takkenshi","fn":"宅地建物取引士","q":"宅建士証の交付を受けていない者であっても、宅建士の登録を受けていれば宅建士としての業務を行うことができる。","a":false,"e":"登録だけでは不十分で、宅建士証の交付を受けて初めて宅建士としての業務を行うことができます。"},{"f":"takkenshi","fn":"宅地建物取引士","q":"事務禁止処分を受けた宅建士は、速やかに宅建士証を交付を受けた知事に提出しなければならない。","a":true,"e":"事務禁止処分を受けた場合、宅建士証を提出する義務があります。処分期間満了後に返還されます。"},{"f":"takkenshi","fn":"宅地建物取引士","q":"宅建士が不正の手段により登録を受けた場合、登録消除処分の対象となる。","a":true,"e":"不正手段による登録は、登録消除の事由に該当します。"},{"f":"takkenshi","fn":"宅地建物取引士","q":"宅建士の登録を受けるためには、2年以上の実務経験又は国土交通大臣の登録を受けた実務講習の修了が必要である。","a":true,"e":"試験合格に加え、2年以上の実務経験、又は登録実務講習の修了が登録の要件です。"},{"f":"takkenshi","fn":"宅地建物取引士","q":"専任の宅建士が不足した場合、宅建業者は4週間以内に補充しなければならない。","a":false,"e":"2週間以内に補充する必要があります。4週間ではありません。"},{"f":"hoshokin","fn":"営業保証金","q":"営業保証金は、主たる事務所につき1,000万円、従たる事務所1箇所につき500万円を供託しなければならない。","a":true,"e":"主たる事務所1,000万円、従たる事務所ごとに500万円です。"},{"f":"hoshokin","fn":"営業保証金","q":"営業保証金の供託先は、主たる事務所の最寄りの供託所である。","a":true,"e":"従たる事務所の分も含め、すべて主たる事務所の最寄りの供託所に供託します。"},{"f":"hoshokin","fn":"営業保証金","q":"営業保証金は、金銭のほか国債証券（額面100%）や地方債証券（額面90%）で供託できる。","a":true,"e":"有価証券でも供託可能です。国債100%、地方債・政府保証債90%、その他の有価証券80%で評価されます。"},{"f":"hoshokin","fn":"営業保証金","q":"宅建業者は、営業保証金を供託した後、その旨を免許権者に届け出た後でなければ事業を開始してはならない。","a":true,"e":"供託→届出→事業開始の順序です。届出前に事業を開始することはできません。"},{"f":"hoshokin","fn":"営業保証金","q":"営業保証金が還付された場合、宅建業者は通知を受けた日から2週間以内に不足額を供託しなければならない。","a":true,"e":"還付後の補充は通知書の送付を受けた日から2週間以内です。"},{"f":"hoshokin","fn":"営業保証金","q":"宅建業者と取引をした者は、その取引により生じた債権について営業保証金から弁済を受けることができる。","a":true,"e":"宅建業に関する取引により生じた債権を有する者は、営業保証金から弁済を受けられます。ただし、宅建業者は除かれます。"},{"f":"hoshokin","fn":"営業保証金","q":"免許権者から不足額の供託を命じられた宅建業者が、その命令に従わない場合、業務停止処分の対象となる。","a":true,"e":"供託命令に従わない場合は業務停止処分、さらに従わなければ免許取消処分の対象となります。"},{"f":"hoshokin","fn":"営業保証金","q":"従たる事務所を新設した場合、その事務所の分の営業保証金を供託し、届け出なければ当該事務所で業務を開始できない。","a":true,"e":"従たる事務所の分も供託・届出が完了してから業務を開始します。"},{"f":"kyokai","fn":"保証協会","q":"弁済業務保証金分担金は、主たる事務所につき60万円、従たる事務所1箇所につき30万円である。","a":true,"e":"営業保証金（主1,000万円/従500万円）と比べて大幅に少額です。"},{"f":"kyokai","fn":"保証協会","q":"保証協会の社員は、営業保証金を供託する必要がない。","a":true,"e":"保証協会に加入すれば、営業保証金の供託に代えて分担金の納付で済みます。"},{"f":"kyokai","fn":"保証協会","q":"宅建業者は、2つの保証協会に同時に加入することができる。","a":false,"e":"二重加入は認められていません。いずれか1つの協会にのみ加入できます。"},{"f":"kyokai","fn":"保証協会","q":"保証協会の社員が社員の地位を失った場合、1週間以内に営業保証金を供託しなければならない。","a":true,"e":"社員の地位を失った場合、1週間以内に営業保証金を供託する必要があります。"},{"f":"kyokai","fn":"保証協会","q":"弁済業務保証金の還付があった場合、社員は通知を受けた日から2週間以内に不足分の還付充当金を納付しなければならない。","a":true,"e":"還付後の補充は通知から2週間以内に還付充当金を保証協会に納付します。"},{"f":"kyokai","fn":"保証協会","q":"保証協会は、宅建業者の相手方等からの苦情の解決の業務を行う。","a":true,"e":"苦情の解決は保証協会の必須業務です。"},{"f":"kyokai","fn":"保証協会","q":"保証協会は、宅地建物取引士等に対する研修を行わなければならない。","a":true,"e":"宅建士等への研修も保証協会の必須業務です。"},{"f":"kyokai","fn":"保証協会","q":"宅建業者が保証協会に加入しようとする場合、加入しようとする日までに分担金を納付しなければならない。","a":true,"e":"分担金は加入日までに納付が必要です。"},{"f":"gyomu","fn":"業務上の規制・事務所等","q":"宅建業者は、事務所ごとに従業者名簿を備え、最終記載日から10年間保存しなければならない。","a":true,"e":"従業者名簿の保存期間は10年間です。帳簿の保存期間5年間と混同しないよう注意が必要です。"},{"f":"gyomu","fn":"業務上の規制・事務所等","q":"宅建業者は、帳簿を各事業年度の末日に閉鎖し、閉鎖後5年間保存しなければならない。","a":true,"e":"帳簿は5年間保存です。ただし、自ら売主の新築住宅の場合は10年間保存が必要です。"},{"f":"gyomu","fn":"業務上の規制・事務所等","q":"従業者は、取引の関係者から請求がなくても、従業者証明書を提示しなければならない。","a":false,"e":"従業者証明書は「取引の関係者から請求があった場合」に提示する義務があります。請求がなければ自ら提示する義務はありません。"},{"f":"gyomu","fn":"業務上の規制・事務所等","q":"宅建業者の守秘義務は、退職後も継続する。","a":true,"e":"正当な理由なく業務上知り得た秘密を漏らしてはならず、この義務は退職後も継続します。"},{"f":"gyomu","fn":"業務上の規制・事務所等","q":"宅建業者は、事務所及び案内所等に標識を掲げなければならない。","a":true,"e":"標識は事務所のほか、契約行為等を行う案内所等にも掲示義務があります。"},{"f":"art34","fn":"34条書面(媒介)","q":"専属専任媒介契約では、依頼者は自ら発見した相手方と直接契約を締結することができない。","a":true,"e":"専属専任媒介では自己発見取引もできません。自己発見取引ができるのは専任と一般です。"},{"f":"art34","fn":"34条書面(媒介)","q":"専任媒介契約の有効期間は、3ヶ月を超えることができない。","a":true,"e":"3ヶ月を超える特約は3ヶ月に短縮されます。自動更新の特約も無効です。"},{"f":"art34","fn":"34条書面(媒介)","q":"専任媒介契約では、7日以内に指定流通機構（レインズ）に登録しなければならない。","a":true,"e":"専任は7日以内、専属専任は5日以内です。一般媒介には登録義務がありません。"},{"f":"art34","fn":"34条書面(媒介)","q":"専属専任媒介契約では、1週間に1回以上の頻度で業務処理状況を報告しなければならない。","a":true,"e":"専属専任は1週間に1回以上、専任は2週間に1回以上です。一般には報告義務がありません。"},{"f":"art34","fn":"34条書面(媒介)","q":"一般媒介契約の場合、指定流通機構への登録義務及び業務報告義務はない。","a":true,"e":"一般媒介にはレインズ登録義務も報告義務もありません。"},{"f":"art34","fn":"34条書面(媒介)","q":"媒介契約書面（34条書面）には、宅地建物取引士の記名が必要である。","a":false,"e":"34条書面への記名義務者は宅建業者です。宅建士の記名が必要なのは35条と37条です。"},{"f":"art34","fn":"34条書面(媒介)","q":"一般媒介契約の有効期間には、法律上の制限がない。","a":true,"e":"有効期間の制限があるのは専任・専属専任のみです。一般媒介には法定の上限はありません。"},{"f":"art35","fn":"35条書面(重要事項説明)","q":"重要事項の説明は、宅地建物取引士が行い、35条書面に記名しなければならない。","a":true,"e":"説明と記名は宅建士の独占業務です。ただし、書面の交付自体は宅建士でなくても可能です。"},{"f":"art35","fn":"35条書面(重要事項説明)","q":"重要事項の説明は、売買契約の締結と同時に行えばよい。","a":false,"e":"契約締結「前」に行わなければなりません。契約と同時では遅すぎます。"},{"f":"art35","fn":"35条書面(重要事項説明)","q":"宅建業者が買主の場合、35条書面の交付も省略することができる。","a":false,"e":"業者が買主の場合、説明は省略可能ですが、35条書面の交付は省略できません。"},{"f":"art35","fn":"35条書面(重要事項説明)","q":"代金の額及びその支払時期は、35条書面の記載事項である。","a":false,"e":"代金の額・支払時期・方法は37条書面の記載事項です。35条の記載事項ではありません。"},{"f":"art35","fn":"35条書面(重要事項説明)","q":"IT重説（オンラインによる重要事項説明）は、売買においても行うことができる。","a":true,"e":"令和3年以降、賃貸に限らず売買でもIT重説が可能になりました。"},{"f":"art35","fn":"35条書面(重要事項説明)","q":"重要事項説明書に、宅建士は押印しなければならない。","a":false,"e":"令和4年改正により、35条書面への押印は不要となりました。記名のみで足ります。"},{"f":"art37","fn":"37条書面(契約書面)","q":"37条書面は、宅地建物取引士の記名が必要であるが、内容の説明は不要である。","a":true,"e":"37条書面は記名のみで、説明義務はありません。35条書面との大きな違いです。"},{"f":"art37","fn":"37条書面(契約書面)","q":"37条書面は、売主及び買主の双方に交付しなければならない。","a":true,"e":"37条書面は契約の両当事者に交付が必要です。35条書面は取得者・借主に交付します。"},{"f":"art37","fn":"37条書面(契約書面)","q":"代金の額、支払時期及び支払方法は、37条書面の必要的記載事項である。","a":true,"e":"代金の額・支払時期・方法は37条の必要的記載事項です。35条ではなく37条に記載する点がポイントです。"},{"f":"art37","fn":"37条書面(契約書面)","q":"損害賠償の予定額は、定めがない場合でも37条書面に記載しなければならない。","a":false,"e":"損害賠償の予定額は「定めがあるとき」のみ記載する任意的記載事項です。"},{"f":"art37","fn":"37条書面(契約書面)","q":"37条書面は、契約成立後遅滞なく交付しなければならない。","a":true,"e":"37条書面は契約成立後に遅滞なく交付します。35条書面は契約前です。"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"8種制限は、宅建業者が売主で宅建業者が買主の場合にも適用される。","a":false,"e":"8種制限は業者間取引には適用されません。業者売主・一般消費者買主の場合にのみ適用されます。"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"クーリングオフは、事務所で買受けの申込みをした場合にも適用される。","a":false,"e":"事務所等以外の場所で申込みをした場合にのみ適用されます。事務所での申込みには適用されません。"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"クーリングオフは、書面で告げられた日から8日以内に、書面で行わなければならない。","a":true,"e":"書面での告知日から8日以内に書面で行います。引渡し＋代金全額支払い後は行使できません。"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"自ら売主の場合、手付金の額は代金の10分の2を超えてはならず、受領した手付は解約手付とみなされる。","a":true,"e":"手付は20%が上限で、性質に関わらず解約手付とみなされます。"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"損害賠償の予定額と違約金の合算額が代金の20%を超える場合、契約全体が無効となる。","a":false,"e":"20%を超える「部分」のみが無効です。契約全体が無効になるわけではありません。"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"宅建業者が自ら売主の場合、他人物売買は一切禁止されている。","a":false,"e":"原則禁止ですが、物件を確実に取得できる場合（売買契約等がある場合）は例外的に可能です。"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"自ら売主の場合、契約不適合責任について民法の規定より買主に不利な特約は無効である。","a":true,"e":"ただし、通知期間を引渡しから2年以上とする特約は有効です。"},{"f":"seigen8","fn":"8種制限(自ら売主)","q":"クーリングオフにより契約が解除された場合、業者は受領した手付金等を返還しなければならない。","a":true,"e":"クーリングオフの場合、業者は損害賠償も違約金も請求できず、受領した金銭は速やかに返還します。"},{"f":"koukoku","fn":"広告・取引の規制","q":"未完成物件は、建築確認等の処分後でなければ広告をすることができない。","a":true,"e":"建築確認等の処分前の広告は禁止されています。契約も同様に処分後でなければできません。"},{"f":"koukoku","fn":"広告・取引の規制","q":"宅建業者は、取引態様を広告時と注文を受けた時にそれぞれ明示しなければならない。","a":true,"e":"取引態様の明示は広告時と注文時の両方で必要です。"},{"f":"koukoku","fn":"広告・取引の規制","q":"おとり広告（実際には取引できない物件の広告）は禁止されている。","a":true,"e":"おとり広告は誇大広告の禁止規定に違反し、処罰の対象となります。"},{"f":"koukoku","fn":"広告・取引の規制","q":"誇大広告の禁止規定は、免許を受けている宅建業者にのみ適用される。","a":false,"e":"誇大広告の禁止は免許の有無に関わらず適用されます。"},{"f":"houshu","fn":"報酬に関する制限","q":"売買代金が400万円を超える場合の媒介報酬は、代金×3%＋6万円（税別）が上限である。","a":true,"e":"400万円超は「3%+6万円」の速算式で計算し、消費税を加算します。"},{"f":"houshu","fn":"報酬に関する制限","q":"売買代金がちょうど400万円の場合、報酬は「代金×3%＋6万円」で計算する。","a":false,"e":"400万円ちょうどは「4%+2万円」で計算します。3%+6万円は400万円「超」の場合です。上限は18万円（税別）。"},{"f":"houshu","fn":"報酬に関する制限","q":"賃貸借の媒介報酬は、貸主及び借主から合計で借賃の2ヶ月分まで受領できる。","a":false,"e":"合計で借賃の1ヶ月分が上限です。2ヶ月分ではありません。"},{"f":"houshu","fn":"報酬に関する制限","q":"居住用建物の賃貸媒介で、依頼者の承諾がない場合、一方から受領できる報酬は借賃の半月分が上限である。","a":true,"e":"居住用建物の場合、承諾がなければ一方から半月分が上限です。承諾があれば1ヶ月分まで可能です。"},{"f":"houshu","fn":"報酬に関する制限","q":"400万円以下の低廉な空家等の売買媒介では、売主から18万円＋消費税まで受領できる。","a":true,"e":"現地調査費用がかかる場合、売主から18万円+消費税まで受領可能です。"},{"f":"kantoku","fn":"監督・罰則","q":"免許権者は、宅建業者に対し指示処分、業務停止処分及び免許取消処分を行うことができる。","a":true,"e":"免許権者は3種類すべての処分が可能です。免許権者以外の知事は指示・業務停止のみです。"},{"f":"kantoku","fn":"監督・罰則","q":"業務停止処分の期間は、最長で1年以内である。","a":true,"e":"業務停止は1年以内です。"},{"f":"kantoku","fn":"監督・罰則","q":"免許取消処分の前には、公開の聴聞を行わなければならない。","a":true,"e":"免許取消し・登録消除の前には公開の聴聞が必要です。"},{"f":"kantoku","fn":"監督・罰則","q":"無免許で宅建業を営んだ者は、3年以下の拘禁刑もしくは300万円以下の罰金に処せられる。","a":true,"e":"無免許営業は3年以下の拘禁刑または300万円以下の罰金です。法人は1億円以下の罰金です。"},{"f":"kantoku","fn":"監督・罰則","q":"業務停止処分に違反して業務を行った場合、免許取消処分の対象となる。","a":true,"e":"業務停止処分への違反は、必要的免許取消事由に該当します。"},{"f":"kashi","fn":"住宅瑕疵担保履行法","q":"住宅瑕疵担保履行法の資力確保措置は、新築住宅の売主である宅建業者に義務づけられている。","a":true,"e":"対象は新築住宅の売主たる宅建業者です。中古住宅や賃貸は対象外です。"},{"f":"kashi","fn":"住宅瑕疵担保履行法","q":"資力確保措置として、保証金の供託と保険への加入のいずれかを選択する必要がある。","a":true,"e":"供託または保険のいずれか（又は併用）が必要です。"},{"f":"kashi","fn":"住宅瑕疵担保履行法","q":"資力確保措置の基準日は、毎年3月31日及び9月30日の年2回である。","a":false,"e":"基準日は毎年3月31日の年1回です。届出は基準日から3週間以内に行います。"},{"f":"kashi","fn":"住宅瑕疵担保履行法","q":"届出を行わなかった宅建業者は、基準日の翌日から起算して50日を経過した日以後、新たに売買契約を締結してはならない。","a":true,"e":"届出がない場合、基準日から50日経過後は新たな売買契約を締結できません。"},{"f":"kashi","fn":"住宅瑕疵担保履行法","q":"保証金の供託と保険への加入を併用することはできない。","a":false,"e":"供託と保険の併用は認められています。"},{"f":"gyomu","fn":"業務上の規制・事務所等","q":"改正前の従業者名簿には従業者の住所、生年月日及び性別の記載が必要であったが、令和7年4月の改正により、これらの記載は不要となった。","a":true,"e":"プライバシー保護の観点から、住所・生年月日・性別は記載事項から削除されました（R7年4月施行）。"},{"f":"gyomu","fn":"業務上の規制・事務所等","q":"宅建業者名簿の登載事項には、事務所ごとに置かれる専任の宅地建物取引士の氏名が含まれる。","a":false,"e":"令和7年4月の改正により、専任宅建士の氏名は宅建業者名簿の登載事項から削除されました。ただし、専任宅建士に変更があった場合の届出義務は残ります。"},{"f":"gyomu","fn":"業務上の規制・事務所等","q":"事務所に掲げる標識（宅地建物取引業者票）には、専任の宅地建物取引士の氏名を記載しなければならない。","a":false,"e":"令和7年4月の改正により、標識への記載は氏名ではなく「専任の宅建士の人数」のみとなりました。また、事務所の代表者の氏名の記載が新たに追加されました。"},{"f":"art34","fn":"34条書面(媒介)","q":"専任媒介契約を締結した宅建業者は、指定流通機構（レインズ）に物件を登録する際、取引の状況（公開中・書面による購入申込みあり等）を登録しなければならない。","a":true,"e":"令和7年1月の改正により、いわゆる「囲い込み」防止のため、レインズ登録時に取引状況の登録が義務化されました。"},{"f":"menkyo","fn":"免許","q":"宅建業者の欠格事由において、「禁錮以上の刑に処せられた者」は「拘禁刑以上の刑に処せられた者」と読み替えられる。","a":true,"e":"令和7年6月施行の刑法改正により、懲役と禁錮が拘禁刑に一本化されました。宅建業法の欠格事由も拘禁刑に読み替えられます。"}];
const HQ=[{"f":"toshi","fn":"都市計画法","q":"市街化区域については、少なくとも用途地域を定めるものとされている。","a":true,"e":"市街化区域は用途地域を必ず定めます。市街化調整区域は原則として用途地域を定めません。"},{"f":"toshi","fn":"都市計画法","q":"市街化調整区域は、おおむね10年以内に優先的かつ計画的に市街化を図るべき区域である。","a":false,"e":"これは市街化区域の説明です。市街化調整区域は市街化を抑制すべき区域です。"},{"f":"toshi","fn":"都市計画法","q":"市街化区域内において1,000㎡以上の開発行為を行う場合、原則として開発許可が必要である。","a":true,"e":"市街化区域では1,000㎡以上で開発許可が必要です。"},{"f":"toshi","fn":"都市計画法","q":"市街化調整区域において行う開発行為で、その規模が300㎡であるものについては、常に開発許可は不要である。","a":false,"e":"市街化調整区域では、規模に関わらず原則として開発許可が必要です。300㎡でも許可が必要です。"},{"f":"toshi","fn":"都市計画法","q":"区域区分の定めのない都市計画区域（非線引き区域）においては、3,000㎡以上の開発行為に開発許可が必要である。","a":true,"e":"非線引き区域及び準都市計画区域では3,000㎡以上で許可が必要です。"},{"f":"toshi","fn":"都市計画法","q":"都市計画区域及び準都市計画区域外の区域において、10,000㎡以上の開発行為を行う場合、開発許可が必要である。","a":true,"e":"都市計画区域外でも10,000㎡（1ha）以上で許可が必要です。"},{"f":"toshi","fn":"都市計画法","q":"市街化調整区域において、農業を営む者の居住用建築物の建築を目的とする開発行為は、開発許可が必要である。","a":false,"e":"農林漁業を営む者の居住用建築物等の建築目的の開発行為は、市街化区域以外では許可不要です。"},{"f":"toshi","fn":"都市計画法","q":"図書館、公民館、変電所その他これらに類する公益上必要な建築物の建築を目的とする開発行為は、開発許可が不要である。","a":true,"e":"駅舎・図書館・公民館・変電所等の公益上必要な建築物の建築目的の開発行為は許可不要です。"},{"f":"toshi","fn":"都市計画法","q":"都市計画事業の施行として行う開発行為は、開発許可が必要である。","a":false,"e":"都市計画事業の施行として行う開発行為は許可不要です。"},{"f":"toshi","fn":"都市計画法","q":"開発許可を受けた開発区域内の土地においては、工事完了の公告があるまでの間は、原則として建築物を建築してはならない。","a":true,"e":"工事完了公告前は原則として建築物の建築が制限されます。"},{"f":"toshi","fn":"都市計画法","q":"高度地区は、用途地域内において市街地の環境を維持し、又は土地利用の増進を図るため、建築物の高さの最高限度又は最低限度を定める地区である。","a":true,"e":"高度地区は建築物の高さの最高限度又は最低限度を定めます。容積率を定める高度利用地区と混同しないよう注意が必要です。"},{"f":"toshi","fn":"都市計画法","q":"高度利用地区は、建築物の高さの最高限度及び最低限度を定める地区である。","a":false,"e":"高度利用地区は容積率の最高限度・最低限度、建ぺい率の最高限度等を定めます。高さを定めるのは高度地区です。"},{"f":"toshi","fn":"都市計画法","q":"準都市計画区域については、用途地域を定めることができる。","a":true,"e":"準都市計画区域でも用途地域を定めることができます。"},{"f":"toshi","fn":"都市計画法","q":"準都市計画区域については、市街地開発事業に関する都市計画を定めることができる。","a":false,"e":"準都市計画区域では市街地開発事業を定めることはできません。"},{"f":"toshi","fn":"都市計画法","q":"田園住居地域は、農業の利便の増進を図りつつ、これと調和した低層住宅に係る良好な住居の環境を保護するため定める地域である。","a":true,"e":"田園住居地域は2018年に新設された用途地域で、農業と調和した低層住宅地の環境保護を目的とします。"},{"f":"toshi","fn":"都市計画法","q":"開発許可を受けた者は、開発行為に関する工事を廃止したときは、遅滞なくその旨を都道府県知事に届け出なければならない。","a":true,"e":"工事を廃止した場合は、遅滞なく都道府県知事への届出が必要です。"},{"f":"toshi","fn":"都市計画法","q":"地区計画は、用途地域が定められている土地の区域においてのみ定めることができる。","a":false,"e":"地区計画は、用途地域が定められていない土地の区域でも一定の場合に定めることができます。"},{"f":"toshi","fn":"都市計画法","q":"開発行為とは、主として建築物の建築又は特定工作物の建設の用に供する目的で行う土地の区画形質の変更をいう。","a":true,"e":"開発行為の定義です。建築物の建築等を目的とした土地の区画形質の変更をいいます。"},{"f":"toshi","fn":"都市計画法","q":"市街化調整区域のうち開発許可を受けた開発区域以外の区域内において建築物を新築する場合、原則として都道府県知事の許可が必要である。","a":true,"e":"市街化調整区域では、開発許可を受けた区域以外でも、建築物の新築等に原則として知事の許可が必要です。"},{"f":"toshi","fn":"都市計画法","q":"用途地域は13種類定められている。","a":true,"e":"用途地域は住居系8種類、商業系2種類、工業系3種類の計13種類です。"},{"f":"kenchiku","fn":"建築基準法","q":"建築基準法上の道路とは、原則として幅員4m以上のものをいう。","a":true,"e":"原則として幅員4m以上です。特定行政庁が指定する区域では6m以上となる場合があります。"},{"f":"kenchiku","fn":"建築基準法","q":"建築基準法が施行された際、現に建築物が立ち並んでいる幅員4m未満の道で特定行政庁が指定したものは、建築基準法上の道路とみなされる。","a":true,"e":"いわゆる2項道路（みなし道路）です。中心線から2mのセットバックが必要です。"},{"f":"kenchiku","fn":"建築基準法","q":"建築物の敷地は、原則として建築基準法上の道路に2m以上接しなければならない。","a":true,"e":"接道義務です。道路に2m以上接する必要があります。"},{"f":"kenchiku","fn":"建築基準法","q":"地方公共団体は、条例により接道義務の要件を緩和することができる。","a":false,"e":"条例による付加（要件を厳しくすること）は可能ですが、緩和はできません。"},{"f":"kenchiku","fn":"建築基準法","q":"2項道路に接する敷地においては、道路の中心線から水平距離2mの線が道路境界線とみなされ、セットバック部分は敷地面積に算入されない。","a":true,"e":"2項道路のセットバック部分は敷地面積に算入できません。"},{"f":"kenchiku","fn":"建築基準法","q":"前面道路の幅員が12m未満である場合、住居系の用途地域における容積率は、前面道路の幅員に10分の4を乗じた数値と指定容積率のいずれか小さい方が適用される。","a":true,"e":"住居系は幅員×4/10、その他は幅員×6/10で計算し、指定容積率と比較して小さい方が適用されます。"},{"f":"kenchiku","fn":"建築基準法","q":"建ぺい率について、防火地域内にある耐火建築物は10分の1が加算され、街区の角にある敷地はさらに10分の1が加算される。","a":true,"e":"防火地域内の耐火建築物+10%、角地+10%で、併用すると+20%となります。"},{"f":"kenchiku","fn":"建築基準法","q":"建ぺい率の限度が10分の8とされている地域内で、かつ防火地域内にある耐火建築物については、建ぺい率の制限は適用されない。","a":true,"e":"建ぺい率80%地域かつ防火地域内の耐火建築物は建ぺい率の制限がなくなります（100%）。"},{"f":"kenchiku","fn":"建築基準法","q":"容積率の計算において、建築物の地階でその天井が地盤面からの高さ1m以下にあるものの住宅の用途に供する部分の床面積は、一定の限度で延べ面積に算入されない。","a":true,"e":"住宅の地下室は、一定の限度（住宅部分の床面積の1/3まで）で容積率算定上不算入となります。"},{"f":"kenchiku","fn":"建築基準法","q":"日影規制は、商業地域、工業地域及び工業専用地域には適用されない。","a":true,"e":"日影規制は住居系の地域等に適用され、商業・工業・工業専用地域には適用されません。"},{"f":"kenchiku","fn":"建築基準法","q":"都市計画区域内においては、原則としてすべての建築物について建築確認が必要である。","a":true,"e":"都市計画区域内では規模に関わらずすべての建築物に建築確認が必要です。"},{"f":"kenchiku","fn":"建築基準法","q":"都市計画区域外においては、いかなる建築物についても建築確認は不要である。","a":false,"e":"都市計画区域外でも、一定規模を超える特殊建築物や大規模建築物には建築確認が必要です。"},{"f":"kenchiku","fn":"建築基準法","q":"用途変更により200㎡を超える特殊建築物とする場合、原則として建築確認が必要である。","a":true,"e":"200㎡超の特殊建築物への用途変更は建築確認が必要です。類似用途間の変更は不要です。"},{"f":"kenchiku","fn":"建築基準法","q":"建築主は、建築確認を受けた建築物の工事が完了した場合、建築主事等の検査を受けなければならない。","a":true,"e":"工事完了後は建築主事等の完了検査を受ける必要があります。"},{"f":"kenchiku","fn":"建築基準法","q":"新築の建築物は、原則として検査済証の交付を受けた後でなければ使用することができない。","a":true,"e":"原則として検査済証の交付後に使用できます。ただし、特定行政庁が仮使用を認めた場合等は例外です。"},{"f":"kenchiku","fn":"建築基準法","q":"既存不適格建築物は、違反建築物として是正命令の対象となる。","a":false,"e":"既存不適格建築物は違反建築物ではありません。増改築時に現行法への適合が求められます。"},{"f":"kenchiku","fn":"建築基準法","q":"特定行政庁は、建築基準法に違反した建築物について、建築主等に対し工事の停止や除却等を命ずることができる。","a":true,"e":"特定行政庁は違反建築物に対し、除却・移転・使用禁止等を命じることができます。"},{"f":"kenchiku","fn":"建築基準法","q":"防火地域内においては、階数が3以上又は延べ面積が100㎡を超える建築物は、耐火建築物等としなければならない。","a":true,"e":"防火地域では、階数3以上又は延べ面積100㎡超の建築物は耐火建築物等とする必要があります。"},{"f":"kenchiku","fn":"建築基準法","q":"建築物が防火地域及び準防火地域にわたる場合、原則として建築物全部について厳しい方の防火地域の規制が適用される。","a":true,"e":"建築物が2つの地域にわたる場合、原則として厳しい方（防火地域）の規制が全体に適用されます。"},{"f":"kenchiku","fn":"建築基準法","q":"第一種低層住居専用地域内においては、原則として建築物の高さは10m又は12mのうち都市計画で定められた限度を超えてはならない。","a":true,"e":"低層住居専用地域・田園住居地域では、建築物の高さの限度（10m又は12m）が定められます。"},{"f":"nouchi","fn":"農地法","q":"農地を農地のまま売買する場合、農地法第3条の許可が必要であり、その許可権者は農業委員会である。","a":true,"e":"3条（権利移動）の許可権者は農業委員会です。"},{"f":"nouchi","fn":"農地法","q":"自己所有の農地を農地以外のものに転用する場合、農地法第4条の許可が必要であり、その許可権者は都道府県知事等である。","a":true,"e":"4条（転用）の許可権者は都道府県知事等です。"},{"f":"nouchi","fn":"農地法","q":"農地を転用する目的で売買する場合、農地法第5条の許可が必要であり、その許可権者は農業委員会である。","a":false,"e":"5条（転用目的の権利移動）の許可権者は都道府県知事等です。農業委員会ではありません。"},{"f":"nouchi","fn":"農地法","q":"市街化区域内の農地を転用する場合、あらかじめ農業委員会に届け出れば、農地法第4条の許可は不要である。","a":true,"e":"市街化区域内の農地の転用（4条・5条）は、農業委員会への届出で足ります。"},{"f":"nouchi","fn":"農地法","q":"市街化区域内の農地を農地のまま売買する場合、あらかじめ農業委員会に届け出れば、農地法第3条の許可は不要である。","a":false,"e":"3条（権利移動）は市街化区域内でも許可が必要です。届出で足りるのは4条・5条のみです。"},{"f":"nouchi","fn":"農地法","q":"相続により農地を取得した場合、農地法第3条の許可は不要であるが、農業委員会への届出が必要である。","a":true,"e":"相続による取得は3条許可は不要ですが、農業委員会への届出は必要です。"},{"f":"nouchi","fn":"農地法","q":"農地法第3条又は第5条の許可を受けずに締結した売買契約は、有効である。","a":false,"e":"必要な許可を受けずに締結した契約は無効です。"},{"f":"nouchi","fn":"農地法","q":"農地の賃貸借は、その登記がなくても、引渡しがあったときは、その後に農地の所有権を取得した第三者に対抗することができる。","a":true,"e":"農地の賃貸借は引渡しがあれば第三者に対抗できます。"},{"f":"nouchi","fn":"農地法","q":"耕作を目的として農地を借り入れる場合、農地法第3条の許可が必要である。","a":true,"e":"農地の賃借権の設定も権利移動に当たるため、3条の許可が必要です。"},{"f":"nouchi","fn":"農地法","q":"農地法において、現に耕作されていない休耕地は農地に該当しない。","a":false,"e":"耕作の目的に供される土地であれば、現に耕作されていない休耕地も農地に該当します。"},{"f":"kokudo","fn":"国土利用計画法","q":"市街化区域において2,000㎡以上の土地売買等の契約を締結した場合、事後届出が必要である。","a":true,"e":"事後届出の面積要件は市街化区域2,000㎡以上です。"},{"f":"kokudo","fn":"国土利用計画法","q":"市街化調整区域において3,000㎡の土地売買等の契約を締結した場合、事後届出が必要である。","a":false,"e":"市街化調整区域・非線引き区域は5,000㎡以上で届出が必要です。3,000㎡では不要です。"},{"f":"kokudo","fn":"国土利用計画法","q":"都市計画区域外において10,000㎡以上の土地売買等の契約を締結した場合、事後届出が必要である。","a":true,"e":"都市計画区域外は10,000㎡以上で届出が必要です。"},{"f":"kokudo","fn":"国土利用計画法","q":"事後届出は、権利取得者（買主）が契約締結の日から起算して2週間以内に行わなければならない。","a":true,"e":"届出義務者は権利取得者（買主）で、契約締結後2週間以内です。"},{"f":"kokudo","fn":"国土利用計画法","q":"事後届出の義務者は、土地の売主である。","a":false,"e":"届出義務者は権利取得者（買主）です。売主ではありません。"},{"f":"kokudo","fn":"国土利用計画法","q":"当事者の一方又は双方が国又は地方公共団体である場合、事後届出は不要である。","a":true,"e":"国・地方公共団体が当事者の場合は届出不要です。"},{"f":"kokudo","fn":"国土利用計画法","q":"事後届出を行わなかった場合、その土地売買等の契約は無効となる。","a":false,"e":"届出をしなくても契約は有効です。ただし、罰則（6ヶ月以下の拘禁刑又は100万円以下の罰金）の対象となります。"},{"f":"kokudo","fn":"国土利用計画法","q":"都道府県知事は、事後届出に係る土地の利用目的について、必要な変更をすべきことを勧告することができる。","a":true,"e":"知事は土地の利用目的について変更の勧告ができます。ただし、対価（価格）については勧告できません。"},{"f":"kokudo","fn":"国土利用計画法","q":"贈与により土地を取得した場合、事後届出が必要である。","a":false,"e":"贈与は対価がないため「土地売買等の契約」に該当せず、事後届出は不要です。"},{"f":"kokudo","fn":"国土利用計画法","q":"事後届出における面積要件は、権利取得者が取得した土地の面積で判断する。","a":true,"e":"面積は権利取得者が取得した一団の土地の面積で判断します（買いの一団）。"},{"f":"takuzo","fn":"盛土規制法","q":"宅地造成等工事規制区域内において、盛土であって高さが1mを超える崖を生ずることとなるものに関する工事を行う場合、都道府県知事の許可が必要である。","a":true,"e":"盛土1m超、切土2m超、切盛合わせて2m超、面積500㎡超のいずれかに該当すれば許可が必要です。"},{"f":"takuzo","fn":"盛土規制法","q":"宅地造成等工事規制区域内において、切土であって高さが1mの崖を生ずる工事は、常に許可が必要である。","a":false,"e":"切土は高さ2m超で許可が必要です。1mでは許可不要です（他の要件に該当しない限り）。"},{"f":"takuzo","fn":"盛土規制法","q":"宅地造成等工事規制区域内において、盛土又は切土をする土地の面積が500㎡を超える工事は、崖を生じない場合であっても許可が必要である。","a":true,"e":"面積500㎡超であれば、崖の高さに関わらず許可が必要です。"},{"f":"takuzo","fn":"盛土規制法","q":"宅地造成等工事規制区域は、国土交通大臣が指定する。","a":false,"e":"宅地造成等工事規制区域は都道府県知事等が指定します。"},{"f":"takuzo","fn":"盛土規制法","q":"宅地造成等に関する工事の許可を受けた者は、工事が完了した場合、都道府県知事の検査を受けなければならない。","a":true,"e":"工事完了後は都道府県知事等の完了検査を受ける必要があります。"},{"f":"kukaku","fn":"土地区画整理法","q":"土地区画整理事業の施行地区内において、建築物の新築を行おうとする者は、原則として都道府県知事等の許可を受けなければならない。","a":true,"e":"施行地区内では、建築物の新築・改築・増築等に都道府県知事等の許可が必要です。"},{"f":"kukaku","fn":"土地区画整理法","q":"換地処分は、関係権利者に換地計画において定められた関係事項を通知して行う。","a":true,"e":"換地処分は関係権利者への通知により行われます。"},{"f":"kukaku","fn":"土地区画整理法","q":"仮換地が指定された場合、従前の宅地の所有者は、仮換地について使用収益することができる。","a":true,"e":"仮換地指定後、従前の宅地の所有者は仮換地を使用収益でき、従前の宅地は使用収益できなくなります。"},{"f":"kukaku","fn":"土地区画整理法","q":"換地処分の公告があった日の翌日において、換地は従前の宅地とみなされる。","a":true,"e":"換地処分の公告の翌日から、換地は従前の宅地とみなされます。"},{"f":"kukaku","fn":"土地区画整理法","q":"土地区画整理組合を設立しようとする者は、7人以上共同して定款及び事業計画を定め、都道府県知事の認可を受けなければならない。","a":true,"e":"組合設立には7人以上の共同と都道府県知事の認可が必要です。"}];
const KQ=[{"f":"seigen","fn":"制限行為能力者","q":"成年被後見人が行った法律行為は、事理を弁識する能力がある状態で行われたものであっても取り消すことができる。ただし、日用品の購入その他日常生活に関する行為はこの限りでない。","a":true,"e":"成年被後見人の法律行為は原則として取り消せますが、日用品の購入等の日常生活に関する行為は取り消せません。"},{"f":"seigen","fn":"制限行為能力者","q":"被保佐人が保佐人の同意を得ずにした土地の売却は、被保佐人が行為能力者であることを相手方に信じさせるため詐術を用いたときであっても、取り消すことができる。","a":false,"e":"制限行為能力者が詐術を用いた場合、その行為を取り消すことはできません。"},{"f":"seigen","fn":"制限行為能力者","q":"成年後見人が成年被後見人に代わって、成年被後見人が居住している建物を売却するためには、家庭裁判所の許可が必要である。","a":true,"e":"居住用不動産の処分は生活の基盤に関わるため、家庭裁判所の許可が必要です。"},{"f":"seigen","fn":"制限行為能力者","q":"営業を許された未成年者が、その営業とは無関係に自己の居住用建物を第三者から購入した場合、法定代理人はその売買契約を取り消すことができる。","a":true,"e":"営業を許された未成年者は、その営業に関しては成年者と同一の行為能力を有します。しかし、営業と無関係な居住用建物の購入は、法定代理人が取り消すことができます。"},{"f":"seigen","fn":"制限行為能力者","q":"被補助人が法律行為を行うためには、常に補助人の同意が必要である。","a":false,"e":"補助人の同意が必要となるのは、家庭裁判所の審判により同意権の対象とされた特定の法律行為に限られます。すべての行為に同意が必要なわけではありません。"},{"f":"seigen","fn":"制限行為能力者","q":"営業を許された未成年者が、その営業に関して意思能力を有しない状態で行った法律行為は、無効である。","a":true,"e":"意思能力を欠く状態で行われた法律行為は、行為能力の有無に関わらず無効です。"},{"f":"seigen","fn":"制限行為能力者","q":"成年後見人は、後見監督人がいる場合、後見監督人の同意を得なければ成年被後見人の法律行為を取り消すことができない。","a":false,"e":"取消しは単独で行うことができ、後見監督人の同意は不要です。後見監督人の同意が必要となるのは、営業や重要な財産行為等です。"},{"f":"seigen","fn":"制限行為能力者","q":"成年年齢は18歳であるため、18歳の者は年齢を理由として後見開始の審判を受けることはない。","a":true,"e":"成年年齢は18歳です。18歳以上であれば年齢を理由に制限行為能力者となることはありません。"},{"f":"seigen","fn":"制限行為能力者","q":"成年後見人は家庭裁判所が選任するが、未成年後見人は必ずしも家庭裁判所が選任するとは限らない。","a":true,"e":"成年後見人は家庭裁判所が選任します。未成年後見人は、最後に親権を行う者が遺言で指定できる場合があるため、必ずしも家庭裁判所が選任するとは限りません。"},{"f":"seigen","fn":"制限行為能力者","q":"成年後見人が成年被後見人を代理して、成年被後見人が所有するオフィスビルに第三者のための抵当権を設定する場合、家庭裁判所の許可が必要である。","a":false,"e":"居住用不動産以外の処分には家庭裁判所の許可は不要です。許可が必要なのは居住用不動産の処分に限られます。"},{"f":"seigen","fn":"制限行為能力者","q":"土地を売却すると土地の管理義務を免れることになるので、未成年者が土地を売却するにあたって法定代理人の同意は不要である。","a":false,"e":"土地の売却は所有権を失う処分行為であり、単に義務を免れる行為ではありません。法定代理人の同意が必要です。"},{"f":"seigen","fn":"制限行為能力者","q":"未成年後見人は、自ら後見する未成年者について、後見開始の審判を請求することができない。","a":false,"e":"未成年後見人は、未成年者について後見開始の審判を請求することができます。"},{"f":"seigen","fn":"制限行為能力者","q":"相続の放棄は相手方のない単独行為であるから、成年後見人が成年被後見人に代わってこれを行っても利益相反行為とはならない。","a":false,"e":"成年後見人自身も相続人である場合、被後見人に相続放棄をさせることで自己の相続分が増えるため、利益相反行為となる場合があります。"},{"f":"seigen","fn":"制限行為能力者","q":"未成年者が法定代理人の同意を得ずに売買契約を締結した後、成年に達して自らが取消権を有すると知った上で当該契約を追認した場合、もはや取り消すことができない。","a":true,"e":"取消権者が取消権があることを知った上で追認すると、以後取り消すことができなくなります。"},{"f":"seigen","fn":"制限行為能力者","q":"意思能力を有しない状態で行った不動産の売買契約は、後見開始の審判を受けているか否かに関わらず効力を有しない。","a":true,"e":"意思能力を欠く状態での法律行為は無効です。後見開始の審判の有無は関係ありません。"},{"f":"seigen","fn":"制限行為能力者","q":"制限行為能力者の相手方は、制限行為能力者が行為能力者となった後、その者に対し1ヶ月以上の期間を定めて追認するかどうか確答するよう催告することができる。","a":true,"e":"相手方は、行為能力者となった本人に対して催告権を行使できます。期間内に確答がない場合は追認したものとみなされます。"},{"f":"seigen","fn":"制限行為能力者","q":"制限行為能力者が行為能力者であることを信じさせるために詐術を用いた場合であっても、法定代理人の同意がなければ、当該行為を取り消すことができる。","a":false,"e":"詐術を用いた場合は取り消すことができません。"},{"f":"seigen","fn":"制限行為能力者","q":"被保佐人が不動産を売却する場合、保佐人の同意又はこれに代わる家庭裁判所の許可が必要である。","a":true,"e":"不動産の売買等の重要な財産行為には保佐人の同意が必要です。保佐人が同意しない場合、家庭裁判所の許可で代替できます。"},{"f":"seigen","fn":"制限行為能力者","q":"制限行為能力者が単独で有効に取り消すことができる。","a":true,"e":"取消しは制限行為能力者自身が単独で行うことができます。取消しは制限行為能力者に不利益をもたらさないためです。"},{"f":"seigen","fn":"制限行為能力者","q":"家庭裁判所は、保佐開始の審判をする場合、本人の同意を得なければならない。","a":false,"e":"保佐開始の審判には本人の同意は不要です。本人の同意が必要なのは補助開始の審判です。"},{"f":"ishi","fn":"意思表示","q":"心裡留保による意思表示は原則として有効であるが、相手方が表意者の真意でないことを知っていた場合又は知ることができた場合は無効となる。","a":true,"e":"心裡留保は原則有効ですが、相手方が悪意又は有過失の場合は無効となります。"},{"f":"ishi","fn":"意思表示","q":"AとBが通じて行った仮装の売買契約（虚偽表示）は、取り消すことができる。","a":false,"e":"虚偽表示は当然に無効です。取消しではありません。"},{"f":"ishi","fn":"意思表示","q":"虚偽表示による無効は、善意の第三者に対抗することができない。この場合、第三者に過失があってもよい。","a":true,"e":"虚偽表示の第三者保護は「善意」で足り、無過失までは要求されません。"},{"f":"ishi","fn":"意思表示","q":"詐欺による意思表示の取消しは、善意無過失の第三者に対抗することができる。","a":false,"e":"詐欺による取消しは、善意無過失の第三者には対抗できません（民法96条3項）。"},{"f":"ishi","fn":"意思表示","q":"強迫による意思表示の取消しは、善意無過失の第三者に対しても対抗することができる。","a":true,"e":"強迫には第三者保護規定がないため、善意無過失の第三者にも取消しを対抗できます。"},{"f":"ishi","fn":"意思表示","q":"錯誤による意思表示は、その錯誤が法律行為の目的及び取引上の社会通念に照らして重要なものであるとき、取り消すことができる。","a":true,"e":"錯誤による取消しには、錯誤が法律行為の目的等に照らして重要であることが必要です。"},{"f":"ishi","fn":"意思表示","q":"錯誤による意思表示について、表意者に重大な過失があった場合は、いかなる場合も取り消すことができない。","a":false,"e":"表意者に重過失があっても、相手方が悪意又は重過失の場合、又は相手方も同一の錯誤に陥っていた場合は取り消すことができます。"},{"f":"ishi","fn":"意思表示","q":"第三者による詐欺の場合、相手方がその事実を知っていたとき又は知ることができたときに限り、取り消すことができる。","a":true,"e":"第三者による詐欺では、相手方が悪意又は有過失の場合にのみ取り消すことができます。"},{"f":"ishi","fn":"意思表示","q":"動機の錯誤は、その動機が相手方に表示されていた場合であっても、取消しの対象とはならない。","a":false,"e":"動機の錯誤も、動機が表示されて意思表示の内容となっていれば、取消しの対象となり得ます。"},{"f":"ishi","fn":"意思表示","q":"意思表示は、その通知が相手方に到達した時からその効力を生ずる。","a":true,"e":"意思表示は到達主義が原則です。相手方に到達した時に効力が生じます。"},{"f":"dairi","fn":"代理","q":"無権代理人が本人を単独で相続した場合、無権代理行為は当然に有効となる。","a":true,"e":"無権代理人が本人を相続した場合、追認拒否は信義則に反するため、当然に有効となります。"},{"f":"dairi","fn":"代理","q":"本人が無権代理人を相続した場合、本人は無権代理行為の追認を拒絶することができる。","a":true,"e":"本人が無権代理人を相続しても、本人の追認拒絶権は消滅しません。無権代理人が本人を相続した場合とは逆の結論となります。"},{"f":"dairi","fn":"代理","q":"無権代理の相手方は、本人が追認しない間、善意であれば無権代理行為を取り消すことができる。","a":true,"e":"相手方の取消権は、契約時に善意であれば行使できます。"},{"f":"dairi","fn":"代理","q":"無権代理の相手方は、本人に対して相当の期間を定めて追認するかどうか催告することができ、この催告は相手方が悪意であってもすることができる。","a":true,"e":"催告権は相手方が悪意であっても行使できます。取消権とは異なり善意は要件ではありません。"},{"f":"dairi","fn":"代理","q":"代理人が自己又は第三者の利益を図る目的で代理権の範囲内の行為をした場合、相手方がその目的を知り又は知ることができたときは、その行為は無権代理行為とみなされる。","a":true,"e":"代理権の濫用は、相手方が悪意又は有過失のときに無権代理とみなされます。"},{"f":"dairi","fn":"代理","q":"代理人が制限行為能力者である場合、その代理行為は制限行為能力を理由に取り消すことができる。","a":false,"e":"代理人は行為能力者である必要はありません。制限行為能力者が代理人としてした行為は、行為能力の制限を理由に取り消すことはできません。"},{"f":"dairi","fn":"代理","q":"復代理人を選任した場合、代理人の代理権は消滅する。","a":false,"e":"復代理人を選任しても、代理人の代理権は消滅しません。"},{"f":"dairi","fn":"代理","q":"任意代理人は、本人の許諾を得たとき又はやむを得ない事由があるときでなければ、復代理人を選任することができない。","a":true,"e":"任意代理人の復任には、本人の許諾又はやむを得ない事由が必要です。"},{"f":"dairi","fn":"代理","q":"代理権授与の表示による表見代理、権限外の行為の表見代理、代理権消滅後の表見代理の3類型がある。","a":true,"e":"表見代理には109条・110条・112条の3類型があります。"},{"f":"dairi","fn":"代理","q":"双方代理は、本人があらかじめ許諾した場合であっても無権代理行為とみなされる。","a":false,"e":"本人があらかじめ許諾した双方代理は有効です。また、債務の履行についても双方代理が認められます。"},{"f":"jikou","fn":"時効","q":"取得時効において、善意無過失で占有を開始した者は10年間の占有継続で所有権を取得できる。","a":true,"e":"善意無過失なら10年、それ以外（悪意又は有過失）は20年です。"},{"f":"jikou","fn":"時効","q":"取得時効の善意無過失は、占有の全期間を通じて必要である。","a":false,"e":"善意無過失は占有開始時に判断されます。途中で悪意になっても影響しません。"},{"f":"jikou","fn":"時効","q":"債権は、権利を行使することができることを知った時から5年間、又は権利を行使することができる時から10年間行使しないときは、時効によって消滅する。","a":true,"e":"消滅時効はいずれか早い方で完成します。主観的起算点5年、客観的起算点10年です。"},{"f":"jikou","fn":"時効","q":"人の生命又は身体の侵害による損害賠償請求権の消滅時効は、権利を行使できる時から10年である。","a":false,"e":"生命・身体の侵害による損害賠償請求権は、客観的起算点から20年に延長されています。"},{"f":"jikou","fn":"時効","q":"時効は、当事者が援用しなければ、裁判所がこれによって裁判をすることができない。","a":true,"e":"時効は当事者が援用しなければ、裁判所が職権で適用することはできません。"},{"f":"jikou","fn":"時効","q":"時効の利益は、あらかじめ放棄することができる。","a":false,"e":"時効の利益は、時効完成前にあらかじめ放棄することはできません。"},{"f":"jikou","fn":"時効","q":"時効완成後に債務者が債務を承認した場合、その後に時効を援用することは信義則上許されない。","a":true,"e":"時効完成後の債務承認は、以後の時効援用を信義則上許さないとされています。"},{"f":"jikou","fn":"時効","q":"裁判上の請求があった場合、その事由が終了するまでの間は時効は完成しない。","a":true,"e":"裁判上の請求は時効の完成猶予事由です。確定判決等により権利が確定すれば時効は更新されます。"},{"f":"jikou","fn":"時効","q":"催告があったときは、その時から1年を経過するまでの間は時効は完成しない。","a":false,"e":"催告による完成猶予期間は6ヶ月です。1年ではありません。"},{"f":"jikou","fn":"時効","q":"承認による時効の更新は、承認をした時から新たに時効の進行が始まる。","a":true,"e":"債務の承認は時効の更新事由であり、承認時から新たに時効が進行します。"},{"f":"bukken","fn":"物権変動","q":"不動産の物権変動は、登記をしなければ第三者に対抗することができない。","a":true,"e":"不動産物権変動の対抗要件は登記です（民法177条）。"},{"f":"bukken","fn":"物権変動","q":"背信的悪意者に対しては、登記がなければ物権変動を対抗することができない。","a":false,"e":"背信的悪意者は民法177条の「第三者」に該当しないため、登記がなくても対抗できます。"},{"f":"bukken","fn":"物権変動","q":"不動産の取消し前に現れた第三者に対しては、取消権者は善意無過失の第三者を除き、登記なくして取消しを対抗できる。","a":true,"e":"取消し前の第三者のうち、詐欺の場合は善意無過失の第三者が保護されます。それ以外の第三者には登記なく対抗できます。"},{"f":"bukken","fn":"物権変動","q":"不動産の取消し後に現れた第三者との関係は、登記の先後によって優劣が決まる。","a":true,"e":"取消し後の第三者とは対抗関係となり、先に登記を備えた方が優先します。"},{"f":"bukken","fn":"物権変動","q":"相続による不動産の取得は、法定相続分を超える部分であっても、登記なくして第三者に対抗できる。","a":false,"e":"法定相続分の範囲内は登記なく対抗できますが、これを超える部分は登記がなければ対抗できません（令和元年改正）。"},{"f":"bukken","fn":"物権変動","q":"不法占拠者に対しては、登記がなくても所有権を主張することができる。","a":true,"e":"不法占拠者は正当な第三者ではないため、登記なくして所有権を対抗できます。"},{"f":"bukken","fn":"物権変動","q":"共有物の変更（形状又は効用の著しい変更を伴うもの）を行うには、他の共有者全員の同意が必要である。","a":true,"e":"共有物の変更には共有者全員の同意が必要です。管理行為は持分価格の過半数、保存行為は各共有者単独で行えます。"},{"f":"bukken","fn":"物権変動","q":"共有物の保存行為は、各共有者が単独で行うことができる。","a":true,"e":"保存行為は各共有者が単独で行えます。"},{"f":"bukken","fn":"物権変動","q":"共有物の管理に関する事項は、各共有者の持分の価格に従い、その過半数で決する。","a":true,"e":"管理行為は持分価格の過半数で決定します。"},{"f":"bukken","fn":"物権変動","q":"各共有者は、いつでも共有物の分割を請求することができるが、5年を超えない期間内は分割をしない旨の契約をすることができる。","a":true,"e":"共有物分割請求は原則自由ですが、5年以内の不分割特約は有効です。"},{"f":"teitou","fn":"抵当権","q":"抵当権設定時に土地の上に建物が存在し、土地と建物が同一所有者に属していた場合において、競売により土地と建物が別々の所有者になったときは、法定地上権が成立する。","a":true,"e":"法定地上権の成立要件をすべて満たしています。"},{"f":"teitou","fn":"抵当権","q":"更地に抵当権を設定した後、抵当権設定者がその土地に建物を建築した場合、競売により法定地上権が成立する。","a":false,"e":"法定地上権は「抵当権設定時に建物が存在」が要件です。更地への設定後に建築されても成立しません。"},{"f":"teitou","fn":"抵当権","q":"抵当権者は、抵当不動産の賃料に対して物上代位権を行使することができるが、賃料の払渡し前に差押えをする必要がある。","a":true,"e":"物上代位には払渡し又は引渡し前の差押えが必要です。"},{"f":"teitou","fn":"抵当権","q":"抵当権の被担保債権が弁済された場合でも、抵当権は当然には消滅しない。","a":false,"e":"抵当権は付従性により、被担保債権が消滅すれば当然に消滅します。"},{"f":"teitou","fn":"抵当権","q":"抵当不動産の第三取得者は、抵当権消滅請求をすることができる。","a":true,"e":"第三取得者は抵当権消滅請求ができます。ただし、主たる債務者・保証人・これらの承継人は請求できません。"},{"f":"teitou","fn":"抵当権","q":"主たる債務者は、抵当権消滅請求をすることができる。","a":false,"e":"主たる債務者・保証人は抵当権消滅請求をすることができません。全額弁済する義務があるためです。"},{"f":"teitou","fn":"抵当権","q":"抵当権の順位は、各抵当権者の合意によって変更することができるが、利害関係者がいる場合はその承諾が必要である。","a":true,"e":"抵当権の順位変更は当事者の合意と利害関係者の承諾で可能です。登記が効力要件です。"},{"f":"teitou","fn":"抵当権","q":"根抵当権の極度額は、後順位抵当権者その他の第三者の承諾があれば変更することができる。","a":true,"e":"極度額の変更には利害関係者の承諾が必要です。"},{"f":"teitou","fn":"抵当権","q":"抵当権は、目的物の売却、賃貸、滅失又は損傷によって債務者が受けるべき金銭に対しても行使することができる。","a":true,"e":"物上代位の目的には、売却代金・賃料・保険金・損害賠償金等が含まれます。"},{"f":"teitou","fn":"抵当権","q":"1つの債権を担保するために複数の不動産に抵当権を設定することはできない。","a":false,"e":"1つの債権のために複数の不動産に抵当権を設定する共同抵当が認められています。"},{"f":"saimu","fn":"債務不履行","q":"契約の解除には、債務者の帰責事由が必要である。","a":false,"e":"令和2年改正により、解除に帰責事由は不要です。帰責事由が必要なのは損害賠償請求です。"},{"f":"saimu","fn":"債務不履行","q":"債務不履行による損害賠償請求には、債務者の帰責事由が必要である。","a":true,"e":"損害賠償請求には帰責事由が必要です。解除には帰責事由は不要です。"},{"f":"saimu","fn":"債務不履行","q":"債務の履行が契約その他の債務の発生原因及び取引上の社会通念に照らして不能であるときは、債権者はその債務の履行を請求することができない。","a":true,"e":"履行不能の場合、債権者は履行を請求できません。"},{"f":"saimu","fn":"債務不履行","q":"当事者の一方がその債務を履行しない場合、相手方が相当の期間を定めて催告し、その期間内に履行がないときは、契約を解除することができる。","a":true,"e":"催告解除の原則です。相当期間を定めた催告後に履行がなければ解除できます。"},{"f":"saimu","fn":"債務不履行","q":"債務の全部の履行が不能である場合、債権者は催告をすることなく直ちに契約を解除することができる。","a":true,"e":"履行不能の場合は無催告解除が可能です。"},{"f":"saimu","fn":"債務不履行","q":"金銭債務の不履行については、債務者は不可抗力をもって抗弁とすることができる。","a":false,"e":"金銭債務の不履行では、不可抗力は抗弁となりません。債務者は履行遅滞の責任を免れません。"},{"f":"saimu","fn":"債務不履行","q":"危険負担において、当事者双方の責めに帰することができない事由により債務が履行不能となった場合、債権者は反対給付の履行を拒むことができる。","a":true,"e":"双方無責の履行不能の場合、債権者は反対給付の履行を拒絶できます（令和2年改正）。"},{"f":"saimu","fn":"債務不履行","q":"買主の売主に対する契約不適合を理由とする代金減額請求は、原則としてまず追完の催告をする必要がある。","a":true,"e":"代金減額請求は原則として追完の催告が必要です。"},{"f":"saimu","fn":"債務不履行","q":"買主が契約不適合を知った時から1年以内にその旨を売主に通知すれば、その後に具体的な請求をすることができる。","a":true,"e":"改正民法では「1年以内に通知」すれば足ります。"},{"f":"saimu","fn":"債務不履行","q":"契約不適合が買主の責めに帰すべき事由によるものである場合、買主は追完請求をすることができない。","a":true,"e":"買主に帰責事由がある場合、追完請求・代金減額請求はできません。"},{"f":"rentai","fn":"連帯債務・保証","q":"連帯債務者の一人に対する履行の請求は、他の連帯債務者に対してもその効力を生ずる。","a":false,"e":"令和2年改正により、履行の請求は相対効となりました。絶対効は弁済・更改・混同・相殺の4つのみです。"},{"f":"rentai","fn":"連帯債務・保証","q":"連帯債務者の一人が債権者に対して債権を有する場合にその連帯債務者が相殺を援用したときは、債権は全ての連帯債務者の利益のために消滅する。","a":true,"e":"相殺は絶対効を有します。相殺を援用すれば全員のために債権が消滅します。"},{"f":"rentai","fn":"連帯債務・保証","q":"連帯保証人には、催告の抗弁権及び検索の抗弁権がある。","a":false,"e":"連帯保証人には催告の抗弁権も検索の抗弁権もありません。これらは通常の保証人にのみ認められます。"},{"f":"rentai","fn":"連帯債務・保証","q":"通常の保証人は、債権者に対してまず主たる債務者に催告すべき旨を請求することができる。","a":true,"e":"通常の保証人は催告の抗弁権を有します。"},{"f":"rentai","fn":"連帯債務・保証","q":"個人が根保証契約を締結する場合、極度額を定めなければ効力を生じない。","a":true,"e":"個人根保証契約は極度額の定めがなければ無効です（民法465条の2）。"},{"f":"rentai","fn":"連帯債務・保証","q":"保証契約は、書面又は電磁的記録でしなければ効力を生じない。","a":true,"e":"保証契約は書面（又は電磁的記録）でしなければ効力を生じません。"},{"f":"rentai","fn":"連帯債務・保証","q":"主たる債務者について生じた事由は、原則として保証人にもその効力を生ずる。","a":true,"e":"保証債務の付従性により、主債務者について生じた事由は原則として保証人にも及びます。"},{"f":"rentai","fn":"連帯債務・保証","q":"保証人が主たる債務者の委託を受けて保証をした場合、一定の要件のもとで主たる債務者に対して求償することができる。","a":true,"e":"委託を受けた保証人は、弁済等により主債務者に対して求償権を有します。"},{"f":"rentai","fn":"連帯債務・保証","q":"事業のために負担した貸金等債務を主たる債務とする保証契約は、公正証書で保証人になろうとする者の意思を確認しなければ効力を生じない。","a":true,"e":"事業用融資の個人保証は原則として公正証書による意思確認が必要です。ただし、主債務者の配偶者等は例外です。"},{"f":"rentai","fn":"連帯債務・保証","q":"連帯債務者の一人について生じた免除は、他の連帯債務者に対してもその効力を生ずる。","a":false,"e":"令和2年改正により、免除は相対効となりました。他の連帯債務者には影響しません。"},{"f":"chintai","fn":"賃貸借","q":"賃貸人の地位は、賃貸不動産の所有権が移転した場合、原則として新所有者に移転する。","a":true,"e":"令和2年改正で明文化されました。賃貸人の地位は所有権移転に伴い当然に新所有者に移転します。"},{"f":"chintai","fn":"賃貸借","q":"敷金返還債務は、賃貸借が終了すれば、目的物の明渡し前であっても発生する。","a":false,"e":"敷金返還債務は、賃貸借の終了かつ目的物の明渡しがなされた時に発生します。"},{"f":"chintai","fn":"賃貸借","q":"賃借人は、賃借物について賃貸人の負担に属する必要費を支出したときは、直ちにその償還を請求することができる。","a":true,"e":"必要費は直ちに償還請求できます。有益費は賃貸借終了時に償還請求できます。"},{"f":"chintai","fn":"賃貸借","q":"賃借人は、賃貸人の承諾を得なければ、賃借権を譲渡し、又は賃借物を転貸することができない。","a":true,"e":"賃借権の譲渡・転貸には賃貸人の承諾が必要です。無断譲渡・転貸は解除事由となり得ます。"},{"f":"chintai","fn":"賃貸借","q":"賃借人が賃貸人の承諾を得て適法に転貸した場合、転借人は賃貸人に対して直接義務を負う。","a":true,"e":"適法な転貸の場合、転借人は賃貸人に対して直接賃料支払義務等を負います。"},{"f":"chintai","fn":"賃貸借","q":"賃借物の一部が滅失し、賃借人の責めに帰することができない事由による場合、賃料は当然に減額される。","a":true,"e":"令和2年改正により、一部滅失等による使用収益不能の場合、賃料は当然に減額されます。"},{"f":"chintai","fn":"賃貸借","q":"民法上の賃貸借の存続期間は、50年を超えることができない。","a":true,"e":"民法上の賃貸借の上限は50年です。ただし、借地借家法が適用される場合は異なります。"},{"f":"chintai","fn":"賃貸借","q":"賃貸借の期間満了後、賃借人が使用収益を継続し、賃貸人がこれを知りながら異議を述べないときは、従前と同一の条件で更新したものと推定される。","a":true,"e":"黙示の更新（法定更新）が推定されます。"},{"f":"chintai","fn":"賃貸借","q":"賃借人が賃借物を無断で転貸した場合、賃貸人は常に契約を解除することができる。","a":false,"e":"無断転貸でも、賃貸人に対する背信的行為と認めるに足りない特段の事情がある場合は解除できません。"},{"f":"chintai","fn":"賃貸借","q":"使用貸借は、借主の死亡によって終了する。","a":true,"e":"使用貸借は借主の死亡により終了します。賃貸借とは異なり、相続の対象となりません。"},{"f":"shakuchi","fn":"借地借家(借地)","q":"借地権の存続期間は30年以上とされ、これより短い期間を定めた場合は30年となる。","a":true,"e":"借地権の存続期間は最低30年です。より短い期間を定めても30年に修正されます。"},{"f":"shakuchi","fn":"借地借家(借地)","q":"借地権の最初の更新後の存続期間は10年である。","a":false,"e":"最初の更新後は20年、2回目以降の更新後は10年です。"},{"f":"shakuchi","fn":"借地借家(借地)","q":"借地権は、その登記がなくても、借地上に借地権者名義で登記した建物を所有することで第三者に対抗できる。","a":true,"e":"借地上の建物の登記があれば、借地権自体の登記がなくても第三者に対抗できます。"},{"f":"shakuchi","fn":"借地借家(借地)","q":"事業用定期借地権は、公正証書によって設定しなければならない。","a":true,"e":"事業用定期借地権は公正証書に限ります。他の定期借地権は書面で足ります。"},{"f":"shakuchi","fn":"借地借家(借地)","q":"一般定期借地権の存続期間は、30年以上でなければならない。","a":false,"e":"一般定期借地権は50年以上です。30年以上は建物譲渡特約付借地権です。"},{"f":"shakuchi","fn":"借地借家(借地)","q":"借地権者が借地上の建物を再築する場合、借地権設定者の承諾があれば存続期間が延長される。","a":true,"e":"借地権者が承諾を得て残存期間を超えて存続する建物を築造した場合、借地権は承諾日又は築造日のいずれか早い日から20年間存続します。"},{"f":"shakuchi","fn":"借地借家(借地)","q":"借地権の存続期間が満了し契約が更新されない場合、借地権者は借地権設定者に対し建物を時価で買い取るよう請求できる。","a":true,"e":"建物買取請求権です。更新されない場合、借地権者は建物の時価買取を請求できます。"},{"f":"shakuchi","fn":"借地借家(借地)","q":"事業用定期借地権は、居住用の建物を所有する目的で設定することができる。","a":false,"e":"事業用定期借地権は専ら事業用の建物所有目的に限られます。居住用は対象外です。"},{"f":"shakka","fn":"借地借家(借家)","q":"建物賃貸借において、期間を1年未満とする定めをした場合、期間の定めのない賃貸借とみなされる。","a":true,"e":"普通借家で1年未満の期間を定めると「期間の定めなし」とみなされます。定期借家にはこの規定はありません。"},{"f":"shakka","fn":"借地借家(借家)","q":"建物賃貸借の対抗要件は、賃借権の登記のほか、建物の引渡しでもよい。","a":true,"e":"借家権は建物の引渡しがあれば第三者に対抗できます。"},{"f":"shakka","fn":"借地借家(借家)","q":"賃貸人による更新拒絶には正当事由が必要であり、立退料の提供のみで正当事由が認められる。","a":false,"e":"立退料の提供だけでは不十分で、建物使用の必要性等を総合考慮して正当事由が判断されます。"},{"f":"shakka","fn":"借地借家(借家)","q":"定期建物賃貸借契約を締結するには、公正証書によらなければならない。","a":false,"e":"定期借家は書面（電磁的記録を含む）であれば足り、公正証書に限定されません。"},{"f":"shakka","fn":"借地借家(借家)","q":"定期建物賃貸借契約を締結する場合、あらかじめ賃借人に対し、契約の更新がなく期間満了により終了する旨を記載した書面を交付して説明しなければならない。","a":true,"e":"事前の書面による説明が必要です。この説明を怠ると普通借家契約となります。"},{"f":"shakka","fn":"借地借家(借家)","q":"床面積200㎡未満の居住用建物の定期建物賃貸借において、転勤等のやむを得ない事情がある場合、賃借人は中途解約を申し入れることができる。","a":true,"e":"200㎡未満の居住用建物では、やむを得ない事情があれば賃借人からの中途解約が認められます。"},{"f":"shakka","fn":"借地借家(借家)","q":"造作買取請求権は、特約によって排除することができない。","a":false,"e":"造作買取請求権は特約で排除できます。強行規定ではありません。"},{"f":"shakka","fn":"借地借家(借家)","q":"建物の賃借人が賃貸人の同意を得て建物に付加した造作については、賃貸借終了時に賃貸人に時価で買い取るよう請求できる。","a":true,"e":"造作買取請求権です。ただし特約で排除可能です。"},{"f":"bensai","fn":"弁済・相殺等","q":"債務者以外の第三者は、原則として債務者の意思に反して弁済をすることができない。","a":false,"e":"弁済をするについて正当な利益を有する第三者は、債務者の意思に反しても弁済できます。正当な利益を有しない第三者は原則として債務者の意思に反して弁済できません。"},{"f":"bensai","fn":"弁済・相殺等","q":"受領権者としての外観を有する者に対して善意無過失で行った弁済は、有効である。","a":true,"e":"受領権者としての外観を有する者への弁済は、弁済者が善意無過失であれば有効です。"},{"f":"bensai","fn":"弁済・相殺等","q":"相殺は、双方の債務が弁済期にあるときにすることができるが、自働債権が弁済期にあれば受働債権の弁済期が到来していなくてもよい。","a":true,"e":"自働債権が弁済期にあれば、受働債権の期限の利益を放棄して相殺できます。"},{"f":"bensai","fn":"弁済・相殺等","q":"悪意による不法行為に基づく損害賠償債権を受働債権として、相殺することができる。","a":false,"e":"悪意による不法行為の損害賠償債権を受働債権とする相殺はできません。被害者に現実の弁済を受けさせるためです。"},{"f":"bensai","fn":"弁済・相殺等","q":"譲渡制限の意思表示がされた債権であっても、その譲渡の効力は妨げられない。","a":true,"e":"令和2年改正により、譲渡制限特約があっても債権譲渡自体は有効です。"},{"f":"bensai","fn":"弁済・相殺等","q":"債権譲渡は、譲渡人が債務者に通知し、又は債務者が承諾しなければ、債務者に対抗することができない。","a":true,"e":"債権譲渡の対抗要件は、譲渡人からの通知又は債務者の承諾です。"},{"f":"bensai","fn":"弁済・相殺等","q":"弁済をするについて正当な利益を有する者が弁済をした場合、その者は当然に債権者に代位する。","a":true,"e":"正当な利益を有する第三者は、弁済により法律上当然に債権者に代位します。"},{"f":"bensai","fn":"弁済・相殺等","q":"債務の弁済として給付をした者が、その債務が存在しないことを知っていた場合、その給付したものの返還を請求できる。","a":false,"e":"債務がないことを知って弁済した場合（非債弁済）、返還請求はできません。"},{"f":"fuhou","fn":"請負・不法行為","q":"請負契約において、仕事の目的物が契約に適合しない場合、注文者は請負人に対して追完請求をすることができる。","a":true,"e":"請負にも契約不適合責任が適用され、注文者は追完請求等ができます。"},{"f":"fuhou","fn":"請負・不法行為","q":"請負人が仕事を完成しない間は、注文者はいつでも損害を賠償して契約を解除することができる。","a":true,"e":"注文者は仕事完成前であれば、損害を賠償していつでも解除できます。"},{"f":"fuhou","fn":"請負・不法行為","q":"不法行為による損害賠償請求権は、被害者が損害及び加害者を知った時から3年間行使しないときは時効によって消滅する。","a":true,"e":"不法行為の消滅時効は、損害及び加害者を知った時から3年（人の生命・身体の侵害は5年）、又は不法行為の時から20年です。"},{"f":"fuhou","fn":"請負・不法行為","q":"土地工作物の設置又は保存に瑕疵があり他人に損害を生じた場合、占有者は損害の発生を防止するのに必要な注意をしたときは責任を免れる。","a":true,"e":"占有者は必要な注意をしたことを立証すれば免責されます。ただし、その場合は所有者が無過失責任を負います。"},{"f":"fuhou","fn":"請負・不法行為","q":"土地工作物責任において、所有者は無過失であっても損害賠償責任を負う。","a":true,"e":"所有者は無過失責任を負います。占有者が免責された場合、最終的に所有者が責任を負います。"},{"f":"fuhou","fn":"請負・不法行為","q":"使用者責任において、被用者の不法行為について使用者が賠償した場合、使用者は被用者に対して求償することができる。","a":true,"e":"使用者は被用者に求償できます。ただし、信義則上相当な範囲に制限される場合があります。"},{"f":"fuhou","fn":"請負・不法行為","q":"共同不法行為者は、各自が連帯して損害賠償責任を負う。","a":true,"e":"共同不法行為者は連帯して損害賠償責任を負います。被害者は各加害者に全額請求できます。"},{"f":"fuhou","fn":"請負・不法行為","q":"不法行為による損害賠償において、被害者に過失があった場合、裁判所は必ず賠償額を減額しなければならない。","a":false,"e":"過失相殺は裁判所の裁量です（「できる」規定）。債務不履行の過失相殺（必ず考慮）とは異なります。"},{"f":"kubun","fn":"共有・区分所有","q":"区分所有法における規約の設定、変更又は廃止は、区分所有者及び議決権の各4分の3以上の多数による集会の決議で行う。","a":true,"e":"規約の設定・変更・廃止は各3/4以上の特別決議が必要です。"},{"f":"kubun","fn":"共有・区分所有","q":"共用部分の変更（その形状又は効用の著しい変更を伴わないものを除く）は、区分所有者及び議決権の各過半数で決する。","a":false,"e":"共用部分の重大変更は各3/4以上が必要です。過半数は通常の管理行為の要件です。"},{"f":"kubun","fn":"共有・区分所有","q":"建替え決議は、区分所有者及び議決権の各5分の4以上の多数による集会の決議で行う。","a":true,"e":"建替え決議は各4/5以上が原則です。ただし、令和8年4月改正で一定要件下では3/4以上に緩和される例外が新設されました。"},{"f":"kubun","fn":"共有・区分所有","q":"管理者は、区分所有者以外の者から選任することはできない。","a":false,"e":"管理者は区分所有者以外の者からも選任できます。法人が管理者になることも可能です。"},{"f":"kubun","fn":"共有・区分所有","q":"規約は、区分所有者の特定承継人に対しても効力を有する。","a":true,"e":"規約は特定承継人（購入者等）にも効力が及びます。"},{"f":"kubun","fn":"共有・区分所有","q":"集会は、区分所有者及び議決権の各5分の1以上を有する者が請求すれば招集することができる。","a":true,"e":"区分所有者及び議決権の各1/5以上で集会の招集を請求できます。この定数は規約で減じることができます。"},{"f":"kubun","fn":"共有・区分所有","q":"占有者（賃借人等）は、建物の使用方法について、区分所有者が規約及び集会の決議に基づいて負う義務と同一の義務を負う。","a":true,"e":"占有者も建物の使用方法に関する規約・決議に従う義務があります。"},{"f":"kubun","fn":"共有・区分所有","q":"共用部分の保存行為は、集会の決議がなければ行うことができない。","a":false,"e":"保存行為は各区分所有者が単独で行うことができます。集会の決議は不要です。"},{"f":"souzoku","fn":"相続","q":"相続人が配偶者と子2人の場合、配偶者の法定相続分は2分の1、子は各4分の1である。","a":true,"e":"配偶者＋子の場合、配偶者1/2、子が1/2（2人で分けて各1/4）です。"},{"f":"souzoku","fn":"相続","q":"相続人が配偶者と直系尊属の場合、配偶者の法定相続分は3分の2である。","a":true,"e":"配偶者＋直系尊属の場合、配偶者2/3、直系尊属1/3です。"},{"f":"souzoku","fn":"相続","q":"相続人が配偶者と被相続人の兄弟姉妹の場合、配偶者の法定相続分は4分の3である。","a":true,"e":"配偶者＋兄弟姉妹の場合、配偶者3/4、兄弟姉妹1/4です。"},{"f":"souzoku","fn":"相続","q":"遺留分は、直系尊属のみが相続人である場合は被相続人の財産の3分の1、それ以外の場合は2分の1である。","a":true,"e":"遺留分は直系尊属のみの場合1/3、それ以外は1/2です。兄弟姉妹に遺留分はありません。"},{"f":"souzoku","fn":"相続","q":"兄弟姉妹には遺留分がない。","a":true,"e":"遺留分権利者は配偶者・子・直系尊属です。兄弟姉妹には遺留分がありません。"},{"f":"souzoku","fn":"相続","q":"遺留分侵害額請求は、遺留分を侵害する遺贈等の現物の返還を請求する方法によって行う。","a":false,"e":"令和元年改正により、遺留分侵害額請求は金銭請求に一本化されました。現物返還ではありません。"},{"f":"souzoku","fn":"相続","q":"相続の放棄をしようとする者は、その旨を家庭裁判所に申述しなければならない。","a":true,"e":"相続放棄は家庭裁判所への申述が必要です。相続人間の合意だけでは放棄になりません。"},{"f":"souzoku","fn":"相続","q":"相続人は、自己のために相続の開始があったことを知った時から3ヶ月以内に、相続の承認又は放棄をしなければならない。","a":true,"e":"熟慮期間は自己のために相続開始を知った時から3ヶ月です。"},{"f":"souzoku","fn":"相続","q":"自筆証書遺言は、遺言者が全文、日付及び氏名を自書し、これに押印しなければならない。ただし、財産目録については自書を要しない。","a":true,"e":"自筆証書遺言の本文は自書が必要ですが、財産目録はパソコン作成等でも可能です（各頁に署名押印は必要）。"},{"f":"souzoku","fn":"相続","q":"公正証書遺言を作成するには、証人2人以上の立会いが必要である。","a":true,"e":"公正証書遺言には証人2人以上の立会いが必要です。"},{"f":"touki","fn":"不動産登記法","q":"不動産登記には公信力があるため、登記を信頼して取引した者は保護される。","a":false,"e":"日本の不動産登記制度に公信力はありません。登記を信頼しても真の権利者でなければ権利を取得できません。"},{"f":"touki","fn":"不動産登記法","q":"権利に関する登記の申請は、法令に別段の定めがある場合を除き、登記権利者及び登記義務者が共同してしなければならない。","a":true,"e":"権利に関する登記は共同申請が原則です。"},{"f":"touki","fn":"不動産登記法","q":"所有権の保存の登記は、登記名義人となる者が単独で申請することができる。","a":true,"e":"所有権保存登記は単独申請が可能です。"},{"f":"touki","fn":"不動産登記法","q":"仮登記には対抗力があり、仮登記のままで第三者に権利を対抗できる。","a":false,"e":"仮登記には対抗力はなく、順位保全効のみです。本登記をして初めて対抗力が生じます。"},{"f":"touki","fn":"不動産登記法","q":"相続により所有権を取得した者は、自己のために相続の開始があったことを知り、かつ、その所有権を取得したことを知った日から3年以内に、所有権の移転の登記を申請しなければならない。","a":true,"e":"令和6年4月施行の改正により、相続登記が義務化されました。3年以内の申請が必要で、怠ると過料の対象です。"},{"f":"touki","fn":"不動産登記法","q":"所有権の登記名義人は、住所又は氏名について変更があった日から2年以内に、変更の登記を申請しなければならない。","a":true,"e":"令和8年4月施行の改正により、住所等変更登記が義務化されました。2年以内の申請が必要です。"},{"f":"touki","fn":"不動産登記法","q":"表示に関する登記は、当事者の申請がなければ登記官が職権ですることはできない。","a":false,"e":"表示に関する登記は、登記官が職権ですることができます。"},{"f":"touki","fn":"不動産登記法","q":"登記の申請をする場合、原則として登記原因を証する情報を提供しなければならない。","a":true,"e":"権利に関する登記の申請には、登記原因証明情報の提供が必要です。"}];
